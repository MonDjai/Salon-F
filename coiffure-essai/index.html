riode, prend la suite de celle-ci. Après une interruption, un paiement entre le 1er et le 14 couvre le mois en cours ; à partir du 15, la période commence le mois suivant et le reste du mois en cours vous est offert.","L'abonnement ne se renouvelle pas tout seul : aucun prélèvement automatique n'est fait."]],["h","Article 6. Fin de l'abonnement ou de l'essai"],["ol",["Nous vous prévenons 3 jours avant la fin, dans l'appli, et par notification si vous l'avez autorisée.","Après la fin, vous gardez 3 jours de grâce pendant lesquels la saisie reste ouverte.","Ensuite, l'appli passe en lecture seule : vous voyez et sauvegardez vos chiffres, sans pouvoir en noter de nouveaux.","Rien n'est effacé sur votre téléphone. Dès qu'un nouveau paiement est confirmé, tout revient, et vous pouvez noter les jours passés."]],["h","Article 7. Remboursement"],["ol",["Après votre premier paiement pour une formule, vous pouvez demander le remboursement, sans donner de raison, dans les 10 jours ouvrables qui suivent la confirmation du paiement. Écrivez-nous sur WhatsApp ou à contact@mondjai.ci avec votre identifiant MonDjai.","Nous remboursons la totalité du montant payé, par le même moyen de paiement, sous 15 jours. L'appli repasse alors en lecture seule ; vos chiffres restent sur votre téléphone.","Passé ce délai, une période commencée n'est pas remboursée, même si vous n'utilisez plus l'appli.","Un paiement fait par erreur (en double, mauvais montant) est remboursé ou reporté sur la période suivante, à votre choix.","Si le service est indisponible par notre faute plus de 7 jours de suite, votre période est prolongée d'autant."]],["h","Article 8. Changement de prix"],["p","Nous pouvons changer les prix. Un nouveau prix est annoncé dans l'appli 30 jours avant. Il ne s'applique jamais à une période déjà payée."],["h","Article 9. Offre fondatrice"],["p","Les personnes qui ont testé MonDjai avant son lancement bénéficient d'une remise de 50 % pendant 12 mois à compter du début de leur test, puis de 30 % sans limite de durée. L'offre est personnelle et ne se transmet pas."],["h","Article 10. Réclamations"],["p","Pour toute question sur un paiement, écrivez-nous sur WhatsApp au +225 01 01 95 90 95 ou à contact@mondjai.ci, avec votre identifiant MonDjai et la référence de la transaction. Nous répondons sous 2 jours ouvrables. Le droit applicable et le règlement des litiges sont ceux de l'article 13 des Conditions générales d'utilisation."]]},{"id":"confidentialite","titre":"Politique de confidentialité","blocs":[["p","Version 1.0, en vigueur le 1er décembre 2026."],["h","Article 1. Qui est responsable de vos données"],["p","Le responsable du traitement de vos données est Kham-Consulting, dont l'identité figure à l'article 1 des Conditions générales d'utilisation. Contact : WhatsApp +225 01 01 95 90 95 ; e-mail contact@mondjai.ci."],["h","Article 2. Le principe"],["p","Vos chiffres restent sur votre téléphone. Si vous avez un code PIN, une copie fermée par ce code est aussi gardée sur notre serveur : nous ne pouvons pas l'ouvrir. Pour le reste, notre serveur garde seulement ce qu'il faut pour vous reconnaître, gérer votre abonnement et améliorer l'appli."],["h","Article 3. Ce que nous gardons sur le serveur"],["t",[["Données","Pourquoi","Sur quelle base","Durée"],["Compte : prénom, nom (facultatif), numéro vérifié, salon, activités, commune (facultative), parrain, identifiant MonDjai, date d'accord aux conditions","Connexion, assistance, gestion du compte","Le contrat","Tant que le compte sert ; supprimé 12 mois après la dernière connexion"],["Abonnement et paiements : formule, dates, montant, moyen, référence, reçu","Débloquer l'appli, tenir les comptes, délivrer les reçus","Le contrat ; nos obligations comptables","10 ans"],["Appareil : marque, système, navigateur, version de l'appli, adresse de notification","Assistance, compatibilité, envoi des rappels","Le contrat ; votre accord pour les notifications","Tant que le compte existe"],["Sauvegarde en ligne : copie de vos chiffres fermée par votre code PIN (la dernière et l'avant-dernière)","Retrouver vos chiffres sur un nouveau téléphone","Le contrat ; active dès que vous avez un code PIN, vous pouvez l'arrêter","Jusqu'à la fermeture du compte, ou plus tôt sur demande"],["Avis : note, commentaire, motif de désabonnement","Améliorer le service","Votre choix de répondre","3 ans"],["Comptages d'usage (article 6)","Savoir ce qui sert et ce qu'il faut simplifier","L'amélioration du service ; vous pouvez les arrêter","13 mois"],["Erreurs : message d'erreur, écran, version","Réparer les pannes","L'amélioration du service","6 mois"]]],["p","Si vous nous écrivez sur WhatsApp ou par e-mail, nous gardons l'échange le temps de traiter votre demande."],["h","Article 4. Ce que nous ne collectons jamais"],["ul",["vos chiffres sous une forme lisible : la seule copie que nous gardons est fermée par votre code PIN ;","les noms et numéros de vos clientes et clients, en dehors de cette même copie fermée ;","votre position GPS, vos contacts, vos photos ;","votre code PIN et votre empreinte : nous ne les recevons jamais ;","vos codes Wave ou Orange Money : le paiement se fait dans leur application, pas dans MonDjai."]],["h","Article 5. La sauvegarde en ligne"],["p","Si vous avez un code PIN, l'appli envoie chaque jour une copie de vos chiffres sur notre serveur, en France. Avant l'envoi, la copie est fermée sur votre téléphone avec une clé tirée de votre code PIN. Nous ne recevons que la copie fermée et nous ne connaissons pas votre code : nous ne pouvons ni la lire, ni la récupérer si vous l'oubliez."],["p","Nous voyons seulement la date de la dernière copie. Vous pouvez arrêter la sauvegarde en ligne dans Réglages, et nous demander de supprimer les copies déjà envoyées."],["h","Article 6. Les comptages d'usage"],["p","Une fois par jour, l'appli nous envoie les comptages de la veille, pour savoir ce qui sert et ce qu'il faut simplifier."],["t",[["Nous comptons","Nous ne comptons jamais"],["Ouvertures, saisies et temps passé à saisir","Les montants"],["Écrans ouverts et fonctions utilisées","Les noms"],["Étapes du guide, rappels vus, sauvegardes faites","Les numéros de téléphone"],["Heures d'utilisation","Ce que vous tapez"],["Marque et système du téléphone, version de l'appli","Votre position"]]],["p","Ces comptages partent avec un identifiant tiré au hasard sur votre téléphone, sans lien avec votre compte. Vous pouvez les arrêter à tout moment : Réglages › « Aider à améliorer MonDjai »."],["p","Plus tard, nous pourrons proposer des statistiques de métier, par exemple un prix moyen par commune. Elles ne seront calculées qu'avec votre accord, demandé à part, et après les formalités nécessaires auprès de l'ARTCI."],["h","Article 7. Qui reçoit vos données"],["p","Nous ne vendons pas vos données et nous ne les donnons à personne pour de la publicité. Seul l'administrateur de MonDjai accède aux comptes et aux abonnements. Nous faisons appel à des prestataires techniques :"],["t",[["Prestataire","Rôle","Données concernées","Lieu"],["Supabase","Base de données et connexion des comptes","Toutes les données de l'article 3","France (Paris)"],["Cloudflare","Hébergement des applications sur mondjai.ci","Données techniques de connexion (adresse IP)","Réseau mondial"],["Orange Côte d'Ivoire (API SMS)","Envoi du code de connexion","Votre numéro et le code","Côte d'Ivoire"],["Service de notification de votre téléphone (Google, Apple)","Rappels quand l'appli est fermée","Adresse de notification, texte du rappel","Selon le fabricant"]]],["p","Wave et Orange Money traitent votre paiement selon leurs propres règles ; nous recevons seulement le montant et la référence. Nous pouvons aussi devoir communiquer des données à une autorité qui le demande dans le cadre de la loi."],["h","Article 8. Hébergement hors de Côte d'Ivoire"],["p","Les données de l'article 3 sont hébergées en France, pays qui applique le règlement européen sur la protection des données."],["h","Article 9. Sécurité"],["ul",["chaque personne ne peut lire que ses propres données ;","les échanges avec le serveur sont chiffrés (HTTPS) ;","l'administration est protégée par un mot de passe et une double vérification ;","le prix et les dates d'abonnement sont calculés par le serveur, pas par le téléphone."]],["p","Aucun système n'est sûr à 100 %. En cas d'incident touchant vos données, nous vous prévenons."],["h","Article 10. Vos droits"],["p","La loi n° 2013-450 du 19 juin 2013 vous donne le droit de :"],["ul",["savoir quelles données nous avons sur vous et en recevoir une copie ;","les faire corriger, directement dans « Mon compte » ou en nous écrivant ;","les faire supprimer ;","vous opposer à un traitement, par exemple aux comptages d'usage ou aux notifications ;","retirer un accord que vous avez donné."]],["p","Pour exercer un droit, écrivez-nous sur WhatsApp depuis le numéro de votre compte, ou à contact@mondjai.ci. Nous répondons sous 30 jours. Les données de paiement sont gardées pour la comptabilité, même après une demande de suppression."],["p","Si notre réponse ne vous convient pas, vous pouvez saisir l'Autorité de protection des données : l'ARTCI (Autorité de Régulation des Télécommunications/TIC de Côte d'Ivoire), www.artci.ci."],["h","Article 11. Messages et rappels"],["p","Nous vous écrivons pour votre compte et votre abonnement : code de connexion, reçu, rappel d'échéance. Les rappels de saisie et les notifications se règlent dans Réglages. Nous ne vous envoyons pas de publicité pour d'autres produits sans votre accord."],["h","Article 12. Stockage sur votre téléphone"],["p","MonDjai n'utilise pas de cookies publicitaires ni de traceurs d'autres sociétés. L'appli range sur votre téléphone vos chiffres, votre compte et votre connexion, pour fonctionner sans Internet."],["h","Article 13. Mineurs"],["p","MonDjai s'adresse aux professionnels. Vous avez moins de 18 ans ? Inscrivez-vous avec l'accord d'un parent ou d'un tuteur."],["h","Article 14. Modification"   /* ---------- Outils ---------- */
  function maintenant(){ return new Date().getTime(); }
  function deux(n){ return n < 10 ? "0" + n : "" + n; }
  function jourLocal(ms){
    var d = ms ? new Date(ms) : new Date();
    return d.getFullYear() + "-" + deux(d.getMonth() + 1) + "-" + deux(d.getDate());
  }
  // "AAAA-MM-JJ" → "JJ/MM/AAAA"
  function dateFr(s){
    if(!s) return "";
    var p = String(s).slice(0, 10).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : String(s);
  }
  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function copier(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
  // Copie de a, complétée ou corrigée par b (objets simples).
  function fusion(a, b){
    var o = {}, k;
    if(a && typeof a === "object") for(k in a) if(Object.prototype.hasOwnProperty.call(a, k)) o[k] = a[k];
    if(b && typeof b === "object") for(k in b) if(Object.prototype.hasOwnProperty.call(b, k)) o[k] = b[k];
    return o;
  }
  function appel(nom, defaut){
    try{
      if(cfg && typeof cfg[nom] === "function"){
        var args = Array.prototype.slice.call(arguments, 2);
        return cfg[nom].apply(cfg, args);
      }
    }catch(e){}
    return defaut;
  }
  function hasard(n, alphabet){
    var out = "", i, octets = null;
    try{
      if(window.crypto && window.crypto.getRandomValues){
        octets = new Uint8Array(n);
        window.crypto.getRandomValues(octets);
      }
    }catch(e){ octets = null; }
    for(i = 0; i < n; i++){
      var v = octets ? octets[i] : Math.floor(Math.random() * 256);
      out += alphabet.charAt(v % alphabet.length);
    }
    return out;
  }

  // Fin de l'essai calculée sur le téléphone (règle du 15), seulement quand le
  // serveur n'a pas encore répondu. Renvoie "AAAA-MM-JJ".
  function finEssaiLocale(ms){
    var d = new Date(ms || maintenant());
    var annee = d.getFullYear(), mois = d.getMonth();
    if(d.getDate() >= JOUR_BASCULE_ESSAI) mois += 1;
    var fin = new Date(annee, mois + 1, 0);
    return fin.getFullYear() + "-" + deux(fin.getMonth() + 1) + "-" + deux(fin.getDate());
  }

  /* ---------- Numéro de téléphone ---------- */
  function chiffresDe(s){ return String(s === undefined || s === null ? "" : s).replace(/[^0-9]/g, ""); }
  // Les 10 chiffres nationaux tapés (accepte un numéro collé avec +225 ou 00225).
  function chiffresNationaux(s){
    var c = chiffresDe(s);
    if(c.length > LONGUEUR_NUMERO && c.indexOf("00225") === 0) c = c.slice(5);
    else if(c.length > LONGUEUR_NUMERO && c.indexOf("225") === 0) c = c.slice(3);
    return c.slice(0, LONGUEUR_NUMERO);
  }
  // "+225XXXXXXXXXX" ou null.
  function normaliserNumero(s){
    var c = chiffresNationaux(s);
    if(c.length !== LONGUEUR_NUMERO) return null;
    if(PREFIXES_MOBILES.indexOf(c.slice(0, 2)) === -1) return null;
    return INDICATIF + c;
  }
  // Pourquoi un numéro n'est pas accepté (message doux), ou "".
  function defautNumero(s){
    var c = chiffresNationaux(s);
    if(!c.length) return "Tapez votre numéro, 10 chiffres.";
    if(c.length >= 2 && PREFIXES_MOBILES.indexOf(c.slice(0, 2)) === -1) return "Un numéro mobile commence par " + PREFIXES_MOBILES.slice(0, -1).join(", ") + " ou " + PREFIXES_MOBILES[PREFIXES_MOBILES.length - 1] + ".";
    if(c.length < LONGUEUR_NUMERO){
      var manque = LONGUEUR_NUMERO - c.length;
      return "Il manque " + manque + (manque > 1 ? " chiffres." : " chiffre.");
    }
    return "";
  }
  // "0700000099" → "07 00 00 00 99"
  function grouperParDeux(c){
    var out = "";
    for(var i = 0; i < c.length; i += 2) out += (i ? " " : "") + c.substr(i, 2);
    return out;
  }
  function numeroLisible(tel){
    if(!tel) return "";
    return INDICATIF + " " + grouperParDeux(chiffresNationaux(tel));
  }
  // v3 : « AT2741 » s'affiche « AT 2741 » (2 lettres, espace, 4 chiffres).
  // Un identifiant d'un autre format (6 lettres d'avant S6b) reste tel quel :
  // l'appli ne vérifie jamais son format.
  function identifiantLisible(id){
    var s = String(id === undefined || id === null ? "" : id);
    return /^[A-Za-z]{2}[0-9]{4}$/.test(s) ? s.slice(0, 2).toUpperCase() + " " + s.slice(2) : s;
  }

  /* ---------- Hachage du code PIN (SHA-256, sans bibliothèque) ---------- */
  var K256 = null;
  function sha256(octets){
    var i, j;
    if(!K256){
      K256 = [];
      var n = 2, trouve = 0;
      while(trouve < 64){
        var premier = true;
        for(j = 2; j * j <= n; j++) if(n % j === 0){ premier = false; break; }
        if(premier){ K256.push((Math.pow(n, 1 / 3) % 1) * 4294967296 | 0); trouve++; }
        n++;
      }
    }
    var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
    var l = octets.length, m = octets.slice(0);
    m.push(0x80);
    while(m.length % 64 !== 56) m.push(0);
    var bits = l * 8;
    m.push(0, 0, 0, 0, (bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255);
    var w = [];
    for(i = 0; i < m.length; i += 64){
      for(j = 0; j < 16; j++) w[j] = (m[i + j * 4] << 24) | (m[i + j * 4 + 1] << 16) | (m[i + j * 4 + 2] << 8) | m[i + j * 4 + 3];
      for(j = 16; j < 64; j++){
        var x = w[j - 15], y = w[j - 2];
        var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
        var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for(j = 0; j < 64; j++){
        var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K256[j] + w[j]) | 0;
        var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        var maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    var out = [];
    for(i = 0; i < 8; i++) out.push((H[i] >>> 24) & 255, (H[i] >>> 16) & 255, (H[i] >>> 8) & 255, H[i] & 255);
    return out;
  }
  function octetsDeTexte(s){
    var out = [];
    for(var i = 0; i < s.length; i++) out.push(s.charCodeAt(i) & 255);
    return out;
  }
  function hexa(octets){
    var out = "";
    for(var i = 0; i < octets.length; i++) out += (octets[i] < 16 ? "0" : "") + octets[i].toString(16);
    return out;
  }
  function hacherPin(pin, sel){
    var h = sha256(octetsDeTexte(sel + "|" + pin));
    for(var i = 1; i < PIN_ITERATIONS; i++) h = sha256(h.concat(octetsDeTexte(sel)));
    return hexa(h);
  }

      sauvegardeEnLigne: { active: true, derniereLe: null, derniereMs: null, derniereTaille: null, aRefaire: false },
      // Ajouts du bloc v3 (sprint C), null tant qu'aucun geste ne les concerne :
      rappels: null,             // { saisie: true | false, plusTard: { type: "AAAA-MM-JJ" } }
      guideVu: null,             // { coiffure | revente | salonh: "AAAA-MM-JJ" } guide terminé ou passé
      notifications: null        // { autorisees, endpoint, cles { p256dh, auth }, demandeesLe, refuseeLe, saisieEnvoyee }
    };
  }
  function normaliserCompte(o){
    var base = compteVide(), k;
    if(!o || typeof o !== "object") return base;
    for(k in o) if(Object.prototype.hasOwnProperty.call(o, k) && o[k] !== undefined) base[k] = o[k];
    if(!base.installations || typeof base.installations !== "object") base.installations = { coiffure: null, revente: null, salonh: null };
    if(!Array.isArray(base.activites)) base.activites = [];
    if(!base.invitation || typeof base.invitation !== "object") base.invitation = {};
    if(!base.appareilLe || typeof base.appareilLe !== "object") base.appareilLe = {};
    if(base.session && (typeof base.session !== "object" || !base.session.refresh_token)) base.session = null;
    if(base.pin && (typeof base.pin !== "object" || !base.pin.empreinte || !base.pin.sel)) base.pin = null;
    if(base.empreinte && (typeof base.empreinte !== "object" || !base.empreinte.credentialId)) base.empreinte = null;
    var s = base.sauvegardeEnLigne;
    if(!s || typeof s !== "object") s = {};
    base.sauvegardeEnLigne = { active: s.active !== false, derniereLe: s.derniereLe || null, derniereMs: s.derniereMs || null,
      derniereTaille: s.derniereTaille || null, aRefaire: s.aRefaire === true };
    if(base.paiement && (typeof base.paiement !== "object" || !base.paiement.donnees || typeof base.paiement.donnees !== "object")) base.paiement = null;
    if(base.declaration && typeof base.declaration !== "object") base.declaration = null;
    if(base.merci && (typeof base.merci !== "object" || !base.merci.fin)) base.merci = null;
    if(base.conditionsAnnonce && typeof base.conditionsAnnonce !== "object") base.conditionsAnnonce = null;
    if(base.rappels && (typeof base.rappels !== "object" || Array.isArray(base.rappels))) base.rappels = null;
    if(base.guideVu && (typeof base.guideVu !== "object" || Array.isArray(base.guideVu))) base.guideVu = null;
    if(base.notifications && (typeof base.notifications !== "object" || Array.isArray(base.notifications))) base.notifications = null;
    base.version = 1;
    return base;
  }
  function lireStockage(cle){
    try{ return localStorage.getItem(cle); }catch(e){ return null; }
  }
  function ecrireStockage(cle, texte){
    try{ localStorage.setItem(cle, texte); return true; }catch(e){ return false; }
  }
  // Relit toujours le stockage : une autre appli MonDjai de la même adresse
  // a pu modifier le compte entre-temps.
  function chargerCompte(){
    var brut = lireStockage(CLE_COMPTE), o = null;
    if(brut){ try{ o = JSON.parse(brut); }catch(e){ o = null; } }
    compte = normaliserCompte(o);
    return compte;
  }
  function enregistrerCompte(){
    ecrireStockage(CLE_COMPTE, JSON.stringify(compte));
    planifierCopieSecours();
  }
  // Lecture – modification – écriture, en une fois.
  function modifierCompte(fn){
    chargerCompte();
    fn(compte);
    enregistrerCompte();
    return compte;
  }
  function sansSession(c){
    var o = copier(c);
    o.session = null;
    return o;
  }
  function estInscrit(){ return !!(compte && compte.id); }
  function estConnecte(){ return !!(compte && compte.session && compte.session.refresh_token); }
  // Inscription à terminer : pas de compte serveur connu et rien en attente d'envoi.
  function inscriptionATerminer(){ return !!compte && !compte.id && !compte.enAttente; }

  /* ---------- Copie de secours (IndexedDB), sans jamais masquer l'écran ---------- */
  // Ouvre une base IndexedDB et crée les magasins qui manquent (jamais
  // d'effacement). suite(base) ; base = null si IndexedDB est absent ou refusé.
  function ouvrirBase(nom, version, magasins, suite){
    var idb = null, fini = false;
    function rendre(base){ if(!fini){ fini = true; suite(base); } }
    try{ idb = window.indexedDB; }catch(e){ idb = null; }
    if(!idb){ rendre(null); return; }
    try{
      var dem = idb.open(nom, version);
      dem.onupgradeneeded = function(){
        for(var i = 0; i < magasins.length; i++){
          try{ if(!dem.result.objectStoreNames.contains(magasins[i])) dem.result.createObjectStore(magasins[i]); }catch(e){}
        }
      };
      dem.onsuccess = function(){
        var base = dem.result;
        try{ base.onversionchange = function(){ try{ base.close(); }catch(e){} }; }catch(e){}
        rendre(base);
      };
      dem.onerror = function(){ rendre(null); };
      dem.onblocked = function(){ rendre(null); };
    }catch(e){ rendre(null); }
  }
  function ouvrirBaseSecours(suite){ ouvrirBase(BASE_SECOURS, VERSION_BASE_SECOURS, ["copie", "cle"], suite); }
  function fermerBase(base){ try{ base.close(); }catch(e){} }
  function planifierCopieSecours(){
    if(minuteurs.copie) clearTimeout(minuteurs.copie);
    minuteurs.copie = setTimeout(ecrireCopieSecours, DELAI_COPIE_SECOURS_MS);
  }
  function ecrireCopieSecours(){
    minuteurs.copie = null;
    if(!compte) return;
    // On n'écrase jamais une copie qu'on n'a pas encore pu lire, et on ne
    // copie rien tant qu'il n'y a ni compte, ni numéro, ni code PIN.
    if(!memoire.secoursLu) return;
    if(!compte.id && !compte.telephone && !compte.pin && !compte.enAttente) return;
    var texte = JSON.stringify(sansSession(compte));
    ouvrirBaseSecours(function(base){
      if(!base) return;
      try{
        var tx = base.transaction("copie", "readwrite");
        tx.objectStore("copie").put({ texte: texte, le: maintenant() }, "compte");
        tx.oncomplete = function(){ try{ base.close(); }catch(e){} };
        tx.onerror = tx.onabort = function(){ try{ base.close(); }catch(e){} };
      }catch(e){ try{ base.close(); }catch(e2){} }
    });
  }
  // Au démarrage : si le compte a disparu du stockage principal et qu'une copie
  // existe, elle est remise en place (sans session), sans rechargement.
  function retrouverDepuisSecours(){
    if(lireStockage(CLE_COMPTE)){ memoire.secoursLu = true; return; }
    ouvrirBaseSecours(function(base){
      if(!base) return;                       // copie illisible : on n'y touchera pas
      try{
        var tx = base.transaction("copie", "readonly");
        var dem = tx.objectStore("copie").get("compte");
        dem.onsuccess = function(){
          var v = dem.result, o = null;
          try{ base.close(); }catch(e){}
          memoire.secoursLu = true;
          if(!v || !v.texte) return;
          try{ o = JSON.parse(v.texte); }catch(e){ o = null; }
          if(!o) return;
          chargerCompte();
          if(compte.id || compte.telephone || compte.pin || compte.session) return;
          var ici = compte;
          compte = normaliserCompte(o);
          compte.session = null;
          for(var i = 0; i < APPLIS.length; i++){
            if(!compte.installations[APPLIS[i]] && ici.installations[APPLIS[i]]) compte.installations[APPLIS[i]] = ici.installations[APPLIS[i]];
          }
          if(ici.choixEntree) compte.choixEntree = ici.choixEntree;
          ecrireStockage(CLE_COMPTE, JSON.stringify(compte));
          prevenirSiRepos();
        };
        dem.onerror = function(){ try{ base.close(); }catch(e){} };
      }catch(e){ try{ base.close(); }catch(e2){} }
    });
  }

  /* ---------- Sauvegarde en fichier ---------- */
  // Bloc « compte » ajouté au fichier « Sauvegarder mes données » : jamais la session.
  function pourSauvegarde(){
    chargerCompte();
    var o = sansSession(compte);
    o.statut = null;                 // le statut est toujours repris du serveur
    o.appareilLe = {};
    o.paiement = null;               // coordonnées : toujours reprises du serveur
    o.merci = null;
    o.notifications = null;          // v3 : l'adresse de notification est propre à ce téléphone
    return o;
  }
  // À la restauration : le compte du fichier n'est remis en place que s'il
  // manque sur ce téléphone. Renvoie true s'il a été remis.
  function restaurerDepuisSauvegarde(o){
    if(!o || typeof o !== "object") return false;
    chargerCompte();
    if(compte.id || compte.telephone || compte.pin || compte.session) return false;
    var installations = compte.installations, invitation = compte.invitation;
    compte = normaliserCompte(o);
    compte.session = null;
    compte.statut = null;
    compte.appareilLe = {};
    compte.paiement = null;
    compte.merci = null;
    compte.notifications = null;              // v3 : à redemander sur ce téléphone
    compte.installations = installations;     // l'installation est celle de CE téléphone
    compte.invitation = invitation;
    enregistrerCompte();
    return true;
  }

  /* ---------- Réseau : XMLHttpRequest vers le serveur MonDjai seulement ---------- */
  // suite(erreur, donnees) ; erreur = { type: "reseau" | "delai" | "serveur" | "refus", statut, code, message }
  function requete(methode, chemin, corps, jeton, suite){
    var fini = false, xhr;
    function rendre(err, data){ if(!fini){ fini = true; enCours.appel--; suite(err, data); } }
    enCours.appel++;
    try{
      xhr = new XMLHttpRequest();
      xhr.open(methode, SUPABASE_URL + chemin, true);
      xhr.timeout = DELAI_MAX_MS;
      xhr.setRequestHeader("apikey", SUPABASE_CLE_PUBLIQUE);
      xhr.setRequestHeader("Content-Type", "application/json");
      // La clé publique n'est pas un jeton : Authorization seulement une fois connectée.
      if(jeton) xhr.setRequestHeader("Authorization", "Bearer " + jeton);
      xhr.onreadystatechange = function(){
        if(xhr.readyState !== 4) return;
        var statut = xhr.status, data = null;
        if(!statut) return;                         // réseau ou délai : onerror / ontimeout suit
        try{ data = xhr.responseText ? JSON.parse(xhr.responseText) : null; }catch(e){ data = null; }
        if(statut >= 200 && statut < 300){ rendre(null, data); return; }
        var code = data ? (data.error_code || data.code || data.error || "") : "";
        var message = data ? (data.msg || data.message || data.error_description || "") : "";
        rendre({ type: statut >= 500 ? "serveur" : "refus", statut: statut, code: String(code), message: String(message) }, null);
      };
      xhr.onerror = function(){ rendre({ type: "reseau", statut: 0, code: "", message: "" }, null); };
      xhr.ontimeout = function(){ rendre({ type: "delai", statut: 0, code: "", message: "" }, null); };
      xhr.onabort = function(){ rendre({ type: "reseau", statut: 0, code: "", message: "" }, null); };
      xhr.send(corps === undefined || corps === null ? null : JSON.stringify(corps));
    }catch(e){
      rendre({ type: "reseau", statut: 0, code: "", message: "" }, null);
    }
  }
  function estPanne(err){ return !!err && (err.type === "reseau" || err.type === "delai" || err.type === "serveur"); }
  function estJetonRefuse(err){
    return !!err && err.type === "refus" && (err.statut === 401 || /jwt/i.test(err.message || "") || /^PGRST30[13]$/.test(err.code || ""));
  }
  // Message doux pour une panne.
  function messagePanne(err){
    if(!err) return "";
    if(err.type === "reseau") return "Pas de réseau pour l’instant. Réessayez dans un moment.";
    if(err.type === "delai") return "Le réseau est lent. Réessayez dans un moment.";
    if(err.type === "serveur") return "Le service est occupé. Réessayez dans un moment.";
    if(err.statut === 429) return "Trop d’essais. Patientez une minute.";
    return "Cela n’a pas marché. Réessayez dans un moment.";
  }

  /* ---------- Connexion par SMS et jetons ---------- */
  function demanderCode(telephone, suite){
    requete("POST", "/auth/v1/otp", { phone: telephone }, null, function(err){ suite(err || null); });
  }
  function verifierCode(telephone, code, suite){
    requete("POST", "/auth/v1/verify", { type: "sms", phone: telephone, token: code }, null, function(err, data){
      if(err){ suite(err); return; }
      if(!data || !data.access_token || !data.refresh_token){ suite({ type: "serveur", statut: 500, code: "", message: "" }); return; }
      rangerSession(data);
      modifierCompte(function(c){ c.telephone = telephone; });
      suite(null);
    });
  }
  function rangerSession(data){
    var duree = Number(data.expires_in) > 0 ? Number(data.expires_in) : 3600;
    modifierCompte(function(c){
      c.session = { access_token: data.access_token, refresh_token: data.refresh_token, expire: maintenant() + duree * 1000 };
    });
  }
  // Un seul renouvellement à la fois (le jeton de renouvellement ne sert qu'une fois).
  function renouvelerSession(suite){
    if(enCours.renouvellement){ enCours.renouvellement.push(suite); return; }
    chargerCompte();
    if(!estConnecte()){ suite({ type: "refus", statut: 401, code: "sans_session", message: "" }); return; }
    enCours.renouvellement = [suite];
    requete("POST", "/auth/v1/token?grant_type=refresh_token", { refresh_token: compte.session.refresh_token }, null, function(err, data){
      var attente = enCours.renouvellement, i;
      enCours.renouvellement = null;
      if(!err && data && data.access_token && data.refresh_token) rangerSession(data);
      else if(!err) err = { type: "serveur", statut: 500, code: "", message: "" };
      else if(err.type === "refus"){
        // Session refusée pour de bon : il faudra se reconnecter par SMS.
        modifierCompte(function(c){ c.session = null; });
        prevenirSiRepos();
      }
      for(i = 0; i < attente.length; i++) attente[i](err || null);
    });
  }
  function avecJeton(suite){
    chargerCompte();
    if(!estConnecte()){ suite({ type: "refus", statut: 401, code: "sans_session", message: "" }, null); return; }
    if(compte.session.access_token && compte.session.expire - maintenant() > MARGE_RENOUVELLEMENT_MS){
      suite(null, compte.session.access_token);
      return;
    }
    renouvelerSession(function(err){
      if(err){ suite(err, null); return; }
      suite(null, compte.session.access_token);
    });
  }

  /* ---------- Appel des fonctions du serveur ---------- */
  // options.anonyme : comptages anonymes, avec la clé publique seule.
  function appelerFonction(nom, parametres, options, suite){
    var chemin = "/rest/v1/rpc/" + nom;
    if(options && options.anonyme){ requete("POST", chemin, parametres || {}, null, suite); return; }
    avecJeton(function(err, jeton){
      if(err){ suite(err, null); return; }
      requete("POST", chemin, parametres || {}, jeton, function(err2, data){
        if(estJetonRefuse(err2)){
          // Jeton expiré plus tôt que prévu : un renouvellement, un seul nouvel essai.
          renouvelerSession(function(err3){
            if(err3){ suite(err3, null); return; }
            requete("POST", chemin, parametres || {}, compte.session.access_token, suite);
          });
          return;
        }
        suite(err2, data);
      });
    });
  }

  /* ---------- File d'attente : mondjai_file_v1 ---------- */
  var FONCTIONS_UNIQUES = { enregistrer_mon_compte: 1, enregistrer_appareil: 1, declarer_paiement: 1 };
  function lireFile(){
    var brut = lireStockage(CLE_FILE), f = null;
    if(brut){ try{ f = JSON.parse(brut); }catch(e){ f = null; } }
    return Array.isArray(f) ? f : [];
  }
  function ecrireFile(f){ ecrireStockage(CLE_FILE, JSON.stringify(f)); }
  function mettreEnFile(fonction, parametres){
    var f = lireFile(), i;
    if(FONCTIONS_UNIQUES[fonction]){
      // Un seul envoi en attente par fonction : le plus récent remplace l'ancien.
      for(i = f.length - 1; i >= 0; i--) if(f[i] && f[i].fonction === fonction) f.splice(i, 1);
    }
    f.push({ fonction: fonction, parametres: parametres, creeLe: maintenant(), essais: 0 });
    while(f.length > FILE_TAILLE_MAX) f.shift();
    ecrireFile(f);
  }
  // Rejoue la file, dans l'ordre. S'arrête à la première panne (on réessaiera).
  function rejouerFile(suite){
    if(enCours.file){ if(suite) suite(); return; }
    var f = lireFile();
    if(!f.length || !estConnecte()){ if(suite) suite(); return; }
    enCours.file = true;
    (function suivant(){
      var file = lireFile();
      if(!file.length){ enCours.file = false; if(suite) suite(); return; }
      var envoi = file[0];
      appelerFonction(envoi.fonction, envoi.parametres, null, function(err, data){
        var file2 = lireFile();
        if(estPanne(err) || (err && err.code === "sans_session")){
          if(file2.length && file2[0].creeLe === envoi.creeLe){
            file2[0].essais = (file2[0].essais || 0) + 1;
            if(file2[0].essais > FILE_ESSAIS_MAX) file2.shift();
            ecrireFile(file2);
          }
          enCours.file = false;
          if(suite) suite();
          return;
        }
        // Reçu, ou refusé pour de bon par le serveur : on retire l'envoi.
        if(file2.length && file2[0].creeLe === envoi.creeLe){ file2.shift(); ecrireFile(file2); }
        if(!err && envoi.fonction === "enregistrer_mon_compte" && data) appliquerStatut(data);
        if(err && envoi.fonction === "enregistrer_mon_compte") modifierCompte(function(c){ c.enAttente = false; });
        if(envoi.fonction === "declarer_paiement"){
          modifierCompte(function(c){ if(c.declaration){ c.declaration.envoyee = !err; c.declaration.horsLigne = false; } });
          if(!err && data) appliquerStatut(data);
          prevenirSiRepos();
        }
        suivant();
      });
    })();
  }

  /* ---------- Statut ---------- */
  // Range la réponse de mon_statut (ou de enregistrer_mon_compte) dans le compte.
  function appliquerStatut(rep){
    if(!rep || typeof rep !== "object") return;
    modifierCompte(function(c){
      var s = rep.compte, a = rep.abonnement;
      if(s){
        c.id = s.identifiant || c.id;
        c.prenom = s.prenom || c.prenom;
        c.nom = s.nom === undefined ? c.nom : (s.nom || null);
        c.telephone = s.telephone || c.telephone;
        c.salon = s.salon || c.salon;
        if(Array.isArray(s.activites)) c.activites = s.activites.slice(0);
        c.modeCoiffure = s.mode_coiffure === undefined ? c.modeCoiffure : (s.mode_coiffure || null);
        c.commune = s.commune === undefined ? c.commune : (s.commune || null);
        c.enAttente = false;
        if(!c.inscritLe) c.inscritLe = jourLocal();
        if(!c.conditionsAccepteesLe) c.conditionsAccepteesLe = jourLocal();
      }
      if(a){
        var avant = c.statut;
        c.statut = {
          valeur: a.statut || null,
          saisieOuverte: a.saisie_ouverte !== false,
          formule: a.formule || null,
          essaiFin: a.essai_fin || null,
          fin: a.fin || null,
          accesFin: a.acces_fin || null,
          graceFin: a.grace_fin || null,
          confianceJusqua: a.confiance_jusqua || null,
          prix: Array.isArray(rep.prix) ? rep.prix : [],
          paiementEnAttente: rep.paiement_en_attente || null,
          recuLe: maintenant()
        };
        var nouvelleFin = c.statut.fin;
        if(avant && nouvelleFin && (!avant.fin || nouvelleFin > avant.fin)){
          // Paiement validé (ou fin réglée par l'administration) : « Merci ! » une fois.
          c.merci = { fin: nouvelleFin, vu: false, le: jourLocal() };
          c.declaration = null;
        } else if(c.declaration && c.declaration.envoyee && avant && avant.paiementEnAttente && !c.statut.paiementEnAttente){
          // La déclaration a disparu sans prolonger l'abonnement : refusée.
          c.declaration.refusee = true;
        }
      }
    });
    appel("surStatut");
  }
  // Demande le statut au serveur ; hors ligne, le dernier statut connu reste appliqué.
  function rafraichirStatut(suite){
    chargerCompte();
    if(!estConnecte() || enCours.statut){ if(suite) suite(null); return; }
    enCours.statut = true;
    memoire.dernierStatutDemande = maintenant();
    appelerFonction("mon_statut", {}, null, function(err, data){
      enCours.statut = false;
      if(!err && data){
        var avant = empreinteCompte();
        if(data.compte) appliquerStatut(data);
        if(avant !== empreinteCompte()) prevenirSiRepos();
        rejouerFile(function(){ envoyerAppareil(); });
        // Coordonnées de paiement : une fois par jour au moins (et à chaque ouverture de Mon abonnement).
        if(data.compte && (!compte.paiement || jourUtc(compte.paiement.recuLe) !== jourUtc())) rafraichirInfosPaiement();
        planifierSauvegardeAuto();
      }
      if(suite) suite(err || null, data || null);
    });
  }
  // Ce qui, dans le compte, change l'affichage de l'appli (sans les dates de réception).
  function empreinteCompte(){
    var o = sansSession(compte);
    if(o.statut) o.statut.recuLe = 0;
    return JSON.stringify(o);
  }
  function statutSiBesoin(){
    if(typeof document !== "undefined" && document.visibilityState === "hidden") return;
    if(maintenant() - memoire.dernierStatutDemande < 20000) return;   // pas deux demandes coup sur coup
    rafraichirStatut();
  }

  /* ---------- Appareil : une fois par jour au plus ---------- */
  function decrireAppareil(){
    var ua = "";
    try{ ua = navigator.userAgent || ""; }catch(e){}
    var marques = [["Tecno", /tecno/i], ["Infinix", /infinix/i], ["Itel", /\bitel\b/i], ["Samsung", /samsung|sm-[a-z]\d/i],
      ["Huawei", /huawei|honor|harmonyos/i], ["Xiaomi", /xiaomi|redmi|\bmi \d|poco/i], ["Oppo", /oppo|cph\d/i],
      ["Vivo", /vivo/i], ["Realme", /realme|rmx\d/i], ["Nokia", /nokia/i], ["iPhone", /iphone/i], ["iPad", /ipad/i]];
    var marque = null, i, m;
    for(i = 0; i < marques.length; i++) if(marques[i][1].test(ua)){ marque = marques[i][0]; break; }
    var systeme = null;
    if((m = /Android ([0-9.]+)/.exec(ua))) systeme = "Android " + m[1];
    else if((m = /OS (\d+)[_.](\d+)[^)]*like Mac OS X/.exec(ua))) systeme = "iOS " + m[1] + "." + m[2];
    else if(/Windows/.test(ua)) systeme = "Windows";
    else if(/Mac OS X/.test(ua)) systeme = "macOS";
    else if(/Linux/.test(ua)) systeme = "Linux";

  function identifiantInstallation(){

  /* ---------- Dates de l'abonnement (jour UTC, comme le serveur : Abidjan = UTC) ---------- */
  function jourUtc(ms){
    var d = new Date(ms === undefined || ms === null ? maintenant() : ms);
    return d.getUTCFullYear() + "-" + deux(d.getUTCMonth() + 1) + "-" + deux(d.getUTCDate());
  }
  function partiesJour(iso){
    var p = String(iso).slice(0, 10).split("-");

  }
  function ajouterJours(iso, n){

  }
  // b − a, en jours
  function ecartJours(a, b){
    var pa = partiesJour(a), pb = partiesJour(b);
    return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);

  function plusTardif(a, b){ if(!a) return b || null; if(!b) return a; return a > b ? a : b; }

    var p = partiesJour(iso), a = p[0], m = p[1] + 1;

  // La période qu'un paiement d'aujourd'hui donnerait : même règle que le
  // serveur (S6 periode_pour, S3 valider_paiement). À partir du 15, le mois
  // suivant (reste du mois offert) ; à la suite d'une période payée ; après
  // l'essai s'il est en cours. Une période finit le dernier jour d'un mois.
  function periodePour(jour, essaiFin, fin, duree){
    var p = partiesJour(jour);
    var debut = p[2] >= JOUR_BASCULE_ESSAI ? premierDuMoisSuivant(jour) : p[0] + "-" + deux(p[1]) + "-01";
    if(fin) debut = plusTardif(debut, premierDuMoisSuivant(fin));
    if(essaiFin && essaiFin >= jour) debut = plusTardif(debut, premierDuMoisSuivant(essaiFin));
    var q = partiesJour(debut), mois = q[1] - 1 + duree;
    var derniere = Date.UTC(q[0] + Math.floor(mois / 12), mois % 12, 1) - 86400000;

  /* ---------- Statut et accès (dernier statut connu, avec ses dates) ---------- */
  // Recalcule le statut à la date du jour à partir des dates reçues du
  // serveur : hors ligne, l'appli applique donc le dernier statut connu.
  // Même ordre que le serveur (S2 calcul_statut). Sans statut du serveur pour
  // ce compte, l'accès local d'avant (essai ou code du mois) reste valable.
  function statutCourant(){
    chargerCompte();
    var jour = jourUtc(), s = compte.statut, v, essaiFin, fin, accesFin, graceFin, source;
    if(s && (s.essaiFin || s.fin)){
      source = "serveur";
      essaiFin = s.essaiFin; fin = s.fin;
      accesFin = plusTardif(essaiFin, fin);
      graceFin = s.graceFin || ajouterJours(accesFin, JOURS_GRACE);
      if(fin && fin >= jour) v = "abonnee";
      else if(essaiFin && essaiFin >= jour) v = "essai";
      else if(jour <= graceFin) v = "grace";
      else if(s.confianceJusqua && maintenant() < Date.parse(s.confianceJusqua)) v = "confiance";
      else v = "lecture_seule";
    } else {
      source = "local";
      var l = appel("accesLocal", null);
      essaiFin = l && l.fin ? l.fin : null; fin = null;
      accesFin = essaiFin;
      graceFin = accesFin ? ajouterJours(accesFin, JOURS_GRACE) : null;
      // Jamais de blocage sans date connue.
      if(!accesFin || accesFin >= jour) v = "essai";

      confianceJusqua: s && v === "confiance" ? s.confianceJusqua : null,

      joursGrace: v === "grace" ? ecartJours(jour, graceFin) + 1 : null,

  }

  /* ---------- Formules et prix ---------- */
  function libelleFormule(code){
    var f = formuleDe(code);
    return f ? f.libelle : code;
  }
  function listeFormules(){
    chargerCompte();
    var p = compte.statut && Array.isArray(compte.statut.prix) && compte.statut.prix.length ? compte.statut.prix : FORMULES_SECOURS;
    return p;
  }
  function formuleDe(code){
    var l = listeFormules(), i;
    for(i = 0; i < l.length; i++) if(l[i] && l[i].formule === code) return l[i];

  function montantPour(code, duree){

  function formuleOuvreAppli(code){

  // Formules proposées, la première étant celle par défaut (§5.3 du cahier) :
  // compte « les deux » → Coiffure + Mèches d'abord, puis l'appli seule.
  function formulesProposees(){
    chargerCompte();
    var acts = compte.activites || [], seule = cfg.appli, out = [];
    var deux = cfg.appli !== "salonh" && acts.indexOf("coiffure") !== -1 && acts.indexOf("revente") !== -1;
    var enCours = compte.statut && compte.statut.formule && formuleOuvreAppli(compte.statut.formule) ? compte.statut.formule : null;
    if(enCours === "coiffure_revente" || (!enCours && deux)) out.push("coiffure_revente", seule);
    else if(enCours) out.push(enCours);
    else out.push(seule);
    if(deux && out.indexOf("coiffure_revente") === -1) out.push("coiffure_revente");

  // À l'écran, un montant ne se coupe jamais en fin de ligne (« 1 / 000 F »).
  function insecable(t){ return String(t).replace(/(\d) (?=\d{3}\b)/g, "$1\u00a0").replace(/(\d) F\b/g, "$1\u00a0F"); }
  function dureeLisible(duree){ return duree === 12 ? "1 an" : duree + " mois"; }
  function montantLisible(n){ return String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F"; }
  // Repères affichés : « soit … F par jour », économies sur 3 mois et 1 an.
  function parJour(code){ return Math.round(montantPour(code, 1) / JOURS_PAR_MOIS_AFFICHAGE); }
  function avantageDuree(code, duree){
    var mois = montantPour(code, 1), total = montantPour(code, duree);

    var economie = mois * duree - total;
    if(economie <= 0) return "";
    if(duree === 12 && economie % mois === 0) return (economie / mois) + " mois offerts";
    return montantLisible(economie) + " d’économie";

  /* ---------- Coordonnées de paiement (S6 : infos_paiement) ---------- */
  function cleAbonnement(){

  function rafraichirInfosPaiement(suite){

  // Coordonnées en vigueur : dernière réponse du serveur, sinon PAIEMENT_SECOURS.
  function infosPaiement(){

    return {
      beneficiaire: d.beneficiaire || s.beneficiaire,

      orange_money: d.orange_money && typeof d.orange_money === "object" ? d.orange_money : { actif: false },

  // Date de fin annoncée avant le paiement : celle du serveur si sa réponse

  function periodeAnnoncee(duree){

    if(d && Array.isArray(d.periodes) && d.serveur_le && jourUtc(Date.parse(d.serveur_le)) === jour && compte.paiement.abonnement === cleAbonnement()){
      for(i = 0; i < d.periodes.length; i++){

  // Lien Wave avec le montant déjà rempli : entier sans espace ni séparateur ;
  // « & » si le lien contient déjà « ? ». Lien refusé s'il n'est pas en https.
  function lienWave(lien, parametre, montant){
    lien = String(lien || "");
    var m = Math.round(Number(montant) || 0);
    if(!/^https:\/\//.test(lien) || !(m > 0)) return null;
    var sep = lien.indexOf("?") === -1 ? "?" : (/[?&]$/.test(lien) ? "" : "&");
    return lien + sep + encodeURIComponent(parametre || "amount") + "=" + String(m);
  }
  // Code USSD en lien tel: (« # » encodé %23, sinon le téléphone coupe le code).
  function lienUssd(ussd){
    var u = String(ussd || "").replace(/\s+/g, "");

  }
  function nettoyerReference(s){

  }

  // Message facultatif « Prévenir sur WhatsApp » : identifiant, formule, durée,

  function messageWhatsApp(d){

  // « J'ai payé » : declarer_paiement. Hors ligne : gardé et mis en file.

  // Ce qui est montré comme « paiement en cours de vérification ».
  function paiementEnCours(){
    chargerCompte();

    if(d && d.horsLigne) return { formule: d.formule, duree: d.duree, montant: d.montant, moyen: d.moyen, reference: d.reference, horsLigne: true };
    if(st && st.paiementEnAttente){

  /* ---------- Chiffrement (Web Crypto) : PBKDF2-SHA-256 → AES-GCM 256 ---------- */
  function cryptoPresent(){
    try{
      return !!(window.crypto && window.crypto.subtle && typeof window.crypto.subtle.deriveKey === "function" &&
        typeof window.crypto.subtle.encrypt === "function" && typeof Promise === "function" && window.Uint8Array);
    }catch(e){ return false; }
  }
  function octetsUtf8(s){
    s = String(s);
    if(typeof TextEncoder === "function") return new TextEncoder().encode(s);
    var bin = unescape(encodeURIComponent(s)), o = new Uint8Array(bin.length), i;
    for(i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
    return o;
  }
  function texteUtf8(octets){
    if(typeof TextDecoder === "function") return new TextDecoder("utf-8").decode(octets);
    var morceaux = [], i;
    for(i = 0; i < octets.length; i += 8192) morceaux.push(String.fromCharCode.apply(null, Array.prototype.slice.call(octets, i, i + 8192)));
    return decodeURIComponent(escape(morceaux.join("")));
  }
  function tirerCle(pin, sel, iterations){
    var subtle = window.crypto.subtle;
    return subtle.importKey("raw", octetsUtf8(pin), { name: "PBKDF2" }, false, ["deriveKey"]).then(function(base){
      return subtle.deriveKey({ name: "PBKDF2", salt: sel, iterations: iterations, hash: "SHA-256" }, base,
        { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }
  function chiffrer(cle, texte){
    var iv = octetsHasard(LONGUEUR_IV);
    return window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, cle, octetsUtf8(texte)).then(function(buf){
      return { donnees: versBase64(new Uint8Array(buf)), iv: versBase64(iv) };
    });
  }
  function dechiffrer(cle, donnees, iv){
    return window.crypto.subtle.decrypt({ name: "AES-GCM", iv: depuisBase64(iv) }, cle, depuisBase64(donnees)).then(function(buf){
      return texteUtf8(new Uint8Array(buf));
    });
  }

  /* ---------- La clé de la sauvegarde : CryptoKey non exportable (magasin « cle ») ---------- */
  // Tirée du code PIN quand il est créé, changé ou tapé ; jamais le PIN ni la
  // clé en clair, jamais dans un fichier. Elle permet la sauvegarde du jour
  // même quand l'appli s'ouvre avec l'empreinte.
  function lireCle(suite){
    if(memoire.cle || memoire.cleLue){ suite(memoire.cle); return; }
    ouvrirBaseSecours(function(base){
      if(!base){ memoire.cleLue = true; suite(memoire.cle); return; }
      try{
        var dem = base.transaction("cle", "readonly").objectStore("cle").get(CLE_SAUVEGARDE);
        dem.onsuccess = function(){
          fermerBase(base);
          var v = dem.result;
          memoire.cleLue = true;
          if(v && v.cle && v.sel && !memoire.cle) memoire.cle = v;
          suite(memoire.cle);
        };
        dem.onerror = function(){ fermerBase(base); memoire.cleLue = true; suite(memoire.cle); };
      }catch(e){ fermerBase(base); memoire.cleLue = true; suite(memoire.cle); }
    });
  }
  // Range la clé ; si le navigateur refuse de la garder, elle reste en
  // mémoire pour la journée (repli : sauvegarde le jour où le PIN est tapé).
  function rangerCle(objet, suite){
    memoire.cle = objet; memoire.cleLue = true;
    ouvrirBaseSecours(function(base){
      if(!base){ memoire.cleNonGardee = true; if(suite) suite(false); return; }
      var fini = false;
      function rendre(ok){ if(fini) return; fini = true; fermerBase(base); memoire.cleNonGardee = !ok; if(suite) suite(ok); }
      try{
        var tx = base.transaction("cle", "readwrite");
        tx.objectStore("cle").put(objet, CLE_SAUVEGARDE);
        tx.oncomplete = function(){ rendre(true); };
        tx.onerror = tx.onabort = function(){ rendre(false); };
      }catch(e){ rendre(false); }
    });
  }
  function effacerCle(){
    memoire.cle = null; memoire.cleLue = true;
    ouvrirBaseSecours(function(base){
      if(!base) return;
      try{
        var tx = base.transaction("cle", "readwrite");
        tx.objectStore("cle")["delete"](CLE_SAUVEGARDE);
        tx.oncomplete = tx.onerror = tx.onabort = function(){ fermerBase(base); };
      }catch(e){ fermerBase(base); }
    });
  }
  // Tire une nouvelle clé (sel neuf) du code PIN et la range. suite(objet | null)
  function creerCle(pin, suite){
    if(!cryptoPresent()){ if(suite) suite(null); return; }
    var sel = octetsHasard(LONGUEUR_SEL);
    enCours.cle = true;
    try{
      tirerCle(String(pin), sel, PBKDF2_ITERATIONS).then(function(cle){
        enCours.cle = false;
        var objet = { cle: cle, sel: versBase64(sel), iterations: PBKDF2_ITERATIONS, le: maintenant() };
        rangerCle(objet, function(){ if(suite) suite(objet); });
      }, function(){ enCours.cle = false; if(suite) suite(null); });
    }catch(e){ enCours.cle = false; if(suite) suite(null); }
  }
  // Le code PIN vient d'être tapé (écran de l'appli) : un PIN d'avant
  // (config.pinCode) ou un PIN du compte sans clé produit la clé ; dans le
  // repli sans clé gardée, la sauvegarde du jour se fait maintenant.
  function pinTape(pin){
    if(!cryptoPresent() || !pin) return;
    lireCle(function(c){
      if(c){ if(memoire.cleNonGardee) planifierSauvegardeAuto(); return; }
      creerCle(pin, function(objet){ if(objet) planifierSauvegardeAuto(); prevenirReglages(); });
    });
  }

  /* ---------- Sauvegarde en ligne ---------- */
  function pinPresent(){ chargerCompte(); return !!compte.pin || appel("pinExistant", false) === true; }
  // Pourquoi la sauvegarde en ligne ne peut pas se faire (ou "" si elle peut).
  function empechementSauvegarde(){
    chargerCompte();
    if(!cryptoPresent()) return "crypto";
    if(!pinPresent()) return "pin";
    if(!estInscrit()) return "inscription";
    if(!estConnecte()) return "connexion";
    if(!compte.sauvegardeEnLigne.active) return "desactivee";
    return "";
  }
  function sauvegardeDue(){
    chargerCompte();
    var s = compte.sauvegardeEnLigne;
    return !empechementSauvegarde() && (s.aRefaire || s.derniereLe !== jourLocal());
  }
  function planifierSauvegardeAuto(){
    if(minuteurs.sauvegarde || !cfg) return;
    if(!sauvegardeDue()) return;
    if(maintenant() - memoire.sauvegardeEchecLe < PAUSE_APRES_ECHEC_MS) return;
    minuteurs.sauvegarde = setTimeout(function(){
      minuteurs.sauvegarde = null;
      essayerSauvegardeAuto();
    }, DELAI_SAUVEGARDE_AUTO_MS);
  }
  // Une fois par jour, au premier lancement du jour, appli au repos.
  function essayerSauvegardeAuto(){
    if(!sauvegardeDue() || enCours.sauvegarde || !enLigne()) return;
    if(ecran || appel("verrouille", false) === true || appel("auRepos", true) !== true){ planifierSauvegardeAuto(); return; }
    lireCle(function(cle){
      if(!cle) return;                         // pas de clé : le PIN sera demandé une fois (Réglages)
      sauvegarderAvec(cle, function(err){
        if(err) memoire.sauvegardeEchecLe = maintenant();
        prevenirReglages();
      });
    });
  }
  // Chiffre le contenu donné par l'appli et le dépose sur le serveur.
  // suite(erreur) ; erreur = { type: "taille" | "contenu" | "crypto" | … }
  function sauvegarderAvec(cleObjet, suite){
    if(enCours.sauvegarde){ suite({ type: "occupe" }); return; }
    var contenu = appel("contenuSauvegarde", null);
    if(!contenu || typeof contenu !== "object"){ suite({ type: "contenu" }); return; }
    var texte;
    try{ texte = JSON.stringify({ format: FORMAT_SAUVEGARDE, version: 1, appli: cfg.appli, versionAppli: String(cfg.version || ""), le: maintenant(), contenu: contenu }); }
    catch(e){ suite({ type: "contenu" }); return; }
    enCours.sauvegarde = true;
    function finir(err){ enCours.sauvegarde = false; suite(err || null); }
    try{
      chiffrer(cleObjet.cle, texte).then(function(ch){
        if(ch.donnees.length > TAILLE_MAX_SAUVEGARDE){ finir({ type: "taille" }); return; }
        var parametres = { p_appli: cfg.appli, p_donnees: ch.donnees, p_iv: ch.iv, p_sel: cleObjet.sel,
          p_iterations: cleObjet.iterations, p_version: String(cfg.version || "").slice(0, 40) };
        appelerFonction("deposer_sauvegarde", parametres, null, function(err, data){
          if(err){ finir(err); return; }
          modifierCompte(function(c){
            c.sauvegardeEnLigne.derniereLe = jourLocal();
            c.sauvegardeEnLigne.derniereMs = data && data.maj_le ? Date.parse(data.maj_le) || maintenant() : maintenant();
            c.sauvegardeEnLigne.derniereTaille = data && data.taille ? data.taille : ch.donnees.length;
            c.sauvegardeEnLigne.aRefaire = false;
          });
          compter("sauvegarde.en_ligne");
          finir(null);
        });
      }, function(){ finir({ type: "crypto" }); });
    }catch(e){ finir({ type: "crypto" }); }
  }
  // Lecture d'une sauvegarde (la dernière, ou l'avant-dernière). suite(err, s | null)
  function lireSauvegardeEnLigne(precedente, suite){
    appelerFonction("lire_ma_sauvegarde", { p_appli: cfg.appli, p_precedente: !!precedente }, null, function(err, data){
      if(err){ suite(err, null); return; }
      if(!data || typeof data !== "object" || !data.donnees || !data.iv || !data.sel){ suite(null, null); return; }
      suite(null, data);
    });
  }
  // Ouvre une sauvegarde avec le PIN tapé. suite(null, { contenu, cle }) ou suite({ type: "pin" | "illisible" })
  function ouvrirSauvegarde(s, pin, suite){
    var sel = depuisBase64(s.sel), iterations = Number(s.iterations) || PBKDF2_ITERATIONS, cleTiree = null;
    try{
      tirerCle(String(pin), sel, iterations).then(function(cle){
        cleTiree = cle;
        return dechiffrer(cle, s.donnees, s.iv);
      }).then(function(texte){
        var o = null;
        try{ o = JSON.parse(texte); }catch(e){ o = null; }
        if(!o || o.format !== FORMAT_SAUVEGARDE || !o.contenu || typeof o.contenu !== "object"){ suite({ type: "illisible" }); return; }
        if(o.appli && o.appli !== cfg.appli){ suite({ type: "illisible" }); return; }
        suite(null, { contenu: o.contenu, cle: { cle: cleTiree, sel: s.sel, iterations: iterations, le: maintenant() }, le: s.maj_le || null });
      }, function(){
        // AES-GCM ne dit pas si c'est le code ou les données : mauvais PIN, ou sauvegarde abîmée.
        suite({ type: "pin" });
      });
    }catch(e){ suite({ type: "illisible" }); }
  }
  // Réglages de l'appli à redessiner (message, date de la dernière sauvegarde).
  function prevenirReglages(){ if(!ecran) appel("surChangement"); else if(ecran.type === "feuille") prevenirAppli(); }

  /* ---------- Copie de secours des chiffres de l'appli (IndexedDB) ---------- */
  // o = { base, lire() → texte | null (stockage principal), ecrire(texte), estVide(texte) → bool, surRestauration() }
  // La copie n'est jamais écrite avant d'avoir été lue ; jamais écrasée par un
  // état vide ; elle ne remplace jamais un stockage principal présent ; elle
  // ne masque jamais l'écran (tout se fait en arrière-plan).
  function ouvrirBaseDonnees(suite){ ouvrirBase(copieDonnees.o.base, 1, ["copie"], suite); }
  function demarrerCopieDonnees(o){
    if(copieDonnees || !o || !o.base) return;
    copieDonnees = { o: o, lue: false };
    ouvrirBaseDonnees(function(base){
      if(!base) return;                        // copie impossible : on n'écrira jamais
      try{
        var dem = base.transaction("copie", "readonly").objectStore("copie").get("etat");
        dem.onsuccess = function(){
          fermerBase(base);
          var v = dem.result, ici = null;
          try{ ici = o.lire(); }catch(e){ ici = null; }
          copieDonnees.lue = true;
          if(ici === null && v && typeof v.texte === "string" && !vide(v.texte)){
            try{ o.ecrire(v.texte); }catch(e){}
            try{ o.surRestauration(); }catch(e){}
            return;
          }
          if(ici !== null && !vide(ici) && (!v || v.texte !== ici)) noterChangementDonnees();
        };
        dem.onerror = function(){ fermerBase(base); };
      }catch(e){ fermerBase(base); }
    });
  }
  function vide(texte){
    try{ return copieDonnees.o.estVide(texte) !== false; }catch(e){ return true; }
  }
  function noterChangementDonnees(){
    if(!copieDonnees || !copieDonnees.lue) return;
    if(minuteurs.donnees) clearTimeout(minuteurs.donnees);
    minuteurs.donnees = setTimeout(ecrireCopieDonnees, DELAI_COPIE_DONNEES_MS);
  }
  function ecrireCopieDonnees(){
    minuteurs.donnees = null;
    if(!copieDonnees || !copieDonnees.lue) return;
    var texte = null;
    try{ texte = copieDonnees.o.lire(); }catch(e){ texte = null; }
    if(texte === null || vide(texte)) return;   // jamais d'état vide sur la copie
    ouvrirBaseDonnees(function(base){
      if(!base) return;
      try{
        var tx = base.transaction("copie", "readwrite");
        tx.objectStore("copie").put({ texte: texte, le: maintenant(), version: String(cfg && cfg.version || "") }, "etat");
        tx.oncomplete = tx.onerror = tx.onabort = function(){ fermerBase(base); };
      }catch(e){ fermerBase(base); }
    });
  }

  /* ---------- Inscription et modification du compte ---------- */
  // fiche = { prenom, nom, commune, activites, salon, modeCoiffure }
  function parametresCompte(fiche){
    return { p_prenom: fiche.prenom, p_nom: fiche.nom || "", p_salon: fiche.salon, p_activites: fiche.activites,
      p_mode_coiffure: fiche.modeCoiffure || null, p_commune: fiche.commune || "", p_parrain: null, p_conditions: true };
  }
  // Enregistre sur le serveur ; en cas de panne, garde la fiche sur le téléphone
  // et la met en file d'attente. suite(erreurDefinitive, enAttente)
  function envoyerFiche(fiche, suite){
    var parametres = parametresCompte(fiche);
    function rangerLocalement(enAttente){
      modifierCompte(function(c){
        c.prenom = fiche.prenom; c.nom = fiche.nom || null; c.commune = fiche.commune || null;
        c.salon = fiche.salon; c.activites = fiche.activites.slice(0); c.modeCoiffure = fiche.modeCoiffure || null;
        if(!c.conditionsAccepteesLe) c.conditionsAccepteesLe = jourLocal();
        if(enAttente && !c.id) c.enAttente = true;
      });
    }
    appelerFonction("enregistrer_mon_compte", parametres, null, function(err, data){
      if(!err){
        rangerLocalement(false);
        appliquerStatut(data);
        envoyerAppareil();
        suite(null, false);
        return;
      }
      if(estPanne(err)){
        rangerLocalement(true);
        mettreEnFile("enregistrer_mon_compte", parametres);
        suite(null, true);
        return;
      }
      suite(err, false);
    });
  }

  /* ---------- Code PIN du compte (haché) et empreinte ---------- */
  function pinDefini(){ chargerCompte(); return !!compte.pin; }
  function verifierPin(pin){
    chargerCompte();
    if(!compte.pin) return false;
    return hacherPin(String(pin), compte.pin.sel) === compte.pin.empreinte;
  }
  // cleTiree (facultative) : clé déjà tirée de ce PIN (restauration d'une
  // sauvegarde en ligne) ; sinon une clé neuve est tirée du nouveau PIN.
  function definirPin(pin, cleTiree){
    var sel = hasard(16, ALPHABET_ID);
    modifierCompte(function(c){
      c.pin = { empreinte: hacherPin(String(pin), sel), sel: sel };
      // La prochaine sauvegarde en ligne part avec la clé de ce PIN.
      c.sauvegardeEnLigne.aRefaire = true;
    });
    appel("surPinDefini");
    if(cleTiree) rangerCle(cleTiree, function(){ planifierSauvegardeAuto(); });
    else creerCle(pin, function(){ planifierSauvegardeAuto(); prevenirReglages(); });
  }
  function retirerPin(){
    modifierCompte(function(c){ c.pin = null; c.empreinte = null; });
    effacerCle();
    appel("surPinRetire");
  }
  function empreinteActive(){ chargerCompte(); return !!(compte.empreinte && memoire.empreintePossible !== false && webAuthnPresent()); }
  function webAuthnPresent(){
    try{ return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create && navigator.credentials.get && window.Uint8Array); }
    catch(e){ return false; }
  }
  // L'empreinte n'est proposée que si le téléphone répond « oui ».
  function sonderEmpreinte(){
    memoire.empreintePossible = false;
    if(!webAuthnPresent()) return;
    try{
      var f = window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable;
      if(typeof f !== "function") return;
      memoire.empreintePossible = null;          // réponse du téléphone attendue
      f.call(window.PublicKeyCredential).then(function(oui){
        var avant = memoire.empreintePossible;
        memoire.empreintePossible = oui === true;
        if(ecran) majApresSonde();
        // Écran de code PIN de l'appli déjà affiché : le bouton de l'empreinte suit la réponse.
        else if(avant !== memoire.empreintePossible && compte && compte.empreinte && appel("verrouille", false) === true) prevenirAppli();
      }, function(){ memoire.empreintePossible = false; });
    }catch(e){ memoire.empreintePossible = false; }
  }
  function octetsHasard(n){
    var o = new Uint8Array(n);
    try{ window.crypto.getRandomValues(o); }catch(e){ for(var i = 0; i < n; i++) o[i] = Math.floor(Math.random() * 256); }
    return o;
  }
  var B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
  // Base64 « url » sans remplissage (identifiants d'empreinte, sauvegarde en
  // ligne). Par morceaux : une sauvegarde peut faire plusieurs Mo.
  function versBase64(octets){
    var morceaux = [], out = "", i, a, b, c;
    for(i = 0; i < octets.length; i += 3){
      a = octets[i]; b = i + 1 < octets.length ? octets[i + 1] : 0; c = i + 2 < octets.length ? octets[i + 2] : 0;
      out += B64.charAt(a >> 2) + B64.charAt(((a & 3) << 4) | (b >> 4));
      if(i + 1 < octets.length) out += B64.charAt(((b & 15) << 2) | (c >> 6));
      if(i + 2 < octets.length) out += B64.charAt(c & 63);
      if(out.length >= 8192){ morceaux.push(out); out = ""; }
    }
    morceaux.push(out);
    return morceaux.join("");
  }
  var B64_VALEURS = null;
  function depuisBase64(s){
    var i, n = 0, bits = 0, k = 0;
    s = String(s || "");
    if(!B64_VALEURS){ B64_VALEURS = {}; for(i = 0; i < B64.length; i++) B64_VALEURS[B64.charAt(i)] = i; }
    var out = new Uint8Array(Math.floor(s.length * 3 / 4) + 3);
    for(i = 0; i < s.length; i++){
      var v = B64_VALEURS[s.charAt(i)];
      if(v === undefined) continue;
      n = ((n << 6) | v) & 0xffffff; bits += 6;
      if(bits >= 8){ bits -= 8; out[k++] = (n >> bits) & 255; }
    }
    return out.subarray ? out.subarray(0, k) : out;
  }
  // Enregistre l'empreinte du téléphone (authentificateur intégré seulement).
  function activerEmpreinte(suite){
    if(!webAuthnPresent() || memoire.empreintePossible !== true){ suite(false); return; }
    chargerCompte();
    try{
      navigator.credentials.create({ publicKey: {
        challenge: octetsHasard(32),
        rp: { name: "MonDjai" },
        user: { id: octetsHasard(16), name: compte.telephone || "MonDjai", displayName: compte.prenom || "MonDjai" },
        pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],

        timeout: 60000,
        attestation: "none"
      } }).then(function(cred){
        if(!cred || !cred.rawId){ suite(false); return; }
        var id = versBase64(new Uint8Array(cred.rawId));
        modifierCompte(function(c){ c.empreinte = { credentialId: id }; });
        suite(true);
      }, function(){ suite(false); });
    }catch(e){ suite(false); }
  }
  // Vérification locale : le téléphone confirme l'empreinte. Le PIN reste le secours.
  function verifierEmpreinte(suite){
    chargerCompte();
    if(!webAuthnPresent() || !compte.empreinte){ suite(false); return; }
    var attendu = compte.empreinte.credentialId;
    try{
      navigator.credentials.get({ publicKey: {
        challenge: octetsHasard(32),
        allowCredentials: [{ type: "public-key", id: depuisBase64(attendu), transports: ["internal"] }],
        userVerification: "required",
        timeout: 60000
      } }).then(function(cred){
        var ok = !!(cred && cred.rawId && versBase64(new Uint8Array(cred.rawId)) === attendu);
        try{
          // Bit « utilisatrice vérifiée » des données de l'authentificateur.
          var donnees = new Uint8Array(cred.response.authenticatorData);
          if(donnees.length > 32 && !(donnees[32] & 4)) ok = false;
        }catch(e){}
        suite(ok);
      }, function(){ suite(false); });
    }catch(e){ suite(false); }
  }

  function joursLisibles(n){ return n + (n > 1 ? " jours" : " jour"); }
  // Une ligne courte (Mon compte, Réglages).
  function resumeStatut(){
    var st = statutCourant();
    if(paiementEnCours() || st.valeur === "confiance") return "Paiement en vérification";
    if(st.valeur === "abonnee") return "Jusqu’au " + dateFr(st.fin);
    if(st.valeur === "essai") return st.accesFin ? (st.source === "local" ? "Accès" : "Essai") + " jusqu’au " + dateFr(st.accesFin) : "Essai gratuit";
    if(st.valeur === "grace") return "Terminé · encore " + joursLisibles(st.joursGrace);
    return "Lecture seule";
  }
  function htmlStatutAbonnement(st){
    var petit = "", grand = "", detail = "", cls = "mdc-statut";
    if(st.valeur === "abonnee"){ petit = "Abonnée jusqu’au"; grand = dateFr(st.fin); }
    else if(st.valeur === "essai"){
      petit = st.source === "local" ? "Accès jusqu’au" : "Essai gratuit jusqu’au";
      grand = st.accesFin ? dateFr(st.accesFin) : "";
      if(!st.accesFin){ petit = "Votre accès"; grand = "Essai gratuit"; }
    }
    else if(st.valeur === "grace"){
      petit = (st.dejaAbonnee ? "Abonnement terminé le" : "Essai terminé le"); grand = dateFr(st.accesFin);
      detail = "Encore " + joursLisibles(st.joursGrace) + " pour noter.";
    }
    else if(st.valeur === "confiance"){ petit = "Paiement en cours de vérification"; grand = "Saisie ouverte"; detail = "En attendant la validation."; }
    else { petit = "Votre accès"; grand = "Lecture seule"; detail = "Vos chiffres restent sur ce téléphone."; cls += " ls"; }
    return '<div class="' + cls + '" data-test="statut-abonnement" data-statut="' + esc(st.valeur) + '"><small>' + esc(petit) + '</small><b>' + esc(grand) + '</b>' +
      (detail ? '<span>' + esc(detail) + '</span>' : '') + '</div>';
  }
