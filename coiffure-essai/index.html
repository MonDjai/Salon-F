  /* ================= Calculs ================= */

  function sortByDateDesc(arr){
    return arr.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts||0) - (a.ts||0);
    });
  }

  function dateFromStr(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }

  function getDayRange(d){ var k = dateKey(d); return { start:k, end:k }; }
  function getWeekRange(d){
    var day = d.getDay();
    var diffLundi = (day === 0) ? -6 : (1 - day);
    var lundi = new Date(d); lundi.setDate(d.getDate() + diffLundi);
    var dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6);
    return { start: dateKey(lundi), end: dateKey(dimanche) };
  }
  function getMonthRange(d){
    var premier = new Date(d.getFullYear(), d.getMonth(), 1);
    var dernier = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: dateKey(premier), end: dateKey(dernier) };
  }
  function rangeForPeriode(periode, ref){
    if(periode === "semaine") return getWeekRange(ref);
    if(periode === "mois") return getMonthRange(ref);
    return getDayRange(ref);
  }
  function inRange(dateStr, range){ return !!dateStr && dateStr >= range.start && dateStr <= range.end; }
  function filterRange(arr, range){ return arr.filter(function(x){ return inRange(x.date, range); }); }
  function sumBy(arr, fn){ return arr.reduce(function(s,x){ return s + (Number(fn(x)) || 0); }, 0); }

  // Cahier des charges Sprint 5A, section 4 : Transport rejoint la Mèche —
  // aucun des deux ne pèse plus sur les charges, le solde net ou le bénéfice de
  // Coiffure (payés par la cliente). Seules les Charges communes du salon
  // restent une charge réelle. Les deux restent enregistrés sur chaque
  // prestation pour la traçabilité, et restent visibles comme blocs informatifs
  // sur Aujourd'hui.
  function recetteCoiffure(range){
    return recettesPeriode(range);
  }

  /* ----- Sprint 8C : crédit clientes (comptabilité de trésorerie) ----- */
  // La recette compte le jour où l'argent est reçu : le montant payé le jour
  // de la prestation (mainOeuvre) à la date de la prestation, chaque
  // encaissement ultérieur à sa propre date. Le reste dû n'entre dans aucun
  // calcul tant qu'il n'est pas reçu. FONCTION UNIQUE de recettes : toutes les
  // sommes de recettes (Main d'œuvre, Disponible, épargne, résultat net,
  // rémunérations, Télécharger…) passent par elle. Sans aucun crédit, elle
  // donne exactement la même somme qu'au 8B (Σ mainOeuvre).
  function recettesPeriode(range, act){
    var total = sumBy(filterRange(state.prestationsCoiffure, range).filter(function(p){
      return !act || activiteDe(p) === act;
    }), function(p){ return p.mainOeuvre; });
    var enc = state.encaissementsCredit || [];
    if(enc.length){
      total += sumBy(enc.filter(function(e){
        if(!e || !inRange(e.date, range)) return false;
        if(!act) return true;
        var p = prestationParId(e.prestationId);
        return activiteDe(p || {}) === act;
      }), function(e){ return e.montant; });
    }
    return total;
  }
  function prestationParId(id){
    var l = state.prestationsCoiffure;
    for(var i=0;i<l.length;i++) if(l[i] && l[i].id === id) return l[i];
    return null;
  }
  // Crédit d'une prestation (null si payée en entier ou donnée illisible).
  function creditDe(p){
    var c = p && p.credit;
    return (c && typeof c === "object" && Number(c.prixTotal) > 0) ? c : null;
  }
  function encaissementsDe(prestationId){
    return (state.encaissementsCredit || []).filter(function(e){ return e && e.prestationId === prestationId; });
  }
  function totalEncaissementsDe(prestationId){ return sumBy(encaissementsDe(prestationId), function(e){ return e.montant; }); }
  // Déjà reçu pour une prestation : payé le jour même + encaissements.
  function dejaRecuPrestation(p){ return (Number(p.mainOeuvre) || 0) + totalEncaissementsDe(p.id); }
  // Reste dû = prix total − payé le jour de la prestation − Σ encaissements.
  function resteDuCredit(p){
    var c = creditDe(p);
    if(!c) return 0;
    return Math.max(0, Math.round(Number(c.prixTotal) - dejaRecuPrestation(p)));
  }
  function statutCredit(p){
    var c = creditDe(p);
    if(!c) return null;
    if(c.statut === "abandonne") return "abandonne";
    return resteDuCredit(p) <= 0 ? "solde" : "en_cours";
  }
  // Garde le statut enregistré en accord avec les montants (sauf abandon).
  function majStatutCredit(p){
    var c = creditDe(p);
    if(!c || c.statut === "abandonne") return;
    c.statut = resteDuCredit(p) <= 0 ? "solde" : "en_cours";
  }
  function creditsEnCours(){
    return state.prestationsCoiffure.filter(function(p){ return statutCredit(p) === "en_cours"; });
  }
  function totalAEncaisser(){ return sumBy(creditsEnCours(), resteDuCredit); }
  function nbClientesEnCours(){
    var vu = {};
    creditsEnCours().forEach(function(p){ vu[String(creditDe(p).clienteNom || "").trim().toLowerCase()] = 1; });
    return Object.keys(vu).length;
  }
  function aDejaUnCredit(){ return state.prestationsCoiffure.some(function(p){ return !!creditDe(p); }); }
  function libelleClientes(n){ return n + (n > 1 ? " clientes" : " cliente"); }
  // Mes habitudes (statistiques d'activité) : prix total d'une prestation à
  // crédit, sinon la Main d'œuvre — identique au 8B sans crédit.
  function montantActivitePrestation(p){
    var c = creditDe(p);
    return c ? Number(c.prixTotal) : p.mainOeuvre;
  }
  function encaissementsPeriode(range, act){
    return (state.encaissementsCredit || []).filter(function(e){
      if(!e || !inRange(e.date, range)) return false;
      if(!act) return true;
      return activiteDe(prestationParId(e.prestationId) || {}) === act;
    });
  }
  function transportPeriode(range){
    return sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.transport||0; });
  }
  function mechePeriode(range){
    return sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.coutMeches||0; });
  }
  function chargesCommunesTotal(range){
    return sumBy(filterRange(state.autresCharges, range), function(c){ return c.montant; });
  }
  // Sprint 7 (observations terrain, confirmé par Hamadou) : le Solde net de
  // « Mon état » (et de l'aperçu Télécharger, même notion) déduit désormais à
  // la fois l'Épargne et les Charges communes de la Main d'œuvre — et non plus
  // les seules Charges communes. Les Charges communes restent affichées telles
  // quelles dans la mini-rangée de stats sous ce solde, à titre d'information,
  // même si elles n'apparaissent plus isolément dans le calcul. Ce changement
  // ne touche pas « Disponible aujourd'hui » sur l'écran Aujourd'hui, qui reste
  // Main d'œuvre − Charges communes − Épargne (formule inchangée, déjà
  // équivalente arithmétiquement, mais gardée comme fonction séparée pour ne
  // jamais coupler par erreur les deux écrans si l'un venait à évoluer seul).
  function soldeNetPeriode(range){
    return recetteCoiffure(range) - epargnePeriode(range) - chargesCommunesTotal(range);
  }
  function soldeNetJour(dateStr){ return soldeNetPeriode({ start:dateStr, end:dateStr }); }

  function allActivityDates(){
    var set = {};
    state.prestationsCoiffure.forEach(function(p){ if(p.date) set[p.date] = 1; });
    state.autresCharges.forEach(function(c){
      if(c.date) set[c.date] = 1;
      // Sprint 8A : une charge saisie pour un mois antérieur (mois concerné)
      // rend ce mois consultable dans Mon état, même sans autre donnée.
      if(c.moisConcerne) set[c.moisConcerne + "-01"] = 1;
    });
    return Object.keys(set).sort();
  }

  // Observations terrain : ne jamais permettre de remonter, dans « Mon état »,
  // « Mes habitudes » ou « Télécharger », au-delà de la semaine ou du mois où
  // la toute première donnée (prestation ou charge) a été enregistrée — pour
  // éviter un défilement infini vers des périodes vides.
  function earliestActivityWeekStart(){
    var dates = allActivityDates();
    if(!dates.length) return getWeekRange(new Date()).start;
    return getWeekRange(dateFromStr(dates[0])).start;
  }
  function earliestActivityMonthStart(){
    var dates = allActivityDates();
    if(!dates.length) return getMonthRange(new Date()).start;
    return getMonthRange(dateFromStr(dates[0])).start;
  }

  // Cahier des charges Sprint 5A, section 5 : l'épargne est un pourcentage de
  // la Main d'œuvre (recette brute) — plus du solde net comme sur Trépor/Salon
  // F — donc simplement proportionnelle et additive sur une période, sans avoir
  // besoin de raisonner jour par jour.
  // Amendement (observations terrain) : le mode « Manuel » devient, comme sur
  // Trépor, un montant fixe visé chaque jour où au moins une prestation a été
  // enregistrée — jamais un pourcentage libre. Le mode « Auto » reste un
  // pourcentage de la Main d'œuvre, mais limité aux trois scénarios (10/20/30 %).
  function joursActifsDansPeriode(range){
    var set = {};
    state.prestationsCoiffure.forEach(function(p){
      if(inRange(p.date, range)) set[p.date] = 1;
    });
    return Object.keys(set).length;
  }
  function epargnePeriode(range){
    if(!state.objectifEpargne) return 0;
    var o = state.objectifEpargne;
    // Sprint 9B2 : objectif en Libre, ou qui a changé de façon (dates gardées).
    // Un objectif d'avant le 9B2 passe par le calcul ci-dessous, inchangé.
    if(o.type === "libre" || o.faconDepuis || Array.isArray(o.faconsPrecedentes)) return epargneParFacons(o, range);
    if(o.type === "manuel"){
      return joursActifsDansPeriode(range) * (o.montant || 0);
    }
    return recetteCoiffure(range) * (o.pourcentage || 0) / 100;
  }
  function epargneJour(dateStr){ return epargnePeriode({ start:dateStr, end:dateStr }); }
  /* ----- Sprint 9B2 : épargne libre (cahier v2.4 §5.16) ----- */
  // Mises de côté notées (« Mettre de côté ») : state.misesDeCote[] =
  // { id, date, montant, ts, modifieLe?, versionsPrecedentes? }, créé au
  // premier geste seulement. L'épargne Libre d'une période = la somme des
  // mises de côté datées dans cette période.
  function misesDeCote(){
    var l = state.misesDeCote;
    return Array.isArray(l) ? l.filter(function(m){ return m && m.date && Number(m.montant) > 0; }) : [];
  }
  function misesDeCotePeriode(range){
    return sumBy(misesDeCote().filter(function(m){ return inRange(m.date, range); }), function(m){ return m.montant; });
  }
  // Façons d'épargner d'un objectif (à domicile), de la plus ancienne à la
  // façon actuelle : chacune vaut de sa date de début (incluse) jusqu'au début
  // de la suivante (exclu). La première n'a pas de début (« depuis toujours »).
  function faconsObjectif(o){
    var l = Array.isArray(o.faconsPrecedentes) ? o.faconsPrecedentes.slice() : [];
    l.push({ type: o.type, pourcentage: o.pourcentage, montant: o.montant, depuis: o.faconDepuis || null });
    return l;
  }
  // Même calcul qu'avant pour une façon Pourcentage ou Montant fixe.
  function epargneFaconPeriode(f, range){
    if(f.type === "libre") return misesDeCotePeriode(range);
    if(f.type === "manuel") return joursActifsDansPeriode(range) * (f.montant || 0);
    return recetteCoiffure(range) * (f.pourcentage || 0) / 100;
  }
  function veilleDe(dateStr){ var d = dateFromStr(dateStr); d.setDate(d.getDate() - 1); return dateKey(d); }
  function epargneParFacons(o, range){
    var l = faconsObjectif(o), total = 0;
    for(var i = 0; i < l.length; i++){
      var debut = l[i].depuis, suivant = i + 1 < l.length ? l[i + 1].depuis : null;
      var fin = suivant ? veilleDe(suivant) : null;
      var s = { start: (debut && debut > range.start) ? debut : range.start, end: (fin && fin < range.end) ? fin : range.end };
      if(s.start <= s.end) total += epargneFaconPeriode(l[i], s);
    }
    return total;
  }
  // L'objectif actuel épargne-t-il en Libre ? (à domicile : sa façon ; en
  // salon : l'épargne du mois en cours)
  function epargneEnLibre(){
    if(!state.objectifEpargne) return false;
    if(estModeSalon()){
      var v = versionPourMois(state.config.epargneMensuelle, moisCourantCle());
      return !!(v && v.mode === "libre");
    }
    return state.objectifEpargne.type === "libre";
  }
  // Première date possible pour une mise de côté : le début de la façon Libre
  // en cours (à domicile), le 1er du mois où l'épargne du mois est passée en
  // Libre (en salon). Avant, l'épargne est calculée comme avant.
  function debutMiseDeCote(){
    if(!epargneEnLibre()) return null;
    if(estModeSalon()){
      var v = versionPourMois(state.config.epargneMensuelle, moisCourantCle());
      return v && v.depuis ? v.depuis + "-01" : null;
    }
    return state.objectifEpargne.faconDepuis || null;
  }
  // Début de la liste « Mis de côté » de l'objectif actuel.
  function debutListeMisesDeCote(){
    var o = state.objectifEpargne;
    if(!o) return null;
    var debuts = [];
    if(estModeSalon()){
      var p = state.config.epargneMensuelle;
      if(p){
        (p.historique || []).concat([{ depuis: p.depuis, mode: p.mode }]).forEach(function(v){ if(v.mode === "libre") debuts.push(v.depuis + "-01"); });
      }
    } else {
      faconsObjectif(o).forEach(function(f){ if(f.type === "libre") debuts.push(f.depuis || o.dateCreation || ""); });
    }
    debuts.sort();
    var d = debuts.length ? debuts[0] : (o.dateCreation || "");
    return d && o.dateCreation && d < o.dateCreation ? o.dateCreation : d;
  }
  function misesDeCoteListees(){
    var debut = debutListeMisesDeCote();
    return misesDeCote().filter(function(m){ return !debut || m.date >= debut; }).sort(function(a, b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts || 0) - (a.ts || 0);
    });
  }
  function dernierMontantMisDeCote(){
    var l = misesDeCote().slice().sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
    return l.length ? Math.round(Number(l[0].montant)) : 0;
  }
  function miseDeCoteParId(id){
    var l = Array.isArray(state.misesDeCote) ? state.misesDeCote : [];
    for(var i = 0; i < l.length; i++) if(l[i] && l[i].id === id) return l[i];
    return null;
  }

  // Sprint 7 (observations terrain) : 4 modèles d'objectif d'épargne, repris du
  // format de l'écran « Mon objectif » de Trépor mais adaptés au métier de la
  // coiffure — utilisés pour l'étape « Vous mettez de côté pour quoi ? » avant
  // le choix Auto/Manuel, et pour l'habillage (icônes fantômes) des 2
  // emplacements verrouillés.
  // Sprint 7 (retouches suite au test du Sprint 6) : les modèles Véhicule et
  // Filet de sécurité sont remplacés par deux modèles plus proches du métier
  // de la coiffure — Matériel de coiffure et Fauteuil & aménagement. Famille
  // et Épargne libre restent inchangés. Les objectifs déjà créés sous
  // l'ancien modèle gardent leur emoji/nom d'origine (déjà enregistrés en
  // state, non recalculés) : aucune migration nécessaire.
  var OBJECTIF_MODELES = [
    { id:"materiel", emoji:"🪮", nom:"Matériel de coiffure", desc:"Sèche-cheveux, kit d’installation, petit matériel" },
    { id:"fauteuil", emoji:"🪑", nom:"Fauteuil & aménagement", desc:"Fauteuil de coiffure, comptoir, aménagement du salon" },
    { id:"famille", emoji:"👨‍👩‍👧", nom:"Famille", desc:"Mariage, scolarité, santé" },
    { id:"libre", emoji:"💰", nom:"Épargne libre", desc:"Juste mettre de côté, sans montant précis" }
  ];
  function findObjectifModele(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++) if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    return null;
  }
  // Emoji affiché pour l'épargne (tuile Aujourd'hui, raccourci d'en-tête, carte
  // objectif active) : celui du modèle choisi à la création si disponible,
  // sinon 💰 par défaut (objectifs créés avant ce sprint, ou modèle non choisi).
  function epargneEmoji(){
    return (state.objectifEpargne && state.objectifEpargne.emoji) || "💰";
  }

  /* ================= Sprint 8A : calculs mensuels du mode Salon ================= */

  // Chaîne de calcul (amendement n°1, section 7, étapes 1 à 4) :
  //   Recettes du mois − Charges du mois − Fonds de renouvellement du mois
  //   = Résultat net du mois.
  // Les étapes 5 à 8 (rémunérations, épargne mensuelle, reste) arrivent au
  // Sprint 8B et partiront de ce même résultat net.
  // En mode À domicile, aucune de ces fonctions n'intervient : les calculs du
  // Sprint 7bis (par date) restent les seuls utilisés.

  function estModeSalon(){ return state.config.modeTravail === "salon"; }

  // Mois sous forme de clé "AAAA-MM" (même format que autresCharges[].moisConcerne).
  function moisCleDe(dateStr){ return String(dateStr||"").slice(0,7); }
  function moisCourantCle(){ return moisCleDe(todayStr()); }
  function decalerMoisCle(cle, delta){
    var y = parseInt(cle.slice(0,4),10), m = parseInt(cle.slice(5,7),10) - 1 + delta;
    var d = new Date(y, m, 1);
    return d.getFullYear() + "-" + pad2(d.getMonth()+1);
  }
  function rangeDuMoisCle(cle){
    return getMonthRange(new Date(parseInt(cle.slice(0,4),10), parseInt(cle.slice(5,7),10)-1, 1));
  }
  function libelleMoisCle(cle){
    return MOIS_NOMS[parseInt(cle.slice(5,7),10)-1] + " " + cle.slice(0,4);
  }
  function libelleMoisCleMaj(cle){ var s = libelleMoisCle(cle); return s.charAt(0).toUpperCase() + s.slice(1); }
  function nomMoisSeul(cle){ return MOIS_NOMS[parseInt(cle.slice(5,7),10)-1]; }
  // « d’octobre », « d’avril », « d’août » mais « de septembre ».
  function deMois(nom){ return /^[aeiouyàâäéèêëîïôöûüh]/i.test(nom) ? "d’" + nom : "de " + nom; }

  // Mois auquel une charge est rattachée : son mois concerné (charges saisies
  // en mode Salon) ou, à défaut, le mois de sa date de saisie (toutes les
  // charges antérieures au Sprint 8A) — calculé à la volée, jamais réécrit.
  function moisDeCharge(c){ return c.moisConcerne || moisCleDe(c.date); }
  // Type de la charge : celui mémorisé à la saisie (survit à la suppression
  // d'une rubrique), sinon celui de la rubrique, sinon « charge commune ».
  function typeDeCharge(c){
    if(c.rubriqueType) return c.rubriqueType;
    return typeDeRubrique(findRubriqueCharge(c.rubriqueId));
  }
  function chargesDuMois(cle){
    return state.autresCharges.filter(function(c){ return moisDeCharge(c) === cle; });
  }
  function recettesMois(cle){ return recetteCoiffure(rangeDuMoisCle(cle)); }

  // ----- Fonds de renouvellement des produits -----
  // Versionné par mois : modifier le fonds en octobre ne réécrit jamais la
  // prévision de septembre (le résultat net d'un mois terminé est définitif).
  function versionsFonds(){
    var f = state.config.fondsRenouvellement;
    if(!f) return [];
    var v = (f.historique || []).slice();
    v.push({ depuis: f.depuis, mode: f.mode, valeur: f.valeur });
    return v.sort(function(a,b){ return a.depuis < b.depuis ? -1 : (a.depuis > b.depuis ? 1 : 0); });
  }
  function versionFondsPourMois(cle){
    var res = null;
    versionsFonds().forEach(function(v){ if(v.depuis <= cle) res = v; });
    return res;
  }
  function fondsActifPourMois(cle){
    var v = versionFondsPourMois(cle);
    return !!(v && Number(v.valeur) > 0);
  }
  // Prévision du mois : montant fixe, ou pourcentage des recettes du mois
  // (arrondi au franc — FCFA sans décimale, et pour que Recettes − Charges −
  // Fonds affichés tombent toujours juste sur le résultat net affiché).
  function previsionFondsMois(cle){
    var v = versionFondsPourMois(cle);
    if(!v || !(Number(v.valeur) > 0)) return 0;
    if(v.mode === "pourcentage") return Math.round(recettesMois(cle) * Number(v.valeur) / 100);
    return Math.round(Number(v.valeur));
  }
  function achatsProduitsMois(cle, typeFiltre){
    return sumBy(chargesDuMois(cle).filter(function(c){
      var t = typeDeCharge(c);
      return typeFiltre ? t === typeFiltre : estTypeProduits(t);
    }), function(c){ return c.montant; });
  }
  // Solde du fonds = prévisions cumulées (du premier mois du fonds jusqu'au
  // mois en cours) − achats de produits payés par le fonds.
  function soldeFonds(){
    var v = versionsFonds();
    if(!v.length) return { configure:false, actif:false, previsions:0, achats:0, solde:0 };
    var debut = v[0].depuis, fin = moisCourantCle();
    var previsions = 0;
    for(var m = debut, garde = 0; m <= fin && garde < 600; m = decalerMoisCle(m, 1), garde++){
      previsions += previsionFondsMois(m);
    }
    var achats = sumBy(state.autresCharges.filter(function(c){
      var mc = moisDeCharge(c);
      return mc >= debut && estTypeProduits(typeDeCharge(c)) && fondsActifPourMois(mc);
    }), function(c){ return c.montant; });
    return { configure:true, actif: fondsActifPourMois(fin), previsions: previsions, achats: achats, solde: previsions - achats };
  }

  // ----- Charges du mois -----
  // Pèsent sur le résultat net : toutes les charges du mois (loyer, CIE,
  // SODECI, Mairie, BURIDA, remboursements de crédit, autres), sauf les
  // achats de produits quand un fonds est actif ce mois-là — ils sont alors
  // payés par le fonds, jamais comptés une seconde fois. Sans fonds actif, un
  // achat de produits reste une charge ordinaire : une dépense réelle ne
  // disparaît jamais du résultat.
  function chargesComptees(cle){
    var actif = fondsActifPourMois(cle);
    return chargesDuMois(cle).filter(function(c){ return !(actif && estTypeProduits(typeDeCharge(c))); });
  }
  function chargesMoisTotal(cle){ return sumBy(chargesComptees(cle), function(c){ return c.montant; }); }

  // Résultat net du mois — provisoire pendant le mois, définitif ensuite.
  function resultatNetMois(cle){
    var recettes = recettesMois(cle);
    var charges = chargesMoisTotal(cle);
    var fonds = previsionFondsMois(cle);
    return {
      mois: cle, recettes: recettes, charges: charges, fonds: fonds,
      resultatNet: recettes - charges - fonds,
      provisoire: cle >= moisCourantCle()
    };
  }

  // Jauge « Charges du mois à couvrir » (fonds produits compris) : simple repère, rien n'est
  // déduit. Pourcentage arrondi à l'inférieur pour ne jamais afficher 100 %
  // tant que les recettes ne couvrent pas réellement tout.
  function jaugeMois(cle){
    var r = resultatNetMois(cle);
    var aCouvrir = r.charges + r.fonds;
    var pct = aCouvrir > 0 ? Math.min(100, Math.floor(r.recettes / aCouvrir * 100)) : 0;
    return { aCouvrir: aCouvrir, recettes: r.recettes, pct: pct, couvert: aCouvrir > 0 && r.recettes >= aCouvrir, reste: Math.max(0, aCouvrir - r.recettes) };
  }

  // ----- Remboursement de crédit -----
  function findCredit(rubriqueId){
    var list = state.config.credits || [];
    for(var i=0;i<list.length;i++) if(list[i].rubriqueId === rubriqueId) return list[i];
    return null;
  }
  // Remboursé = remboursements saisis depuis la première saisie (point de
  // départ du crédit) ; Reste dû = montant total − remboursé, si un montant
  // total a été indiqué.
  function bilanCredit(credit){
    var rembourse = sumBy(state.autresCharges.filter(function(c){
      if(c.rubriqueId !== credit.rubriqueId) return false;
      if(c.ts && credit.tsDebut) return c.ts >= credit.tsDebut;
      return (c.date || "") >= (credit.dateDebut || "");
    }), function(c){ return c.montant; });
    var total = Number(credit.montantTotal) > 0 ? Number(credit.montantTotal) : null;
    return {
      rembourse: rembourse,
      total: total,
      resteDu: total !== null ? Math.max(0, total - rembourse) : null,
      pct: total !== null ? Math.min(100, Math.floor(rembourse / total * 100)) : null,
      solde: total !== null && rembourse >= total
    };
  }
  // Sprint 9B2 (D29) : un crédit « terminé » (config.credits[].termineLe) sort
  // des listes, de la saisie et de la reprise ; ses remboursements restent.
  function creditTermine(rubriqueId){
    var c = findCredit(rubriqueId);
    return !!(c && c.termineLe);
  }
  function aDesRemboursements(rubriqueId){
    return state.autresCharges.some(function(c){ return c && c.rubriqueId === rubriqueId; });
  }

  // ----- Rubriques selon le mode -----
  function rubriquesPourMode(seulementActives){
    var salon = estModeSalon();
    var source = state.config.rubriquesCharges;
    var list = source.filter(function(r){
      var p = porteeRubrique(r);
      if(salon ? p === "domicile" : p === "salon") return false;
      return seulementActives ? !!r.actif : true;
    });
    if(!salon) return list;
    var pos = {};
    source.forEach(function(r, i){ pos[r.id] = i; });
    var rangCredit = ORDRE_RUBRIQUES_SALON.indexOf("credit");
    function rang(r){
      var i = ORDRE_RUBRIQUES_SALON.indexOf(r.id);
      if(i !== -1) return i;
      if(typeDeRubrique(r) === "credit") return rangCredit + 0.001 * (pos[r.id] + 1);
      return 100 + pos[r.id];
    }
    return list.slice().sort(function(a,b){ return rang(a) - rang(b); });
  }

  // ----- Reprise des charges du mois précédent -----
  // À l'ouverture d'un nouveau mois (mode Salon), chaque rubrique payée le
  // mois précédent est proposée avec le même montant, à confirmer ou
  // modifier (la CIE et la SODECI varient) — jamais créée automatiquement.
  // Exclus : achats de produits (ponctuels, payés par le fonds), rubriques
  // supprimées, désactivées ou propres au mode À domicile, rubriques déjà
  // saisies ce mois-ci, propositions déjà confirmées ou ignorées.
  function reprisesEnAttente(cle){
    cle = cle || moisCourantCle();
    var prec = decalerMoisCle(cle, -1);
    var traitees = (state.reprisesCharges && state.reprisesCharges[cle]) || {};
    var dejaSaisies = {};
    chargesDuMois(cle).forEach(function(c){ dejaSaisies[c.rubriqueId] = 1; });
    var parRub = {}, ids = [];
    chargesDuMois(prec).forEach(function(c){
      if(c.rubriqueSupprimee) return;
      var r = findRubriqueCharge(c.rubriqueId);
      if(!r || !r.actif || porteeRubrique(r) === "domicile") return;
      if(typeDeRubrique(r) === "credit" && creditTermine(r.id)) return;   // Sprint 9B2
      if(estTypeProduits(typeDeCharge(c))) return;
      if(dejaSaisies[c.rubriqueId] || traitees[c.rubriqueId]) return;
      if(!(c.rubriqueId in parRub)){ parRub[c.rubriqueId] = 0; ids.push(c.rubriqueId); }
      parRub[c.rubriqueId] += Number(c.montant) || 0;
    });
    var ordre = rubriquesPourMode(false).map(function(r){ return r.id; });
    ids.sort(function(a,b){ return ordre.indexOf(a) - ordre.indexOf(b); });
    return ids.map(function(id){
      return { rubrique: findRubriqueCharge(id), montant: parRub[id], moisPrecedent: prec, mois: cle };
    });
  }

  /* ================= Sprint 8B : activité, rémunérations, épargne mensuelle ================= */

  // Activité d'une prestation : toute prestation sans champ `activite`
  // (antérieure au Sprint 8B, ou saisie en mode À domicile) est « coiffure ».
  function activiteDe(p){ return p.activite === "onglerie" ? "onglerie" : "coiffure"; }
  // Sprint 8C : passe par la fonction unique de recettes (encaissements de
  // crédits rattachés à l'activité de leur prestation).
  function recettesActivite(range, act){
    return recettesPeriode(range, act);
  }

  // ----- Paramètres versionnés par mois (rémunérations, épargne mensuelle) -----
  // Même principe que le fonds de renouvellement : { mode, valeur, depuis,
  // historique[] }. Une modification s'applique au mois en cours ; les mois
  // terminés gardent la clause qui était la leur.
  function versionPourMois(param, cle){
    if(!param || !param.depuis) return null;
    var v = (param.historique || []).slice();
    v.push({ depuis: param.depuis, mode: param.mode, valeur: param.valeur });
    v.sort(function(a,b){ return a.depuis < b.depuis ? -1 : (a.depuis > b.depuis ? 1 : 0); });
    var res = null;
    v.forEach(function(x){ if(x.depuis <= cle) res = x; });
    return res;
  }
  function majParamVersionne(param, mode, valeur, cle){
    if(!param) return { mode: mode, valeur: valeur, depuis: cle, historique: [] };
    if(param.depuis === cle){ param.mode = mode; param.valeur = valeur; return param; }
    if(param.depuis < cle){
      param.historique = (param.historique || []).concat([{ depuis: param.depuis, mode: param.mode, valeur: param.valeur }]);
    } else {
      // Horloge du téléphone revenue en arrière : on remplace simplement.
      param.historique = (param.historique || []).filter(function(h){ return h.depuis < cle; });
    }
    param.depuis = cle; param.mode = mode; param.valeur = valeur;
    return param;
  }
  function versionActive(v){ return !!(v && Number(v.valeur) > 0); }

  // Salariés présents un mois donné : depuis leur mois d'arrivée (`debut`),
  // jusqu'à leur dernier mois (`fin`) s'ils ont été retirés.
  function salariesActifs(cle){
    return (state.config.salaries || []).filter(function(s){
      return s.debut <= cle && (!s.fin || cle <= s.fin);
    });
  }

  // Garde-fou (amendement, section 7 — point 2 validé) : tous les
  // pourcentages portent sur le même résultat net ; leur total ne doit pas
  // dépasser 100 %. `remplace` permet de tester une valeur avant de
  // l'enregistrer : { cible:'proprio'|'epargne'|'salarie', id, nouveau, mode, valeur }.
  function pctDe(v){ return (v && v.mode === "pourcentage") ? (Number(v.valeur) || 0) : 0; }
  function totalPourcentages(cle, remplace){
    var r = remplace || {};
    var cfg = state.config;
    var det = { proprio: 0, salaries: 0, epargne: 0 };
    det.proprio = pctDe(r.cible === "proprio" ? r : versionPourMois(cfg.remunerationProprio, cle));
    salariesActifs(cle).forEach(function(s){
      det.salaries += pctDe((r.cible === "salarie" && r.id === s.id) ? r : versionPourMois(s, cle));
    });
    if(r.cible === "salarie" && r.nouveau) det.salaries += pctDe(r);
    det.epargne = pctDe(r.cible === "epargne" ? r : versionPourMois(cfg.epargneMensuelle, cle));
    det.total = Math.round((det.proprio + det.salaries + det.epargne) * 100) / 100;
    return det;
  }
  function formatPct(v){
    var n = Math.round((Number(v) || 0) * 10) / 10;
    return String(n).replace(".", ",") + " %";
  }
  function libelleClause(v){
    if(!versionActive(v)) return "Non réglée";
    return v.mode === "pourcentage" ? (formatPct(v.valeur) + " du résultat net") : (formatFCFA(v.valeur) + " par mois");
  }
  // Message du garde-fou si la valeur testée ferait dépasser 100 %.
  function erreurGardeFou(cle, remplace){
    if(remplace.mode !== "pourcentage") return "";
    var det = totalPourcentages(cle, remplace);
    if(det.total <= 100) return "";
    var sansCible = det.total - pctDe(remplace);
    return "Le total des pourcentages passerait à " + formatPct(det.total) + " du résultat net (100 % au maximum). Il reste " + formatPct(Math.max(0, 100 - sansCible)) + " disponibles.";
  }

  // Répartition du résultat net du mois (amendement, section 7, étapes 4 à 8) :
  // Résultat net → propriétaire → chaque salarié → épargne = Reste.
  // Résultat net négatif : parts en pourcentage à zéro ; montants fixes
  // maintenus, avec une alerte douce (jamais bloquante).
  function repartitionMois(cle){
    var r = resultatNetMois(cle);
    var rn = r.resultatNet;
    var base = Math.max(0, rn);
    function part(v){
      if(!versionActive(v)) return 0;
      return v.mode === "pourcentage" ? Math.round(base * Number(v.valeur) / 100) : Math.round(Number(v.valeur));
    }
    function ligne(v){ return versionActive(v) ? { mode: v.mode, valeur: Number(v.valeur), montant: part(v) } : null; }
    var proprio = ligne(versionPourMois(state.config.remunerationProprio, cle));
    var salaries = salariesActifs(cle).map(function(s){
      var l = ligne(versionPourMois(s, cle)) || { mode: null, valeur: 0, montant: 0 };
      l.id = s.id; l.nom = s.nom;
      return l;
    });
    var vEpargne = versionPourMois(state.config.epargneMensuelle, cle);
    // Sprint 9B2 : épargne Libre = ce qui a été mis de côté ce mois-ci.
    var epargne = (vEpargne && vEpargne.mode === "libre") ? { mode: "libre", valeur: 0, montant: misesDeCotePeriode(rangeDuMoisCle(cle)) } : ligne(vEpargne);
    var totalRemunerations = (proprio ? proprio.montant : 0) + sumBy(salaries, function(s){ return s.montant; });
    var montantEpargne = epargne ? epargne.montant : 0;
    var reste = rn - totalRemunerations - montantEpargne;
    var lignes = [proprio, epargne].concat(salaries).filter(Boolean);
    var fixes = sumBy(lignes.filter(function(l){ return l.mode === "fixe"; }), function(l){ return l.montant; });
    var aDesPct = lignes.some(function(l){ return l.mode === "pourcentage" && l.valeur > 0; });
    var pct = totalPourcentages(cle);
    var alertes = [];
    if(rn < 0 && aDesPct) alertes.push("Résultat net négatif : les parts en pourcentage valent zéro ce mois-ci.");
    if(rn < 0 && fixes > 0) alertes.push("Les montants fixes (" + formatFCFA(fixes) + ") restent dus : le reste après rémunérations et épargne est négatif.");
    else if(rn >= 0 && fixes > 0 && reste < 0) alertes.push("Les montants fixes dépassent le résultat net : le reste après rémunérations et épargne est négatif de " + formatFCFA(Math.abs(reste)) + ".");
    if(pct.total > 100) alertes.push("Le total des pourcentages dépasse 100 % (" + formatPct(pct.total) + ").");
    return {
      mois: cle, resultat: r, resultatNet: rn,
      proprio: proprio, salaries: salaries, epargne: epargne,
      totalRemunerations: totalRemunerations, montantEpargne: montantEpargne,
      reste: reste, totalPct: pct.total, alertes: alertes
    };
  }

  // Épargne mensuelle (mode Salon) : réglée ou non pour le mois en cours,
  // montant du mois, cumul depuis la première version.
  function epargneSalonReglee(){
    var v = versionPourMois(state.config.epargneMensuelle, moisCourantCle());
    return versionActive(v) || !!(v && v.mode === "libre");   // Sprint 9B2 : Libre
  }
  function epargneMoisSalon(cle){ return repartitionMois(cle || moisCourantCle()).montantEpargne; }
  function cumulEpargneSalon(){
    var p = state.config.epargneMensuelle;
    if(!p) return 0;
    var v = (p.historique || []).map(function(h){ return h.depuis; }).concat([p.depuis]).sort();
    var total = 0, fin = moisCourantCle();
    for(var m = v[0], garde = 0; m <= fin && garde < 600; m = decalerMoisCle(m, 1), garde++) total += epargneMoisSalon(m);
    return total;
  }

  function emptyState(emoji, titre, desc){
    return '<div class="empty-state"><div class="es-emoji">' + emoji + '</div>' +
      '<div class="es-title">' + esc(titre) + '</div>' +

  /* ================= Sprint 8A : écran « Aujourd’hui » en mode Salon ================= */

  // Amendement n°1, section 9 (point 1 validé par le prompt du Sprint 8A) :
  // en mode Salon, « Disponible aujourd’hui » n’est plus calculé — les
  // charges se règlent au mois. À la place : Recette du jour (total salon),

  // Sprint 8D (observations d'Hamadou) : tuiles [Main d'œuvre][Crédit
  // clientes] / [Épargne du mois][Mèche] ; la tuile Fonds produits quitte
  // l'écran (son alerte courte reste sous la jauge).
  function renderAujourdhuiSalon(){

    // Sprint 8D : la coiffure a sa tuile (Main d'œuvre) ; la carte ne dit
    // plus que la part de l'onglerie, pour ne pas répéter la tuile.
    var mainOeuvreCoiffure = recettesActivite(range, "coiffure");
    var recetteOnglerie = recettesActivite(range, "onglerie");
    var detailActivites = recetteOnglerie > 0 ? " · dont onglerie " + formatFCFA(recetteOnglerie) : "";
    var compte = [];

    if(nbEnc) compte.push(nbEnc + (nbEnc > 1 ? " encaissements" : " encaissement"));

    var recetteCard =

        '<div class="ds-sub">' + (compte.length ? (compte.join(" · ") + detailActivites) : "Aucune prestation enregistrée aujourd’hui") + '</div>' +

        '<span class="rb-emoji">🔁</span>' +
        '<span class="rb-text">' + reprises.length + (reprises.length > 1 ? " charges" : " charge") + ' ' + esc(deMois(nomMoisSeul(reprises[0].moisPrecedent))) + ' à reprendre</span>' +
        '<span class="rb-chev">›</span>' +
      '</button>'
    ) : '';

    // Sprint 8D : tuile « Main d'œuvre » (comme en mode À domicile) = argent

    var mainOeuvreTile =

        '<div class="db-label">Crédit clientes</div>' +

    );

  // Fenêtre « Fonds produits » (alerte courte d'Aujourd'hui, ligne du fonds
  // dans la feuille Charges du mois). Sprint 8D : un seul nom, « Fonds
  // produits » (coiffure et onglerie), à la place de « Fonds de renouvellement ».
  function renderFondsDetailModal(){
    var cle = moisCourantCle();
    var sf = soldeFonds();
    if(!sf.configure){
      return (
        '<div class="hint" style="margin-bottom:14px;">Aucun fonds produits réglé. Prévoyez chaque mois un montant fixe ou un pourcentage des recettes : cette prévision fait partie des charges du mois, et vos achats de produits coiffure et onglerie sont payés par ce fonds au lieu d’être comptés deux fois.</div>' +
        '<button type="button" class="btn btn-primary" data-action="ouvrir-reglages-fonds">Régler le fonds</button>'
      );
    }
    var v = versionFondsPourMois(cle);
    var actif = fondsActifPourMois(cle);
    var modeTxt = !actif ? "fonds arrêté" : (v.mode === "pourcentage" ? (v.valeur + " % des recettes") : "montant fixe");
    var rows =
      drow("Prévision " + deMois(nomMoisSeul(cle)), formatFCFA(previsionFondsMois(cle)) + ' <span style="color:var(--text-dim); font-weight:600;">(' + esc(modeTxt) + ')</span>') +
      drow("Achats produits coiffure ce mois", formatFCFA(achatsProduitsMois(cle, "produits_coiffure"))) +
      drow("Achats produits onglerie ce mois", formatFCFA(achatsProduitsMois(cle, "produits_onglerie"))) +
      drow("Prévisions cumulées", formatFCFA(sf.previsions)) +
      drow("Achats payés par le fonds", formatFCFA(sf.achats)) +
      drow("Solde du fonds", '<span style="color:' + (sf.solde < 0 ? "var(--red)" : "var(--green)") + ';">' + formatFCFA(sf.solde) + '</span>');
    return (
      '<div>' + rows + '</div>' +
      (!actif ? '<div class="alerte-douce">Fonds produits arrêté : ce mois-ci, les achats de produits comptent comme des charges du mois.</div>' : '') +
      (sf.solde < 0 ? renderAlerteFonds(sf) : '') +
      '<div class="btn-row">' +
        '<button type="button" class="btn btn-secondary" data-action="ouvrir-reglages-fonds">Régler le fonds</button>' +
        '<button type="button" class="btn btn-primary" data-action="add-achat-produits">+ Achat de produits</button>' +
      '</div>'
    );
  }

  // Fenêtre « Charges du mois » (mode Salon) : reprise du mois précédent,
  // jauge, charges saisies pour le mois en cours, ajout.
  function renderChargesMoisModal(){
    var cle = moisCourantCle();
    var reprises = reprisesEnAttente(cle);
    var html = "";
    if(reprises.length){
      var prec = reprises[0].moisPrecedent;
      html +=
        '<div class="reglages-section" style="margin-bottom:16px;">' +
          '<div class="rs-title">À reprendre ' + esc(deMois(nomMoisSeul(prec))) + '</div>' +
          '<div class="hint tight" style="margin-bottom:10px;">Même montant que le mois dernier : confirmez, modifiez (CIE et SODECI varient) ou ignorez.</div>' +
          reprises.map(function(p){
            var id = p.rubrique.id;
            var val = (ui.repriseDraft[id] !== undefined) ? ui.repriseDraft[id] : String(p.montant);
            return (
              '<div class="reprise-row">' +
                '<div class="rr-head"><span>' + esc(p.rubrique.emoji || "📝") + '</span><span class="rr-nom">' + esc(p.rubrique.nom) + '</span>' +
                  '<span class="rr-prev">' + esc(nomMoisSeul(prec)) + ' : ' + formatFCFA(p.montant) + '</span></div>' +
                '<div class="rr-actions">' +
                  '<input type="number" inputmode="numeric" min="0" step="1" class="input" id="f-reprise-' + esc(id) + '" value="' + esc(val) + '" data-action-change="capture-reprise" data-id="' + esc(id) + '" aria-label="Montant pour ' + esc(nomMoisSeul(cle)) + '">' +
                  '<button type="button" class="btn btn-primary" data-action="reprise-confirmer" data-id="' + esc(id) + '">Confirmer</button>' +
                  '<button type="button" class="btn btn-secondary" data-action="reprise-ignorer" data-id="' + esc(id) + '">Ignorer</button>' +
                '</div>' +
                fieldErr("reprise-" + id) +
              '</div>'
            );
          }).join("") +
          (reprises.length > 1 ? '<button type="button" class="btn btn-secondary" data-action="reprise-tout-confirmer">✓ Tout confirmer</button>' : '') +
        '</div>';
    }
    html += renderJaugeCard(cle, false);

    // Sprint 8D : deux listes. « Charges d'octobre » = la prévision du fonds
    // produits en tête, puis les charges comptées : elle tombe juste sur le
    // total de la jauge. « Achats de produits payés par le fonds » : déjà
    // couverts par la prévision, listés à part, jamais ajoutés une seconde fois.
    var nomM = nomMoisSeul(cle);
    var actifFonds = fondsActifPourMois(cle);
    var sf = soldeFonds();
    var prevision = previsionFondsMois(cle);
    var vFonds = versionFondsPourMois(cle);
    var parDate = function(a,b){ return (b.ts||0) - (a.ts||0); };
    var comptees = chargesComptees(cle).slice().sort(parDate);
    var achatsFonds = actifFonds
      ? chargesDuMois(cle).filter(function(c){ return estTypeProduits(typeDeCharge(c)); }).sort(parDate)
      : [];
    function carteCharge(c, neutre){
      var sub = "Saisie le " + formatDateFr(c.date) + (c.note ? " · " + c.note : "");
      return (
        '<button type="button" class="entry-card" style="width:100%; margin-bottom:8px;" data-action="voir-charge-mois" data-id="' + esc(c.id) + '" data-test="' + (neutre ? "achat-fonds" : "charge-comptee") + '">' +
          '<div class="entry-ico">' + esc(c.rubriqueEmoji || "📝") + '</div>' +
          '<div class="entry-main"><div class="entry-title">' + esc(c.rubriqueNom) + '</div>' +
            '<div class="entry-sub">' + esc(sub) + '</div></div>' +
          '<div class="entry-amount' + (neutre ? " neutre" : "") + '">' + formatFCFA(c.montant) + '</div>' +
        '</button>'
      );
    }
    var ligneFonds;
    if(actifFonds){
      // Réglée dans Réglages, non modifiable ici : au toucher, la fenêtre du
      // fonds produits (solde, achats, « Régler le fonds »).
      ligneFonds =
        '<button type="button" class="entry-card" style="width:100%; margin-bottom:8px;" data-action="voir-fonds" data-test="ligne-prevision-fonds">' +
          '<div class="entry-ico ico-turq">🧴</div>' +
          '<div class="entry-main"><div class="entry-title et-wrap">Fonds produits — prévision ' + esc(deMois(nomM)) + '</div>' +
            '<div class="entry-sub">' + (vFonds && vFonds.mode === "pourcentage" ? esc(formatPct(vFonds.valeur)) + " des recettes · réglée dans Réglages" : "Réglée dans Réglages") + '</div></div>' +
          '<div class="entry-amount">' + formatFCFA(prevision) + '</div>' +
        '</button>';
    } else {
      ligneFonds =
        '<button type="button" class="charges-row charges-row-vide" style="margin-bottom:8px;" data-action="voir-fonds" data-test="ligne-prevision-fonds">' +
          '<span class="cr-emoji t-turq">🧴</span><span class="cr-label">Fonds produits · ' + (sf.configure ? "arrêté ce mois" : "non réglé") + '</span><span class="cr-chev" aria-hidden="true">›</span>' +
        '</button>';
    }
    var totalCharges = prevision + chargesMoisTotal(cle);
    html += '<div class="reglages-section" data-test="liste-charges-mois"><div class="rs-title">Charges ' + esc(deMois(nomM)) + '</div>' +
      ligneFonds +
      comptees.map(function(c){ return carteCharge(c, false); }).join("") +
      (comptees.length || actifFonds
        ? '<div class="total-liste" data-test="total-charges-mois"><span>Total des charges ' + esc(deMois(nomM)) + '</span><b>' + formatFCFA(totalCharges) + '</b></div>'
        : '<div class="hint tight">Aucune charge saisie pour ' + esc(nomM) + ' pour l’instant.</div>') +
      '<button type="button" class="btn btn-secondary" style="margin-top:10px;" data-action="add-autre-charge">+ Ajouter une charge</button>' +
    '</div>';
    if(achatsFonds.length){
      html += '<div class="reglages-section" data-test="liste-achats-fonds"><div class="rs-title">Achats de produits payés par le fonds</div>' +
        '<div class="hint tight" style="margin:-2px 0 10px;">Déjà couverts par la prévision du fonds produits : ils ne s’ajoutent pas aux charges.</div>' +
        achatsFonds.map(function(c){ return carteCharge(c, true); }).join("") +
      '</div>';
    }
    html += '<div class="hint" style="margin-top:-8px;" data-test="aide-charges-mois">' + (actifFonds
      ? "Les charges sont déduites du résultat net du mois, jamais au jour le jour. Les achats de produits sont payés par le fonds produits."
      : "Les charges sont déduites du résultat net du mois, jamais au jour le jour. Sans fonds produits ce mois-ci, les achats de produits comptent comme des charges du mois.") + '</div>';
    return html;
  }

  /* ================= Formulaire F5 : Prestations coiffure ================= */

  function optionsFor(name, selectedId){
    var list = findList(name);
    var opts = list.map(function(it){
      return '<option value="' + it.id + '"' + (it.id===selectedId?" selected":"") + '>' + esc(it.nom) + '</option>';
    }).join("");
    opts += '<option value="__new__"' + (selectedId==="__new__"?" selected":"") + '>+ Autre…</option>';
    return opts;
  }
  function fieldErr(key){
    return ui.errors[key] ? '<div class="field-error">' + esc(ui.errors[key]) + '</div>' : "";
  }
  function captureDraft(fieldIds){
    fieldIds.forEach(function(id){
      var el = byId(id);
      if(el) ui.draft[id] = el.value;
    });
  }

  function renderChampLieu(lieu){
    return (
      '<div class="field"><div class="label">Lieu de la prestation <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (lieu==="domicile"?" active":"") + '" data-action="set-lieu-coiffure" data-val="domicile">🏠 À domicile</button>' +
          '<button type="button" class="radio-opt' + (lieu==="salon"?" active":"") + '" data-action="set-lieu-coiffure" data-val="salon">💈 En salon</button>' +
        '</div>' +
      '</div>'
    );
  }

  // Sprint 8B (amendement, section 8) : en mode Salon, menu « Activité »
  // en tête du formulaire. Onglerie = activité, montant et date, rien d'autre.
  // Sprint 8C : le même formulaire sert à la saisie et à la modification ;
  // en modification, l'activité de l'enregistrement corrigé fait foi.
  function estModifPrestation(){ return !!ui.modal && ui.modal.type === "edit-coiffure"; }
  function prestationEnCorrection(){ return estModifPrestation() ? prestationParId(ui.modal.id) : null; }
  function activiteBrouillon(){
    if(estModifPrestation()) return ui.draft["f-activite"] === "onglerie" ? "onglerie" : "coiffure";
    return (estModeSalon() && ui.draft["f-activite"] === "onglerie") ? "onglerie" : "coiffure";
  }
  function renderChampActivite(act){
    return (
      '<div class="field"><div class="label">Activité <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (act==="coiffure"?" active":"") + '" data-action="set-activite" data-val="coiffure">💇 Coiffure</button>' +
          '<button type="button" class="radio-opt' + (act==="onglerie"?" active":"") + '" data-action="set-activite" data-val="onglerie">💅 Onglerie</button>' +
        '</div>' +
      '</div>'
    );
  }

  // ----- Sprint 8C : « Payé : En entier / À crédit » -----
  function paiementBrouillon(){ return ui.draft["f-paiement"] === "credit" ? "credit" : "entier"; }
  function renderChampPaiement(){
    var pay = paiementBrouillon();
    var p = prestationEnCorrection();
    // Une prestation qui a déjà des encaissements reste à crédit (sinon ces
    // sommes seraient comptées deux fois).
    var verrou = !!(p && creditDe(p) && encaissementsDe(p.id).length);
    return (
      '<div class="field"><div class="label">Payé <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (pay==="entier"?" active":"") + '" data-action="set-paiement" data-val="entier" data-test="paye-entier"' + (verrou ? " disabled" : "") + '>💵 En entier</button>' +
          '<button type="button" class="radio-opt opt-credit' + (pay==="credit"?" active":"") + '" data-action="set-paiement" data-val="credit" data-test="paye-credit">🤝 À crédit</button>' +
        '</div>' +
        (verrou ? '<div class="field-note">Cette prestation a déjà des encaissements : elle reste à crédit.</div>' : '') +
      '</div>'
    );
  }
  // « Déjà payé aujourd'hui » — ou « le JJ/MM » si la prestation est datée
  // d'un autre jour (c'est ce jour-là que ce montant compte).
  function libelleDejaPaye(){
    var d = ui.draft["f-date"] || todayStr();
    return d === todayStr() ? "Déjà payé aujourd’hui (FCFA)" : "Déjà payé le " + formatDateFr(d).slice(0, 5) + " (FCFA)";
  }
  function majLibelleDejaPaye(){
    var el = byId("lbl-deja-paye");
    if(el) el.textContent = libelleDejaPaye();
  }
  function renderChampsCredit(){
    var d = ui.draft;
    var p = prestationEnCorrection();
    var enc = p ? totalEncaissementsDe(p.id) : 0;
    return (
      '<div class="bloc-credit">' +
        '<div class="field"><div class="label">Nom de la cliente <span class="req">*</span></div>' +
          '<input type="text" class="input" id="f-clienteNom" autocomplete="off" placeholder="Ex. Aïcha" value="' + esc(d["f-clienteNom"]||"") + '" data-action-change="capture-coiffure">' +
          fieldErr("clienteNom") +
        '</div>' +
        '<div class="field"><div class="label">Prix de la prestation (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-prixCredit" value="' + esc(d["f-prixCredit"]||"") + '" data-action-change="capture-coiffure">' +
          fieldErr("prixCredit") +
        '</div>' +
        '<div class="field"><div class="label"><span id="lbl-deja-paye">' + esc(libelleDejaPaye()) + '</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-dejaPaye" placeholder="0" value="' + esc(d["f-dejaPaye"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">' + (enc > 0 ? "Encaissements déjà reçus après la prestation : " + esc(montantInsecable(enc)) + ". " : "") +
            "Seul l’argent reçu compte dans vos recettes ; le reste dû est suivi dans « Crédit clientes »." + '</div>' +
          fieldErr("dejaPaye") +
        '</div>' +
      '</div>'
    );
  }
  function boutonEnregistrerPrestation(){
    return estModifPrestation()
      ? '<button type="button" class="btn btn-primary" data-action="enregistrer-modif-coiffure">Enregistrer les modifications</button>'
      : '<button type="button" class="btn btn-primary" data-action="enregistrer-coiffure">Enregistrer</button>';
  }

  function renderFormOnglerie(){
    var d = ui.draft;
    var credit = paiementBrouillon() === "credit";
    return (
      '<div>' +
        (estModeSalon() ? renderChampActivite("onglerie") : '') +
        renderChampPaiement() +
        (credit ? renderChampsCredit() :
          '<div class="field"><div class="label">Montant (FCFA) <span class="req">*</span></div>' +
            '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-montantOnglerie" value="' + esc(d["f-montantOnglerie"]||"") + '" data-action-change="capture-coiffure">' +
            fieldErr("montantOnglerie") +
          '</div>') +
        '<div class="field"><div class="label">Date <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-coiffure">' +
          fieldErr("date") +
        '</div>' +
        (estModifPrestation() ? renderNoteMoisPasse() : '') +
        boutonEnregistrerPrestation() +
      '</div>'
    );
  }

  function renderFormCoiffure(){
    if(activiteBrouillon() === "onglerie") return renderFormOnglerie();
    var d = ui.draft;
    var clienteSel = d["f-clienteSel"] || "";
    var quartierSel = d["f-quartierSel"] || "";
    var typesSel = d.typesCoiffureSel || [];
    var showNouveauType = !!d.showNouveauTypeCoiffure;
    var credit = paiementBrouillon() === "credit";
    // Sprint 8A : en mode Salon, la prestation est par défaut « En salon » ;
    // « À domicile » reste possible (quartier, transport — amendement,
    // section 2). En mode À domicile, défaut inchangé.
    var lieu = d["f-lieu"] || lieuParDefaut();
    var chips = state.config.typesCoiffure.map(function(t){
      var active = typesSel.indexOf(t.id) !== -1;
      return '<button type="button" class="chip' + (active?" active":"") + '" data-action="toggle-coiffure-type" data-id="' + t.id + '">' + esc(t.nom) + '</button>';
    }).join("");
    chips += '<button type="button" class="chip dashed" data-action="toggle-nouveau-type-coiffure">+ Personnalisé</button>';

    return (
      '<div>' +
        (estModeSalon() ? renderChampActivite("coiffure") : '') +
        '<div class="field"><div class="label">Date de la prestation <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-coiffure">' +
          fieldErr("date") +
        '</div>' +
        '<div class="field"><div class="label">Type de cliente <span class="req">*</span></div>' +
          '<select class="select" id="f-clienteSel" data-action-change="cliente-change">' + optionsFor("typesCliente", clienteSel) + '</select>' +
          (clienteSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-clienteNouveauNom" placeholder="Nouveau type de cliente" value="' + esc(d["f-clienteNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("cliente") +
        '</div>' +
        renderChampLieu(lieu) +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Quartier <span class="req">*</span></div>' +
          '<select class="select" id="f-quartierSel" data-action-change="quartier-change">' + optionsFor("quartiers", quartierSel) + '</select>' +
          (quartierSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-quartierNouveauNom" placeholder="Nom du quartier" value="' + esc(d["f-quartierNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("quartier") +
        '</div>' : '') +
        '<div class="field"><div class="label">Type(s) de coiffure</div>' +
          '<div class="chip-wrap">' + chips + '</div>' +
          (showNouveauType ? '<div class="inline-new"><input type="text" class="input" id="f-nouveauTypeCoiffure" placeholder="Ex. Vanilles" value="' + esc(d["f-nouveauTypeCoiffure"]||"") + '" data-autofocus data-action-change="capture-coiffure">' +
            '<button type="button" class="btn btn-secondary" data-action="ajouter-type-coiffure">Ajouter</button></div>' : '') +
        '</div>' +
        renderChampPaiement() +
        (credit ? renderChampsCredit() :
        '<div class="field"><div class="label">Main d’œuvre gardée (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-mainOeuvre" value="' + esc(d["f-mainOeuvre"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">' + (estModeSalon() ? "Recette du salon pour cette prestation (hors mèche et transport)." : "Ce que vous gardez réellement pour vous.") + '</div>' +
          fieldErr("mainOeuvre") +
        '</div>') +
        '<div class="field"><div class="label">Coût des mèches (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-coutMeches" placeholder="0" value="' + esc(d["f-coutMeches"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Transport (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-transport" placeholder="0" value="' + esc(d["f-transport"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' : '') +
        (estModifPrestation() ? renderNoteMoisPasse() : '') +
        boutonEnregistrerPrestation() +
      '</div>'
    );
  }

  function lieuParDefaut(){ return estModeSalon() ? "salon" : "domicile"; }
  /* ----- Sprint 9B2 : saisie du soir (cahier v2.4 §5.15, D25) ----- */
  // Réglages › Mon travail › « Je note » : config.saisieCoiffure « chaque »
  // (absent = chaque, écrit seulement au premier choix) ou « soir ». Une
  // recette du soir est une prestation comme les autres : saisie « soir »,
  // nbClientes (ou null), sans type de cliente, quartier ni type de coiffure ;
  // lieu = celui du mode de travail. En salon, une recette par activité
  // (Coiffure, Onglerie), reliées par groupeSoir.
  function saisieDuSoir(){ return state.config.saisieCoiffure === "soir"; }
  function estRecetteSoir(p){ return !!p && p.saisie === "soir"; }
  function groupeDe(p){ return p.groupeSoir || p.id; }
  function recetteSoirExiste(date, groupeExclu){
    return state.prestationsCoiffure.some(function(p){ return estRecetteSoir(p) && p.date === date && groupeDe(p) !== groupeExclu; });
  }
  var SOIR_FIELDS = ["f-soirDate", "f-soirMontant", "f-soirOnglerie", "f-soirNb"];
  function estModifSoir(){ return !!ui.modal && ui.modal.type === "edit-soir"; }
  function messageDoublonSoir(){
    var date = ui.draft["f-soirDate"] || todayStr();
    var p = estModifSoir() ? prestationParId(ui.modal.id) : null;
    return recetteSoirExiste(date, p ? groupeDe(p) : null) ? "Une recette du soir existe déjà pour ce jour." : "";
  }
  function majNoteDoublonSoir(){
    var el = byId("note-soir-doublon");
    if(!el) return;
    var msg = messageDoublonSoir();
    el.textContent = msg;
    el.hidden = !msg;
  }
  function champMontantSoir(id, libelle, test, focus){
    return '<div class="field"><div class="label">' + esc(libelle) + '</div>' +
      '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="' + id + '" value="' + esc(ui.draft[id] || "") + '" data-action-change="capture-soir" data-test="' + test + '"' + (focus ? ' data-autofocus' : '') + '>' +

  function renderFormSoir(){

    if(modif){
      montants = champMontantSoir("f-soirMontant", (p.activite === "onglerie" ? "💅 Onglerie" : (p.activite ? "💇 Coiffure" : "Montant du jour")) + " (FCFA)", "soir-montant", true);
    } else if(salon){
      montants = '<div class="soir-deux">' + champMontantSoir("f-soirMontant", "💇 Coiffure (FCFA)", "soir-montant", true) +
        champMontantSoir("f-soirOnglerie", "💅 Onglerie (FCFA)", "soir-onglerie", false) + '</div>';

            '<input type="date" class="input" id="f-soirDate" max="' + todayStr() + '" value="' + esc(date) + '" data-action-change="capture-soir" data-test="soir-date">' +
          '</div>' +
          '<div class="field"><div class="label">Clientes</div>' +
            '<input type="number" inputmode="numeric" step="1" min="1" class="input" id="f-soirNb" placeholder="Facultatif" value="' + esc(d["f-soirNb"] || "") + '" data-action-change="capture-soir" data-test="soir-nb">' +
          '</div>' +
        '</div>' +
        fieldErr("soirDate") + fieldErr("soirNb") +
        '<div class="note-douce" id="note-soir-doublon" data-test="soir-doublon" role="status"' + (doublon ? '' : ' hidden') + '>' + esc(doublon) + '</div>' +
        '<button type="button" class="btn btn-primary" data-action="' + (modif ? "enregistrer-modif-soir" : "enregistrer-soir") + '" data-test="soir-enregistrer">' + (modif ? "Enregistrer les modifications" : "Enregistrer") + '</button>' +
        (modif ? '' : '<button type="button" class="lien-discret" data-action="detailler-cliente" data-test="detailler-cliente">Détailler une cliente ›</button>') +
      '</div>'
    );
  }
  function lireFormulaireSoir(){
    captureDraft(SOIR_FIELDS);
    var d = ui.draft, errors = {};
    var modif = estModifSoir(), salonDeux = estModeSalon() && !modif;
    var brut = function(id){ var v = d[id]; return (v === undefined || v === null) ? "" : String(v).trim(); };
    var date = brut("f-soirDate") || todayStr();
    if(date > todayStr()) errors.soirDate = "La date ne peut pas être dans le futur.";
    var b1 = brut("f-soirMontant"), b2 = salonDeux ? brut("f-soirOnglerie") : "";
    var m1 = b1 === "" ? 0 : toNum(b1), m2 = b2 === "" ? 0 : toNum(b2);
    if(m1 < 0 || m2 < 0) errors.soirMontant = "Indiquez un montant positif.";
    else if(salonDeux ? !(m1 > 0 || m2 > 0) : !(m1 > 0)) errors.soirMontant = salonDeux ? "Indiquez au moins un montant." : "Indiquez le montant du jour.";
    var bn = brut("f-soirNb"), nb = null;
    if(bn !== ""){
      nb = toNum(bn);
      if(!(nb >= 1) || Math.round(nb) !== nb) errors.soirNb = "Indiquez un nombre de clientes, ou laissez vide.";
    }
    return { errors: errors, date: date, coiffure: Math.round(m1), onglerie: Math.round(m2), nb: nb };
  }
  function enregistrerSoir(){
    var f = lireFormulaireSoir();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }
    var maintenant = Date.now();
    var salon = estModeSalon();
    var aCreer = salon
      ? [["coiffure", f.coiffure], ["onglerie", f.onglerie]].filter(function(x){ return x[1] > 0; })
      : [[null, f.coiffure]];
    var groupe = aCreer.length > 1 ? uid("soir") : null;
    aCreer.forEach(function(x, i){
      var p = { id: uid("soir"), date: f.date, saisie: "soir", nbClientes: i === 0 ? f.nb : null, mainOeuvre: x[1],
        lieu: salon ? "salon" : "domicile", coutMeches: 0, transport: 0, ts: maintenant + i };
      if(x[0]) p.activite = x[0];
      if(groupe) p.groupeSoir = groupe;
      state.prestationsCoiffure.push(p);
    });
    saveState();
    MonDjaiCompte.finSaisie("saisie.soir");
    closeModal();
  }
  function enregistrerModifSoir(){
    var p = prestationParId(ui.modal && ui.modal.id);
    if(!p){ closeModal(); return; }
    var f = lireFormulaireSoir();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }
    if(appliquerModification(p, { date: f.date, mainOeuvre: f.coiffure, nbClientes: f.nb })) saveState();
    ui.errors = {};
    closeModal();
  }
  function brouillonDepuisSoir(p){
    return { "f-soirDate": p.date || todayStr(), "f-soirMontant": valeurChamp(p.mainOeuvre), "f-soirNb": Number(p.nbClientes) > 0 ? String(p.nbClientes) : "" };
  }
  // Trace d'une recette du soir ou d'une mise de côté supprimée.
  function archiverSuppression(quoi, rec){
    if(!rec) return;
    if(!Array.isArray(state.supprimes)) state.supprimes = [];
    state.supprimes.push({ quoi: quoi, le: Date.now(), enregistrement: JSON.parse(JSON.stringify(rec)) });
  }

  var COIFFURE_FIELDS = ["f-date","f-clienteSel","f-clienteNouveauNom","f-quartierSel","f-quartierNouveauNom","f-nouveauTypeCoiffure","f-mainOeuvre","f-coutMeches","f-transport","f-montantOnglerie","f-clienteNom","f-prixCredit","f-dejaPaye"];

  // Sprint 8C : lecture + contrôles du formulaire de prestation, PARTAGÉS par
  // la saisie et la modification (mêmes contrôles, mêmes messages). Les
  // contrôles du 8B sont repris tels quels ; s'y ajoutent ceux du crédit.
  // Renvoie { errors, act, construire() } — construire() n'est appelée
  // qu'une fois les contrôles passés (elle peut créer un type de cliente ou
  // un quartier personnalisé, comme avant).
  function lireFormulairePrestation(){
    captureDraft(COIFFURE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var act = activiteBrouillon();
    var date = d["f-date"] || todayStr();
    var credit = paiementBrouillon() === "credit";
    var p = prestationEnCorrection();
    var enc = p ? encaissementsDe(p.id) : [];
    var totalEnc = sumBy(enc, function(e){ return e.montant; });
    if(!date) errors.date = "Choisissez une date.";
    else if(enc.length){
      var premiere = enc.map(function(e){ return e.date; }).sort()[0];
      if(date > premiere) errors.date = "Cette prestation a un encaissement le " + formatDateFr(premiere) + " : sa date ne peut pas être postérieure.";
    }

    var montantRecu = 0, creditObj;
    if(credit){
      var nom = String(d["f-clienteNom"]||"").trim();
      var brutPrix = String(d["f-prixCredit"]||"").trim();
      var prix = toNum(brutPrix);
      var brutDeja = String(d["f-dejaPaye"]===undefined || d["f-dejaPaye"]===null ? "" : d["f-dejaPaye"]).trim();
      var deja = brutDeja === "" ? 0 : toNum(brutDeja);
      if(!nom) errors.clienteNom = "Indiquez le nom de la cliente.";
      if(!(prix > 0) || brutPrix === "") errors.prixCredit = "Indiquez le prix de la prestation.";
      if(deja < 0) errors.dejaPaye = "Indiquez un montant positif, ou laissez vide (0).";
      else if(prix > 0 && deja > prix) errors.dejaPaye = "Le montant déjà payé ne peut pas dépasser le prix de la prestation.";
      else if(prix > 0 && totalEnc > 0 && deja + totalEnc > prix){
        errors.prixCredit = "Déjà reçu pour cette prestation : " + formatFCFA(deja + totalEnc) + ". Le prix ne peut pas être inférieur.";
      }
      montantRecu = Math.round(deja);
      var ancien = p ? creditDe(p) : null;
      var abandonne = !!(ancien && ancien.statut === "abandonne");
      creditObj = {
        clienteNom: nom, prixTotal: Math.round(prix),
        statut: abandonne ? "abandonne" : (montantRecu + totalEnc >= Math.round(prix) ? "solde" : "en_cours"),
        abandonneLe: abandonne ? (ancien.abandonneLe || null) : null
      };
    }

    if(act === "onglerie"){
      if(!credit){
        var montant = toNum(d["f-montantOnglerie"]);
        if(!(montant > 0) || !d["f-montantOnglerie"]) errors.montantOnglerie = "Indiquez le montant de la prestation.";
        montantRecu = montant;
      }
      return { errors: errors, act: act, construire: function(){
        return {
          date: date, activite: "onglerie", lieu: "salon",
          typeClienteId: null, typeClienteNom: null, quartierId: null, quartierNom: null,
          typesCoiffureIds: [], typesCoiffureNoms: [],
          mainOeuvre: montantRecu, coutMeches: 0, transport: 0,
          credit: creditObj
        };
      }};
    }

    var lieu = ((d["f-lieu"] || lieuParDefaut()) === "salon") ? "salon" : "domicile";
    var clienteSel = d["f-clienteSel"];
    var clienteNouveauNom = (d["f-clienteNouveauNom"]||"").trim();
    var quartierSel = d["f-quartierSel"];
    var quartierNouveauNom = (d["f-quartierNouveauNom"]||"").trim();
    var coutMeches = toNum(d["f-coutMeches"]);
    var transport = lieu === "domicile" ? toNum(d["f-transport"]) : 0;
    if(!clienteSel || (clienteSel==="__new__" && !clienteNouveauNom)) errors.cliente = "Choisissez ou précisez le type de cliente.";
    if(lieu === "domicile" && (!quartierSel || (quartierSel==="__new__" && !quartierNouveauNom))) errors.quartier = "Choisissez ou précisez le quartier.";
    if(!credit){
      montantRecu = toNum(d["f-mainOeuvre"]);
      if(!(montantRecu >= 0) || d["f-mainOeuvre"]==="" || d["f-mainOeuvre"]===undefined) errors.mainOeuvre = "Indiquez la main d’œuvre gardée.";
    }
    return { errors: errors, act: act, construire: function(){
      var cliente = clienteSel === "__new__" ? addPerso("typesCliente", clienteNouveauNom) : findById("typesCliente", clienteSel);
      var quartier = lieu === "domicile" ? (quartierSel === "__new__" ? addPerso("quartiers", quartierNouveauNom) : findById("quartiers", quartierSel)) : null;
      var typesIds = (d.typesCoiffureSel || []).slice();
      var typesNoms = typesIds.map(function(id){ var it = findById("typesCoiffure", id); return it ? it.nom : null; }).filter(Boolean);
      var v = {
        date: date, lieu: lieu,
        typeClienteId: cliente ? cliente.id : null, typeClienteNom: cliente ? cliente.nom : clienteNouveauNom,
        quartierId: quartier ? quartier.id : null, quartierNom: lieu === "domicile" ? (quartier ? quartier.nom : quartierNouveauNom) : null,
        typesCoiffureIds: typesIds, typesCoiffureNoms: typesNoms,
        mainOeuvre: montantRecu, coutMeches: coutMeches, transport: transport,
        credit: creditObj
      };
      // Sprint 8B : activité explicite pour les prestations saisies en mode
      // Salon (en mode À domicile, enregistrement identique au 7bis). En
      // modification, le champ est gardé s'il existait déjà.
      if(estModeSalon() || (p && p.activite !== undefined)) v.activite = "coiffure";
      else v.activite = undefined;
      return v;
    }};
  }

  function enregistrerCoiffure(){
    var f = lireFormulairePrestation();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }
    var v = f.construire();
    var prestation = { id: uid(f.act === "onglerie" ? "ongl" : "coif") };
    Object.keys(v).forEach(function(k){ if(v[k] !== undefined) prestation[k] = v[k]; });
    prestation.ts = Date.now();
    state.prestationsCoiffure.push(prestation);
    saveState();
    MonDjaiCompte.finSaisie(f.act === "onglerie" ? "saisie.onglerie" : "saisie.chaque");
    closeModal();
  }
  // Compatibilité : l'enregistrement d'une onglerie passe par le même chemin.
  function enregistrerOnglerie(){ enregistrerCoiffure(); }

  function enregistrerModifCoiffure(){
    var p = prestationEnCorrection();
    if(!p){ closeModal(); return; }
    var f = lireFormulairePrestation();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }

  // Brouillon pré-rempli pour corriger une prestation (coiffure, onglerie, crédit).
  function valeurChamp(n){ return (n === null || n === undefined || n === "") ? "" : String(n); }
  function brouillonDepuisPrestation(p){
    var c = creditDe(p);
    var d = { "f-activite": activiteDe(p), "f-date": p.date || todayStr(), "f-paiement": c ? "credit" : "entier" };
    if(c){
      d["f-clienteNom"] = c.clienteNom || "";
      d["f-prixCredit"] = valeurChamp(c.prixTotal);
      d["f-dejaPaye"] = p.mainOeuvre ? valeurChamp(p.mainOeuvre) : "";
    }
    if(activiteDe(p) === "onglerie"){
      if(!c) d["f-montantOnglerie"] = valeurChamp(p.mainOeuvre);
      return d;
    }
    var cl = p.typeClienteId ? findById("typesCliente", p.typeClienteId) : null;
    d["f-clienteSel"] = cl ? cl.id : (p.typeClienteNom ? "__new__" : "");
    if(!cl && p.typeClienteNom) d["f-clienteNouveauNom"] = p.typeClienteNom;
    d["f-lieu"] = p.lieu === "salon" ? "salon" : "domicile";
    if(p.lieu !== "salon"){
      var q = p.quartierId ? findById("quartiers", p.quartierId) : null;
      d["f-quartierSel"] = q ? q.id : (p.quartierNom ? "__new__" : "");
      if(!q && p.quartierNom) d["f-quartierNouveauNom"] = p.quartierNom;
    }
    d.typesCoiffureSel = (p.typesCoiffureIds || []).filter(function(id){ return !!findById("typesCoiffure", id); });
    if(!c) d["f-mainOeuvre"] = valeurChamp(p.mainOeuvre);
    d["f-coutMeches"] = p.coutMeches ? valeurChamp(p.coutMeches) : "";
    d["f-transport"] = p.transport ? valeurChamp(p.transport) : "";
    return d;
  }

  /* ================= Listes / détails de prestations ================= */

  // Sprint 8C : sous-titre crédit d'une prestation (« 🤝 À crédit · reste … »).
  function badgeCredit(p){
    var st = statutCredit(p);
    if(!st) return "";
    if(st === "solde") return '<span class="badge badge-solde">Soldé ✓</span>';
    if(st === "abandonne") return '<span class="badge badge-abandon">Abandonné</span>';
    return '<span class="badge badge-credit">Crédit</span>';
  }
  function sousTitreCredit8C(p){
    var c = creditDe(p);
    if(!c) return "";
    var st = statutCredit(p);
    if(st === "solde") return "Crédit soldé · prix " + montantInsecable(c.prixTotal);
    if(st === "abandonne") return "Crédit abandonné · prix " + montantInsecable(c.prixTotal);
    return "À crédit · reste " + montantInsecable(resteDuCredit(p));
  }
  function nomAffichePrestation(p){
    if(estRecetteSoir(p)) return "Recette du soir";   // Sprint 9B2
    var c = creditDe(p);
    if(activiteDe(p) === "onglerie") return c && c.clienteNom ? "Onglerie · " + c.clienteNom : "Onglerie";
    var lieuTxt = p.lieu === "salon" ? "💈 En salon" : (p.quartierNom || "");
    return (c && c.clienteNom ? c.clienteNom + " · " : "") + (p.typeClienteNom || "") + " · " + lieuTxt;
  }

  // Sprint 8B : carte d'une prestation d'onglerie (montant et date seulement).
  function renderCarteOnglerie(p, action, avecDate){

  function renderCarteCoiffure(p, action, avecDate){
    action = action || "voir-coiffure";
    if(avecDate === undefined) avecDate = true;
    if(estRecetteSoir(p)) return renderCarteSoir(p, action, avecDate);   // Sprint 9B2
    if(activiteDe(p) === "onglerie") return renderCarteOnglerie(p, action, avecDate);
    var types = (p.typesCoiffureNoms||[]).join(", ") || "Type non précisé";

    var sub = (avecDate ? formatDateFr(p.date) + ' · ' : '') + (c ? sousTitreCredit8C(p) : types);

        '<div class="entry-ico">💇</div>' +

          '<div class="entry-title et-flex"><span class="et-nom">' + esc(nomAffichePrestation(p)) + '</span>' + badgeCredit(p) + '</div>' +
          '<div class="entry-sub">' + esc(sub) + '</div>' +
        '</div>' +
        '<div class="entry-amount">' + formatFCFA(p.mainOeuvre) + '</div>' +
      '</button>'

  // Sprint 9B2 : carte d'une recette du soir.
  function libelleSoir(p){
    var t = [];
    if(Number(p.nbClientes) > 0) t.push(libelleClientes(Number(p.nbClientes)));
    if(p.activite) t.push(activiteDe(p) === "onglerie" ? "onglerie" : "coiffure");

  // Sprint 8C : ligne d'un encaissement dans les listes du jour —
  // « 💵 Encaissement — Aïcha (prestation du 05/10) ».
  function renderCarteEncaissement(e, avecDate){

        '</div>' +

  // Liste des prestations ET des encaissements d'une période (plus récents
  // d'abord). Sprint 8B : `activite` facultatif — filtre la liste (vues
  // Coiffure / Onglerie de Mon état). Sans crédit, liste identique au 8B.
  function elementsJournal(range, activite){
    var items = filterRange(state.prestationsCoiffure, range).map(function(p){ return { type:"p", date:p.date, ts:p.ts||0, rec:p }; });
    if(activite) items = items.filter(function(x){ return activiteDe(x.rec) === activite; });
    encaissementsPeriode(range, activite).forEach(function(e){ items.push({ type:"e", date:e.date, ts:e.ts||0, rec:e }); });
    return items.sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.ts - a.ts;
    });
  }
  function renderListePrestationsRange(range, videEmoji, videTitre, videDesc, activite){
    var items = elementsJournal(range, activite);
    if(!items.length) return emptyState(videEmoji, videTitre, videDesc);
    return '<div class="entry-list">' + items.map(function(x){
      return x.type === "e" ? renderCarteEncaissement(x.rec, true) : renderCarteCoiffure(x.rec, "voir-coiffure", true);
    }).join("") + '</div>';
  }

  function drow(k,v){ return '<div class="detail-row"><div class="dk">' + esc(k) + '</div><div class="dv">' + v + '</div></div>'; }

  // Sprint 8C : « ✏️ Modifier » à côté de « 🗑️ Supprimer » pour les
  // prestations et les charges ; message clair si une prestation à
  // supprimer a des encaissements (supprimés avec elle).
  function detailShell(rowsHtml, kind, id, avantBoutons){
    var confirming = ui.modal.confirmDelete;
    var modifiable = (kind === "coiffure" || kind === "autre-charge");
    var messageSuppr = "Supprimer cet enregistrement ? Cette action est définitive.";
    if(kind === "coiffure"){
      var enc = encaissementsDe(id);
      if(enc.length){
        var tot = formatFCFA(sumBy(enc, function(e){ return e.montant; }));
        messageSuppr = "Supprimer cette prestation ? " + (enc.length > 1
          ? "Ses " + enc.length + " encaissements, " + tot + ", seront supprimés aussi."
          : "Son encaissement de " + tot + " sera supprimé aussi.") + " Cette action est définitive.";
      }
    }
    var boutons = modifiable

      : '<button type="button" class="btn btn-danger" style="margin-top:14px;" data-action="demander-suppression">🗑️ Supprimer</button>';
    return (
      '<div>' + rowsHtml + (avantBoutons || "") +
      (confirming ?

            '<button type="button" class="btn btn-secondary" data-action="annuler-suppression">Annuler</button>' +

          '</div></div>'

  // Lignes « crédit » du détail d'une prestation (prix, payé le jour même,
  // encaissements, reste dû / soldé / abandonné) + bouton « Encaisser ».
  function rowsCreditDetail(p){
    var c = creditDe(p);
    if(!c) return { rows: "", apres: "" };
    var st = statutCredit(p);
    var rows =
      drow("Cliente", esc(c.clienteNom || "—")) +
      drow("Prix de la prestation", formatFCFA(c.prixTotal)) +
      drow("Payé le jour de la prestation", formatFCFA(p.mainOeuvre));
    encaissementsDe(p.id).slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : (a.ts||0) - (b.ts||0)); }).forEach(function(e){
      rows += drow("Encaissement du " + formatDateFr(e.date), '<span style="color:var(--green);">+' + formatFCFA(e.montant) + '</span>');
    });
    if(st === "solde") rows += drow("Reste dû", '<span style="color:var(--green);" data-test="detail-statut">Soldé ✓</span>');
    else if(st === "abandonne") rows += drow("Reste dû", '<span style="color:var(--text-dim);" data-test="detail-statut">Abandonné' + (c.abandonneLe ? " le " + formatDateFr(c.abandonneLe) : "") + ' (' + formatFCFA(resteDuCredit(p)) + ')</span>');
    else rows += drow("Reste dû", '<span style="color:var(--pink);" data-test="detail-statut">' + formatFCFA(resteDuCredit(p)) + '</span>');

      ? '<button type="button" class="btn btn-vert" style="margin-top:14px;" data-action="encaisser-credit" data-id="' + esc(p.id) + '">💵 Encaisser</button>'
      : '';
    return { rows: rows, apres: apres };
  }

  // Sprint 8A : rubriques actives du mode en cours. En mode À domicile, la

  // Sprint 8C : même formulaire pour la saisie et la modification d'une charge.
  function estModifCharge(){ return !!ui.modal && ui.modal.type === "edit-charge"; }
  function chargeEnCorrection(){
    if(!estModifCharge()) return null;
    var l = state.autresCharges;
    for(var i=0;i<l.length;i++) if(l[i] && l[i].id === ui.modal.id) return l[i];
    return null;
  }
  // Tuiles de rubriques ; en modification, la rubrique de la charge reste
  // proposée même si elle a été désactivée ou supprimée depuis.
  function rubriquesPourFormulaire(){
    // Sprint 9B2 : un crédit terminé n'est plus proposé à la saisie.
    var rubs = rubriquesActives().filter(function(r){ return !(typeDeRubrique(r) === "credit" && creditTermine(r.id)); });
    var c = chargeEnCorrection();
    if(c && !rubs.some(function(r){ return r.id === c.rubriqueId; })){
      var r0 = findRubriqueCharge(c.rubriqueId);
      rubs.unshift(r0 || { id: c.rubriqueId, nom: c.rubriqueNom, emoji: c.rubriqueEmoji, type: c.rubriqueType });
    }
    return rubs;
  }
  function boutonEnregistrerCharge(){
    return estModifCharge()
      ? '<button type="button" class="btn btn-primary" data-action="enregistrer-modif-charge">Enregistrer les modifications</button>'
      : '<button type="button" class="btn btn-primary" data-action="enregistrer-autre-charge">Enregistrer</button>';
  }
