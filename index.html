  // Sprint 8A, amendement n°1 section 3 : rubriques propres au mode Salon.
  // `portee` : "salon" (n'apparaît qu'en mode Salon), "domicile" (n'apparaît
  // qu'en mode À domicile) ou "tous". `type` : "commune" (charge du mois),
  // "produits_coiffure" / "produits_onglerie" (payés par le fonds de
  // renouvellement) ou "credit" (remboursement, avec bilan). Les rubriques du
  // Sprint 7bis n'ont ni `portee` ni `type` en state : ils sont déduits par
  // porteeRubrique()/typeDeRubrique() sans jamais réécrire ces rubriques.
  var RUBRIQUES_SALON_DEFAUT = [
    { id:"cie", nom:"Électricité (CIE)", emoji:"⚡", actif:true, type:"commune" },
    { id:"sodeci", nom:"Eau (SODECI)", emoji:"🚰", actif:true, type:"commune" },
    { id:"mairie", nom:"Mairie", emoji:"🏛️", actif:true, type:"commune" },
    { id:"burida", nom:"Taxe BURIDA", emoji:"🎵", actif:true, type:"commune" },
    { id:"produits_coiffure", nom:"Produits coiffure", emoji:"🧴", actif:true, type:"produits_coiffure" },
    { id:"produits_onglerie", nom:"Produits onglerie", emoji:"💅", actif:true, type:"produits_onglerie" },
    { id:"credit", nom:"Remboursement de crédit", emoji:"🏦", actif:true, type:"credit" }
  ];
  // Ordre d'affichage des rubriques en mode Salon (section 3 de l'amendement) ;
  // les rubriques personnalisées et crédits ajoutés suivent, dans leur ordre
  // de création.
  var ORDRE_RUBRIQUES_SALON = ["loyer","cie","sodeci","mairie","burida","produits_coiffure","produits_onglerie","credit","publicite","entretien_salon","decoration","autre"];

  // Ajoute (une seule fois) les rubriques du mode Salon manquantes. Appelée au
  // passage en mode Salon et, par sécurité, au chargement d'un état déjà en
  // mode Salon. N'altère jamais une rubrique existante.
  function assurerRubriquesSalon(config){
    var list = config.rubriquesCharges;
    RUBRIQUES_SALON_DEFAUT.forEach(function(r){
      var existe = list.some(function(x){ return x.id === r.id; });
      if(!existe) list.push({ id:r.id, nom:r.nom, emoji:r.emoji, actif:r.actif, perso:false, portee:"salon", type:r.type });
    });
  }
  function porteeRubrique(r){
    if(!r) return "tous";
    if(r.portee) return r.portee;
    // « Électricité / eau » (Sprint 7bis) reste la rubrique du mode À
    // domicile ; en mode Salon, CIE et SODECI la remplacent (deux factures).
    return r.id === "electricite" ? "domicile" : "tous";
  }
  function typeDeRubrique(r){ return (r && r.type) || "commune"; }
  function estTypeProduits(t){ return t === "produits_coiffure" || t === "produits_onglerie"; }

  function defaultState(){
    return {
      version: 1,
      config: {
        typesCliente: seedList(TYPES_CLIENTE_DEFAUT),
        quartiers: seedList(QUARTIERS_DEFAUT),
        typesCoiffure: seedList(TYPES_COIFFURE_DEFAUT),
        rubriquesCharges: seedRubriquesCharges(),
        codeAccesOk: false,
        derniereValidationAcces: null,
        moisAccesValide: null,        // { mois, annee } — dernier mois civil couvert par l'accès (essai ou code mensuel)
        pinActif: false,
        pinCode: null,
        // Sprint 8A — mode Salon
        modeTravail: "domicile",      // "domicile" (défaut, comportement Sprint 7bis) | "salon"
        fondsRenouvellement: null,    // { mode:'fixe'|'pourcentage', valeur, depuis:'AAAA-MM', historique:[{depuis,mode,valeur}] }
        credits: [],                  // [{ id, rubriqueId, type:'banque'|'personne', preteur, montantTotal|null, dateDebut, tsDebut }]
        // Sprint 8B — répartition du résultat net (paramètres versionnés par mois :
        // { mode:'fixe'|'pourcentage', valeur, depuis:'AAAA-MM', historique:[{depuis,mode,valeur}] })
        remunerationProprio: null,
        salaries: [],                 // [{ id, nom, debut:'AAAA-MM', fin:'AAAA-MM'|null, mode, valeur, depuis, historique }]
        epargneMensuelle: null
        // Sprint 8D — config.theme : 'clair' | 'auto' | 'sombre'. Absent = 'clair'
        // (lu par choixTheme() ; écrit seulement quand l'utilisatrice choisit).
      },
      prestationsCoiffure: [],
      autresCharges: [],            // Sprint 8A : + moisConcerne 'AAAA-MM', note, rubriqueType (charges saisies en mode Salon)
      objectifEpargne: null,        // { id, nom, type:'auto'|'manuel', pourcentage, dateCreation }
      objectifsVerrouilles: [],      // objectifs migrés au-delà du 1er (données conservées, jamais affichées en détail)
      reprisesCharges: {},           // Sprint 8A : { 'AAAA-MM': { rubriqueId: 'confirme'|'ignore' } }
      // Sprint 8C — crédit clientes : chaque somme reçue après le jour de la
      // prestation. prestationsCoiffure[].credit = { clienteNom, prixTotal,
      // statut:'en_cours'|'solde'|'abandonne', abandonneLe }.
      encaissementsCredit: [],      // [{ id, prestationId, date, montant, ts }]
      meta: { creation: todayStr(), derniereSauvegarde: null }
    };
  }

  function merge(base, extra){
    var out = {};
    for(var k in base) out[k] = base[k];
    if(extra) for(var k2 in extra) if(extra[k2] !== undefined) out[k2] = extra[k2];
    return out;
  }

  var state;

  // Fusion défensive d'un état chargé (localStorage) ou importé (F11 JSON) avec
  // l'état par défaut. Accepte aussi, en repli, une sauvegarde faite depuis
  // MonDjai/Salon F (mêmes champs prestationsCoiffure/autresCharges/config de
  // base) — les données propres aux autres profils (achats, ventes, prestations
  // pédicure) sont ignorées puisque cette application ne gère plus que Coiffure,
  // mais rien n'est perdu : un fichier non reconnu par une section précise est
  // simplement filtré à cette section, jamais utilisé pour refuser tout l'import.
  function normaliserEtatImporte(parsed){
    var base = defaultState();
    if(!parsed || typeof parsed !== "object") return base;
    var out = merge(base, parsed);
    out.config = merge(base.config, parsed.config || {});
    if(!Array.isArray(out.config.typesCliente) || !out.config.typesCliente.length) out.config.typesCliente = base.config.typesCliente;
    if(!Array.isArray(out.config.quartiers) || !out.config.quartiers.length) out.config.quartiers = base.config.quartiers;
    if(!Array.isArray(out.config.typesCoiffure) || !out.config.typesCoiffure.length) out.config.typesCoiffure = base.config.typesCoiffure;
    if(!Array.isArray(out.config.rubriquesCharges) || !out.config.rubriquesCharges.length) out.config.rubriquesCharges = base.config.rubriquesCharges;
    if(!Array.isArray(out.prestationsCoiffure)) out.prestationsCoiffure = [];
    if(!Array.isArray(out.autresCharges)) out.autresCharges = [];
    if(!Array.isArray(out.objectifsVerrouilles)) out.objectifsVerrouilles = [];
    // Sprint 8C : un état 8B n'a pas d'encaissements — tableau vide, rien
    // d'autre ne change (les crédits sont lus à la volée par creditDe()).
    if(!Array.isArray(out.encaissementsCredit)) out.encaissementsCredit = [];
    if(out.objectifEpargne && typeof out.objectifEpargne !== "object") out.objectifEpargne = null;
    out.meta = merge(base.meta, parsed.meta || {});
    migrerLieuPrestations(out);
    migrerObjectifsCoiffure(out, parsed);
    migrerValidationAcces(out);
    migrerAccesCalendaire(out);
    normaliserModeSalon(out);
    return out;
  }

  // Sprint 8A : un état antérieur (Sprint ≤7bis) n'a ni mode de travail, ni
  // fonds, ni crédits, ni reprises — il reçoit les valeurs par défaut (mode À
  // domicile), sans qu'aucune prestation, charge ou rubrique existante ne soit
  // modifiée. Les charges sans `moisConcerne` sont rattachées, au moment du
  // calcul seulement, au mois de leur date (moisDeCharge), jamais réécrites.
  function normaliserModeSalon(out){
    if(out.config.modeTravail !== "salon") out.config.modeTravail = "domicile";
    if(!Array.isArray(out.config.credits)) out.config.credits = [];
    var f = out.config.fondsRenouvellement;
    if(f && (typeof f !== "object" || (f.mode !== "fixe" && f.mode !== "pourcentage") || !f.depuis)) out.config.fondsRenouvellement = null;
    else if(f && !Array.isArray(f.historique)) f.historique = [];
    if(!out.reprisesCharges || typeof out.reprisesCharges !== "object" || Array.isArray(out.reprisesCharges)) out.reprisesCharges = {};
    if(out.config.modeTravail === "salon") assurerRubriquesSalon(out.config);
    // Sprint 8B
    out.config.remunerationProprio = paramVersionneValide(out.config.remunerationProprio);
    out.config.epargneMensuelle = paramVersionneValide(out.config.epargneMensuelle);
    if(!Array.isArray(out.config.salaries)) out.config.salaries = [];
    out.config.salaries = out.config.salaries.filter(function(s){
      return s && typeof s === "object" && s.id && paramVersionneValide(s) && s.debut;
    });
  }
  function paramVersionneValide(p){
    if(!p || typeof p !== "object") return null;
    if(p.mode !== "fixe" && p.mode !== "pourcentage") return null;
    if(!p.depuis) return null;
    if(!Array.isArray(p.historique)) p.historique = [];
    return p;
  }

  // Amendement Sprint 2 (Salon F) : champ "lieu" (domicile/salon). Toute
  // prestation enregistrée avant cet amendement (ou provenant d'un très ancien
  // fichier) n'a pas de champ `lieu` — traitée par défaut comme "à domicile",
  // sans perte ni altération d'aucune autre donnée déjà saisie.
  function migrerLieuPrestations(out){
    out.prestationsCoiffure.forEach(function(p){
      if(p.lieu !== "domicile" && p.lieu !== "salon") p.lieu = "domicile";
    });
  }

  // Amendement Sprint 4C (Salon F) : un état déjà validé (codeAccesOk vrai)
  // mais sans horodatage de dernière validation vient forcément d'avant ce
  // mécanisme — on lui accorde une nouvelle période de 30 jours à partir de
  // maintenant plutôt que de considérer l'accès expiré dès la mise à jour de
  // l'application.
  function migrerValidationAcces(out){
    if(out.config.codeAccesOk && !out.config.derniereValidationAcces){
      out.config.derniereValidationAcces = Date.now();
    }
  }

  // Sprint 5B, section 10 : passage de l'accès mensuel en fenêtre glissante de
  // 30 jours (Sprint 4C/5A) à des bornes calendaires. Un état déjà validé
  // (codeAccesOk vrai) qui n'a pas encore de `moisAccesValide` vient forcément
  // d'avant ce mécanisme. On calcule le mois d'essai qui aurait dû s'appliquer
  // à partir de la date d'installation réelle (`meta.creation`, fixée dès le
  // tout premier lancement et jamais réécrite depuis) ; si une validation plus
  // récente existe (ancien renouvellement sous la fenêtre glissante), on ne
  // fait jamais reculer l'accès déjà acquis — on couvre au moins son mois. Une
  // migration technique ne doit jamais bloquer immédiatement une utilisatrice
  // déjà à jour.
  function migrerAccesCalendaire(out){
    if(!out.config.codeAccesOk) return;
    if(out.config.moisAccesValide) return;
    var installation = parseDateStr(out.meta.creation) || new Date();
    var couverture = finEssaiPourInstallation(installation);
    if(out.config.derniereValidationAcces){
      var dv = new Date(out.config.derniereValidationAcces);
      var moisValidation = { mois: dv.getMonth()+1, annee: dv.getFullYear() };
      if(compareMoisAnnee(moisValidation, couverture) > 0) couverture = moisValidation;
    }
    out.config.moisAccesValide = couverture;
  }

  // Cahier des charges Sprint 5A, section 5 : l'épargne devient un pourcentage
  // de la Main d'œuvre, avec un seul objectif actif et 2 emplacements grisés en
  // annonce. Migration : un objectif déjà créé au Sprint ≤4B (modèle Salon F —
  // pourcentage du solde net en mode auto, ou montant fixe/jour en mode manuel,
  // jusqu'à 3 par profil) est repris ; s'il y en avait plusieurs pour le profil
  // Coiffure, le plus récemment modifié devient l'objectif actif de cette
  // application, les autres basculent en "verrouillés" (grisés, données
  // conservées mais non affichées en détail — aucune perte). Faute d'horodatage
  // de modification dans l'ancien modèle, on utilise la date de création comme
  // meilleure approximation disponible (le plus souvent la même chose en
  // pratique), avec l'id (qui encode l'instant de création) comme départage.
  function migrerObjectifsCoiffure(out, parsed){
    if(out.objectifEpargne) return; // déjà au nouveau format (ré-import d'un export Coiffure)
    if(!parsed || !Array.isArray(parsed.objectifs) || !parsed.objectifs.length) return;
    var candidats = parsed.objectifs.filter(function(o){ return !o.profil || o.profil === "coiffure"; });
    if(!candidats.length) return;
    candidats = candidats.slice().sort(function(a,b){
      var da = a.dateCreation || "", db = b.dateCreation || "";
      if(da !== db) return da < db ? 1 : -1;
      var ia = String(a.id||""), ib = String(b.id||"");
      return ia < ib ? 1 : -1;
    });
    var principal = candidats[0];
    var pourcentage = (principal.pourcentage !== undefined && principal.pourcentage !== null && principal.pourcentage > 0) ? principal.pourcentage : 10;
    out.objectifEpargne = {
      id: principal.id || uid("obj"),
      nom: principal.nom || "Épargne",
      type: principal.type === "manuel" ? "manuel" : "auto",
      pourcentage: pourcentage,
      dateCreation: principal.dateCreation || todayStr()
    };
    out.objectifsVerrouilles = (out.objectifsVerrouilles||[]).concat(candidats.slice(1));
  }

  function loadState(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return defaultState();
    var parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ return defaultState(); }
    return normaliserEtatImporte(parsed);
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* stockage indisponible : on continue quand même */ }
  }

  /* ================= F11 : Sauvegarde / restauration JSON ================= */

  // Sprint 5B, note technique section 10/F11 : quand le navigateur propose
  // l'API File System Access (Chrome/Edge/Android), on laisse l'utilisatrice
  // choisir le dossier de destination. Sinon (notamment Safari/iPhone), repli
  // automatique et silencieux sur le téléchargement dans le dossier par défaut
  // — comportement du Sprint 5A, inchangé. Aucun appel réseau dans les deux cas.
  function exporterJson(){
    var filename = "mondjai-coiffure-" + todayStr() + ".json";
    var contenu = JSON.stringify(state, null, 2);
    if(typeof window.showSaveFilePicker === "function"){
      exporterJsonAvecChoixDossier(contenu, filename);
    } else {
      exporterJsonTelechargementDirect(contenu, filename);
    }
  }
  function marquerSauvegardeReussie(message){
    state.meta.derniereSauvegarde = todayStr();
    saveState();
    ui.backupMsg = message;
    render();
  }
  function exporterJsonTelechargementDirect(contenu, filename){
    try{
      var blob = new Blob([contenu], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      marquerSauvegardeReussie("Sauvegarde téléchargée.");
    }catch(e){
      ui.backupMsg = "Impossible de générer le fichier sur cet appareil.";
      render();
    }
  }
  function exporterJsonAvecChoixDossier(contenu, filename){
    window.showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: "Sauvegarde MonDjai/Coiffure", accept: { "application/json": [".json"] } }]
    }).then(function(handle){
      return handle.createWritable().then(function(writable){
        return writable.write(contenu).then(function(){ return writable.close(); });
      });
    }).then(function(){
      marquerSauvegardeReussie("Sauvegarde enregistrée.");
    }).catch(function(err){
      if(err && err.name === "AbortError"){
        // L'utilisatrice a annulé la boîte de dialogue : choix délibéré, on ne
        // force pas de second téléchargement et on ne signale pas d'erreur.
        return;
      }
      // Tout autre échec (permission refusée, navigateur capricieux…) : jamais
      // laisser l'utilisatrice sans sauvegarde — repli automatique et silencieux.
      exporterJsonTelechargementDirect(contenu, filename);
    });
  }

  function importerJsonDepuisFichier(file, callback){
    if(!file){ callback(false); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ callback(false); return; }
      state = normaliserEtatImporte(parsed);
      saveState();
      callback(true);
    };
    reader.onerror = function(){ callback(false); };
    reader.readAsText(file);
  }

  function findList(name){ return state.config[name]; }
  function addPerso(name, nom){
    nom = String(nom || "").trim();
    if(!nom) return null;
    var list = findList(name);
    var existing = list.filter(function(it){ return it.nom.toLowerCase() === nom.toLowerCase(); })[0];
    if(existing) return existing;
    var item = { id: uid("p"), nom: nom, perso:true };
    list.push(item);

  /* ================= Sprint 8D : thème clair / automatique / sombre ================= */
  // Le choix est lu à la volée (absent ou inconnu = « clair ») : charger un
  // état du 8C ne réécrit rien ; seul un choix dans Réglages l'enregistre.
  // Le thème appliqué (data-theme="clair" | "sombre" sur <html>) est déjà
  // posé par le script de <head> avant le premier affichage ; il est ensuite
  // tenu à jour ici (choix dans Réglages, réglage du téléphone en
  // Automatique), sans rechargement.
  var CHOIX_THEMES = ["clair", "auto", "sombre"];
  function choixTheme(){
    var t = state && state.config ? state.config.theme : null;
    return CHOIX_THEMES.indexOf(t) !== -1 ? t : "clair";
  }
  function telephoneEnSombre(){
    try{ return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }catch(e){ return false; }
  }
  function themeApplique(){
    var c = choixTheme();
    return (c === "sombre" || (c === "auto" && telephoneEnSombre())) ? "sombre" : "clair";
  }
  function appliquerTheme(){
    var t = themeApplique();
    var html = document.documentElement;
    if(html.getAttribute("data-theme") !== t) html.setAttribute("data-theme", t);
    majCouleurBarreSysteme();
  }
  // meta theme-color (barre d'état du téléphone) : sombre en thème sombre ;
  // en clair, la couleur du bandeau MonDjai quand l'écran en a un, sinon le
  // fond clair (code d'accès, PIN, Réglages, Objectif…).
  function majCouleurBarreSysteme(){
    var meta = document.querySelector('meta[name="theme-color"]');
    if(!meta) return;
    var c = document.documentElement.getAttribute("data-theme") === "sombre" ? "#11141a"
      : (document.querySelector("#app > .header") ? "#141922" : "#eff1f4");
    if(meta.getAttribute("content") !== c) meta.setAttribute("content", c);
  }
  // Automatique : suit en direct le réglage clair / sombre du téléphone.
  function suivreThemeTelephone(){
    try{
      if(!window.matchMedia) return;
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      var surChangement = function(){ if(choixTheme() === "auto") appliquerTheme(); };
      if(mq.addEventListener) mq.addEventListener("change", surChangement);
      else if(mq.addListener) mq.addListener(surChangement);
    }catch(e){}
  }
  // Bandeau MonDjai d'Aujourd'hui (thème clair) : il descend jusqu'au milieu
  // de la première carte — hauteur recalculée après chaque rendu et à chaque
  // changement de taille d'écran.
  function majBandeauAujourdhui(){
    var main = document.querySelector("#app > .main.ecran-aujourdhui");
    if(!main) return;
    var carte = null;
    for(var i = 0; i < main.children.length; i++){

  var CODE_ACCES_ATTENDU = "HKETCK";
  function normaliserCode(s){

  // Accès mensuel — mécanisme de calcul repris tel quel du Sprint 4C de Salon F
  // (même algorithme déterministe, 100% local, aucun appel réseau), mais avec,
  // depuis le Sprint 5B : un secret propre à Coiffure (les codes des deux
  // applications ne sont plus jamais interchangeables) et des bornes
  // calendaires plutôt qu'une fenêtre glissante de 30 jours (voir plus bas,
  // finEssaiPourInstallation/accesMensuelExpire). Secret utilisé également par
  // l'outil séparé outil-code-mensuel-coiffure.html (non livré aux
  // utilisatrices) pour calculer les codes de réabonnement.
  var SECRET_MENSUEL_COIFFURE = "MDJ-COIFFURE-2026-R4XN";
  var LETTRES_CODE_MENSUEL = "ABCDEFGHJKLMNPQRSTUVWXYZ";

  function hashFnv1a(str){
    var h = 2166136261;
    for(var i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function fmix32(h){
    h ^= h >>> 16;
    h = Math.imul(h, 0x85ebca6b) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35) >>> 0;
    h ^= h >>> 16;
    return h >>> 0;
  }
  function codeAccesDuMois(mois, annee, secret){
    var base = String(secret) + "|" + String(annee) + "-" + pad2(mois) + "|";
    var code = "";
    for(var i=0;i<6;i++){
      var h = fmix32(hashFnv1a(base + i));
      code += LETTRES_CODE_MENSUEL.charAt(h % LETTRES_CODE_MENSUEL.length);
    }
    return code;
  }
  function codeAccesDuMoisAttenduAujourdhui(){
    var d = new Date();
    return codeAccesDuMois(d.getMonth()+1, d.getFullYear(), SECRET_MENSUEL_COIFFURE);
  }

  // ----- Bornes calendaires (Sprint 5B, section 10) -----

  // Parse une date "YYYY-MM-DD" (format utilisé par todayStr/meta.creation) en
  // objet Date local — jamais via `new Date(chaine)`, qui peut être interprété
  // en UTC selon le moteur et décaler le jour d'une unité près de minuit.
  function parseDateStr(s){
    if(!s) return null;
    var parts = String(s).split("-");
    if(parts.length !== 3) return null;
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
    if(!y || !m || !d) return null;
    return new Date(y, m-1, d);
  }
  function moisSuivant(mois, annee){
    mois = mois + 1;
    if(mois > 12){ mois = 1; annee = annee + 1; }
    return { mois: mois, annee: annee };
  }
  // Compare deux { mois, annee } : négatif si a < b, positif si a > b, 0 si égal.
  function compareMoisAnnee(a, b){
    if(a.annee !== b.annee) return a.annee - b.annee;
    return a.mois - b.mois;
  }
  // Cahier Sprint 5B, section 10 : installation avant le 15 du mois → essai
  // jusqu'à la fin de ce même mois civil ; à partir du 15 → essai jusqu'à la
  // fin du mois civil suivant (garantit dans tous les cas au moins deux
  // semaines pleines d'essai, le cas le plus court étant une installation le
  // 14, quel que soit le mois).
  function finEssaiPourInstallation(dateInstallation){
    var jour = dateInstallation.getDate();
    var mois = dateInstallation.getMonth()+1;
    var annee = dateInstallation.getFullYear();
    if(jour < 15) return { mois: mois, annee: annee };
    return moisSuivant(mois, annee);
  }
  // Accès expiré dès que le mois civil en cours dépasse le dernier mois
  // couvert (`moisAccesValide`) — plus de calcul en jours écoulés depuis une
  // dernière validation. Comme avant : aucune donnée n'est jamais supprimée
  // pendant qu'un renouvellement est en attente, seul l'accès est bloqué.
  function accesMensuelExpire(){
    if(!state.config.codeAccesOk) return false;
    var couverture = state.config.moisAccesValide;
    if(!couverture) return false; // état inattendu (migration en attente) : ne jamais bloquer par sécurité
    var d = new Date();
    var actuel = { mois: d.getMonth()+1, annee: d.getFullYear() };
    return compareMoisAnnee(actuel, couverture) > 0;
  }

  /* ================= Calculs ================= */

  function sortByDateDesc(arr){
    return arr.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts||0) - (a.ts||0);
    });
  }

  function dateFromStr(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }

  function getDayRange(d){ var k = dateKey(d); return { start:k, end:k }; }
  function getWeekRange(d){
    var day = d.getDay();
    var diffLundi = (day === 0) ? -6 : (1 - day);
    var lundi = new Date(d); lundi.setDate(d.getDate() + diffLundi);
    var dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6);
    return { start: dateKey(lundi), end: dateKey(dimanche) };
  }
  function getMonthRange(d){
    var premier = new Date(d.getFullYear(), d.getMonth(), 1);
    var dernier = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: dateKey(premier), end: dateKey(dernier) };
  }
  function rangeForPeriode(periode, ref){
    if(periode === "semaine") return getWeekRange(ref);
    if(periode === "mois") return getMonthRange(ref);
    return getDayRange(ref);
  }
  function inRange(dateStr, range){ return !!dateStr && dateStr >= range.start && dateStr <= range.end; }
  function filterRange(arr, range){ return arr.filter(function(x){ return inRange(x.date, range); }); }
  function sumBy(arr, fn){ return arr.reduce(function(s,x){ return s + (Number(fn(x)) || 0); }, 0); }

  // Cahier des charges Sprint 5A, section 4 : Transport rejoint la Mèche —
  // aucun des deux ne pèse plus sur les charges, le solde net ou le bénéfice de
  // Coiffure (payés par la cliente). Seules les Charges communes du salon
  // restent une charge réelle. Les deux restent enregistrés sur chaque
  // prestation pour la traçabilité, et restent visibles comme blocs informatifs
  // sur Aujourd'hui.
  function recetteCoiffure(range){
    return recettesPeriode(range);
  }

  /* ----- Sprint 8C : crédit clientes (comptabilité de trésorerie) ----- */
  // La recette compte le jour où l'argent est reçu : le montant payé le jour
  // de la prestation (mainOeuvre) à la date de la prestation, chaque
  // encaissement ultérieur à sa propre date. Le reste dû n'entre dans aucun
  // calcul tant qu'il n'est pas reçu. FONCTION UNIQUE de recettes : toutes les
  // sommes de recettes (Main d'œuvre, Disponible, épargne, résultat net,
  // rémunérations, Télécharger…) passent par elle. Sans aucun crédit, elle
  // donne exactement la même somme qu'au 8B (Σ mainOeuvre).
  function recettesPeriode(range, act){
    var total = sumBy(filterRange(state.prestationsCoiffure, range).filter(function(p){
      return !act || activiteDe(p) === act;
    }), function(p){ return p.mainOeuvre; });
    var enc = state.encaissementsCredit || [];
    if(enc.length){
      total += sumBy(enc.filter(function(e){
        if(!e || !inRange(e.date, range)) return false;
        if(!act) return true;
        var p = prestationParId(e.prestationId);
        return activiteDe(p || {}) === act;
      }), function(e){ return e.montant; });
    }
    return total;
  }
  function prestationParId(id){
    var l = state.prestationsCoiffure;
    for(var i=0;i<l.length;i++) if(l[i] && l[i].id === id) return l[i];
    return null;
  }
  // Crédit d'une prestation (null si payée en entier ou donnée illisible).
  function creditDe(p){
    var c = p && p.credit;
    return (c && typeof c === "object" && Number(c.prixTotal) > 0) ? c : null;
  }
  function encaissementsDe(prestationId){
    return (state.encaissementsCredit || []).filter(function(e){ return e && e.prestationId === prestationId; });
  }
  function totalEncaissementsDe(prestationId){ return sumBy(encaissementsDe(prestationId), function(e){ return e.montant; }); }
  // Déjà reçu pour une prestation : payé le jour même + encaissements.
  function dejaRecuPrestation(p){ return (Number(p.mainOeuvre) || 0) + totalEncaissementsDe(p.id); }
  // Reste dû = prix total − payé le jour de la prestation − Σ encaissements.
  function resteDuCredit(p){
    var c = creditDe(p);
    if(!c) return 0;
    return Math.max(0, Math.round(Number(c.prixTotal) - dejaRecuPrestation(p)));
  }
  function statutCredit(p){
    var c = creditDe(p);
    if(!c) return null;
    if(c.statut === "abandonne") return "abandonne";
    return resteDuCredit(p) <= 0 ? "solde" : "en_cours";
  }
  // Garde le statut enregistré en accord avec les montants (sauf abandon).
  function majStatutCredit(p){
    var c = creditDe(p);
    if(!c || c.statut === "abandonne") return;
    c.statut = resteDuCredit(p) <= 0 ? "solde" : "en_cours";
  }
  function creditsEnCours(){
    return state.prestationsCoiffure.filter(function(p){ return statutCredit(p) === "en_cours"; });
  }
  function totalAEncaisser(){ return sumBy(creditsEnCours(), resteDuCredit); }
  function nbClientesEnCours(){
    var vu = {};
    creditsEnCours().forEach(function(p){ vu[String(creditDe(p).clienteNom || "").trim().toLowerCase()] = 1; });
    return Object.keys(vu).length;
  }
  function aDejaUnCredit(){ return state.prestationsCoiffure.some(function(p){ return !!creditDe(p); }); }
  function libelleClientes(n){ return n + (n > 1 ? " clientes" : " cliente"); }
  // Mes habitudes (statistiques d'activité) : prix total d'une prestation à
  // crédit, sinon la Main d'œuvre — identique au 8B sans crédit.
  function montantActivitePrestation(p){
    var c = creditDe(p);
    return c ? Number(c.prixTotal) : p.mainOeuvre;
  }
  function encaissementsPeriode(range, act){
    return (state.encaissementsCredit || []).filter(function(e){
      if(!e || !inRange(e.date, range)) return false;
      if(!act) return true;
      return activiteDe(prestationParId(e.prestationId) || {}) === act;
    });
  }
  function transportPeriode(range){
    return sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.transport||0; });
  }
  function mechePeriode(range){
    return sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.coutMeches||0; });
  }
  function chargesCommunesTotal(range){
    return sumBy(filterRange(state.autresCharges, range), function(c){ return c.montant; });
  }
  // Sprint 7 (observations terrain, confirmé par Hamadou) : le Solde net de
  // « Mon état » (et de l'aperçu Télécharger, même notion) déduit désormais à
  // la fois l'Épargne et les Charges communes de la Main d'œuvre — et non plus
  // les seules Charges communes. Les Charges communes restent affichées telles
  // quelles dans la mini-rangée de stats sous ce solde, à titre d'information,
  // même si elles n'apparaissent plus isolément dans le calcul. Ce changement
  // ne touche pas « Disponible aujourd'hui » sur l'écran Aujourd'hui, qui reste
  // Main d'œuvre − Charges communes − Épargne (formule inchangée, déjà
  // équivalente arithmétiquement, mais gardée comme fonction séparée pour ne
  // jamais coupler par erreur les deux écrans si l'un venait à évoluer seul).
  function soldeNetPeriode(range){
    return recetteCoiffure(range) - epargnePeriode(range) - chargesCommunesTotal(range);
  }
  function soldeNetJour(dateStr){ return soldeNetPeriode({ start:dateStr, end:dateStr }); }

  function allActivityDates(){
    var set = {};
    state.prestationsCoiffure.forEach(function(p){ if(p.date) set[p.date] = 1; });
    state.autresCharges.forEach(function(c){
      if(c.date) set[c.date] = 1;
      // Sprint 8A : une charge saisie pour un mois antérieur (mois concerné)
      // rend ce mois consultable dans Mon état, même sans autre donnée.
      if(c.moisConcerne) set[c.moisConcerne + "-01"] = 1;
    });
    return Object.keys(set).sort();
  }

  // Observations terrain : ne jamais permettre de remonter, dans « Mon état »,
  // « Mes habitudes » ou « Télécharger », au-delà de la semaine ou du mois où
  // la toute première donnée (prestation ou charge) a été enregistrée — pour
  // éviter un défilement infini vers des périodes vides.
  function earliestActivityWeekStart(){
    var dates = allActivityDates();
    if(!dates.length) return getWeekRange(new Date()).start;
    return getWeekRange(dateFromStr(dates[0])).start;
  }
  function earliestActivityMonthStart(){
    var dates = allActivityDates();
    if(!dates.length) return getMonthRange(new Date()).start;
    return getMonthRange(dateFromStr(dates[0])).start;
  }

  // Cahier des charges Sprint 5A, section 5 : l'épargne est un pourcentage de
  // la Main d'œuvre (recette brute) — plus du solde net comme sur Trépor/Salon
  // F — donc simplement proportionnelle et additive sur une période, sans avoir
  // besoin de raisonner jour par jour.
  // Amendement (observations terrain) : le mode « Manuel » devient, comme sur
  // Trépor, un montant fixe visé chaque jour où au moins une prestation a été
  // enregistrée — jamais un pourcentage libre. Le mode « Auto » reste un
  // pourcentage de la Main d'œuvre, mais limité aux trois scénarios (10/20/30 %).
  function joursActifsDansPeriode(range){
    var set = {};
    state.prestationsCoiffure.forEach(function(p){
      if(inRange(p.date, range)) set[p.date] = 1;
    });
    return Object.keys(set).length;
  }
  function epargnePeriode(range){
    if(!state.objectifEpargne) return 0;
    var o = state.objectifEpargne;
    if(o.type === "manuel"){
      return joursActifsDansPeriode(range) * (o.montant || 0);
    }
    return recetteCoiffure(range) * (o.pourcentage || 0) / 100;
  }
  function epargneJour(dateStr){ return epargnePeriode({ start:dateStr, end:dateStr }); }

  // Sprint 7 (observations terrain) : 4 modèles d'objectif d'épargne, repris du
  // format de l'écran « Mon objectif » de Trépor mais adaptés au métier de la
  // coiffure — utilisés pour l'étape « Vous mettez de côté pour quoi ? » avant
  // le choix Auto/Manuel, et pour l'habillage (icônes fantômes) des 2
  // emplacements verrouillés.
  // Sprint 7 (retouches suite au test du Sprint 6) : les modèles Véhicule et
  // Filet de sécurité sont remplacés par deux modèles plus proches du métier
  // de la coiffure — Matériel de coiffure et Fauteuil & aménagement. Famille
  // et Épargne libre restent inchangés. Les objectifs déjà créés sous
  // l'ancien modèle gardent leur emoji/nom d'origine (déjà enregistrés en
  // state, non recalculés) : aucune migration nécessaire.
  var OBJECTIF_MODELES = [
    { id:"materiel", emoji:"🪮", nom:"Matériel de coiffure", desc:"Sèche-cheveux, kit d’installation, petit matériel" },
    { id:"fauteuil", emoji:"🪑", nom:"Fauteuil & aménagement", desc:"Fauteuil de coiffure, comptoir, aménagement du salon" },
    { id:"famille", emoji:"👨‍👩‍👧", nom:"Famille", desc:"Mariage, scolarité, santé" },
    { id:"libre", emoji:"💰", nom:"Épargne libre", desc:"Juste mettre de côté, sans montant précis" }
  ];
  function findObjectifModele(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++) if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    return null;
  }
  // Emoji affiché pour l'épargne (tuile Aujourd'hui, raccourci d'en-tête, carte
  // objectif active) : celui du modèle choisi à la création si disponible,
  // sinon 💰 par défaut (objectifs créés avant ce sprint, ou modèle non choisi).
  function epargneEmoji(){
    return (state.objectifEpargne && state.objectifEpargne.emoji) || "💰";
  }

  /* ================= Sprint 8A : calculs mensuels du mode Salon ================= */

  // Chaîne de calcul (amendement n°1, section 7, étapes 1 à 4) :
  //   Recettes du mois − Charges du mois − Fonds de renouvellement du mois
  //   = Résultat net du mois.
  // Les étapes 5 à 8 (rémunérations, épargne mensuelle, reste) arrivent au
  // Sprint 8B et partiront de ce même résultat net.
  // En mode À domicile, aucune de ces fonctions n'intervient : les calculs du
  // Sprint 7bis (par date) restent les seuls utilisés.

  function estModeSalon(){ return state.config.modeTravail === "salon"; }

  // Mois sous forme de clé "AAAA-MM" (même format que autresCharges[].moisConcerne).
  function moisCleDe(dateStr){ return String(dateStr||"").slice(0,7); }
  function moisCourantCle(){ return moisCleDe(todayStr()); }
  function decalerMoisCle(cle, delta){
    var y = parseInt(cle.slice(0,4),10), m = parseInt(cle.slice(5,7),10) - 1 + delta;
    var d = new Date(y, m, 1);
    return d.getFullYear() + "-" + pad2(d.getMonth()+1);
  }
  function rangeDuMoisCle(cle){
    return getMonthRange(new Date(parseInt(cle.slice(0,4),10), parseInt(cle.slice(5,7),10)-1, 1));
  }
  function libelleMoisCle(cle){
    return MOIS_NOMS[parseInt(cle.slice(5,7),10)-1] + " " + cle.slice(0,4);
  }
  function libelleMoisCleMaj(cle){ var s = libelleMoisCle(cle); return s.charAt(0).toUpperCase() + s.slice(1); }
  function nomMoisSeul(cle){ return MOIS_NOMS[parseInt(cle.slice(5,7),10)-1]; }
  // « d’octobre », « d’avril », « d’août » mais « de septembre ».
  function deMois(nom){ return /^[aeiouyàâäéèêëîïôöûüh]/i.test(nom) ? "d’" + nom : "de " + nom; }

  // Mois auquel une charge est rattachée : son mois concerné (charges saisies
  // en mode Salon) ou, à défaut, le mois de sa date de saisie (toutes les
  // charges antérieures au Sprint 8A) — calculé à la volée, jamais réécrit.
  function moisDeCharge(c){ return c.moisConcerne || moisCleDe(c.date); }
  // Type de la charge : celui mémorisé à la saisie (survit à la suppression
  // d'une rubrique), sinon celui de la rubrique, sinon « charge commune ».
  function typeDeCharge(c){
    if(c.rubriqueType) return c.rubriqueType;
    return typeDeRubrique(findRubriqueCharge(c.rubriqueId));
  }
  function chargesDuMois(cle){
    return state.autresCharges.filter(function(c){ return moisDeCharge(c) === cle; });
  }
  function recettesMois(cle){ return recetteCoiffure(rangeDuMoisCle(cle)); }

  // ----- Fonds de renouvellement des produits -----
  // Versionné par mois : modifier le fonds en octobre ne réécrit jamais la
  // prévision de septembre (le résultat net d'un mois terminé est définitif).
  function versionsFonds(){
    var f = state.config.fondsRenouvellement;
    if(!f) return [];
    var v = (f.historique || []).slice();
    v.push({ depuis: f.depuis, mode: f.mode, valeur: f.valeur });
    return v.sort(function(a,b){ return a.depuis < b.depuis ? -1 : (a.depuis > b.depuis ? 1 : 0); });
  }
  function versionFondsPourMois(cle){
    var res = null;
    versionsFonds().forEach(function(v){ if(v.depuis <= cle) res = v; });
    return res;
  }
  function fondsActifPourMois(cle){
    var v = versionFondsPourMois(cle);
    return !!(v && Number(v.valeur) > 0);
  }
  // Prévision du mois : montant fixe, ou pourcentage des recettes du mois
  // (arrondi au franc — FCFA sans décimale, et pour que Recettes − Charges −
  // Fonds affichés tombent toujours juste sur le résultat net affiché).
  function previsionFondsMois(cle){
    var v = versionFondsPourMois(cle);
    if(!v || !(Number(v.valeur) > 0)) return 0;
    if(v.mode === "pourcentage") return Math.round(recettesMois(cle) * Number(v.valeur) / 100);
    return Math.round(Number(v.valeur));
  }
  function achatsProduitsMois(cle, typeFiltre){
    return sumBy(chargesDuMois(cle).filter(function(c){
      var t = typeDeCharge(c);
      return typeFiltre ? t === typeFiltre : estTypeProduits(t);
    }), function(c){ return c.montant; });
  }
  // Solde du fonds = prévisions cumulées (du premier mois du fonds jusqu'au
  // mois en cours) − achats de produits payés par le fonds.
  function soldeFonds(){
    var v = versionsFonds();
    if(!v.length) return { configure:false, actif:false, previsions:0, achats:0, solde:0 };
    var debut = v[0].depuis, fin = moisCourantCle();
    var previsions = 0;
    for(var m = debut, garde = 0; m <= fin && garde < 600; m = decalerMoisCle(m, 1), garde++){
      previsions += previsionFondsMois(m);
    }
    var achats = sumBy(state.autresCharges.filter(function(c){
      var mc = moisDeCharge(c);
      return mc >= debut && estTypeProduits(typeDeCharge(c)) && fondsActifPourMois(mc);
    }), function(c){ return c.montant; });
    return { configure:true, actif: fondsActifPourMois(fin), previsions: previsions, achats: achats, solde: previsions - achats };
  }

  // ----- Charges du mois -----
  // Pèsent sur le résultat net : toutes les charges du mois (loyer, CIE,
  // SODECI, Mairie, BURIDA, remboursements de crédit, autres), sauf les
  // achats de produits quand un fonds est actif ce mois-là — ils sont alors
  // payés par le fonds, jamais comptés une seconde fois. Sans fonds actif, un
  // achat de produits reste une charge ordinaire : une dépense réelle ne
  // disparaît jamais du résultat.
  function chargesComptees(cle){
    var actif = fondsActifPourMois(cle);
    return chargesDuMois(cle).filter(function(c){ return !(actif && estTypeProduits(typeDeCharge(c))); });
  }
  function chargesMoisTotal(cle){ return sumBy(chargesComptees(cle), function(c){ return c.montant; }); }

  // Résultat net du mois — provisoire pendant le mois, définitif ensuite.
  function resultatNetMois(cle){
    var recettes = recettesMois(cle);
    var charges = chargesMoisTotal(cle);
    var fonds = previsionFondsMois(cle);
    return {
      mois: cle, recettes: recettes, charges: charges, fonds: fonds,
      resultatNet: recettes - charges - fonds,
      provisoire: cle >= moisCourantCle()
    };
  }

  // Jauge « Charges du mois à couvrir » (fonds produits compris) : simple repère, rien n'est
  // déduit. Pourcentage arrondi à l'inférieur pour ne jamais afficher 100 %
  // tant que les recettes ne couvrent pas réellement tout.
  function jaugeMois(cle){
    var r = resultatNetMois(cle);
    var aCouvrir = r.charges + r.fonds;
    var pct = aCouvrir > 0 ? Math.min(100, Math.floor(r.recettes / aCouvrir * 100)) : 0;
    return { aCouvrir: aCouvrir, recettes: r.recettes, pct: pct, couvert: aCouvrir > 0 && r.recettes >= aCouvrir, reste: Math.max(0, aCouvrir - r.recettes) };
  }

  // ----- Remboursement de crédit -----
  function findCredit(rubriqueId){
    var list = state.config.credits || [];
    for(var i=0;i<list.length;i++) if(list[i].rubriqueId === rubriqueId) return list[i];
    return null;
  }
  // Remboursé = remboursements saisis depuis la première saisie (point de
  // départ du crédit) ; Reste dû = montant total − remboursé, si un montant
  // total a été indiqué.
  function bilanCredit(credit){
    var rembourse = sumBy(state.autresCharges.filter(function(c){
      if(c.rubriqueId !== credit.rubriqueId) return false;
      if(c.ts && credit.tsDebut) return c.ts >= credit.tsDebut;
      return (c.date || "") >= (credit.dateDebut || "");
    }), function(c){ return c.montant; });
    var total = Number(credit.montantTotal) > 0 ? Number(credit.montantTotal) : null;
    return {
      rembourse: rembourse,
      total: total,
      resteDu: total !== null ? Math.max(0, total - rembourse) : null,
      pct: total !== null ? Math.min(100, Math.floor(rembourse / total * 100)) : null,
      solde: total !== null && rembourse >= total
    };
  }

  // ----- Rubriques selon le mode -----
  function rubriquesPourMode(seulementActives){
    var salon = estModeSalon();
    var source = state.config.rubriquesCharges;
    var list = source.filter(function(r){
      var p = porteeRubrique(r);
      if(salon ? p === "domicile" : p === "salon") return false;
      return seulementActives ? !!r.actif : true;
    });
    if(!salon) return list;
    var pos = {};
    source.forEach(function(r, i){ pos[r.id] = i; });
    var rangCredit = ORDRE_RUBRIQUES_SALON.indexOf("credit");
    function rang(r){
      var i = ORDRE_RUBRIQUES_SALON.indexOf(r.id);
      if(i !== -1) return i;
      if(typeDeRubrique(r) === "credit") return rangCredit + 0.001 * (pos[r.id] + 1);
      return 100 + pos[r.id];
    }
    return list.slice().sort(function(a,b){ return rang(a) - rang(b); });
  }

  // ----- Reprise des charges du mois précédent -----
  // À l'ouverture d'un nouveau mois (mode Salon), chaque rubrique payée le
  // mois précédent est proposée avec le même montant, à confirmer ou
  // modifier (la CIE et la SODECI varient) — jamais créée automatiquement.
  // Exclus : achats de produits (ponctuels, payés par le fonds), rubriques
  // supprimées, désactivées ou propres au mode À domicile, rubriques déjà
  // saisies ce mois-ci, propositions déjà confirmées ou ignorées.
  function reprisesEnAttente(cle){
    cle = cle || moisCourantCle();
    var prec = decalerMoisCle(cle, -1);
    var traitees = (state.reprisesCharges && state.reprisesCharges[cle]) || {};
    var dejaSaisies = {};
    chargesDuMois(cle).forEach(function(c){ dejaSaisies[c.rubriqueId] = 1; });
    var parRub = {}, ids = [];
    chargesDuMois(prec).forEach(function(c){
      if(c.rubriqueSupprimee) return;
      var r = findRubriqueCharge(c.rubriqueId);
      if(!r || !r.actif || porteeRubrique(r) === "domicile") return;
      if(estTypeProduits(typeDeCharge(c))) return;
      if(dejaSaisies[c.rubriqueId] || traitees[c.rubriqueId]) return;
      if(!(c.rubriqueId in parRub)){ parRub[c.rubriqueId] = 0; ids.push(c.rubriqueId); }
      parRub[c.rubriqueId] += Number(c.montant) || 0;
    });
    var ordre = rubriquesPourMode(false).map(function(r){ return r.id; });
    ids.sort(function(a,b){ return ordre.indexOf(a) - ordre.indexOf(b); });
    return ids.map(function(id){
      return { rubrique: findRubriqueCharge(id), montant: parRub[id], moisPrecedent: prec, mois: cle };
    });
  }

  /* ================= Sprint 8B : activité, rémunérations, épargne mensuelle ================= */

  // Activité d'une prestation : toute prestation sans champ `activite`
  // (antérieure au Sprint 8B, ou saisie en mode À domicile) est « coiffure ».
  function activiteDe(p){ return p.activite === "onglerie" ? "onglerie" : "coiffure"; }
  // Sprint 8C : passe par la fonction unique de recettes (encaissements de
  // crédits rattachés à l'activité de leur prestation).
  function recettesActivite(range, act){
    return recettesPeriode(range, act);
  }

  // ----- Paramètres versionnés par mois (rémunérations, épargne mensuelle) -----
  // Même principe que le fonds de renouvellement : { mode, valeur, depuis,
  // historique[] }. Une modification s'applique au mois en cours ; les mois
  // terminés gardent la clause qui était la leur.
  function versionPourMois(param, cle){
    if(!param || !param.depuis) return null;
    var v = (param.historique || []).slice();
    v.push({ depuis: param.depuis, mode: param.mode, valeur: param.valeur });
    v.sort(function(a,b){ return a.depuis < b.depuis ? -1 : (a.depuis > b.depuis ? 1 : 0); });
    var res = null;
    v.forEach(function(x){ if(x.depuis <= cle) res = x; });
    return res;
  }
  function majParamVersionne(param, mode, valeur, cle){
    if(!param) return { mode: mode, valeur: valeur, depuis: cle, historique: [] };
    if(param.depuis === cle){ param.mode = mode; param.valeur = valeur; return param; }
    if(param.depuis < cle){
      param.historique = (param.historique || []).concat([{ depuis: param.depuis, mode: param.mode, valeur: param.valeur }]);
    } else {
      // Horloge du téléphone revenue en arrière : on remplace simplement.
      param.historique = (param.historique || []).filter(function(h){ return h.depuis < cle; });
    }
    param.depuis = cle; param.mode = mode; param.valeur = valeur;
    return param;
  }
  function versionActive(v){ return !!(v && Number(v.valeur) > 0); }

  // Salariés présents un mois donné : depuis leur mois d'arrivée (`debut`),
  // jusqu'à leur dernier mois (`fin`) s'ils ont été retirés.
  function salariesActifs(cle){
    return (state.config.salaries || []).filter(function(s){
      return s.debut <= cle && (!s.fin || cle <= s.fin);
    });
  }

  // Garde-fou (amendement, section 7 — point 2 validé) : tous les
  // pourcentages portent sur le même résultat net ; leur total ne doit pas
  // dépasser 100 %. `remplace` permet de tester une valeur avant de
  // l'enregistrer : { cible:'proprio'|'epargne'|'salarie', id, nouveau, mode, valeur }.
  function pctDe(v){ return (v && v.mode === "pourcentage") ? (Number(v.valeur) || 0) : 0; }
  function totalPourcentages(cle, remplace){
    var r = remplace || {};
    var cfg = state.config;
    var det = { proprio: 0, salaries: 0, epargne: 0 };
    det.proprio = pctDe(r.cible === "proprio" ? r : versionPourMois(cfg.remunerationProprio, cle));
    salariesActifs(cle).forEach(function(s){
      det.salaries += pctDe((r.cible === "salarie" && r.id === s.id) ? r : versionPourMois(s, cle));
    });
    if(r.cible === "salarie" && r.nouveau) det.salaries += pctDe(r);
    det.epargne = pctDe(r.cible === "epargne" ? r : versionPourMois(cfg.epargneMensuelle, cle));
    det.total = Math.round((det.proprio + det.salaries + det.epargne) * 100) / 100;
    return det;
  }
  function formatPct(v){
    var n = Math.round((Number(v) || 0) * 10) / 10;
    return String(n).replace(".", ",") + " %";
  }
  function libelleClause(v){
    if(!versionActive(v)) return "Non réglée";
    return v.mode === "pourcentage" ? (formatPct(v.valeur) + " du résultat net") : (formatFCFA(v.valeur) + " par mois");
  }
  // Message du garde-fou si la valeur testée ferait dépasser 100 %.
  function erreurGardeFou(cle, remplace){
    if(remplace.mode !== "pourcentage") return "";
    var det = totalPourcentages(cle, remplace);
    if(det.total <= 100) return "";
    var sansCible = det.total - pctDe(remplace);
    return "Le total des pourcentages passerait à " + formatPct(det.total) + " du résultat net (100 % au maximum). Il reste " + formatPct(Math.max(0, 100 - sansCible)) + " disponibles.";
  }

  // Répartition du résultat net du mois (amendement, section 7, étapes 4 à 8) :
  // Résultat net → propriétaire → chaque salarié → épargne = Reste.
  // Résultat net négatif : parts en pourcentage à zéro ; montants fixes
  // maintenus, avec une alerte douce (jamais bloquante).
  function repartitionMois(cle){
    var r = resultatNetMois(cle);
    var rn = r.resultatNet;
    var base = Math.max(0, rn);
    function part(v){
      if(!versionActive(v)) return 0;
      return v.mode === "pourcentage" ? Math.round(base * Number(v.valeur) / 100) : Math.round(Number(v.valeur));
    }
    function ligne(v){ return versionActive(v) ? { mode: v.mode, valeur: Number(v.valeur), montant: part(v) } : null; }
    var proprio = ligne(versionPourMois(state.config.remunerationProprio, cle));
    var salaries = salariesActifs(cle).map(function(s){
      var l = ligne(versionPourMois(s, cle)) || { mode: null, valeur: 0, montant: 0 };
      l.id = s.id; l.nom = s.nom;
      return l;
    });
    var epargne = ligne(versionPourMois(state.config.epargneMensuelle, cle));
    var totalRemunerations = (proprio ? proprio.montant : 0) + sumBy(salaries, function(s){ return s.montant; });
    var montantEpargne = epargne ? epargne.montant : 0;
    var reste = rn - totalRemunerations - montantEpargne;
    var lignes = [proprio, epargne].concat(salaries).filter(Boolean);
    var fixes = sumBy(lignes.filter(function(l){ return l.mode === "fixe"; }), function(l){ return l.montant; });
    var aDesPct = lignes.some(function(l){ return l.mode === "pourcentage" && l.valeur > 0; });
    var pct = totalPourcentages(cle);
    var alertes = [];
    if(rn < 0 && aDesPct) alertes.push("Résultat net négatif : les parts en pourcentage valent zéro ce mois-ci.");
    if(rn < 0 && fixes > 0) alertes.push("Les montants fixes (" + formatFCFA(fixes) + ") restent dus : le reste après rémunérations et épargne est négatif.");
    else if(rn >= 0 && fixes > 0 && reste < 0) alertes.push("Les montants fixes dépassent le résultat net : le reste après rémunérations et épargne est négatif de " + formatFCFA(Math.abs(reste)) + ".");
    if(pct.total > 100) alertes.push("Le total des pourcentages dépasse 100 % (" + formatPct(pct.total) + ").");
    return {
      mois: cle, resultat: r, resultatNet: rn,
      proprio: proprio, salaries: salaries, epargne: epargne,
      totalRemunerations: totalRemunerations, montantEpargne: montantEpargne,
      reste: reste, totalPct: pct.total, alertes: alertes
    };
  }

  // Épargne mensuelle (mode Salon) : réglée ou non pour le mois en cours,
  // montant du mois, cumul depuis la première version.
  function epargneSalonReglee(){ return versionActive(versionPourMois(state.config.epargneMensuelle, moisCourantCle())); }
  function epargneMoisSalon(cle){ return repartitionMois(cle || moisCourantCle()).montantEpargne; }
  function cumulEpargneSalon(){
    var p = state.config.epargneMensuelle;
    if(!p) return 0;
    var v = (p.historique || []).map(function(h){ return h.depuis; }).concat([p.depuis]).sort();
    var total = 0, fin = moisCourantCle();
    for(var m = v[0], garde = 0; m <= fin && garde < 600; m = decalerMoisCle(m, 1), garde++) total += epargneMoisSalon(m);
    return total;
  }

    var mainOeuvreCoiffure = recettesActivite(range, "coiffure");

    var detailActivites = recetteOnglerie > 0 ? " · dont onglerie " + formatFCFA(recetteOnglerie) : "";

        '<span class="rb-chev">›</span>' +

    // Sprint 8D : tuile « Main d'œuvre » (comme en mode À domicile) = argent

        '<div class="db-label">Crédit clientes</div>' +
        '<div class="db-mini" data-test="credit-nb-clientes">' + (nbCl ? libelleClientes(nbCl) : "Aucun en cours") + '</div>' +
