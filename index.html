                '<div class="rr-actions">' +
                  '<input type="number" inputmode="numeric" min="0" step="1" class="input" id="f-reprise-' + esc(id) + '" value="' + esc(val) + '" data-action-change="capture-reprise" data-id="' + esc(id) + '" aria-label="Montant pour ' + esc(nomMoisSeul(cle)) + '">' +
                  '<button type="button" class="btn btn-primary" data-action="reprise-confirmer" data-id="' + esc(id) + '">Confirmer</button>' +
                  '<button type="button" class="btn btn-secondary" data-action="reprise-ignorer" data-id="' + esc(id) + '">Ignorer</button>' +
                '</div>' +
                fieldErr("reprise-" + id) +
              '</div>'
            );
          }).join("") +
          (reprises.length > 1 ? '<button type="button" class="btn btn-secondary" data-action="reprise-tout-confirmer">✓ Tout confirmer</button>' : '') +
        '</div>';
    }
    html += renderJaugeCard(cle, false);

    // Sprint 8D : deux listes. « Charges d'octobre » = la prévision du fonds
    // produits en tête, puis les charges comptées : elle tombe juste sur le
    // total de la jauge. « Achats de produits payés par le fonds » : déjà
    // couverts par la prévision, listés à part, jamais ajoutés une seconde fois.
    var nomM = nomMoisSeul(cle);
    var actifFonds = fondsActifPourMois(cle);
    var sf = soldeFonds();
    var prevision = previsionFondsMois(cle);
    var vFonds = versionFondsPourMois(cle);
    var parDate = function(a,b){ return (b.ts||0) - (a.ts||0); };
    var comptees = chargesComptees(cle).slice().sort(parDate);
    var achatsFonds = actifFonds
      ? chargesDuMois(cle).filter(function(c){ return estTypeProduits(typeDeCharge(c)); }).sort(parDate)
      : [];
    function carteCharge(c, neutre){
      var sub = "Saisie le " + formatDateFr(c.date) + (c.note ? " · " + c.note : "");
      return (
        '<button type="button" class="entry-card" style="width:100%; margin-bottom:8px;" data-action="voir-charge-mois" data-id="' + esc(c.id) + '" data-test="' + (neutre ? "achat-fonds" : "charge-comptee") + '">' +
          '<div class="entry-ico">' + esc(c.rubriqueEmoji || "📝") + '</div>' +
          '<div class="entry-main"><div class="entry-title">' + esc(c.rubriqueNom) + '</div>' +
            '<div class="entry-sub">' + esc(sub) + '</div></div>' +
          '<div class="entry-amount' + (neutre ? " neutre" : "") + '">' + formatFCFA(c.montant) + '</div>' +
        '</button>'
      );
    }
    var ligneFonds;
    if(actifFonds){
      // Réglée dans Réglages, non modifiable ici : au toucher, la fenêtre du
      // fonds produits (solde, achats, « Régler le fonds »).
      ligneFonds =
        '<button type="button" class="entry-card" style="width:100%; margin-bottom:8px;" data-action="voir-fonds" data-test="ligne-prevision-fonds">' +
          '<div class="entry-ico ico-turq">🧴</div>' +
          '<div class="entry-main"><div class="entry-title et-wrap">Fonds produits — prévision ' + esc(deMois(nomM)) + '</div>' +
            '<div class="entry-sub">' + (vFonds && vFonds.mode === "pourcentage" ? esc(formatPct(vFonds.valeur)) + " des recettes · réglée dans Réglages" : "Réglée dans Réglages") + '</div></div>' +
          '<div class="entry-amount">' + formatFCFA(prevision) + '</div>' +
        '</button>';
    } else {
      ligneFonds =
        '<button type="button" class="charges-row charges-row-vide" style="margin-bottom:8px;" data-action="voir-fonds" data-test="ligne-prevision-fonds">' +
          '<span class="cr-emoji t-turq">🧴</span><span class="cr-label">Fonds produits · ' + (sf.configure ? "arrêté ce mois" : "non réglé") + '</span><span class="cr-chev" aria-hidden="true">›</span>' +
        '</button>';
    }
    var totalCharges = prevision + chargesMoisTotal(cle);
    html += '<div class="reglages-section" data-test="liste-charges-mois"><div class="rs-title">Charges ' + esc(deMois(nomM)) + '</div>' +
      ligneFonds +
      comptees.map(function(c){ return carteCharge(c, false); }).join("") +
      (comptees.length || actifFonds
        ? '<div class="total-liste" data-test="total-charges-mois"><span>Total des charges ' + esc(deMois(nomM)) + '</span><b>' + formatFCFA(totalCharges) + '</b></div>'
        : '<div class="hint tight">Aucune charge saisie pour ' + esc(nomM) + ' pour l’instant.</div>') +
      '<button type="button" class="btn btn-secondary" style="margin-top:10px;" data-action="add-autre-charge">+ Ajouter une charge</button>' +
    '</div>';
    if(achatsFonds.length){
      html += '<div class="reglages-section" data-test="liste-achats-fonds"><div class="rs-title">Achats de produits payés par le fonds</div>' +
        '<div class="hint tight" style="margin:-2px 0 10px;">Déjà couverts par la prévision du fonds produits : ils ne s’ajoutent pas aux charges.</div>' +
        achatsFonds.map(function(c){ return carteCharge(c, true); }).join("") +
      '</div>';
    }
    html += '<div class="hint" style="margin-top:-8px;" data-test="aide-charges-mois">' + (actifFonds
      ? "Les charges sont déduites du résultat net du mois, jamais au jour le jour. Les achats de produits sont payés par le fonds produits."
      : "Les charges sont déduites du résultat net du mois, jamais au jour le jour. Sans fonds produits ce mois-ci, les achats de produits comptent comme des charges du mois.") + '</div>';
    return html;
  }

  /* ================= Formulaire F5 : Prestations coiffure ================= */

  function optionsFor(name, selectedId){
    var list = findList(name);
    var opts = list.map(function(it){
      return '<option value="' + it.id + '"' + (it.id===selectedId?" selected":"") + '>' + esc(it.nom) + '</option>';
    }).join("");
    opts += '<option value="__new__"' + (selectedId==="__new__"?" selected":"") + '>+ Autre…</option>';
    return opts;
  }
  function fieldErr(key){
    return ui.errors[key] ? '<div class="field-error">' + esc(ui.errors[key]) + '</div>' : "";
  }
  function captureDraft(fieldIds){
    fieldIds.forEach(function(id){
      var el = byId(id);
      if(el) ui.draft[id] = el.value;
    });
  }

  function renderChampLieu(lieu){
    return (
      '<div class="field"><div class="label">Lieu de la prestation <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (lieu==="domicile"?" active":"") + '" data-action="set-lieu-coiffure" data-val="domicile">🏠 À domicile</button>' +
          '<button type="button" class="radio-opt' + (lieu==="salon"?" active":"") + '" data-action="set-lieu-coiffure" data-val="salon">💈 En salon</button>' +
        '</div>' +
      '</div>'
    );
  }

  // Sprint 8B (amendement, section 8) : en mode Salon, menu « Activité »
  // en tête du formulaire. Onglerie = activité, montant et date, rien d'autre.
  // Sprint 8C : le même formulaire sert à la saisie et à la modification ;
  // en modification, l'activité de l'enregistrement corrigé fait foi.
  function estModifPrestation(){ return !!ui.modal && ui.modal.type === "edit-coiffure"; }
  function prestationEnCorrection(){ return estModifPrestation() ? prestationParId(ui.modal.id) : null; }
  function activiteBrouillon(){
    if(estModifPrestation()) return ui.draft["f-activite"] === "onglerie" ? "onglerie" : "coiffure";
    return (estModeSalon() && ui.draft["f-activite"] === "onglerie") ? "onglerie" : "coiffure";
  }
  function renderChampActivite(act){
    return (
      '<div class="field"><div class="label">Activité <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (act==="coiffure"?" active":"") + '" data-action="set-activite" data-val="coiffure">💇 Coiffure</button>' +
          '<button type="button" class="radio-opt' + (act==="onglerie"?" active":"") + '" data-action="set-activite" data-val="onglerie">💅 Onglerie</button>' +
        '</div>' +
      '</div>'
    );
  }

  // ----- Sprint 8C : « Payé : En entier / À crédit » -----
  function paiementBrouillon(){ return ui.draft["f-paiement"] === "credit" ? "credit" : "entier"; }
  function renderChampPaiement(){
    var pay = paiementBrouillon();
    var p = prestationEnCorrection();
    // Une prestation qui a déjà des encaissements reste à crédit (sinon ces
    // sommes seraient comptées deux fois).
    var verrou = !!(p && creditDe(p) && encaissementsDe(p.id).length);
    return (
      '<div class="field"><div class="label">Payé <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (pay==="entier"?" active":"") + '" data-action="set-paiement" data-val="entier" data-test="paye-entier"' + (verrou ? " disabled" : "") + '>💵 En entier</button>' +
          '<button type="button" class="radio-opt opt-credit' + (pay==="credit"?" active":"") + '" data-action="set-paiement" data-val="credit" data-test="paye-credit">🤝 À crédit</button>' +
        '</div>' +
        (verrou ? '<div class="field-note">Cette prestation a déjà des encaissements : elle reste à crédit.</div>' : '') +
      '</div>'
    );
  }
  // « Déjà payé aujourd'hui » — ou « le JJ/MM » si la prestation est datée
  // d'un autre jour (c'est ce jour-là que ce montant compte).
  function libelleDejaPaye(){
    var d = ui.draft["f-date"] || todayStr();
    return d === todayStr() ? "Déjà payé aujourd’hui (FCFA)" : "Déjà payé le " + formatDateFr(d).slice(0, 5) + " (FCFA)";
  }
  function majLibelleDejaPaye(){
    var el = byId("lbl-deja-paye");
    if(el) el.textContent = libelleDejaPaye();
  }
  function renderChampsCredit(){
    var d = ui.draft;
    var p = prestationEnCorrection();
    var enc = p ? totalEncaissementsDe(p.id) : 0;
    return (
      '<div class="bloc-credit">' +
        '<div class="field"><div class="label">Nom de la cliente <span class="req">*</span></div>' +
          '<input type="text" class="input" id="f-clienteNom" autocomplete="off" placeholder="Ex. Aïcha" value="' + esc(d["f-clienteNom"]||"") + '" data-action-change="capture-coiffure">' +
          fieldErr("clienteNom") +
        '</div>' +
        '<div class="field"><div class="label">Prix de la prestation (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-prixCredit" value="' + esc(d["f-prixCredit"]||"") + '" data-action-change="capture-coiffure">' +
          fieldErr("prixCredit") +
        '</div>' +
        '<div class="field"><div class="label"><span id="lbl-deja-paye">' + esc(libelleDejaPaye()) + '</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-dejaPaye" placeholder="0" value="' + esc(d["f-dejaPaye"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">' + (enc > 0 ? "Encaissements déjà reçus après la prestation : " + esc(montantInsecable(enc)) + ". " : "") +
            "Seul l’argent reçu compte dans vos recettes ; le reste dû est suivi dans « Crédit clientes »." + '</div>' +
          fieldErr("dejaPaye") +
        '</div>' +
      '</div>'
    );
  }
  function boutonEnregistrerPrestation(){
    return estModifPrestation()
      ? '<button type="button" class="btn btn-primary" data-action="enregistrer-modif-coiffure">Enregistrer les modifications</button>'
      : '<button type="button" class="btn btn-primary" data-action="enregistrer-coiffure">Enregistrer</button>';
  }

  function renderFormOnglerie(){
    var d = ui.draft;
    var credit = paiementBrouillon() === "credit";
    return (
      '<div>' +
        (estModeSalon() ? renderChampActivite("onglerie") : '') +
        renderChampPaiement() +
        (credit ? renderChampsCredit() :
          '<div class="field"><div class="label">Montant (FCFA) <span class="req">*</span></div>' +
            '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-montantOnglerie" value="' + esc(d["f-montantOnglerie"]||"") + '" data-action-change="capture-coiffure">' +
            fieldErr("montantOnglerie") +
          '</div>') +
        '<div class="field"><div class="label">Date <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-coiffure">' +
          fieldErr("date") +
        '</div>' +
        (estModifPrestation() ? renderNoteMoisPasse() : '') +
        boutonEnregistrerPrestation() +
      '</div>'
    );
  }

  function renderFormCoiffure(){
    if(activiteBrouillon() === "onglerie") return renderFormOnglerie();
    var d = ui.draft;
    var clienteSel = d["f-clienteSel"] || "";
    var quartierSel = d["f-quartierSel"] || "";
    var typesSel = d.typesCoiffureSel || [];
    var showNouveauType = !!d.showNouveauTypeCoiffure;
    var credit = paiementBrouillon() === "credit";
    // Sprint 8A : en mode Salon, la prestation est par défaut « En salon » ;
    // « À domicile » reste possible (quartier, transport — amendement,
    // section 2). En mode À domicile, défaut inchangé.
    var lieu = d["f-lieu"] || lieuParDefaut();
    var chips = state.config.typesCoiffure.map(function(t){
      var active = typesSel.indexOf(t.id) !== -1;
      return '<button type="button" class="chip' + (active?" active":"") + '" data-action="toggle-coiffure-type" data-id="' + t.id + '">' + esc(t.nom) + '</button>';
    }).join("");
    chips += '<button type="button" class="chip dashed" data-action="toggle-nouveau-type-coiffure">+ Personnalisé</button>';

    return (
      '<div>' +
        (estModeSalon() ? renderChampActivite("coiffure") : '') +
        '<div class="field"><div class="label">Date de la prestation <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-coiffure">' +
          fieldErr("date") +
        '</div>' +
        '<div class="field"><div class="label">Type de cliente <span class="req">*</span></div>' +
          '<select class="select" id="f-clienteSel" data-action-change="cliente-change">' + optionsFor("typesCliente", clienteSel) + '</select>' +
          (clienteSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-clienteNouveauNom" placeholder="Nouveau type de cliente" value="' + esc(d["f-clienteNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("cliente") +
        '</div>' +
        renderChampLieu(lieu) +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Quartier <span class="req">*</span></div>' +
          '<select class="select" id="f-quartierSel" data-action-change="quartier-change">' + optionsFor("quartiers", quartierSel) + '</select>' +
          (quartierSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-quartierNouveauNom" placeholder="Nom du quartier" value="' + esc(d["f-quartierNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("quartier") +
        '</div>' : '') +
        '<div class="field"><div class="label">Type(s) de coiffure</div>' +
          '<div class="chip-wrap">' + chips + '</div>' +
          (showNouveauType ? '<div class="inline-new"><input type="text" class="input" id="f-nouveauTypeCoiffure" placeholder="Ex. Vanilles" value="' + esc(d["f-nouveauTypeCoiffure"]||"") + '" data-autofocus data-action-change="capture-coiffure">' +
            '<button type="button" class="btn btn-secondary" data-action="ajouter-type-coiffure">Ajouter</button></div>' : '') +
        '</div>' +
        renderChampPaiement() +
        (credit ? renderChampsCredit() :
        '<div class="field"><div class="label">Main d’œuvre gardée (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-mainOeuvre" value="' + esc(d["f-mainOeuvre"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">' + (estModeSalon() ? "Recette du salon pour cette prestation (hors mèche et transport)." : "Ce que vous gardez réellement pour vous.") + '</div>' +
          fieldErr("mainOeuvre") +
        '</div>') +
        '<div class="field"><div class="label">Coût des mèches (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-coutMeches" placeholder="0" value="' + esc(d["f-coutMeches"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Transport (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-transport" placeholder="0" value="' + esc(d["f-transport"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' : '') +
        (estModifPrestation() ? renderNoteMoisPasse() : '') +
        boutonEnregistrerPrestation() +
      '</div>'
    );
  }

  function lieuParDefaut(){ return estModeSalon() ? "salon" : "domicile"; }

  var COIFFURE_FIELDS = ["f-date","f-clienteSel","f-clienteNouveauNom","f-quartierSel","f-quartierNouveauNom","f-nouveauTypeCoiffure","f-mainOeuvre","f-coutMeches","f-transport","f-montantOnglerie","f-clienteNom","f-prixCredit","f-dejaPaye"];

  // Sprint 8C : lecture + contrôles du formulaire de prestation, PARTAGÉS par
  // la saisie et la modification (mêmes contrôles, mêmes messages). Les
  // contrôles du 8B sont repris tels quels ; s'y ajoutent ceux du crédit.
  // Renvoie { errors, act, construire() } — construire() n'est appelée
  // qu'une fois les contrôles passés (elle peut créer un type de cliente ou
  // un quartier personnalisé, comme avant).
  function lireFormulairePrestation(){
    captureDraft(COIFFURE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var act = activiteBrouillon();
    var date = d["f-date"] || todayStr();
    var credit = paiementBrouillon() === "credit";
    var p = prestationEnCorrection();
    var enc = p ? encaissementsDe(p.id) : [];
    var totalEnc = sumBy(enc, function(e){ return e.montant; });
    if(!date) errors.date = "Choisissez une date.";
    else if(enc.length){
      var premiere = enc.map(function(e){ return e.date; }).sort()[0];
      if(date > premiere) errors.date = "Cette prestation a un encaissement le " + formatDateFr(premiere) + " : sa date ne peut pas être postérieure.";
    }

    var montantRecu = 0, creditObj;
    if(credit){
      var nom = String(d["f-clienteNom"]||"").trim();
      var brutPrix = String(d["f-prixCredit"]||"").trim();
      var prix = toNum(brutPrix);
      var brutDeja = String(d["f-dejaPaye"]===undefined || d["f-dejaPaye"]===null ? "" : d["f-dejaPaye"]).trim();
      var deja = brutDeja === "" ? 0 : toNum(brutDeja);
      if(!nom) errors.clienteNom = "Indiquez le nom de la cliente.";
      if(!(prix > 0) || brutPrix === "") errors.prixCredit = "Indiquez le prix de la prestation.";
      if(deja < 0) errors.dejaPaye = "Indiquez un montant positif, ou laissez vide (0).";
      else if(prix > 0 && deja > prix) errors.dejaPaye = "Le montant déjà payé ne peut pas dépasser le prix de la prestation.";
      else if(prix > 0 && totalEnc > 0 && deja + totalEnc > prix){
        errors.prixCredit = "Déjà reçu pour cette prestation : " + formatFCFA(deja + totalEnc) + ". Le prix ne peut pas être inférieur.";
      }
      montantRecu = Math.round(deja);
      var ancien = p ? creditDe(p) : null;
      var abandonne = !!(ancien && ancien.statut === "abandonne");
      creditObj = {
        clienteNom: nom, prixTotal: Math.round(prix),
        statut: abandonne ? "abandonne" : (montantRecu + totalEnc >= Math.round(prix) ? "solde" : "en_cours"),
        abandonneLe: abandonne ? (ancien.abandonneLe || null) : null
      };
    }

    if(act === "onglerie"){
      if(!credit){
        var montant = toNum(d["f-montantOnglerie"]);
        if(!(montant > 0) || !d["f-montantOnglerie"]) errors.montantOnglerie = "Indiquez le montant de la prestation.";
        montantRecu = montant;
      }
      return { errors: errors, act: act, construire: function(){
        return {
          date: date, activite: "onglerie", lieu: "salon",
          typeClienteId: null, typeClienteNom: null, quartierId: null, quartierNom: null,
          typesCoiffureIds: [], typesCoiffureNoms: [],
          mainOeuvre: montantRecu, coutMeches: 0, transport: 0,
          credit: creditObj
        };
      }};
    }

    var lieu = ((d["f-lieu"] || lieuParDefaut()) === "salon") ? "salon" : "domicile";
    var clienteSel = d["f-clienteSel"];
    var clienteNouveauNom = (d["f-clienteNouveauNom"]||"").trim();
    var quartierSel = d["f-quartierSel"];
    var quartierNouveauNom = (d["f-quartierNouveauNom"]||"").trim();
    var coutMeches = toNum(d["f-coutMeches"]);
    var transport = lieu === "domicile" ? toNum(d["f-transport"]) : 0;
    if(!clienteSel || (clienteSel==="__new__" && !clienteNouveauNom)) errors.cliente = "Choisissez ou précisez le type de cliente.";
    if(lieu === "domicile" && (!quartierSel || (quartierSel==="__new__" && !quartierNouveauNom))) errors.quartier = "Choisissez ou précisez le quartier.";
    if(!credit){
      montantRecu = toNum(d["f-mainOeuvre"]);
      if(!(montantRecu >= 0) || d["f-mainOeuvre"]==="" || d["f-mainOeuvre"]===undefined) errors.mainOeuvre = "Indiquez la main d’œuvre gardée.";
    }
    return { errors: errors, act: act, construire: function(){
      var cliente = clienteSel === "__new__" ? addPerso("typesCliente", clienteNouveauNom) : findById("typesCliente", clienteSel);
      var quartier = lieu === "domicile" ? (quartierSel === "__new__" ? addPerso("quartiers", quartierNouveauNom) : findById("quartiers", quartierSel)) : null;
      var typesIds = (d.typesCoiffureSel || []).slice();
      var typesNoms = typesIds.map(function(id){ var it = findById("typesCoiffure", id); return it ? it.nom : null; }).filter(Boolean);
      var v = {
        date: date, lieu: lieu,
        typeClienteId: cliente ? cliente.id : null, typeClienteNom: cliente ? cliente.nom : clienteNouveauNom,
        quartierId: quartier ? quartier.id : null, quartierNom: lieu === "domicile" ? (quartier ? quartier.nom : quartierNouveauNom) : null,
        typesCoiffureIds: typesIds, typesCoiffureNoms: typesNoms,
        mainOeuvre: montantRecu, coutMeches: coutMeches, transport: transport,
        credit: creditObj
      };
      // Sprint 8B : activité explicite pour les prestations saisies en mode
      // Salon (en mode À domicile, enregistrement identique au 7bis). En
      // modification, le champ est gardé s'il existait déjà.
      if(estModeSalon() || (p && p.activite !== undefined)) v.activite = "coiffure";
      else v.activite = undefined;
      return v;
    }};
  }

  function enregistrerCoiffure(){
    var f = lireFormulairePrestation();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }
    var v = f.construire();
    var prestation = { id: uid(f.act === "onglerie" ? "ongl" : "coif") };
    Object.keys(v).forEach(function(k){ if(v[k] !== undefined) prestation[k] = v[k]; });
    prestation.ts = Date.now();
    state.prestationsCoiffure.push(prestation);
    saveState();
    closeModal();
  }
  // Compatibilité : l'enregistrement d'une onglerie passe par le même chemin.
  function enregistrerOnglerie(){ enregistrerCoiffure(); }

  function enregistrerModifCoiffure(){
    var p = prestationEnCorrection();
    if(!p){ closeModal(); return; }
    var f = lireFormulairePrestation();
    if(Object.keys(f.errors).length){ ui.errors = f.errors; render(); return; }
    var modifie = appliquerModification(p, f.construire());
    if(modifie){ majStatutCredit(p); saveState(); }
    ui.errors = {};
    closeModal();
  }

  // Brouillon pré-rempli pour corriger une prestation (coiffure, onglerie, crédit).
  function valeurChamp(n){ return (n === null || n === undefined || n === "") ? "" : String(n); }
  function brouillonDepuisPrestation(p){
    var c = creditDe(p);
    var d = { "f-activite": activiteDe(p), "f-date": p.date || todayStr(), "f-paiement": c ? "credit" : "entier" };
    if(c){
      d["f-clienteNom"] = c.clienteNom || "";
      d["f-prixCredit"] = valeurChamp(c.prixTotal);
      d["f-dejaPaye"] = p.mainOeuvre ? valeurChamp(p.mainOeuvre) : "";
    }
    if(activiteDe(p) === "onglerie"){
      if(!c) d["f-montantOnglerie"] = valeurChamp(p.mainOeuvre);
      return d;
    }
    var cl = p.typeClienteId ? findById("typesCliente", p.typeClienteId) : null;
    d["f-clienteSel"] = cl ? cl.id : (p.typeClienteNom ? "__new__" : "");
    if(!cl && p.typeClienteNom) d["f-clienteNouveauNom"] = p.typeClienteNom;
    d["f-lieu"] = p.lieu === "salon" ? "salon" : "domicile";
    if(p.lieu !== "salon"){
      var q = p.quartierId ? findById("quartiers", p.quartierId) : null;
      d["f-quartierSel"] = q ? q.id : (p.quartierNom ? "__new__" : "");
      if(!q && p.quartierNom) d["f-quartierNouveauNom"] = p.quartierNom;
    }
    d.typesCoiffureSel = (p.typesCoiffureIds || []).filter(function(id){ return !!findById("typesCoiffure", id); });
    if(!c) d["f-mainOeuvre"] = valeurChamp(p.mainOeuvre);
    d["f-coutMeches"] = p.coutMeches ? valeurChamp(p.coutMeches) : "";
    d["f-transport"] = p.transport ? valeurChamp(p.transport) : "";
    return d;
  }

  /* ================= Listes / détails de prestations ================= */

  // Sprint 8C : sous-titre crédit d'une prestation (« 🤝 À crédit · reste … »).
  function badgeCredit(p){
    var st = statutCredit(p);
    if(!st) return "";
    if(st === "solde") return '<span class="badge badge-solde">Soldé ✓</span>';
    if(st === "abandonne") return '<span class="badge badge-abandon">Abandonné</span>';
    return '<span class="badge badge-credit">Crédit</span>';
  }
  function sousTitreCredit8C(p){
    var c = creditDe(p);
    if(!c) return "";
    var st = statutCredit(p);
    if(st === "solde") return "Crédit soldé · prix " + montantInsecable(c.prixTotal);
    if(st === "abandonne") return "Crédit abandonné · prix " + montantInsecable(c.prixTotal);
    return "À crédit · reste " + montantInsecable(resteDuCredit(p));
  }
  function nomAffichePrestation(p){
    var c = creditDe(p);
    if(activiteDe(p) === "onglerie") return c && c.clienteNom ? "Onglerie · " + c.clienteNom : "Onglerie";
    var lieuTxt = p.lieu === "salon" ? "💈 En salon" : (p.quartierNom || "");
    return (c && c.clienteNom ? c.clienteNom + " · " : "") + (p.typeClienteNom || "") + " · " + lieuTxt;
  }

  // Sprint 8B : carte d'une prestation d'onglerie (montant et date seulement).
  function renderCarteOnglerie(p, action, avecDate){
    var c = creditDe(p);
    var sub = c ? sousTitreCredit8C(p) : "Prestation d’onglerie";
    return (
      '<button type="button" class="entry-card" data-action="' + action + '" data-id="' + p.id + '">' +
        '<div class="entry-ico ico-rose">💅</div>' +
        '<div class="entry-main">' +
          '<div class="entry-title et-flex"><span class="et-nom">' + esc(nomAffichePrestation(p)) + '</span>' + badgeCredit(p) + '</div>' +
          '<div class="entry-sub">' + (avecDate ? formatDateFr(p.date) + ' · ' : '') + esc(sub) + '</div>' +
        '</div>' +
        '<div class="entry-amount">' + formatFCFA(p.mainOeuvre) + '</div>' +
      '</button>'
    );
  }

  function renderCarteCoiffure(p, action, avecDate){
    action = action || "voir-coiffure";
    if(avecDate === undefined) avecDate = true;
    if(activiteDe(p) === "onglerie") return renderCarteOnglerie(p, action, avecDate);
    var types = (p.typesCoiffureNoms||[]).join(", ") || "Type non précisé";
    var c = creditDe(p);
    var sub = (avecDate ? formatDateFr(p.date) + ' · ' : '') + (c ? sousTitreCredit8C(p) : types);
    return (
      '<button type="button" class="entry-card" data-action="' + action + '" data-id="' + p.id + '">' +
        '<div class="entry-ico">💇</div>' +
        '<div class="entry-main">' +
          '<div class="entry-title et-flex"><span class="et-nom">' + esc(nomAffichePrestation(p)) + '</span>' + badgeCredit(p) + '</div>' +
          '<div class="entry-sub">' + esc(sub) + '</div>' +
        '</div>' +
        '<div class="entry-amount">' + formatFCFA(p.mainOeuvre) + '</div>' +
      '</button>'
    );
  }

  // Sprint 8C : ligne d'un encaissement dans les listes du jour —
  // « 💵 Encaissement — Aïcha (prestation du 05/10) ».
  function renderCarteEncaissement(e, avecDate){
    var p = prestationParId(e.prestationId);
    var c = p ? creditDe(p) : null;
    var nom = c && c.clienteNom ? c.clienteNom : "cliente";
    var datePrest = p ? formatDateFr(p.date).slice(0, 5) : "—";
    return (
      '<button type="button" class="entry-card" data-action="voir-coiffure" data-id="' + esc(e.prestationId) + '" data-test="ligne-encaissement">' +
        '<div class="entry-ico ico-vert">💵</div>' +
        '<div class="entry-main">' +
          '<div class="entry-title">Encaissement — ' + esc(nom) + '</div>' +
          '<div class="entry-sub">' + (avecDate ? formatDateFr(e.date) + ' · ' : '') + '(prestation du ' + esc(datePrest) + ')' + (p ? ' · ' + (activiteDe(p) === "onglerie" ? "onglerie" : "coiffure") : '') + '</div>' +
        '</div>' +
        '<div class="entry-amount pos">+' + formatFCFA(e.montant) + '</div>' +
      '</button>'
    );
  }

  // Liste des prestations ET des encaissements d'une période (plus récents
  // d'abord). Sprint 8B : `activite` facultatif — filtre la liste (vues
  // Coiffure / Onglerie de Mon état). Sans crédit, liste identique au 8B.
  function elementsJournal(range, activite){
    var items = filterRange(state.prestationsCoiffure, range).map(function(p){ return { type:"p", date:p.date, ts:p.ts||0, rec:p }; });
    if(activite) items = items.filter(function(x){ return activiteDe(x.rec) === activite; });
    encaissementsPeriode(range, activite).forEach(function(e){ items.push({ type:"e", date:e.date, ts:e.ts||0, rec:e }); });
    return items.sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.ts - a.ts;
    });
  }
  function renderListePrestationsRange(range, videEmoji, videTitre, videDesc, activite){
    var items = elementsJournal(range, activite);
    if(!items.length) return emptyState(videEmoji, videTitre, videDesc);
    return '<div class="entry-list">' + items.map(function(x){
      return x.type === "e" ? renderCarteEncaissement(x.rec, true) : renderCarteCoiffure(x.rec, "voir-coiffure", true);
    }).join("") + '</div>';
  }

  function drow(k,v){ return '<div class="detail-row"><div class="dk">' + esc(k) + '</div><div class="dv">' + v + '</div></div>'; }

  // Sprint 8C : « ✏️ Modifier » à côté de « 🗑️ Supprimer » pour les
  // prestations et les charges ; message clair si une prestation à
  // supprimer a des encaissements (supprimés avec elle).
  function detailShell(rowsHtml, kind, id, avantBoutons){
    var confirming = ui.modal.confirmDelete;
    var modifiable = (kind === "coiffure" || kind === "autre-charge");
    var messageSuppr = "Supprimer cet enregistrement ? Cette action est définitive.";
    if(kind === "coiffure"){
      var enc = encaissementsDe(id);
      if(enc.length){
        var tot = formatFCFA(sumBy(enc, function(e){ return e.montant; }));
        messageSuppr = "Supprimer cette prestation ? " + (enc.length > 1
          ? "Ses " + enc.length + " encaissements, " + tot + ", seront supprimés aussi."
          : "Son encaissement de " + tot + " sera supprimé aussi.") + " Cette action est définitive.";
      }
    }
    var boutons = modifiable
      ? '<div class="btn-row detail-actions">' +
          '<button type="button" class="btn btn-secondary" data-action="modifier-enregistrement" data-kind="' + kind + '" data-id="' + id + '">✏️ Modifier</button>' +
          '<button type="button" class="btn btn-danger" data-action="demander-suppression">🗑️ Supprimer</button>' +
        '</div>'
      : '<button type="button" class="btn btn-danger" style="margin-top:14px;" data-action="demander-suppression">🗑️ Supprimer</button>';
    return (
      '<div>' + rowsHtml + (avantBoutons || "") +
      (confirming ?
        '<div class="confirm-box"><p data-test="message-suppression">' + esc(messageSuppr) + '</p>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn btn-secondary" data-action="annuler-suppression">Annuler</button>' +
            '<button type="button" class="btn btn-danger" data-action="confirmer-suppression" data-kind="' + kind + '" data-id="' + id + '">Oui, supprimer</button>' +
          '</div></div>'
        :
        boutons
      ) +
      '</div>'
    );
  }

  function renderModifieLe(rec){
    if(!rec || !rec.modifieLe) return "";
    var d = new Date(rec.modifieLe);
    if(isNaN(d.getTime())) return "";
    return '<div class="modifie-le" data-test="modifie-le">✏️ Modifié le ' + formatDateFr(dateKey(d)) + '</div>';
  }

  // Lignes « crédit » du détail d'une prestation (prix, payé le jour même,
  // encaissements, reste dû / soldé / abandonné) + bouton « Encaisser ».
  function rowsCreditDetail(p){
    var c = creditDe(p);
    if(!c) return { rows: "", apres: "" };
    var st = statutCredit(p);
    var rows =
      drow("Cliente", esc(c.clienteNom || "—")) +
      drow("Prix de la prestation", formatFCFA(c.prixTotal)) +
      drow("Payé le jour de la prestation", formatFCFA(p.mainOeuvre));
    encaissementsDe(p.id).slice().sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : (a.ts||0) - (b.ts||0)); }).forEach(function(e){
      rows += drow("Encaissement du " + formatDateFr(e.date), '<span style="color:var(--green);">+' + formatFCFA(e.montant) + '</span>');
    });
    if(st === "solde") rows += drow("Reste dû", '<span style="color:var(--green);" data-test="detail-statut">Soldé ✓</span>');
    else if(st === "abandonne") rows += drow("Reste dû", '<span style="color:var(--text-dim);" data-test="detail-statut">Abandonné' + (c.abandonneLe ? " le " + formatDateFr(c.abandonneLe) : "") + ' (' + formatFCFA(resteDuCredit(p)) + ')</span>');
    else rows += drow("Reste dû", '<span style="color:var(--pink);" data-test="detail-statut">' + formatFCFA(resteDuCredit(p)) + '</span>');
    var apres = st === "en_cours"
      ? '<button type="button" class="btn btn-vert" style="margin-top:14px;" data-action="encaisser-credit" data-id="' + esc(p.id) + '">💵 Encaisser</button>'
      : '';
    return { rows: rows, apres: apres };
  }

  function renderDetailCoiffure(){
    var p = prestationParId(ui.modal.id);
    if(!p) return emptyState("🗂️", "Prestation introuvable", "Elle a peut-être été supprimée.");
    var cr = rowsCreditDetail(p);
    var c = creditDe(p);
    if(activiteDe(p) === "onglerie"){
      return detailShell(drow("Date", formatDateFr(p.date)) + drow("Activité", "💅 Onglerie") +
        (c ? cr.rows : drow("Montant", formatFCFA(p.mainOeuvre))) + renderModifieLe(p), "coiffure", p.id, cr.apres);
    }
    var rows =
      drow("Date", formatDateFr(p.date)) +
      drow("Type de cliente", esc(p.typeClienteNom)) +
      drow("Lieu", p.lieu === "salon" ? "💈 En salon" : "🏠 À domicile") +
      (p.lieu === "domicile" ? drow("Quartier", esc(p.quartierNom)) : "") +
      drow("Type(s) de coiffure", esc((p.typesCoiffureNoms||[]).join(", ") || "—")) +
      (c ? cr.rows : drow("Main d’œuvre gardée", formatFCFA(p.mainOeuvre))) +
      drow("Coût des mèches (non compté)", formatFCFA(p.coutMeches||0)) +
      (p.lieu === "domicile" ? drow("Transport (non compté)", formatFCFA(p.transport||0)) : "") +
      renderModifieLe(p);
    return detailShell(rows, "coiffure", p.id, cr.apres);
  }

  // Bloc « Main d'œuvre » / « Recette du jour » d'Aujourd'hui : prestations
  // ET encaissements du jour (Sprint 8C).
  function renderJourMainOeuvreModal(){
    var today = todayStr();
    var rj = { start: today, end: today };
    var items = elementsJournal(rj);
    if(!items.length){
      return emptyState("💇", "Aucune prestation aujourd’hui", "Les prestations enregistrées aujourd’hui apparaîtront ici.");
    }
    // Sprint 8B : en mode Salon, détail Coiffure / Onglerie de la recette du jour.
    var tete = "";
    if(estModeSalon()){
      tete =
        '<div class="etat-stat-row" style="margin-bottom:8px;"><div class="er-label">💇 Coiffure</div><div class="er-val">' + formatFCFA(recettesActivite(rj, "coiffure")) + '</div></div>' +
        '<div class="etat-stat-row" style="margin-bottom:14px;"><div class="er-label">💅 Onglerie</div><div class="er-val">' + formatFCFA(recettesActivite(rj, "onglerie")) + '</div></div>';
    }
    return tete + '<div class="entry-list">' + items.map(function(x){
      if(x.type === "e") return renderCarteEncaissement(x.rec, false).replace('data-action="voir-coiffure"', 'data-action="voir-coiffure-du-jour"');
      return renderCarteCoiffure(x.rec, "voir-coiffure-du-jour", false);
    }).join("") + '</div>';
  }

  // Blocs Transport / Mèche d'Aujourd'hui : depuis ce sprint, plus la liste
  // complète — seul le montant du jour lié au champ concerné, en liste
  // compacte avec le total en tête (confirmé au cahier des charges, section 3).
  function renderJourChampModal(champ){
    var today = todayStr();
    var estTransport = champ === "transport";
    var items = state.prestationsCoiffure.filter(function(p){
      return p.date === today && (estTransport ? (p.transport||0) > 0 : (p.coutMeches||0) > 0);
    });
    items = sortByDateDesc(items);
    var total = sumBy(items, function(p){ return estTransport ? (p.transport||0) : (p.coutMeches||0); });
    var titreChamp = estTransport ? "Transport" : "Mèche";
    var icoChamp = estTransport ? "🚗" : mecheSvg(24);
    if(!items.length){
      return (
        '<div class="hint tight" style="margin-bottom:10px;">Aucun montant ' + (estTransport?"transport":"mèche") + ' enregistré aujourd’hui.</div>'
      );
    }
    var total_row = '<div class="etat-stat-row" style="margin-bottom:10px; border-color:var(--accent);"><div class="er-label">Total ' + titreChamp.toLowerCase() + ' du jour</div><div class="er-val">' + formatFCFA(total) + '</div></div>';
    var rows = items.map(function(p){
      return (
        '<div class="entry-card">' +
          '<div class="entry-ico">' + icoChamp + '</div>' +
          '<div class="entry-main"><div class="entry-title">' + esc(p.typeClienteNom) + '</div></div>' +
          '<div class="entry-amount">' + formatFCFA(estTransport ? (p.transport||0) : (p.coutMeches||0)) + '</div>' +
        '</div>'
      );
    }).join("");
    return total_row + '<div class="entry-list">' + rows + '</div>';
  }

  /* ================= Autres charges (rubriques, F11) ================= */

  // Sprint 8A : rubriques actives du mode en cours. En mode À domicile, la
  // liste est exactement celle du Sprint 7bis (les rubriques « salon » n'y
  // apparaissent jamais) ; en mode Salon, ordre de l'amendement, section 3.
  function rubriquesActives(){
    return rubriquesPourMode(true);
  }
  function findRubriqueCharge(id){
    var list = state.config.rubriquesCharges;
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    return null;
  }

  function renderDetailChargesJour(){
    var today = todayStr();
    var range = { start: today, end: today };
    var hint = '<div class="hint tight" style="margin-bottom:14px;">Ces charges concernent le salon dans son ensemble (loyer, publicité…).</div>';
    var autres = filterRange(state.autresCharges, range).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    var autresHtml = '<div class="reglages-section"><div class="rs-title">Charges communes du jour</div>' +
      (autres.length ? autres.map(function(c){
        return (
          '<button type="button" class="entry-card" data-action="voir-autre-charge" data-id="' + c.id + '" style="margin-bottom:8px; width:100%;">' +
            '<div class="entry-ico ico-rouge">' + esc(c.rubriqueEmoji||"📝") + '</div>' +
            '<div class="entry-main"><div class="entry-title">' + esc(c.rubriqueNom) + '</div></div>' +
            '<div class="entry-amount neg">' + formatFCFA(c.montant) + '</div>' +
          '</button>'
        );
      }).join("") : '<div class="hint tight">Aucune charge commune ajoutée aujourd’hui.</div>') +
      '<button type="button" class="btn btn-secondary" style="margin-top:8px;" data-action="add-autre-charge">+ Ajouter une charge</button>' +
    '</div>';
    return hint + autresHtml;
  }

  // Sprint 8C : même formulaire pour la saisie et la modification d'une charge.
  function estModifCharge(){ return !!ui.modal && ui.modal.type === "edit-charge"; }
  function chargeEnCorrection(){
    if(!estModifCharge()) return null;
    var l = state.autresCharges;
    for(var i=0;i<l.length;i++) if(l[i] && l[i].id === ui.modal.id) return l[i];
    return null;
  }
  // Tuiles de rubriques ; en modification, la rubrique de la charge reste
  // proposée même si elle a été désactivée ou supprimée depuis.
  function rubriquesPourFormulaire(){
    var rubs = rubriquesActives().slice();
    var c = chargeEnCorrection();
    if(c && !rubs.some(function(r){ return r.id === c.rubriqueId; })){
      var r0 = findRubriqueCharge(c.rubriqueId);
      rubs.unshift(r0 || { id: c.rubriqueId, nom: c.rubriqueNom, emoji: c.rubriqueEmoji, type: c.rubriqueType });
    }
    return rubs;
  }
  function boutonEnregistrerCharge(){
    return estModifCharge()
      ? '<button type="button" class="btn btn-primary" data-action="enregistrer-modif-charge">Enregistrer les modifications</button>'
      : '<button type="button" class="btn btn-primary" data-action="enregistrer-autre-charge">Enregistrer</button>';
  }

  function renderFormAutreCharge(){
    if(estModeSalon()) return renderFormChargeSalon();
    var d = ui.draft;
    var rubSel = d["f-rubrique"] || "";
    var tiles = rubriquesPourFormulaire().map(function(r){
      return (
        '<button type="button" class="rub-tile' + (rubSel===r.id?" selected":"") + '" data-action="set-rubrique-charge" data-id="' + r.id + '">' +
          '<div class="rub-icon">' + esc(r.emoji||"📝") + '</div>' +
          '<div class="rub-nom">' + esc(r.nom) + '</div>' +
        '</button>'
      );
    }).join("");
    return (
      '<div>' +
        '<div class="field"><div class="label">Rubrique <span class="req">*</span></div>' +
          '<div class="rub-grid">' + tiles + '</div>' +
          fieldErr("rubrique") +
        '</div>' +
        '<div class="field"><div class="label">Montant (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-montantAutreCharge" value="' + esc(d["f-montantAutreCharge"]||"") + '" data-action-change="capture-autre-charge">' +
          fieldErr("montant") +
        '</div>' +
        (estModifCharge() ? renderNoteMoisPasse() : '') +
        boutonEnregistrerCharge() +
      '</div>'
    );
  }
  // Sprint 8A : formulaire de charge du mode Salon — rubrique, (crédit :
  // prêteur à la première saisie, sinon bilan), montant, mois concerné, note
  // libre (détail des produits : shampoing, gel, vernis…).
  var CHARGE_FIELDS = ["f-montantAutreCharge","f-moisConcerne","f-noteCharge","f-creditPreteur","f-creditTotal"];

  function optionsMoisConcerne(cle){
    // Mois précédent (facture arrivée en retard), mois en cours (défaut), mois suivant (paiement d'avance).
    return [decalerMoisCle(cle, -1), cle, decalerMoisCle(cle, 1)];
  }
  // Sprint 8C : en modification, le mois concerné d'origine reste proposé.
  function optionsMoisFormulaire(cle){
    var l = optionsMoisConcerne(cle);
    var c = chargeEnCorrection();
    if(c){
      var m = moisDeCharge(c);
      if(l.indexOf(m) === -1){ l.push(m); l.sort(); }
    }
    return l;
  }

  function renderChampsPremierCredit(d){

  // Sprint 8C : lecture + contrôles du formulaire de charge, PARTAGÉS par la
  // saisie et la modification (contrôles du 8A/8B inchangés).
  function lireFormulaireCharge(){
    var salon = estModeSalon();
    captureDraft(salon ? CHARGE_FIELDS : ["f-montantAutreCharge"]);
    var d = ui.draft;
    var errors = {};
    var c = chargeEnCorrection();
    var rubSel = d["f-rubrique"];
    var rubrique = rubSel ? findRubriqueCharge(rubSel) : null;
    // Rubrique supprimée depuis : la charge corrigée peut la garder.
    if(!rubrique && c && rubSel === c.rubriqueId){
      rubrique = { id: c.rubriqueId, nom: c.rubriqueNom, emoji: c.rubriqueEmoji, type: c.rubriqueType, __ancienne: true };
    }
    var montant = toNum(d["f-montantAutreCharge"]);
    if(!rubrique) errors.rubrique = "Choisissez une rubrique.";
    if(!(montant > 0) || d["f-montantAutreCharge"]==="" || d["f-montantAutreCharge"]===undefined) errors.montant = "Indiquez un montant supérieur à 0.";
    if(!salon){
      return { errors: errors, construire: function(){
        return { rubriqueId: rubrique.id, rubriqueNom: rubrique.nom, rubriqueEmoji: rubrique.emoji, montant: montant };
      }};
    }
    var cle = moisCourantCle();
    var mois = d["f-moisConcerne"] || (c ? moisDeCharge(c) : cle);
    if(optionsMoisFormulaire(cle).indexOf(mois) === -1) mois = cle;
    var type = rubrique ? (rubrique.__ancienne ? (rubrique.type || typeDeCharge(c)) : typeDeRubrique(rubrique)) : "commune";
    var nouveauCredit = !!(rubrique && !rubrique.__ancienne && type === "credit" && !findCredit(rubrique.id));
    if(nouveauCredit && d["f-creditType"] !== "banque" && d["f-creditType"] !== "personne"){
      errors.creditType = "Précisez le type de prêteur.";
    }
    return { errors: errors, nouveauCredit: nouveauCredit, construire: function(maintenant){
      if(nouveauCredit){
        var total = toNum(d["f-creditTotal"]);
        state.config.credits.push({
          id: uid("cred"), rubriqueId: rubrique.id, type: d["f-creditType"],
          preteur: String(d["f-creditPreteur"]||"").trim(),
          montantTotal: total > 0 ? Math.round(total) : null,
          dateDebut: todayStr(), tsDebut: maintenant
        });
      }
      var note = String(d["f-noteCharge"]||"").trim();
      var v = { moisConcerne: mois, rubriqueId: rubrique.id, rubriqueNom: rubrique.nom, rubriqueEmoji: rubrique.emoji, rubriqueType: type, montant: montant, note: note || undefined };
      if(c){
        // Correction d'une charge saisie avant le 8A (sans mois concerné) :
        // on n'ajoute ces champs que si la personne change réellement le mois
        // ou la rubrique (« enregistrer sans changement » ne laisse aucune trace).
        if(c.moisConcerne === undefined && mois === moisDeCharge(c)) v.moisConcerne = undefined;
        if(c.rubriqueType === undefined && rubrique.id === c.rubriqueId) v.rubriqueType = undefined;
      }
      return v;
    }};
  }

  /* ================= Sprint 8C : modifier un enregistrement ================= */
  // Règle reprise de MonDjai/Revente (Sprint E) — piste d'audit adaptée à un
  // carnet personnel : on CORRIGE l'enregistrement au lieu de le supprimer
  // puis le ressaisir, et on garde la trace dans l'enregistrement lui-même :
  //  - modifieLe : horodatage (ms) de la dernière correction ;
  //  - versionsPrecedentes : les anciennes valeurs, une entrée par correction,
  //    la plus récente en dernier (jamais affichées en détail, conservées à
  //    l'export et à la restauration).
  // id, ts et date de saisie d'origine ne changent jamais. Enregistrer sans
  // rien changer n'ajoute aucune trace. Mêmes contrôles qu'à la saisie ; les
  // mois passés ne sont pas verrouillés — un message doux prévient seulement.
  function memeValeur(a, b){
    var videA = (a === null || a === undefined), videB = (b === null || b === undefined);
    if(videA || videB) return videA && videB;
    if(typeof a === "object" || typeof b === "object") return JSON.stringify(a) === JSON.stringify(b);
    return a === b;
  }
  // Copie des valeurs actuelles (sans l'historique lui-même).
  function instantane(rec){
    var copie = {};
    for(var k in rec){
      if(Object.prototype.hasOwnProperty.call(rec, k) && k !== "versionsPrecedentes") copie[k] = rec[k];
    }
    return JSON.parse(JSON.stringify(copie));
  }
  // Applique une correction ; une valeur `undefined` retire le champ.
  // Renvoie false si rien n'a réellement changé (aucune trace dans ce cas).
  function appliquerModification(rec, nouveau){
    var change = Object.keys(nouveau).some(function(k){ return !memeValeur(rec[k], nouveau[k]); });
    if(!change) return false;
    var historique = Array.isArray(rec.versionsPrecedentes) ? rec.versionsPrecedentes.slice()
      : (rec.versionsPrecedentes ? [rec.versionsPrecedentes] : []);
    historique.push(instantane(rec));
    Object.keys(nouveau).forEach(function(k){
      if(nouveau[k] === undefined || nouveau[k] === null && (k === "credit" || k === "note")) delete rec[k];
      else rec[k] = nouveau[k];
    });
    rec.modifieLe = Date.now();
    rec.versionsPrecedentes = historique;
    return true;
  }
  function ouvrirModification(kind, id){
    if(!ui.modal) return;
    var rec = kind === "coiffure" ? prestationParId(id) : state.autresCharges.filter(function(x){ return x.id === id; })[0];
    if(!rec) return;
    empilerModale();
    ui.modal = { type: kind === "coiffure" ? "edit-coiffure" : "edit-charge", id: id };
    ui.draft = kind === "coiffure" ? brouillonDepuisPrestation(rec) : brouillonDepuisCharge(rec);
    ui.errors = {};
    render();
  }

  // Message doux (jamais bloquant) quand la correction touche un mois passé :
  // l'ancien ou le nouveau mois (date de la prestation, ou mois concerné de
  // la charge en mode Salon).
  function moisPassesConcernes(anciennes, nouvelles){
    var courant = moisCourantCle();
    var liste = [];
    anciennes.concat(nouvelles).forEach(function(m){
      if(!m || m >= courant) return;
      if(liste.indexOf(m) < 0) liste.push(m);
    });
    return liste.sort().reverse();
  }
  function messageCorrectionMoisPasse(){
    var liste = [];
    if(estModifPrestation()){
      var p = prestationEnCorrection();
      liste = moisPassesConcernes([p ? moisCleDe(p.date) : null], [moisCleDe(ui.draft["f-date"] || todayStr())]);
    } else if(estModifCharge()){
      var c = chargeEnCorrection();
      if(!c) return "";
      var nouveauMois = estModeSalon() ? (ui.draft["f-moisConcerne"] || moisDeCharge(c)) : moisCleDe(c.date);
      liste = moisPassesConcernes([estModeSalon() ? moisDeCharge(c) : moisCleDe(c.date)], [nouveauMois]);
    } else {
      return "";
    }
    if(!liste.length) return "";
    var noms = liste.map(function(m){ return deMois(libelleMoisCle(m)); }).join(" et ");
    if(estModeSalon()){
      return "Cette correction change le résultat net définitif " + noms + " et " + (liste.length > 1 ? "leur" : "sa") + " répartition.";
    }
    return "Cette correction change aussi les chiffres " + noms + ".";
  }
  function renderNoteMoisPasse(){
    var msg = messageCorrectionMoisPasse();
    return '<div class="note-douce" id="note-mois-passe" data-test="msg-mois-passe" role="status"' + (msg ? '' : ' hidden') + '>' + esc(msg) + '</div>';

  }

      '</div>' +
