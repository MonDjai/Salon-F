<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#11141a" />
<title>MonDjai/Coiffure</title>
<meta name="application-name" content="Coiffure" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<script>
  // Sprint 8D — thème posé AVANT le premier affichage (aucun éclair sombre ou
  // blanc au démarrage, au rechargement de mise à jour ni à l'écran du code
  // d'accès). Lit seulement le choix enregistré (state.config.theme :
  // 'clair' | 'auto' | 'sombre' ; absent = 'clair'). Aucun appel réseau.
  (function(){
    var t = "clair", porte = true;
    try{
      var s = JSON.parse(localStorage.getItem("mondjai_coiffure_state_v1") || "null");
      var c = s && s.config ? s.config : null;
      var choix = c ? c.theme : null;
      if(choix === "sombre") t = "sombre";
      else if(choix === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "sombre";
      // Écran de départ sans bandeau (code d'accès, code PIN) ?
      porte = !(c && c.codeAccesOk) || !!(c.pinActif && c.pinCode);
    }catch(e){}
    var html = document.documentElement;
    html.setAttribute("data-theme", t);
    var meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t === "sombre" ? "#11141a" : (porte ? "#eff1f4" : "#141922"));
  })();
</script>
<style>
  /* =====================================================================
     Sprint 8D — thème clair « bandeau MonDjai » (variante B validée le
     17/10/2026) et thème sombre (rendu du 8C conservé à l'identique).
     UNE seule source de couleurs : les variables ci-dessous, en deux jeux
     de valeurs. :root = sombre (valeurs exactes du 8C) ;
     html[data-theme="clair"] = clair (contraste des textes ≥ 4,5:1).
     L'attribut data-theme est posé sur <html> avant le premier affichage
     par le petit script de <head> (aucun éclair au démarrage).
     ===================================================================== */
  :root{
    --bg:#11141a;
    --card:#1b2029;
    --card-2:#20262f;
    --border:#2a303c;
    --text:#eef1f6;
    --text-dim:#b7bfcc;
    /* Ambre « texte » (liens, pourcentages, onglet actif, montants) et ambre
       « remplissage » (bouton « + », boutons principaux, interrupteurs,
       pastilles du PIN, jauge, coches), toujours avec --on-accent dessus. */
    --accent:#f5a623;
    --accent-fill:#f5a623;
    --accent-dark:#c9840f;
    --on-accent:#1b1200;
    --green:#34b37e;
    --green-fill:#34b37e;
    --red:#ff6b5e;
    --red-soft:#ff8f84;
    --blue:#5b8def;
    --turquoise:#4fd1c5;
    --pink:#e8788c;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    /* Sprint 8C (repris de Revente-E) : bordures fines et discrètes, léger
       dégradé + ombre douce, rayons harmonisés. */
    --line:rgba(255,255,255,.075);
    --card-grad:linear-gradient(180deg,#1f252f 0%,#1a1f28 100%);
    --shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 8px 18px -10px rgba(0,0,0,.65);
    --shadow-sm:inset 0 1px 0 rgba(255,255,255,.03), 0 3px 8px -4px rgba(0,0,0,.5);
    --r-lg:18px;
    --r-md:14px;
    --r-sm:11px;
    --filet:linear-gradient(90deg, rgba(255,255,255,.13), rgba(255,255,255,0));

    /* Bandeau MonDjai (en-tête) : sombre dans les deux thèmes. */
    --bandeau:#141922;
    --bandeau-text:#eef1f6;
    --bandeau-text-dim:#b7bfcc;
    --bandeau-line:rgba(255,255,255,.075);
    --bandeau-card-grad:linear-gradient(180deg,#1f252f 0%,#1a1f28 100%);
    --bandeau-card-2:#20262f;
    --bandeau-shadow-sm:inset 0 1px 0 rgba(255,255,255,.03), 0 3px 8px -4px rgba(0,0,0,.5);
    --bandeau-filet:linear-gradient(90deg, rgba(255,255,255,.13), rgba(255,255,255,0));
    --header-bg:linear-gradient(180deg,#181d26,#12161d);
    --header-border:1px solid rgba(255,255,255,.075);
    --header-shadow:0 10px 18px -16px rgba(0,0,0,.9);

    /* Barre du bas, feuilles du bas, bannière de mise à jour */
    --tabbar-bg:linear-gradient(180deg,#171c24,#13171e);
    --tabbar-shadow:0 -10px 22px -16px rgba(0,0,0,.9);
    --tab-actif-bg:rgba(245,166,35,.17);
    --tab-actif-ring:rgba(245,166,35,.42);
    --overlay:rgba(5,7,10,.62);
    --modal-bg:linear-gradient(180deg,#171c24 0px,#11141a 160px);
    --modal-border:rgba(255,255,255,.1);
    --modal-shadow:0 -14px 34px rgba(0,0,0,.5);
    --modal-poignee:#3c4352;
    --maj-bg:#1f2632;
    --maj-shadow:0 8px 24px rgba(0,0,0,.45);

    /* Boutons et contrôles */
    --btn2-border:rgba(255,255,255,.1);
    --fab-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 10px 22px -6px rgba(245,166,35,.5);
    --seg-shadow:inset 0 1px 3px rgba(0,0,0,.35);
    --choice-sel-bg:linear-gradient(135deg,#241d10,#1c2029);
    --switch-knob:#fff;

    /* Cartes particulières */
    --dash-solde-bg:radial-gradient(120% 90% at 50% 0%, rgba(245,166,35,.07), rgba(245,166,35,0) 60%), linear-gradient(180deg,#1f252f 0%,#1a1f28 100%);
    --carte-bandeau-shadow:inset 0 1px 0 rgba(255,255,255,.035), 0 8px 18px -10px rgba(0,0,0,.65);
    --carte-bandeau-border:rgba(255,255,255,.075);
    --pointilles-border:rgba(255,255,255,.12);
    --pointilles-bg:rgba(255,255,255,.018);
    --info-amount:#d5dbe5;
    --vide-border:rgba(255,255,255,.1);
    --vide-bg:rgba(255,255,255,.012);
    --badge-neutre-bg:rgba(255,255,255,.07);
    --jauge-bar-bg:rgba(255,255,255,.05);
    --jauge-bar-border:rgba(255,255,255,.075);
    --jauge-fill:linear-gradient(90deg,#f7b443,#f5a623);
    --jauge-fill-ok:linear-gradient(90deg,#3fc58d,#34b37e);
    --reprise-bg:rgba(245,166,35,.08);
    --reprise-border:rgba(245,166,35,.55);
    --alerte-bg:linear-gradient(135deg, rgba(255,107,94,.12), rgba(255,107,94,.04));
    --alerte-border:rgba(255,107,94,.38);
    --mois-btn-bg:linear-gradient(120deg, rgba(245,166,35,.22) 0%, rgba(245,166,35,.08) 48%, rgba(245,166,35,.03) 100%), #1b2029;
    --mois-btn-border:rgba(245,166,35,.6);
    --mois-btn-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 22px -12px rgba(245,166,35,.55);
    --pastille-ring:#1d1f22;
    --credit-hero-bg:radial-gradient(120% 120% at 0% 0%, rgba(232,120,140,.2), rgba(232,120,140,0) 60%), linear-gradient(135deg,#251a20,#1b2029);
    --credit-hero-border:rgba(232,120,140,.5);

    /* Sélections ambre (choix actif, rubrique, modèle, puce) et badges ambre ;
       bouton « danger » ; badge « Crédit » ; texte indicatif des champs. */
    --sel-bg-12:rgba(245,166,35,.12);
    --sel-bg-10:rgba(245,166,35,.1);
    --badge-ambre-bg:rgba(245,166,35,.14);
    --danger-bg:rgba(255,107,94,.1);
    --danger-border:rgba(255,107,94,.38);
    /* Sombre : 4,5:1 atteint avec un fond de badge un peu plus léger qu'au 8C (.15). */
    --badge-credit-bg:rgba(232,120,140,.12);
    --placeholder:#8b93a1;

    /* Pastilles teintées des icônes (vert = recettes, ambre = mèche,
       turquoise = fonds, bleu = épargne, rose = crédit, rouge, gris = info) */
    --t-ambre-bg:radial-gradient(circle at 30% 25%, rgba(245,166,35,.32), rgba(245,166,35,.08));
    --t-ambre-ring:inset 0 0 0 1px rgba(245,166,35,.26);
    --t-vert-bg:radial-gradient(circle at 30% 25%, rgba(52,179,126,.32), rgba(52,179,126,.08));
    --t-vert-ring:inset 0 0 0 1px rgba(52,179,126,.28);
    --t-turq-bg:radial-gradient(circle at 30% 25%, rgba(79,209,197,.28), rgba(79,209,197,.07));
    --t-turq-ring:inset 0 0 0 1px rgba(79,209,197,.24);
    --t-bleu-bg:radial-gradient(circle at 30% 25%, rgba(91,141,239,.32), rgba(91,141,239,.08));
    --t-bleu-ring:inset 0 0 0 1px rgba(91,141,239,.28);
    --t-rouge-bg:radial-gradient(circle at 30% 25%, rgba(255,107,94,.3), rgba(255,107,94,.08));
    --t-rouge-ring:inset 0 0 0 1px rgba(255,107,94,.26);
    --t-rose-bg:radial-gradient(circle at 30% 25%, rgba(232,120,140,.32), rgba(232,120,140,.08));
    --t-rose-ring:inset 0 0 0 1px rgba(232,120,140,.28);
    --t-gris-bg:radial-gradient(circle at 30% 25%, rgba(183,191,204,.2), rgba(183,191,204,.05));
    --t-gris-ring:inset 0 0 0 1px rgba(183,191,204,.18);
  }

  /* ---------- Thème clair : corps clair, cartes blanches, bandeau sombre ---------- */
  html[data-theme="clair"]{
    --bg:#eff1f4;
    --card:#ffffff;
    --card-2:#f1f3f6;
    --border:#d9dde4;
    --text:#151a22;          /* 17,5:1 sur blanc */
    --text-dim:#5a6372;      /* 6,1:1 */
    --accent:#9a5a00;        /* ambre « texte » : 5,5:1 */
    --accent-fill:#f5a623;   /* ambre « remplissage » : inchangé */
    --accent-dark:#c9840f;
    --on-accent:#1b1200;
    --green:#137a52;         /* 5,3:1 */
    --green-fill:#259466;
    --red:#c4382c;           /* 5,3:1 */
    --red-soft:#c4382c;
    --blue:#2b5bc0;          /* 6,3:1 */
    --turquoise:#0b766e;
    --pink:#b03d5a;          /* 5,7:1 */
    --line:#e3e6eb;
    --card-grad:linear-gradient(180deg,#ffffff 0%,#fcfcfd 100%);
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 22px -14px rgba(16,24,40,.28);
    --shadow-sm:0 1px 2px rgba(16,24,40,.07);
    --filet:linear-gradient(90deg, rgba(21,26,34,.16), rgba(21,26,34,0));

    --bandeau-card-grad:linear-gradient(180deg,#232a35 0%,#1c222c 100%);
    --bandeau-shadow-sm:inset 0 1px 0 rgba(255,255,255,.04), 0 3px 8px -4px rgba(0,0,0,.5);
    --bandeau-filet:linear-gradient(90deg, rgba(255,255,255,.16), rgba(255,255,255,0));
    --header-bg:#141922;
    --header-border:none;
    --header-shadow:none;

    --tabbar-bg:#ffffff;
    --tabbar-shadow:0 -8px 20px -16px rgba(16,24,40,.35);
    --tab-actif-bg:rgba(245,166,35,.22);
    --tab-actif-ring:rgba(201,132,15,.45);
    --overlay:rgba(16,20,28,.45);
    --modal-bg:#ffffff;
    --modal-border:#e3e6eb;
    --modal-shadow:0 -14px 34px rgba(16,24,40,.18);
    --modal-poignee:#d0d4db;
    --maj-bg:#ffffff;
    --maj-shadow:0 8px 24px rgba(16,24,40,.18);

    --btn2-border:#d9dde4;
    --fab-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 10px 20px -8px rgba(201,132,15,.55);
    --seg-shadow:inset 0 1px 2px rgba(16,24,40,.08);
    --choice-sel-bg:#fff8ec;

    --dash-solde-bg:radial-gradient(120% 90% at 50% 0%, rgba(245,166,35,.10), rgba(245,166,35,0) 60%), #ffffff;
    --carte-bandeau-shadow:0 14px 28px -16px rgba(16,24,40,.45);
    --carte-bandeau-border:#ffffff;
    --pointilles-border:#c9ced7;
    --pointilles-bg:#fafbfc;
    --info-amount:#151a22;
    --vide-border:#cfd4dc;
    --vide-bg:#fafbfc;
    --badge-neutre-bg:#eceef2;
    --jauge-bar-bg:#eceef2;
    --jauge-bar-border:#e1e4e9;
    --jauge-fill:linear-gradient(90deg,#f7b443,#e0950f);
    --jauge-fill-ok:linear-gradient(90deg,#3fc58d,#259466);
    --reprise-bg:#fff7ea;
    --reprise-border:rgba(201,132,15,.55);
    --alerte-bg:#fdf0ee;
    --alerte-border:rgba(196,56,44,.32);
    --mois-btn-bg:linear-gradient(120deg, rgba(245,166,35,.22) 0%, rgba(245,166,35,.08) 48%, rgba(245,166,35,.03) 100%), #ffffff;
    --mois-btn-border:rgba(201,132,15,.6);
    --mois-btn-shadow:0 10px 22px -14px rgba(201,132,15,.6);
    --pastille-ring:#ffffff;
    --credit-hero-bg:radial-gradient(120% 120% at 0% 0%, rgba(232,120,140,.2), rgba(232,120,140,0) 60%), linear-gradient(135deg,#fdeef2,#ffffff);
    --credit-hero-border:rgba(176,61,90,.4);

    --sel-bg-12:#fff5e3;
    --sel-bg-10:#fff5e3;
    --badge-ambre-bg:#fff1d9;
    --danger-bg:#fdf2f0;
    --danger-border:rgba(196,56,44,.38);
    --badge-credit-bg:rgba(232,120,140,.15);
    --placeholder:#5f6776;

    --t-ambre-bg:radial-gradient(circle at 30% 25%, rgba(245,166,35,.42), rgba(245,166,35,.14));
    --t-ambre-ring:inset 0 0 0 1px rgba(201,132,15,.30);
    --t-vert-bg:radial-gradient(circle at 30% 25%, rgba(52,179,126,.36), rgba(52,179,126,.12));
    --t-vert-ring:inset 0 0 0 1px rgba(19,122,82,.24);
    --t-turq-bg:radial-gradient(circle at 30% 25%, rgba(79,209,197,.38), rgba(79,209,197,.12));
    --t-turq-ring:inset 0 0 0 1px rgba(11,118,110,.22);
    --t-bleu-bg:radial-gradient(circle at 30% 25%, rgba(91,141,239,.34), rgba(91,141,239,.12));
    --t-bleu-ring:inset 0 0 0 1px rgba(43,91,192,.22);
    --t-rouge-bg:radial-gradient(circle at 30% 25%, rgba(255,107,94,.34), rgba(255,107,94,.12));
    --t-rouge-ring:inset 0 0 0 1px rgba(196,56,44,.22);
    --t-rose-bg:radial-gradient(circle at 30% 25%, rgba(232,120,140,.36), rgba(232,120,140,.12));
    --t-rose-ring:inset 0 0 0 1px rgba(176,61,90,.22);
    --t-gris-bg:radial-gradient(circle at 30% 25%, rgba(90,99,114,.18), rgba(90,99,114,.06));
    --t-gris-ring:inset 0 0 0 1px rgba(90,99,114,.16);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none; color-scheme:dark;}
  /* Dates, listes et champs natifs lisibles dans le thème choisi. */
  html[data-theme="clair"], html[data-theme="clair"] body{color-scheme:light;}
  /* Chiffres à chasse fixe sur les montants (ils s'alignent et ne « dansent »
     pas). Pas sur le texte courant : dans la police système Android, l'option
     élargit aussi les traits d'union. */
  .db-amount, .db-mini, .entry-amount, .entry-sub, .ds-amount, .ds-sub, .sms-val, .er-val, .eb-val, .cr-amount, .cr-sub,
  .dv, .oc-montant, .oc-sub, .es-val, .en-label, .jauge-amount, .jauge-pct, .jauge-foot, .ch-v, .pt-val, .cb-line b,
  .cc-montant, .cc-chiffres, .ct-montant, .ct-sub, .rl-val, .cm-titre, .enc-resume b, .modifie-le, .about-line b,
  .sx-val, .total-liste b,
  input[type=number], input[type=date]{font-variant-numeric:tabular-nums;}
  #app{min-height:100%; display:flex; flex-direction:column;
    /* Le léger glissement des transitions d'écran ne doit jamais créer de
       défilement passager (clip ≠ hidden : l'en-tête reste collant). */
    overflow:clip;}
  a{color:inherit;}
  button{font-family:inherit; color:inherit;}

  /* ---------- Header (bandeau MonDjai, sombre dans les deux thèmes) ---------- */
  .header{
    /* L'en-tête garde l'identité MonDjai : ses éléments lisent les couleurs
       du bandeau, quel que soit le thème. */
    --text:var(--bandeau-text); --text-dim:var(--bandeau-text-dim); --line:var(--bandeau-line);
    --card-grad:var(--bandeau-card-grad); --card-2:var(--bandeau-card-2); --shadow-sm:var(--bandeau-shadow-sm);
    color:var(--text);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:calc(15px + var(--safe-top)) 16px 13px;
    background:var(--header-bg);
    border-bottom:var(--header-border);
    box-shadow:var(--header-shadow);
    position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .brand-emoji{font-size:22px; flex:none;}
  .brand-text{display:flex; flex-direction:column; line-height:1.18; min-width:0;}
  .brand-title{font-size:15px; font-weight:800; letter-spacing:.005em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brand-sub{font-size:10.5px; color:var(--text-dim); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icon-btn{
    background:var(--card-grad); border:1px solid var(--line); color:var(--text);
    width:38px; height:38px; border-radius:12px; font-size:17px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn:active{background:var(--card-2);}
  @media (max-width:380px){
    .header{padding-left:14px; padding-right:14px; gap:6px;}
    .brand{gap:7px;}
    .brand-emoji{font-size:20px;}
    .brand-title{font-size:14px;}
    .header-icons{gap:5px;}
  }
  .icon-btn.epargne-shortcut{
    width:auto; padding:0 10px; gap:5px; flex-direction:row; font-size:15px; font-weight:800;
  }
  .icon-btn.epargne-shortcut .es-emoji{font-size:15px;}
  .icon-btn.epargne-shortcut .es-val{font-size:11px; font-weight:800; color:var(--text); white-space:nowrap;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:14px 16px calc(24px + var(--safe-bottom)); display:flex; flex-direction:column;}
  .main.with-tabbar{padding-bottom: calc(96px + var(--safe-bottom));}

  /* Titres de section suivis d'un fin filet */
  .section-title{display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.06em; margin:4px 0 10px;}
  .section-title::after{content:""; flex:1 1 auto; min-width:16px; height:1px;
    background:var(--filet);}
  .hint{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .hint.tight{margin-top:4px;}

  /* ---------- Onboarding / full pages (no tabbar) ---------- */
  .onb{flex:1; display:flex; flex-direction:column; padding:calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom)); min-height:100%;}
  .onb-head{margin-bottom:18px;}
  .onb-emoji{font-size:40px;}
  .onb-title{font-size:22px; font-weight:800; margin:10px 0 6px;}
  .onb-desc{font-size:14px; color:var(--text-dim); line-height:1.5;}
  .onb-body{flex:1; display:flex; flex-direction:column; justify-content:center;}

  .choice-grid{display:flex; flex-direction:column; gap:12px;}
  .choice-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1.5px solid var(--border); border-radius:16px;
    padding:16px 14px; text-align:left;
  }
  .choice-card.selected{border-color:var(--accent-fill); background:var(--choice-sel-bg);}
  .choice-card .emoji{font-size:30px; width:40px; text-align:center; flex:none;}
  .choice-card .cc-text{flex:1; min-width:0;}
  .choice-card .cc-title{font-size:15.5px; font-weight:700;}
  .choice-card .cc-desc{font-size:12.5px; color:var(--text-dim); margin-top:2px; line-height:1.4;}
  .choice-card .cc-check{
    width:24px; height:24px; border-radius:8px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;
    color:transparent; background:var(--card-2);
  }
  .choice-card.selected .cc-check{background:var(--accent-fill); border-color:var(--accent-fill); color:var(--on-accent);}

  .error-text{color:var(--red); font-size:12.5px; margin-top:10px; line-height:1.4;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:14px; padding:14px 16px; font-size:15px; font-weight:700;
    width:100%;
  }
  .btn-primary{background:linear-gradient(135deg,#f7b443,var(--accent-dark)); color:var(--on-accent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 10px 20px -12px rgba(245,166,35,.75);}
  .btn-secondary{background:var(--card-grad); color:var(--text); border:1px solid var(--btn2-border); box-shadow:var(--shadow-sm);}
  .btn-ghost{background:transparent; color:var(--accent); border:none; padding:10px;}
  .btn-danger{background:var(--danger-bg); color:var(--red); border:1px solid var(--danger-border);}
  .btn-vert{background:linear-gradient(135deg,#3fc58d,#259466); color:#06150e;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 10px 20px -12px rgba(52,179,126,.75);}
  .btn:active{opacity:.88;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{width:auto; flex:1;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; background:var(--tabbar-bg); border-top:1px solid var(--line);
    box-shadow:var(--tabbar-shadow);
    padding:7px 4px calc(8px + var(--safe-bottom));
  }
  .tab{
    flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; color:var(--text-dim); padding:2px 1px; border-radius:12px;
  }
  /* L'onglet actif est marqué par une pastille ambre. */
  .tab .tab-emoji{font-size:19px; line-height:1; width:58px; max-width:100%; height:30px; border-radius:999px;
    display:flex; align-items:center; justify-content:center;}
  .tab .tab-label{font-size:10.5px; font-weight:600; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
  @media (max-width:380px){ .tab .tab-label{font-size:10px; letter-spacing:-.01em;} }
  .tab.active{color:var(--accent);}
  .tab.active .tab-emoji{background:var(--tab-actif-bg); box-shadow:inset 0 0 0 1px var(--tab-actif-ring);}
  .tab.active .tab-label{font-weight:800;}

  /* ---------- List cards ---------- */
  .entry-list{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .entry-card{
    background:var(--card-grad); border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow);
    padding:13px 14px; display:flex; align-items:center; gap:12px; text-align:left; color:var(--text);
  }
  .entry-card:active{background:var(--card-2);}
  .entry-ico{
    width:38px; height:38px; border-radius:12px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    background:radial-gradient(circle at 30% 25%, rgba(245,166,35,.26), rgba(245,166,35,.08));
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.2); color:var(--accent);
  }
  .entry-ico.ico-vert{background:radial-gradient(circle at 30% 25%, rgba(52,179,126,.3), rgba(52,179,126,.08)); box-shadow:inset 0 0 0 1px rgba(52,179,126,.26);}
  .entry-ico.ico-rose{background:radial-gradient(circle at 30% 25%, rgba(232,120,140,.3), rgba(232,120,140,.08)); box-shadow:inset 0 0 0 1px rgba(232,120,140,.26);}
  .entry-ico.ico-rouge{background:radial-gradient(circle at 30% 25%, rgba(255,107,94,.28), rgba(255,107,94,.08)); box-shadow:inset 0 0 0 1px rgba(255,107,94,.24);}
  .entry-ico.ico-turq{background:var(--t-turq-bg); box-shadow:var(--t-turq-ring);}
  .entry-main{flex:1; min-width:0;}
  .entry-title{font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* Un nom long est coupé, jamais le badge qui le suit. */
  .entry-title.et-flex{display:flex; align-items:center; min-width:0;}
  .entry-title .et-nom{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-title .badge{flex:none;}
  .entry-title.et-wrap{white-space:normal; line-height:1.3;}
  .entry-sub{font-size:12px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-amount{font-size:14.5px; font-weight:800; color:var(--accent); flex:none; white-space:nowrap;}
  .entry-amount.neg{color:var(--red);}
  .entry-amount.pos{color:var(--green);}
  .entry-amount.neutre{color:var(--text-dim);}
  .badge{
    display:inline-block; vertical-align:1px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px;
    background:rgba(91,141,239,.15); color:var(--blue); margin-left:6px;
  }
  .badge.badge-credit{background:var(--badge-credit-bg); color:var(--pink);}
  .badge.badge-solde{background:rgba(52,179,126,.15); color:var(--green);}
  .badge.badge-abandon{background:var(--badge-neutre-bg); color:var(--text-dim);}

  /* États vides soignés (pastille, cadre en pointillés discret) */
  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px 16px; color:var(--text-dim); gap:8px;
    border:1px dashed var(--vide-border); border-radius:var(--r-lg); background:var(--vide-bg);
  }
  .empty-state .es-emoji{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:29px; margin-bottom:4px;
    background:radial-gradient(circle at 30% 25%, rgba(245,166,35,.24), rgba(245,166,35,.05));
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.22);}
  .empty-state .es-title{font-size:14.5px; font-weight:800; color:var(--text);}
  .empty-state .es-desc{font-size:12.5px; max-width:260px; line-height:1.5;}

  /* Bouton « + » : toujours juste au-dessus de la barre du bas (hauteur
     réelle mesurée), jamais sur un montant (voir les écrans Aujourd'hui). */
  .fab{
    position:fixed; right:16px; bottom:calc(var(--tabbar-h, 70px) + 18px); z-index:7;
    width:56px; height:56px; border-radius:18px; border:none;
    background:linear-gradient(135deg,#f7b443,var(--accent-dark));
    color:var(--on-accent); font-size:28px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--fab-shadow);
  }
  .fab.fab-salon{bottom:calc(var(--tabbar-h, 70px) + 6px);}
  .fab:active{transform:scale(.96);}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field .label{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
  .field .label .req{color:var(--accent);}
  .input, .select, .textarea{
    width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 13px; font-size:15px; appearance:none;
  }
  .select{background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    padding-right:36px;}
  .input:focus, .select:focus, .textarea:focus{outline:2px solid var(--accent); outline-offset:0;}
  /* Texte indicatif des champs lisible (≥ 4,5:1 sur le fond du champ). */
  .input::placeholder{color:var(--placeholder); opacity:1;}
  .field-error{color:var(--red); font-size:12px; margin-top:6px; line-height:1.4;}
  .field-note{color:var(--text-dim); font-size:11.5px; margin-top:6px; line-height:1.4;}
  .inline-new{margin-top:10px; display:flex; gap:8px;}
  .inline-new .input{flex:1;}
  .inline-new .btn{width:auto; padding:10px 14px; font-size:13px;}
  .field-duo{display:flex; gap:10px;}
  .field-duo .field{flex:1; min-width:0;}

  .radio-row{display:flex; gap:10px;}
  .radio-opt{
    flex:1; text-align:center; background:var(--card-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:12px; padding:12px 8px; font-size:13px; font-weight:700;
  }
  .radio-opt.active{border-color:rgba(245,166,35,.85); color:var(--accent); background:var(--sel-bg-12);
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.35);}
  .radio-opt.active.opt-credit{border-color:rgba(232,120,140,.85); color:var(--pink); background:rgba(232,120,140,.12);
    box-shadow:inset 0 0 0 1px rgba(232,120,140,.35);}
  .radio-opt:disabled{opacity:.4;}
  /* Sprint 8D — choix du thème (Réglages › Affichage) */
  .radio-row.choix-theme{gap:8px;}
  .choix-theme .radio-opt{display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px; min-width:0;}
  .choix-theme .ct-emoji{font-size:18px; line-height:1.2;}
  .choix-theme .ct-nom{font-size:13px; font-weight:800;}
  .choix-theme .ct-sous{font-size:11px; font-weight:600; line-height:1.25;}
  .bloc-credit{border:1px solid rgba(232,120,140,.32); background:linear-gradient(180deg, rgba(232,120,140,.07), rgba(232,120,140,.02));
    border-radius:var(--r-md); padding:14px 12px 2px; margin-bottom:16px;}

  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:var(--card-2); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600;
  }
  .chip.active{border-color:var(--accent-fill); color:var(--accent); background:var(--sel-bg-10);}
  .chip.dashed{border-style:dashed;}

  /* ---------- Modal (feuille du bas avec poignée) ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:var(--overlay); z-index:20;
    display:flex; align-items:flex-end;
  }
  .modal{
    width:100%; max-height:88vh; overflow-y:auto; background:var(--modal-bg);
    border-radius:22px 22px 0 0; border-top:1px solid var(--modal-border);
    box-shadow:var(--modal-shadow);
    padding:10px 18px calc(20px + var(--safe-bottom));
  }
  .modal::before{content:""; display:block; width:40px; height:4px; border-radius:999px; background:var(--modal-poignee); margin:0 auto 12px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .modal-title{font-size:17px; font-weight:800; min-width:0;}
  .modal-close{background:var(--card-grad); border:1px solid var(--line); color:var(--text-dim); flex:none;
    width:32px; height:32px; border-radius:10px; font-size:15px; display:flex; align-items:center; justify-content:center;}

  .detail-row{display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row .dk{color:var(--text-dim);}
  .detail-row .dv{font-weight:700; text-align:right;}

  .confirm-box{background:rgba(255,107,94,.08); border:1px solid rgba(255,107,94,.3); border-radius:14px; padding:14px; margin-top:14px;}
  .confirm-box p{margin:0 0 12px; font-size:13.5px; color:var(--text); line-height:1.45;}

  /* ---------- Réglages / À propos ---------- */
  .reglages-section{margin-bottom:22px;}
  .reglages-section .rs-title{display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:800; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .reglages-section .rs-title::after{content:""; flex:1 1 auto; min-width:16px; height:1px;
    background:var(--filet);}
  .profil-row{
    display:flex; align-items:center; gap:12px; background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:var(--r-md); padding:13px 14px; margin-bottom:10px;
  }
  .profil-row.soon{opacity:1;}
  .profil-row .pr-emoji{font-size:22px; width:30px; text-align:center; flex:none;}
  .profil-row .pr-text{flex:1;}
  .profil-row .pr-title{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .profil-row .pr-desc{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .badge-soon{
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px;
    background:var(--badge-ambre-bg); color:var(--accent); text-transform:uppercase; letter-spacing:.03em;
  }
  .lock-emoji{font-size:16px;}
  .switch{
    width:46px; height:28px; border-radius:999px; background:var(--card-2); border:1px solid var(--border);
    position:relative; flex:none;
  }
  .switch.on{background:var(--accent-fill); border-color:var(--accent-fill);}
  .switch .knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--switch-knob); transition:left .15s;}
  html[data-theme="clair"] .switch:not(.on) .knob{box-shadow:0 1px 2px rgba(16,24,40,.25);}
  .switch.on .knob{left:20px; background:var(--on-accent);}

  .about-line{font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:10px;}
  .mission{font-size:15.5px; font-weight:700; color:var(--text); margin:18px 0 8px;}

  /* ---------- Tableau de bord (cartes) ---------- */
  .dash-solde{
    background:var(--dash-solde-bg);
    border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:var(--r-lg); padding:18px 18px; text-align:center; margin-bottom:14px;
  }
  .dash-solde .ds-label{font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em;}
  .dash-solde .ds-amount{font-size:31px; font-weight:800; margin-top:6px; letter-spacing:-.01em;}
  .dash-solde .ds-amount.neg{color:var(--red);}
  .dash-perte{
    margin-top:12px; background:rgba(255,107,94,.12); border:1px solid rgba(255,107,94,.35);
    border-radius:12px; padding:9px 12px; font-size:12.5px; color:var(--red); font-weight:600; line-height:1.4;
  }
  .solde-mini-stats{display:flex; margin-top:14px; padding-top:13px; border-top:1px solid var(--line);}
  .solde-mini-stats .sms-col{flex:1; text-align:center; min-width:0;}
  .solde-mini-stats .sms-col + .sms-col{border-left:1px solid var(--line);}
  .solde-mini-stats .sms-label{font-size:11.5px; color:var(--text-dim);}
  .solde-mini-stats .sms-val{font-size:15px; font-weight:800; margin-top:4px; white-space:nowrap;}
  .solde-mini-stats .sms-val.neg{color:var(--red);}
  /* Sprint 8D — carte Résultat net (Salon, Mois) : Recettes − Charges, lus
     comme une soustraction (libellé, précision courte, montant). */
  .soustraction{display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); column-gap:6px; align-items:start;
    margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
  .soustraction .sx-label{font-size:12px; font-weight:800; color:var(--text);}
  .soustraction .sx-prec{font-size:11px; color:var(--text-dim); line-height:1.3; margin-top:1px;}
  .soustraction .sx-val{font-size:16px; font-weight:800; margin-top:5px; white-space:nowrap; align-self:end;}
  .soustraction .sx-moins{grid-row:3; grid-column:2; align-self:end; font-size:20px; font-weight:800; line-height:1.2; color:var(--text-dim); padding:0 2px;}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .dash-block{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg);
    padding:20px 10px; text-align:center; color:var(--text); appearance:none; -webkit-appearance:none; font:inherit; min-width:0;}
  .dash-block .db-emoji{font-size:30px;}
  .dash-block .db-label{font-size:11px; color:var(--text-dim); margin-top:6px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
  .dash-block .db-amount{font-size:24px; font-weight:800; margin-top:10px; letter-spacing:-.01em; white-space:nowrap;}
  .dash-block .db-amount.pos{color:var(--green);}
  .dash-block .db-amount.texte{font-size:18px;}
  .dash-block.charges .db-amount{color:var(--red);}
  .dash-block.info{border-style:dashed; border-color:var(--pointilles-border); background:var(--pointilles-bg); box-shadow:none;}
  .dash-block.info .db-amount{color:var(--info-amount);}
  .db-mini{font-size:11px; color:var(--text-dim); font-weight:700; margin-top:3px; white-space:nowrap;}
  .dash-block.fonds.neg .db-amount{color:var(--red);}
  .dash-block.fonds.neg .db-mini{color:var(--red);}
  /* Icônes dans des pastilles teintées (vert = recettes, ambre = mèche,
     turquoise = fonds, bleu = épargne, rose = crédit clientes, gris = info). */
  .db-ico{width:52px; height:52px; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; line-height:1;}
  .t-ambre{background:var(--t-ambre-bg); box-shadow:var(--t-ambre-ring);}
  .t-vert{background:var(--t-vert-bg); box-shadow:var(--t-vert-ring);}
  .t-turq{background:var(--t-turq-bg); box-shadow:var(--t-turq-ring);}
  .t-bleu{background:var(--t-bleu-bg); box-shadow:var(--t-bleu-ring);}
  .t-rouge{background:var(--t-rouge-bg); box-shadow:var(--t-rouge-ring);}
  .t-rose{background:var(--t-rose-bg); box-shadow:var(--t-rose-ring);}
  .t-gris{background:var(--t-gris-bg); box-shadow:var(--t-gris-ring);}
  /* Sprint 8C : icône de la mèche — petit dessin de tresse en SVG intégré. */
  .meche-svg{display:block; flex:none;}
  .db-ico .meche-svg{width:68%; height:68%;}
  .entry-ico .meche-svg{width:24px; height:24px;}
  .charges-card-wrap{margin-top:26px;}
  .charges-row{
    display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-md);
    padding:12px 14px; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);
  }
  .charges-row .cr-emoji{flex:none; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1;}
  .charges-row .cr-label{flex:1; min-width:0; font-size:11.5px; font-weight:700; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:.05em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .charges-row .cr-amount{font-size:16px; font-weight:800; color:var(--red); flex:none; white-space:nowrap;}
  .charges-row .cr-amount.rose{color:var(--pink);}
  .charges-row .cr-suffixe{font-size:11px; font-weight:700; color:var(--text-dim); margin-left:4px;}
  .charges-row .cr-chev{flex:none; font-size:18px; line-height:1; color:var(--text-dim);}
  .charges-row.charges-row-vide{border-style:dashed; border-color:var(--pointilles-border); background:var(--pointilles-bg); box-shadow:none;}
  .charges-row.charges-row-vide .cr-label{color:var(--text-dim);}
  .charges-row.credit-row-dom{margin-top:10px;}
  .charges-card-wrap .caisse-zone{margin-bottom:0;}

  .caisse-zone{margin-bottom:22px;}
  .caisse-zone:last-child{margin-bottom:6px;}

  /* ---------- Aujourd'hui (mode À domicile) ----------
     Écran inchangé ; la page s'arrête au-dessus du bouton « + » quand elle
     défile (petits écrans) : il ne masque jamais un montant. */
  .main.ecran-aujourdhui.domicile{padding-bottom:calc(var(--tabbar-h, 70px) + 88px);}
  .main.ecran-aujourdhui.domicile .dash-solde{padding:16px 18px;}

  /* Sprint 8D — sur Aujourd'hui, le titre et la première carte se posent sur
     le bandeau MonDjai (sombre). Thème clair : le bandeau descend derrière
     le titre et jusqu'au milieu de la première carte (hauteur mesurée après
     chaque rendu : --bandeau-h), bas arrondi à 26 px. */
  .main.ecran-aujourdhui > .section-title{color:var(--bandeau-text-dim);}
  .main.ecran-aujourdhui > .section-title::after{background:var(--bandeau-filet);}
  .main.ecran-aujourdhui > .dash-solde{box-shadow:var(--carte-bandeau-shadow); border-color:var(--carte-bandeau-border);}
  html[data-theme="clair"] .main.ecran-aujourdhui{position:relative; isolation:isolate;}
  html[data-theme="clair"] .main.ecran-aujourdhui::before{content:""; position:absolute; z-index:-1; left:0; right:0; top:0;
    height:var(--bandeau-h, 84px); background:var(--bandeau); border-radius:0 0 26px 26px; pointer-events:none;}

  /* ---------- Aujourd'hui (mode Salon) ----------
     Recette du jour → tuiles 2×2 → jauge → reprise → alerte du fonds. Les
     tuiles s'étirent entre l'en-tête et la barre du bas (--tabbar-h mesurée
     après chaque rendu) : pas de défilement à 390×844. Le bouton « + » se
     pose dans un couloir laissé libre en bas à droite du dernier élément. */
  .main.ecran-aujourdhui.salon{padding-top:12px; padding-bottom:var(--tabbar-h, 70px); gap:9px;}
  .main.ecran-aujourdhui.salon .section-title{margin:0;}
  .main.ecran-aujourdhui.salon .dash-solde{margin:0; padding:12px 16px 11px;}
  .main.ecran-aujourdhui.salon .dash-solde .ds-amount{font-size:clamp(24px, 4vh, 34px); margin-top:2px;}
  .main.ecran-aujourdhui.salon .ds-sub{margin-top:3px;}
  .main.ecran-aujourdhui.salon .dash-grid{flex:1 1 auto; grid-template-rows:1fr 1fr; gap:9px; margin:0; min-height:0;}
  .main.ecran-aujourdhui.salon .dash-block{display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:5px 8px; min-height:0;}
  .main.ecran-aujourdhui.salon .dash-block .db-ico{width:clamp(34px, 6vh, 54px); height:clamp(34px, 6vh, 54px); font-size:clamp(17px, 2.9vh, 26px);}
  .main.ecran-aujourdhui.salon .dash-block .db-amount{font-size:clamp(17px, 3vh, 26px); margin-top:clamp(4px, 1vh, 10px); line-height:1.15;}
  .main.ecran-aujourdhui.salon .dash-block .db-amount.texte{font-size:clamp(15px, 2.3vh, 19px);}
  .main.ecran-aujourdhui.salon .dash-block .db-label{font-size:10.5px; margin-top:clamp(2px, .4vh, 4px);}
  .main.ecran-aujourdhui.salon .dash-block .db-mini{margin-top:2px;}
  .bas-salon{display:flex; flex-direction:column; gap:9px; flex:none;}
  .bas-salon > *{margin:0 !important;}
  /* Couloir du bouton « + » : les lignes du bas laissent leur côté droit
     libre (le bouton se pose là, juste au-dessus de la barre du bas). */
  .bas-salon .jauge-card .jauge-foot,
  .bas-salon .jauge-card .jauge-link{padding-right:50px;}
  .bas-salon .jauge-card .jauge-link{margin-top:8px;}
  .bas-salon > .reprise-banner,
  .bas-salon > .alerte-ligne{padding-right:70px;}
  .bas-salon > .reprise-banner .rb-chev{display:none;}
  /* Alerte du fonds sur Aujourd'hui : une ligne courte (le détail est dans
     la fenêtre du fonds et dans « Détails du mois »). */
  .alerte-ligne{display:flex; align-items:center; gap:10px; width:100%; text-align:left; font:inherit; color:var(--text);
    background:var(--alerte-bg); border:1px solid var(--alerte-border);
    border-radius:14px; padding:11px 14px; appearance:none; -webkit-appearance:none;}
  .alerte-ligne .al-emoji{flex:none; font-size:17px;}
  .alerte-ligne .al-txt{flex:1; min-width:0; font-size:12.5px; font-weight:700; line-height:1.35;}
  .alerte-ligne .al-txt b{color:var(--red-soft); white-space:nowrap;}
  @media (max-height:700px){
    .main.ecran-aujourdhui.salon{padding-top:9px; gap:6px;}
    .main.ecran-aujourdhui.salon .dash-grid{gap:6px;}
    .main.ecran-aujourdhui.salon .dash-solde{padding:8px 14px 8px;}
    .main.ecran-aujourdhui.salon .dash-solde .ds-label{font-size:10.5px;}
    .main.ecran-aujourdhui.salon .ds-sub{font-size:11px;}
    .main.ecran-aujourdhui.salon .dash-block{padding:3px 6px;}
    .main.ecran-aujourdhui.salon .dash-block .db-ico{width:32px; height:32px; font-size:16px;}
    .main.ecran-aujourdhui.salon .dash-block .db-amount{margin-top:3px;}
    .main.ecran-aujourdhui.salon .dash-block .db-label{font-size:9.5px;}
    .main.ecran-aujourdhui.salon .dash-block .db-mini{font-size:10px; margin-top:1px;}
    .bas-salon{gap:6px;}
    .bas-salon .jauge-card{padding:9px 12px;}
    .bas-salon .jauge-card .jauge-amount{font-size:17px;}
    .bas-salon .jauge-card .jauge-bar{margin-top:7px; height:8px;}
    .bas-salon .jauge-card .jauge-foot{font-size:11.5px; margin-top:6px;}
    .bas-salon .jauge-card .jauge-link{font-size:11.5px; margin-top:5px;}
    .bas-salon > .reprise-banner, .bas-salon > .alerte-ligne{padding-top:9px; padding-bottom:9px; padding-left:12px;}
  }

  /* ---------- Mon état ---------- */
  /* Jour / Semaine / Mois en contrôle segmenté (pastille ambre teintée) */
  .etat-tabs{display:flex; gap:4px; margin-bottom:14px; padding:4px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);}
  .etat-tab{flex:1; text-align:center; background:transparent; border:none; color:var(--text-dim);
    border-radius:10px; padding:9px 6px; font-size:13px; font-weight:700;}
  .etat-tab.active{color:var(--accent); background:rgba(245,166,35,.15); box-shadow:inset 0 0 0 1px rgba(245,166,35,.5);}
  .etat-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
  .etat-nav .en-btn{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow-sm); color:var(--text); width:38px; height:38px;
    border-radius:12px; font-size:18px; display:flex; align-items:center; justify-content:center; flex:none;}
  .etat-nav .en-btn:disabled{opacity:.3; box-shadow:none;}
  .etat-nav .en-label{font-size:14px; font-weight:800; text-align:center; flex:1;}
  .etat-stats{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .etat-stat-row{display:flex; justify-content:space-between; align-items:center; background:var(--card-grad); border:1px solid var(--line);
    border-radius:12px; padding:11px 14px;}
  .etat-stat-row .er-label{font-size:13px; color:var(--text-dim);}
  .etat-stat-row .er-val{font-size:15px; font-weight:800;}
  .etat-stat-row .er-val.neg{color:var(--red);}
  .etat-breakdown{margin-top:6px; margin-bottom:18px;}
  .etat-breakdown .eb-title{font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
  .eb-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .eb-row:last-child{border-bottom:none;}
  .eb-row .eb-nom{color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .eb-row .eb-val{font-weight:700; white-space:nowrap;}
  .eb-row.eb-total{border-top:1.5px solid rgba(245,166,35,.55); margin-top:-1px;}
  .eb-row.eb-total .eb-nom, .eb-row.eb-total .eb-val{font-weight:800;}

  /* Sprint 8C — bouton « Détails du mois » (style du bouton « Ce mois-ci »
     de Revente-E). */
  .mois-btn{position:relative; flex:none; width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    padding:12px 14px 12px 12px; border-radius:var(--r-lg); color:var(--text); font:inherit; appearance:none; -webkit-appearance:none;
    background:var(--mois-btn-bg);
    border:1px solid var(--mois-btn-border); margin-bottom:18px;
    box-shadow:var(--mois-btn-shadow);}
  .mois-btn .cm-ico{position:relative; flex:none; width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:22px; line-height:1; background:radial-gradient(circle at 30% 25%, rgba(245,166,35,.42), rgba(245,166,35,.14));
    box-shadow:inset 0 0 0 1px rgba(245,166,35,.45);}
  .mois-btn .cm-main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .mois-btn .cm-titre{font-size:clamp(14px, 4.1vw, 16px); font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mois-btn .cm-titre .cm-mois{color:var(--accent);}
  .mois-btn .cm-sous{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* Un point d'attention écrit en clair peut tenir sur deux lignes. */
  .mois-btn .cm-sous.attention{color:var(--red-soft); font-weight:700; white-space:normal; line-height:1.35;}
  .mois-btn .cm-chev{flex:none; font-size:26px; line-height:1; color:var(--accent); margin-top:-2px;}
  .mois-btn .cm-pastille{position:absolute; top:-4px; right:-4px; width:13px; height:13px; border-radius:50%;
    background:var(--red); box-shadow:0 0 0 2.5px var(--pastille-ring);}
  .attention-box{background:linear-gradient(135deg, rgba(255,107,94,.12), rgba(255,107,94,.04)); border:1px solid rgba(255,107,94,.36);
    border-radius:var(--r-md); padding:11px 14px; margin-bottom:14px; font-size:12.5px; line-height:1.5;}
  .attention-box b{color:var(--red-soft);}
  .attention-box ul{margin:4px 0 0; padding-left:18px;}

  /* ---------- Header : plusieurs icônes ---------- */
  .header-icons{display:flex; align-items:center; gap:6px; flex:none;}

  /* ---------- Code d'accès / PIN ---------- */
  .code-acces-onb .onb-body{align-items:center; text-align:center;}
  .code-acces-onb .onb-title, .code-acces-onb .onb-desc{width:100%;}
  .code-acces-lock{font-size:52px; margin-bottom:4px;}
  .code-acces-field{width:100%; margin-top:22px; margin-bottom:0;}
  .code-acces-input{
    text-align:center; letter-spacing:.2em; text-transform:uppercase;
    font-size:19px; font-weight:800; border:2px solid var(--accent-fill);
    background:rgba(245,166,35,.07);
  }
  .code-acces-input:focus{outline:2px solid var(--accent-fill); outline-offset:1px;}
  .code-acces-mention{
    margin-top:16px; font-size:11px; color:var(--text-dim); text-align:center; line-height:1.5;
  }
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:18px 0 22px;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); background:var(--card-2);}
  .pin-dot.filled{background:var(--accent-fill); border-color:var(--accent-fill);}
  .pin-dot.filled.err{background:var(--red); border-color:var(--red);}
  .pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:280px; margin:0 auto;}
  .pin-key{
    background:var(--card-grad); border:1px solid var(--line); color:var(--text); box-shadow:var(--shadow-sm);
    border-radius:16px; font-size:20px; font-weight:700; padding:16px 0;
  }
  .pin-key:active{background:var(--card-2);}
  .pin-key-empty{background:transparent; border:none; box-shadow:none;}

  /* ---------- Objectif d'épargne ---------- */
  .objectif-rappel{
    background:rgba(91,141,239,.1); border:1px solid rgba(91,141,239,.3); border-radius:14px;
    padding:12px 14px; font-size:12.5px; color:var(--text); line-height:1.5; margin-bottom:16px;
  }
  .objectif-card{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg); padding:16px; margin-bottom:12px;}
  .objectif-card .oc-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .objectif-card .oc-emoji{font-size:22px;}
  .objectif-card .oc-nom{font-size:15px; font-weight:800; flex:1;}
  .objectif-card .oc-montant{font-size:22px; font-weight:800; color:var(--accent);}
  .objectif-card .oc-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .objectif-card .oc-actions{display:flex; gap:8px; margin-top:12px;}
  .objectif-card .oc-actions .btn{font-size:12.5px; padding:10px;}
  .objectif-slot-vide{
    background:var(--card-2); border:1.5px dashed var(--border); border-radius:16px; padding:16px;
    margin-bottom:12px; text-align:center; position:relative; overflow:hidden;
  }
  .objectif-slot-vide .osv-ghost-icons{font-size:26px; letter-spacing:12px; opacity:.35; filter:blur(0.5px);}
  .objectif-slot-vide .osv-badge{
    display:inline-block; margin-top:10px; font-size:11.5px; font-weight:800; color:var(--accent);
    background:var(--badge-ambre-bg); border:1px solid rgba(245,166,35,.4); border-radius:999px; padding:5px 12px;
  }

  /* ---------- étape « Vous mettez de côté pour quoi ? » (modèles) ---------- */
  .modele-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .modele-tile{
    background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg); padding:18px 10px;
    text-align:center; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);
  }
  .modele-tile.active{border-color:rgba(245,166,35,.85); background:var(--sel-bg-10); box-shadow:inset 0 0 0 1px rgba(245,166,35,.35);}
  .modele-tile .mt-emoji{font-size:30px; margin-bottom:8px;}
  .modele-tile .mt-nom{font-size:14px; font-weight:800;}
  .modele-tile .mt-desc{font-size:11px; color:var(--text-dim); margin-top:4px; line-height:1.3;}

  /* ---------- Télécharger ---------- */
  .partager-canvas-wrap{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-lg); padding:10px; margin-bottom:16px; overflow:hidden;}
  .partager-canvas-wrap canvas{width:100%; height:auto; display:block; border-radius:10px;}
  /* Flou progressif de l'aperçu (Sprint 7) — inchangé. Les boutons
     Télécharger/Partager recalculent un vrai flou sur les pixels exportés. */
  .tc-blur-layer{
    position:absolute; left:0; top:0; right:0;
    filter:blur(16px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, transparent 28%, black 36%, black 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, transparent 28%, black 36%, black 100%);
  }
  /* Posée sur l'image (toujours sombre, dans les deux thèmes) : ambre vif. */
  .partager-overlay-abo{
    position:absolute; left:50%; top:74%; transform:translate(-50%,-50%);
    background:rgba(17,20,26,.75); border:1px solid rgba(245,166,35,.5); color:var(--accent-fill);
    font-size:14px; font-weight:800; text-align:center; padding:12px 20px; border-radius:14px;
    max-width:80%; line-height:1.4;
  }

  /* ---------- Autres charges (rubriques) ---------- */
  .rub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .rub-tile{
    display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card-2);
    border:1px solid var(--border); border-radius:14px; padding:12px 6px; text-align:center; min-width:0;
  }
  .rub-tile.selected{border-color:rgba(245,166,35,.85); background:var(--sel-bg-12); box-shadow:inset 0 0 0 1px rgba(245,166,35,.35);}
  .rub-tile .rub-icon{font-size:20px;}
  .rub-tile .rub-nom{font-size:11px; font-weight:600; line-height:1.25; overflow-wrap:anywhere;}
  .rub-manage-row{
    display:flex; align-items:center; gap:12px; background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow-sm);
    border-radius:var(--r-md); padding:11px 14px; margin-bottom:8px;
  }
  .rub-manage-row .rm-emoji{font-size:18px; width:26px; text-align:center; flex:none;}
  .rub-manage-row .rm-nom{flex:1; font-size:13.5px; font-weight:600;}
  .rub-manage-row .rm-del{background:none; border:none; color:var(--text-dim); font-size:15px; padding:4px;}

  /* ---------- Sprint 8A/8B : mode Salon ---------- */
  .dash-solde.as-btn{display:block; width:100%; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);}
  .ds-badge{display:inline-block; margin-left:6px; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.03em; vertical-align:middle;}
  .ds-badge.provisoire{background:var(--badge-ambre-bg); color:var(--accent);}
  .ds-badge.definitif{background:rgba(52,179,126,.15); color:var(--green);}
  .ds-sub{font-size:12px; color:var(--text-dim); margin-top:6px;}

  .jauge-card{display:block; width:100%; text-align:left; background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow);
    border-radius:var(--r-lg); padding:14px; margin-bottom:12px; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);}
  .jauge-head{font-size:11.5px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em;}
  .jauge-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:6px;}
  .jauge-amount{font-size:20px; font-weight:800; white-space:nowrap;}
  .jauge-pct{font-size:13px; font-weight:800; color:var(--accent); white-space:nowrap;}
  .jauge-pct.ok{color:var(--green);}
  .jauge-bar{height:10px; background:var(--jauge-bar-bg); border:1px solid var(--jauge-bar-border); border-radius:999px; overflow:hidden; margin-top:10px;}
  .jauge-fill{height:100%; background:var(--jauge-fill); border-radius:999px;}
  .jauge-fill.ok{background:var(--jauge-fill-ok);}
  .jauge-foot{font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.4;}
  .jauge-link{font-size:12px; font-weight:700; color:var(--accent); margin-top:8px;}

  .alerte-douce{background:linear-gradient(135deg, rgba(245,166,35,.1), rgba(245,166,35,.04)); border:1px solid rgba(245,166,35,.35); border-radius:12px;
    padding:10px 12px; font-size:12.5px; color:var(--text); line-height:1.45; margin:10px 0;}

  .reprise-banner{display:flex; align-items:center; gap:10px; width:100%; text-align:left; margin-bottom:12px;
    background:var(--reprise-bg); border:1.5px dashed var(--reprise-border); border-radius:14px; padding:12px 14px;
    appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);}
  .reprise-banner .rb-emoji{font-size:19px; flex:none;}
  .reprise-banner .rb-text{flex:1; min-width:0; font-size:13px; font-weight:700; line-height:1.35;}
  .reprise-banner .rb-chev{color:var(--accent); font-weight:800; flex:none;}
  .reprise-row{background:var(--card-grad); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px;}
  .reprise-row .rr-head{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700;}
  .reprise-row .rr-nom{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .reprise-row .rr-prev{font-size:11.5px; color:var(--text-dim); font-weight:600; white-space:nowrap;}
  .reprise-row .rr-actions{display:flex; gap:8px; margin-top:10px;}
  .reprise-row .rr-actions .input{flex:1; min-width:0; padding:10px 11px; font-size:14px;}
  .reprise-row .rr-actions .btn{width:auto; padding:10px 12px; font-size:12.5px; flex:none;}

  /* Sprint 8D — feuille « Charges du mois » : total de la liste (= jauge). */
  .total-liste{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:10px 4px 2px; margin-top:2px;
    border-top:1.5px solid rgba(245,166,35,.55); font-size:13.5px; font-weight:800;}
  .total-liste b{font-size:15px; white-space:nowrap;}

  .credit-bilan{margin-top:8px;}
  .credit-bilan .cb-line{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; color:var(--text-dim);}
  .credit-bilan .cb-line b{color:var(--text);}
  .credit-bilan .jauge-bar{height:8px; margin-top:8px;}
  .credit-row{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-md); padding:13px 14px; margin-bottom:10px;}
  .credit-row .cr-top{display:flex; align-items:center; gap:10px;}
  .credit-row .cr-ico{font-size:20px; flex:none;}
  .credit-row .cr-txt{flex:1; min-width:0;}
  .credit-row .cr-nom{font-size:14px; font-weight:700;}
  .credit-row .cr-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .credit-row .cr-edit{width:auto; padding:8px 12px; font-size:12px; flex:none;}

  .chaine-row{display:flex; justify-content:space-between; gap:10px; padding:9px 2px; font-size:13.5px; border-bottom:1px solid var(--line);}
  .chaine-row:last-child{border-bottom:none;}
  .chaine-row .ch-k{color:var(--text-dim); min-width:0;}
  .chaine-row .ch-v{font-weight:700; white-space:nowrap;}
  .chaine-row.total{font-size:14.5px; border-top:1.5px solid rgba(245,166,35,.55); border-bottom:none; margin-top:-1px;}
  .chaine-row.total .ch-k{color:var(--text); font-weight:800;}
  .chaine-row.total .ch-v{font-weight:800;}
  /* Sprint 8D — lignes « dont … » sous une ligne de la chaîne. */
  .chaine-row.dont .ch-k{padding-left:12px;}
  .chaine-row.dont .ch-v{font-weight:600; color:var(--text-dim);}
  .chaine-box{background:var(--card-grad); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--r-md); padding:4px 12px; margin-bottom:14px;}
  /* Sprint 8B — vues Salon / Coiffure / Onglerie (contrôle segmenté ambre) */
  .vue-tabs{display:flex; gap:4px; margin-bottom:10px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-md); padding:4px;
    box-shadow:var(--seg-shadow);}
  .vue-tab{flex:1; border:none; background:transparent; color:var(--text-dim); border-radius:11px; padding:9px 4px; font-size:13px; font-weight:800; min-width:0; white-space:nowrap;}
  .vue-tab.active{background:linear-gradient(135deg,#f7b443,var(--accent-dark)); color:var(--on-accent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 4px 12px -6px rgba(245,166,35,.8);}
  .pct-total{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--card-grad); border:1px solid var(--line);
    border-radius:12px; padding:11px 14px; margin:4px 0 8px;}
  .pct-total .pt-label{font-size:12.5px; color:var(--text-dim); line-height:1.4;}
  .pct-total .pt-val{font-size:16px; font-weight:800; color:var(--green); white-space:nowrap;}
  .pct-total .pt-val.over{color:var(--red);}
  .tag-fonds{display:inline-block; font-size:10px; font-weight:800; padding:1px 7px; border-radius:999px; margin-left:4px;
    background:rgba(79,209,197,.12); color:var(--turquoise); vertical-align:middle;}

  /* ---------- Sprint 8C : crédit clientes ---------- */

  .credit-carte .cc-reste{flex:none; text-align:right;}

  .credit-carte .cc-montant{font-size:18px; font-weight:800; color:var(--pink); white-space:nowrap;}
  .credit-carte .cc-chiffres{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--text-dim); margin-top:9px; padding-top:9px; border-top:1px solid var(--line);}

  .replier{display:flex; align-items:center; justify-content:space-between; width:100%; background:transparent; border:none; padding:10px 2px;

  body.maj-visible .main.ecran-aujourdhui.domicile{padding-bottom:calc(var(--tabbar-h, 70px) + 88px + 62px);}

  .diag-install .detail-row{font-size:12.5px; padding:8px 0;}

  /* ---------- Retour visuel au toucher (léger enfoncement) ---------- */
  .btn, .entry-card, .dash-block, .charges-row, .mois-btn, .jauge-card, .reprise-banner, .alerte-ligne, .vue-tab, .etat-tab, .en-btn,
  .icon-btn, .radio-opt, .chip, .rub-tile, .modele-tile, .choice-card, .pin-key, .modal-close, .tab .tab-emoji, .fab, .replier{
    transition:transform .12s ease, background-color .15s ease, opacity .15s ease;
  }
  .btn:active, .entry-card:active, button.dash-block:active, .charges-row:active, .mois-btn:active, button.jauge-card:active,
  .reprise-banner:active, .alerte-ligne:active, .vue-tab:active, .etat-tab:active, .en-btn:active, .icon-btn:active, .radio-opt:active, .chip:active,
  .rub-tile:active, .modele-tile:active, .choice-card:active, .pin-key:active, .modal-close:active{transform:scale(.97);}
  .tab:active .tab-emoji{transform:scale(.92);}
  button.dash-solde.as-btn:active{transform:scale(.985);}

  /* ---------- Transitions courtes ---------- */
  /* Ajoutées par le script UNIQUEMENT lors d'un vrai changement d'écran,
     d'onglet, d'écran secondaire ou de feuille du bas (jamais à chaque
     redessin : toucher un bouton dans un formulaire ne rejoue rien). */
  @keyframes mdjEcranIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  @keyframes mdjFondIn{from{opacity:0;} to{opacity:1;}}
  @keyframes mdjFeuilleIn{from{opacity:.5; transform:translateY(56px);} to{opacity:1; transform:none;}}
  @keyframes mdjContenuIn{from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:none;}}
  .anim-ecran{animation:mdjEcranIn .18s ease-out;}
  .modal-overlay.anim-in{animation:mdjFondIn .18s ease-out;}
  .modal-overlay.anim-in .modal{animation:mdjFeuilleIn .2s cubic-bezier(.2,.8,.25,1);}
  .modal.anim-swap{animation:mdjContenuIn .16s ease-out;}

  /* Mouvement réduit demandé par le téléphone : aucune animation ni transition. */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation:none !important; transition:none !important;}
    .btn:active, .entry-card:active, button.dash-block:active, .charges-row:active, .mois-btn:active, button.jauge-card:active,
    .reprise-banner:active, .vue-tab:active, .etat-tab:active, .en-btn:active, .icon-btn:active, .radio-opt:active, .chip:active,
    .rub-tile:active, .modele-tile:active, .choice-card:active, .pin-key:active, .modal-close:active, .fab:active,
    .tab:active .tab-emoji, button.dash-solde.as-btn:active{transform:none !important; opacity:.8;}
  }

<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  // MonDjai/Coiffure — Sprint 5B. Fork de MonDjai/Salon F (Sprint 4C), recentré
  // sur un seul profil (Coiffure) : première application indépendante d'une
  // famille appelée à compter, plus tard, Revente et Pédicure comme applications
  // séparées, avant une éventuelle fusion. Voir le cahier des charges Sprint 5
  // (section 12, prompt Sprint 5B) pour le détail exact de ce qui est livré ici.
  //
  // Sprint 5B (par-dessus la structure livrée au Sprint 5A) :
  //  - Accès mensuel : bornes calendaires (1er au dernier jour du mois civil) au
  //    lieu de la fenêtre glissante de 30 jours. Le mois d'installation reste le
  //    mois d'essai gratuit avec le code d'accès initial (HKETCK, inchangé).
  //    Installation avant le 15 → essai jusqu'à la fin de ce même mois ;
  //    à partir du 15 → essai jusqu'à la fin du mois civil suivant. À partir du
  //    2ᵉ mois, puis à chaque fin de mois civil, le code de réabonnement du mois
  //    en cours est demandé (fonction de calcul déterministe inchangée).
  //  - Secret de calcul du code mensuel propre à Coiffure (SECRET_MENSUEL_COIFFURE),
  //    distinct de celui de Salon F : les codes des deux applications ne sont
  //    plus jamais interchangeables.
  //  - F11 : au moment de l'export, proposition du dossier de destination via
  //    l'API File System Access (showSaveFilePicker) quand le navigateur la
  //    supporte ; repli automatique et silencieux sur le téléchargement dans le
  //    dossier par défaut sinon (notamment Safari/iPhone) — aucune perte de
  //    fonctionnalité ni de donnée dans les deux cas.
  //  - Comme au Sprint 5A : aucun appel réseau n'est introduit par ces
  //    changements ; tout le calcul (code du mois, bornes calendaires) reste
  //    entièrement local.
  //
  // Sprint 8A (amendement n°1 « Mode Salon », socle financier) :
  //  - Réglage « Je travaille : à domicile / en salon » (config.modeTravail,
  //    défaut "domicile"). En mode À domicile, rien ne change par rapport au
  //    Sprint 7bis : mêmes écrans, mêmes calculs, mêmes rubriques.
  //  - Mode Salon : rubriques CIE / SODECI séparées, Mairie, BURIDA, Produits
  //    coiffure, Produits onglerie, Remboursement de crédit (ajoutées à la
  //    liste au premier passage en mode Salon, jamais avant).
  //  - Charges mensuelles : chaque charge est rattachée à un mois concerné
  //    (autresCharges[].moisConcerne "AAAA-MM", repli sur le mois de la date
  //    pour les charges plus anciennes) et déduite du résultat net de ce mois,
  //    jamais au jour le jour. Reprise des montants du mois précédent, à
  //    confirmer ou modifier. Jauge « à couvrir » pendant le mois.
  //  - Fonds de renouvellement des produits (montant fixe par mois ou % des
  //    recettes du mois), versionné par mois pour ne jamais réécrire un mois
  //    passé ; les achats de produits sont payés par le fonds (jamais comptés
  //    deux fois). Solde = prévisions cumulées − achats, alerte douce si < 0.
  //  - Remboursement de crédit : type de prêteur, montant total facultatif,
  //    bilan remboursé / reste dû depuis la première saisie.
  //  - Résultat net du mois = Recettes − Charges du mois − Fonds du mois.
  //
  // Sprint 8B (amendement n°1, suite — points 2 et 4 validés par Hamadou) :
  //  - Rémunération de la propriétaire et liste de salariés : montant fixe ou
  //    % du résultat net du mois (clause convenue), versionnés par mois
  //    (une clause modifiée ne réécrit jamais un mois terminé).
  //  - Épargne mensuelle (fixe ou %) sur le même résultat net, en mode Salon
  //    (config.epargneMensuelle, versionnée) ; épargne inchangée en mode À
  //    domicile. Garde-fou : le total des pourcentages (propriétaire +
  //    salariés + épargne) ne peut pas dépasser 100 % du résultat net.
  //  - Répartition : Résultat net → propriétaire → salariés → épargne
  //    = Reste (trésorerie du salon). Résultat net négatif : parts en %
  //    à zéro, montants fixes maintenus avec alerte douce.
  //  - Menu « Activité » (Coiffure / Onglerie) en mode Salon, formulaire
  //    allégé pour l'onglerie (activité, montant, date) ; vues Mon état
  //    Coiffure, Onglerie et Salon.
  //  - Télécharger en mode Salon : recettes par activité et résultat net,
  //    sans aucune rémunération ; flou réellement calculé sur les pixels
  //    exportés (mécanisme du Sprint 7bis, inchangé).
  //
  // Sprint 8C (remarques d'Hamadou du 16/10/2026, après test du 8B) :
  //  - Crédit clientes (deux modes) : une prestation peut être « À crédit »
  //    (nom de la cliente, prix, déjà payé). Comptabilité de trésorerie : la
  //    recette compte le jour où l'argent est reçu — le montant payé le jour
  //    de la prestation (mainOeuvre) ce jour-là, chaque encaissement ultérieur
  //    à sa propre date (encaissementsCredit[]). Le reste dû n'entre dans aucun
  //    calcul tant qu'il n'est pas reçu ; Mes habitudes comptent le prix total.
  //    Une seule fonction de recettes (recettesPeriode) remplace l'ancienne
  //    somme partout : sans crédit, tous les chiffres restent ceux du 8B.
  //  - Aujourd'hui (Salon) : Recette du jour → tuiles Fonds produits, Mèche,
  //    Épargne du mois, Crédit clientes → jauge → reprise → alerte du fonds,
  //    sans défilement à 390×844. Plus de tuile Transport en Salon (le champ
  //    reste sur les prestations « À domicile »). À domicile : écran inchangé,
  //    plus une ligne « Crédit clientes » dès qu'un crédit existe.
  //  - Mèche : petit dessin de tresse en SVG intégré (mecheSvg), à la place
  //    de l'image de perruque.
  //  - Mon état (Salon, Mois) allégé : le détail passe dans une feuille du
  //    bas « Détails du mois » (aucun calcul modifié), avec une pastille quand
  //    il y a un point d'attention.
  //  - Socle repris de MonDjai/Revente (Sprint E) : mise à jour automatique
  //    (sw.js + VERSION_APP), bouton retour du téléphone (pile de feuilles),
  //    modification des prestations et des charges avec piste d'audit
  //    (modifieLe, versionsPrecedentes), finitions visuelles et transitions.
  //  - Données : clé inchangée ; ajouts non destructifs : encaissementsCredit[],
  //    prestationsCoiffure[].credit, modifieLe / versionsPrecedentes.
  //
  // Sprint 8D (observations d'Hamadou du 17/10/2026 + thème clair validé) :
  //  - AUCUN calcul ne change : seuls l'affichage, les libellés et le thème.
  //  - Aujourd'hui (Salon) : tuiles [Main d'œuvre][Crédit clientes] /
  //    [Épargne du mois][Mèche] ; la tuile Fonds produits quitte l'écran
  //    (l'alerte courte reste). Main d'œuvre = argent reçu aujourd'hui pour
  //    la coiffure ; la carte Recette du jour dit « dont onglerie … ». Jauge
  //    « Charges du mois à couvrir » (le fonds produits fait partie des
  //    charges) ; feuille Charges du mois en deux listes (charges comptées,
  //    prévision du fonds en tête, qui tombent juste sur la jauge ; achats de
  //    produits payés par le fonds, à part, jamais ajoutés).
  //  - « Fonds produits » remplace partout « Fonds de renouvellement ».
  //  - Mon état (Salon) : vues Salon · Coiffure · Onglerie ; carte Résultat
  //    net = Recettes − Charges (deux chiffres) ; « Reste du salon » quitte
  //    l'écran (gardé dans la feuille : « Reste après rémunérations et
  //    épargne ») ; ligne d'attention en clair quand il n'y a qu'un point.
  //  - Thème clair « bandeau MonDjai » par défaut, Automatique ou Sombre au
  //    choix (state.config.theme ; absent = clair, lu à la volée, jamais
  //    réécrit tant que l'utilisatrice ne choisit pas).
  //  - Réglages › « Installer l'application » : gestes adaptés au téléphone
  //    (Huawei / HarmonyOS, iPhone, Android, ordinateur), bouton
  //    « Installer » quand le navigateur le propose, diagnostic (navigateur,
  //    ouverte comme application, hors ligne prêt).

  var STORAGE_KEY = "mondjai_coiffure_state_v1";

  // Version affichée dans Réglages → À propos, pour vérifier d'un coup d'œil
  // quelle version tourne sur un téléphone. Le numéro de cache doit être le
  // même que VERSION_CACHE dans sw.js.
  var VERSION_APP = "Coiffure-8D · cache 11";
  var PREFIXE_CACHE_APP = "mondjai-coiffure-";

  // Sprint 8C : icône de la mèche — petit dessin de tresse (trois mèches
  // entrelacées, tons ambre et brun du thème), en SVG intégré au fichier :
  // aucune image externe, net à toutes les tailles (lisible de 22 à 40 px).
  function mecheSvg(taille, extraClasse){
    var t = taille ? ' width="' + taille + '" height="' + taille + '"' : '';
    // Maillons de la tresse : alternance gauche / droite (motif en épi),
    // chaque maillon recouvre légèrement le précédent → effet entrelacé.
    var maillons = "";
    var pas = 3.7;
    for(var i = 0; i < 7; i++){
      var gauche = (i % 2 === 0);
      var y = 12.4 + i * pas;
      var cx = gauche ? 20.7 : 27.3;
      var rot = gauche ? 38 : -38;
      maillons +=
        '<g transform="rotate(' + rot + ' ' + cx + ' ' + y.toFixed(1) + ')">' +
          '<ellipse cx="' + cx + '" cy="' + y.toFixed(1) + '" rx="6.7" ry="3.5" fill="' + (gauche ? '#f5a623' : '#df8d1b') + '" stroke="#4d2e06" stroke-width="1.35"/>' +
          '<path d="M' + (cx - 3.6) + ' ' + (y - 1.15).toFixed(1) + ' Q' + cx + ' ' + (y - 2.6).toFixed(1) + ' ' + (cx + 3.6) + ' ' + (y - 1.15).toFixed(1) + '" fill="none" stroke="#ffd98a" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>' +
        '</g>';
    }
    return (
      '<svg class="meche-svg' + (extraClasse ? ' ' + extraClasse : '') + '" viewBox="0 0 48 48"' + t + ' role="img" aria-label="Mèche" focusable="false">' +
        // racine de la tresse (cheveux)
        '<path d="M15.6 12.6 Q16.4 4.2 24 4 Q31.6 4.2 32.4 12.6 Q24 8.6 15.6 12.6 Z" fill="#9a5d12" stroke="#4d2e06" stroke-width="1.35" stroke-linejoin="round"/>' +
        maillons +
        // attache
        '<rect x="19.4" y="37.4" width="9.2" height="4" rx="2" fill="#e8788c" stroke="#4d2e06" stroke-width="1.2"/>' +
        // pointe libre
        '<path d="M21 41.6 Q20 44.6 18.2 46 M24 41.6 L24 46.4 M27 41.6 Q28 44.6 29.8 46" fill="none" stroke="#df8d1b" stroke-width="1.9" stroke-linecap="round"/>' +
      '</svg>'
    );
  }

  /* ================= Helpers ================= */

  function uid(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }
  function formatDateFr(s){
    if(!s) return "";
    var parts = s.split("-");
    if(parts.length !== 3) return s;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  // Sprint 8C (comme Revente-E) : vrai signe moins (U+2212) — avec les
  // chiffres à chasse fixe, le trait d'union se détachait du nombre.
  function formatFCFA(n){
    var num = Math.round(Number(n) || 0);
    var neg = num < 0;
    num = Math.abs(num);
    var s = String(num).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "−" : "") + s + " F";
  }
  // Montant jamais coupé en fin de ligne (« 15 / 000 F »).
  function montantInsecable(n){ return formatFCFA(n).replace(/ /g, " "); }
  function toNum(v){
    var n = parseFloat(String(v === undefined || v === null ? "" : v).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function byId(id){ return document.getElementById(id); }

  /* ================= Données par défaut ================= */

  var QUARTIERS_DEFAUT = [
    "Cocody","Yopougon","Abobo","Adjamé","Plateau","Treichville","Marcory",
    "Koumassi","Port-Bouët","Attécoubé","Bingerville","Songon","Anyama"
  ];
  var TYPES_CLIENTE_DEFAUT = ["Jeune fille","Jeune dame","Jeune dame mariée"];
  var TYPES_COIFFURE_DEFAUT = ["Boho Braids","Knot Less","Faux locs","Tissage","Twist"];

  function seedList(names){
    return names.map(function(nom){ return { id: uid("d"), nom: nom, perso:false }; });
  }

  var RUBRIQUES_CHARGES_DEFAUT = [
    { id:"loyer", nom:"Loyer / local", emoji:"🏠", actif:true },
    { id:"decoration", nom:"Décoration / aménagement", emoji:"🎨", actif:false },
    { id:"publicite", nom:"Publicité", emoji:"📣", actif:true },
    { id:"entretien_salon", nom:"Entretien du salon", emoji:"🧹", actif:true },
    { id:"electricite", nom:"Électricité / eau", emoji:"💡", actif:false },
    { id:"autre", nom:"Autre", emoji:"📝", actif:true }
  ];
  function seedRubriquesCharges(){
    return RUBRIQUES_CHARGES_DEFAUT.map(function(r){
      return { id:r.id, nom:r.nom, emoji:r.emoji, actif:r.actif, perso:false };
    });
