<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#11141a" />
<title>MonDjai/Coiffure</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root{
    --bg:#11141a;
    --card:#1b2029;
    --card-2:#20262f;
    --border:#2a303c;
    --text:#eef1f6;
    --text-dim:#b7bfcc;
    --accent:#f5a623;
    --accent-dark:#c9840f;
    --green:#34b37e;
    --red:#ff6b5e;
    --blue:#5b8def;
    --turquoise:#4fd1c5;
    --pink:#e8788c;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none; color-scheme:dark;}
  #app{min-height:100%; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit; color:inherit;}

  /* ---------- Header ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg,#161b23,#11141a);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-emoji{font-size:22px;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-title{font-size:16px; font-weight:700;}
  .brand-sub{font-size:11.5px; color:var(--text-dim);}
  .icon-btn{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    width:40px; height:40px; border-radius:12px; font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{background:var(--card-2);}
  .icon-btn.epargne-shortcut{
    width:auto; padding:0 12px; gap:6px; flex-direction:row; font-size:16px; font-weight:800;
  }
  .icon-btn.epargne-shortcut .es-emoji{font-size:16px;}
  .icon-btn.epargne-shortcut .es-val{font-size:12px; font-weight:800; color:var(--text); white-space:nowrap;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:14px 16px calc(24px + var(--safe-bottom)); display:flex; flex-direction:column;}
  .main.with-tabbar{padding-bottom: calc(96px + var(--safe-bottom));}

  .section-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.04em; margin:4px 0 10px;}
  .hint{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .hint.tight{margin-top:4px;}

  /* ---------- Onboarding / full pages (no tabbar) ---------- */
  .onb{flex:1; display:flex; flex-direction:column; padding:calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom)); min-height:100%;}
  .onb-head{margin-bottom:18px;}
  .onb-emoji{font-size:40px;}
  .onb-title{font-size:22px; font-weight:800; margin:10px 0 6px;}
  .onb-desc{font-size:14px; color:var(--text-dim); line-height:1.5;}
  .onb-body{flex:1; display:flex; flex-direction:column; justify-content:center;}

  .choice-grid{display:flex; flex-direction:column; gap:12px;}
  .choice-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1.5px solid var(--border); border-radius:16px;
    padding:16px 14px; text-align:left;
  }
  .choice-card.selected{border-color:var(--accent); background:linear-gradient(135deg,#241d10,#1c2029);}
  .choice-card .emoji{font-size:30px; width:40px; text-align:center; flex:none;}
  .choice-card .cc-text{flex:1; min-width:0;}
  .choice-card .cc-title{font-size:15.5px; font-weight:700;}
  .choice-card .cc-desc{font-size:12.5px; color:var(--text-dim); margin-top:2px; line-height:1.4;}
  .choice-card .cc-check{
    width:24px; height:24px; border-radius:8px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;
    color:transparent; background:var(--card-2);
  }
  .choice-card.selected .cc-check{background:var(--accent); border-color:var(--accent); color:#1b1200;}

  .error-text{color:var(--red); font-size:12.5px; margin-top:10px; line-height:1.4;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:14px; padding:14px 16px; font-size:15px; font-weight:700;
    width:100%;
  }
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#1b1200;}
  .btn-secondary{background:var(--card); color:var(--text); border:1px solid var(--border);}
  .btn-ghost{background:transparent; color:var(--accent); border:none; padding:10px;}
  .btn-danger{background:rgba(255,107,94,.12); color:var(--red); border:1px solid rgba(255,107,94,.4);}
  .btn:active{opacity:.85;}
  .btn:disabled{opacity:.4; pointer-events:none;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{width:auto; flex:1;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; background:#161b23; border-top:1px solid var(--border);
    padding:8px 6px calc(8px + var(--safe-bottom));
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; color:var(--text-dim); padding:6px 2px; border-radius:12px;
  }
  .tab .tab-emoji{font-size:20px;}
  .tab .tab-label{font-size:10.5px; font-weight:600;}
  .tab.active{color:var(--accent);}
  .tab.active .tab-emoji{transform:translateY(-1px);}

  /* ---------- List cards ---------- */
  .entry-list{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .entry-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; display:flex; align-items:center; gap:12px; text-align:left;
  }
  .entry-card:active{background:var(--card-2);}
  .entry-ico{
    width:38px; height:38px; border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    background:rgba(245,166,35,.12); color:var(--accent);
  }
  .entry-main{flex:1; min-width:0;}
  .entry-title{font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-sub{font-size:12px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-amount{font-size:14px; font-weight:700; color:var(--accent); flex:none; white-space:nowrap;}
  .entry-amount.neg{color:var(--red);}

  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px 10px; color:var(--text-dim); gap:8px;
  }
  .empty-state .es-emoji{font-size:38px; opacity:.7;}
  .empty-state .es-title{font-size:14.5px; font-weight:700; color:var(--text);}
  .empty-state .es-desc{font-size:12.5px; max-width:260px; line-height:1.5;}

  .fab{
    position:fixed; right:18px; bottom:calc(92px + var(--safe-bottom)); z-index:7;
    width:56px; height:56px; border-radius:18px; border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#1b1200; font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(245,166,35,.35);
  }
  .fab:active{transform:scale(.96);}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field .label{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
  .field .label .req{color:var(--accent);}
  .input, .select, .textarea{
    width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 13px; font-size:15px; appearance:none;
  }
  .select{background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    padding-right:36px;}
  .input:focus, .select:focus, .textarea:focus{outline:2px solid var(--accent); outline-offset:0;}
  .field-error{color:var(--red); font-size:12px; margin-top:6px;}
  .field-note{color:var(--text-dim); font-size:11.5px; margin-top:6px; line-height:1.4;}
  .inline-new{margin-top:10px; display:flex; gap:8px;}
  .inline-new .input{flex:1;}
  .inline-new .btn{width:auto; padding:10px 14px; font-size:13px;}

  .radio-row{display:flex; gap:10px;}
  .radio-opt{
    flex:1; text-align:center; background:var(--card-2); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:12px; padding:12px 8px; font-size:13px; font-weight:700;
  }
  .radio-opt.active{border-color:var(--accent); color:var(--accent); background:rgba(245,166,35,.1);}

  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:var(--card-2); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600;
  }
  .chip.active{border-color:var(--accent); color:var(--accent); background:rgba(245,166,35,.1);}
  .chip.dashed{border-style:dashed;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,12,.6); z-index:20;
    display:flex; align-items:flex-end;
  }
  .modal{
    width:100%; max-height:88vh; overflow-y:auto; background:var(--bg);
    border-radius:20px 20px 0 0; border-top:1px solid var(--border);
    padding:18px 18px calc(20px + var(--safe-bottom));
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-title{font-size:17px; font-weight:800;}
  .modal-close{background:var(--card); border:1px solid var(--border); color:var(--text-dim);
    width:32px; height:32px; border-radius:10px; font-size:15px; display:flex; align-items:center; justify-content:center;}

  .detail-row{display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row .dk{color:var(--text-dim);}
  .detail-row .dv{font-weight:700; text-align:right;}

  .confirm-box{background:rgba(255,107,94,.08); border:1px solid rgba(255,107,94,.3); border-radius:14px; padding:14px; margin-top:14px;}
  .confirm-box p{margin:0 0 12px; font-size:13.5px; color:var(--text);}

  /* ---------- Réglages / À propos ---------- */
  .reglages-section{margin-bottom:22px;}
  .reglages-section .rs-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
  .profil-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:13px 14px; margin-bottom:10px;
  }
  .profil-row.soon{opacity:1;}
  .profil-row .pr-emoji{font-size:22px; width:30px; text-align:center; flex:none;}
  .profil-row .pr-text{flex:1;}
  .profil-row .pr-title{font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .profil-row .pr-desc{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .badge-soon{
    display:inline-block; font-size:10px; font-weight:800; padding:2px 8px; border-radius:999px;
    background:rgba(245,166,35,.14); color:var(--accent); text-transform:uppercase; letter-spacing:.03em;
  }
  .lock-emoji{font-size:16px;}
  .switch{
    width:46px; height:28px; border-radius:999px; background:var(--card-2); border:1px solid var(--border);
    position:relative; flex:none;
  }
  .switch.on{background:var(--accent); border-color:var(--accent);}
  .switch .knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on .knob{left:20px; background:#1b1200;}

  .about-line{font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:10px;}
  .mission{font-size:15.5px; font-weight:700; color:var(--text); margin:18px 0 8px;}

  /* ---------- F7 : Tableau de bord ---------- */
  .dash-solde{
    background:linear-gradient(135deg,var(--card),var(--card-2)); border:1px solid var(--border);
    border-radius:18px; padding:20px 18px; text-align:center; margin-bottom:14px;
  }
  .dash-solde .ds-label{font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
  .dash-solde .ds-amount{font-size:32px; font-weight:800; margin-top:6px;}
  .dash-solde .ds-amount.neg{color:var(--red);}
  .dash-perte{
    margin-top:12px; background:rgba(255,107,94,.12); border:1px solid rgba(255,107,94,.35);
    border-radius:12px; padding:9px 12px; font-size:12.5px; color:var(--red); font-weight:600; line-height:1.4;
  }
  .solde-mini-stats{display:flex; margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
  .solde-mini-stats .sms-col{flex:1; text-align:center;}
  .solde-mini-stats .sms-label{font-size:11.5px; color:var(--text-dim);}
  .solde-mini-stats .sms-val{font-size:15px; font-weight:800; margin-top:4px;}
  .solde-mini-stats .sms-val.neg{color:var(--red);}
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .dash-block{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:26px 12px; text-align:center; appearance:none; -webkit-appearance:none; font:inherit;}
  .dash-block .db-emoji{font-size:34px;}
  .meche-icon-img{display:inline-block; object-fit:contain; vertical-align:middle;}
  .db-emoji .meche-icon-img{width:34px; height:34px;}
  .entry-ico .meche-icon-img{width:22px; height:22px;}
  .dash-block .db-label{font-size:12px; color:var(--text-dim); margin-top:6px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .dash-block .db-amount{font-size:24px; font-weight:800; margin-top:10px;}
  .dash-block.charges .db-amount{color:var(--red);}
  .dash-block.info{border-style:dashed;}
  .dash-block.info .db-amount{color:var(--text-dim);}
  /* Sprint 7 (observations terrain post-Sprint 6) : espacement plus généreux
     entre les tuiles Aujourd'hui et la carte Charges communes du salon. */
  .charges-card-wrap{margin-top:26px;}
  /* Sprint 7 (retouches suite au test du Sprint 6) : la carte « Charges
     communes du salon » passe d'une grande tuile carrée à une ligne
     compacte (icône + libellé + montant sur une seule ligne), pour ne plus
     risquer de chevaucher le bouton flottant « + » — hauteur réduite
     d'environ moitié par rapport à l'ancienne tuile, dans les deux variantes
     (vide et remplie). */
  .charges-row{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:12px 14px; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);
  }
  .charges-row .cr-emoji{font-size:19px; flex:none; line-height:1;}
  .charges-row .cr-label{flex:1; min-width:0; font-size:12px; font-weight:700; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:.03em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .charges-row .cr-amount{font-size:16px; font-weight:800; color:var(--red); flex:none; white-space:nowrap;}
  .charges-row.charges-row-vide{border-style:dashed;}
  .charges-row.charges-row-vide .cr-label{color:var(--text-dim);}

  .caisse-zone{margin-bottom:22px;}
  .caisse-zone:last-child{margin-bottom:6px;}
  .cz-header{font-size:13px; font-weight:800; color:var(--accent); margin-bottom:10px;
    text-transform:uppercase; letter-spacing:.03em;}
  .cz-header.cz-header-muted{color:var(--text-dim);}

  /* ---------- F8 : Mon état ---------- */
  .etat-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .etat-tab{flex:1; text-align:center; background:var(--card); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:12px; padding:10px 6px; font-size:13px; font-weight:700;}
  .etat-tab.active{border-color:var(--accent); color:var(--accent); background:rgba(245,166,35,.1);}
  .etat-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .etat-nav .en-btn{background:var(--card); border:1px solid var(--border); color:var(--text); width:36px; height:36px;
    border-radius:10px; font-size:16px; display:flex; align-items:center; justify-content:center;}
  .etat-nav .en-btn:disabled{opacity:.35;}
  .etat-nav .en-label{font-size:13.5px; font-weight:700; text-align:center; flex:1;}
  .etat-stats{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .etat-stat-row{display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:11px 14px;}
  .etat-stat-row .er-label{font-size:13px; color:var(--text-dim);}
  .etat-stat-row .er-val{font-size:15px; font-weight:800;}
  .etat-stat-row .er-val.neg{color:var(--red);}
  .etat-breakdown{margin-top:6px; margin-bottom:18px;}
  .etat-breakdown .eb-title{font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
  .eb-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .eb-row:last-child{border-bottom:none;}
  .eb-row .eb-nom{color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .eb-row .eb-val{font-weight:700; white-space:nowrap;}

  /* ---------- Header : plusieurs icônes ---------- */
  .header-icons{display:flex; align-items:center; gap:8px;}

  /* ---------- Code d'accès / PIN ---------- */
  .code-acces-onb .onb-body{align-items:center; text-align:center;}
  .code-acces-onb .onb-title, .code-acces-onb .onb-desc{width:100%;}
  .code-acces-lock{font-size:52px; margin-bottom:4px;}
  .code-acces-field{width:100%; margin-top:22px; margin-bottom:0;}
  .code-acces-input{
    text-align:center; letter-spacing:.2em; text-transform:uppercase;
    font-size:19px; font-weight:800; border:2px solid var(--accent);
    background:rgba(245,166,35,.07);
  }
  .code-acces-input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .code-acces-mention{
    margin-top:16px; font-size:11px; color:var(--text-dim); text-align:center; line-height:1.5;
  }
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:18px 0 22px;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); background:var(--card-2);}
  .pin-dot.filled{background:var(--accent); border-color:var(--accent);}
  .pin-dot.filled.err{background:var(--red); border-color:var(--red);}
  .pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .pin-key{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:16px; font-size:20px; font-weight:700; padding:16px 0;
  }
  .pin-key:active{background:var(--card-2);}
  .pin-key-empty{background:transparent; border:none;}

  /* ---------- F9 : Objectif d'épargne ---------- */
  .objectif-rappel{
    background:rgba(91,141,239,.1); border:1px solid rgba(91,141,239,.3); border-radius:14px;
    padding:12px 14px; font-size:12.5px; color:var(--text); line-height:1.5; margin-bottom:16px;
  }
  .objectif-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .objectif-card .oc-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .objectif-card .oc-emoji{font-size:22px;}
  .objectif-card .oc-nom{font-size:15px; font-weight:800; flex:1;}
  .objectif-card .oc-montant{font-size:22px; font-weight:800; color:var(--accent);}
  .objectif-card .oc-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .objectif-card .oc-actions{display:flex; gap:8px; margin-top:12px;}
  .objectif-card .oc-actions .btn{font-size:12.5px; padding:10px;}
  .objectif-slot-vide{
    background:var(--card-2); border:1.5px dashed var(--border); border-radius:16px; padding:16px;
    margin-bottom:12px; text-align:center; position:relative; overflow:hidden;
  }
  .objectif-slot-vide .osv-ghost-icons{font-size:26px; letter-spacing:12px; opacity:.35; filter:blur(0.5px);}
  .objectif-slot-vide .osv-badge{
    display:inline-block; margin-top:10px; font-size:11.5px; font-weight:800; color:var(--accent);
    background:rgba(245,166,35,.14); border:1px solid rgba(245,166,35,.4); border-radius:999px; padding:5px 12px;
  }

  /* ---------- F9 : étape « Vous mettez de côté pour quoi ? » (modèles) ---------- */
  .modele-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .modele-tile{
    background:var(--card); border:1.5px solid var(--border); border-radius:16px; padding:18px 10px;
    text-align:center; appearance:none; -webkit-appearance:none; font:inherit; color:var(--text);
  }
  .modele-tile.active{border-color:var(--accent); background:rgba(245,166,35,.1);}
  .modele-tile .mt-emoji{font-size:30px; margin-bottom:8px;}
  .modele-tile .mt-nom{font-size:14px; font-weight:800;}
  .modele-tile .mt-desc{font-size:11px; color:var(--text-dim); margin-top:4px; line-height:1.3;}

  /* ---------- F10 : Télécharger ---------- */
  .partager-canvas-wrap{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:10px; margin-bottom:16px; overflow:hidden;}
  .partager-canvas-wrap canvas{width:100%; height:auto; display:block; border-radius:10px;}
  /* Sprint 7 (observations terrain) : flou progressif de l'aperçu Télécharger —
     un second canvas, copie du premier, flouté et masqué en dégradé pour ne
     couvrir que le bas de l'image (le haut — titre + solde net — reste net
     pour donner envie). Les boutons Télécharger/Partager utilisent toujours le
     canvas net sous-jacent, jamais celui-ci. */
  .tc-blur-layer{
    position:absolute; left:0; top:0; right:0;
    filter:blur(16px);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0%, transparent 28%, black 36%, black 100%);
    mask-image:linear-gradient(to bottom, transparent 0%, transparent 28%, black 36%, black 100%);
  }
  .partager-overlay-abo{
    position:absolute; left:50%; top:74%; transform:translate(-50%,-50%);
    background:rgba(17,20,26,.75); border:1px solid rgba(245,166,35,.5); color:var(--accent);
    font-size:14px; font-weight:800; text-align:center; padding:12px 20px; border-radius:14px;
    max-width:80%; line-height:1.4;
  }

  /* ---------- Autres charges (rubriques) ---------- */
  .rub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .rub-tile{
    display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card-2);
    border:1.5px solid var(--border); border-radius:14px; padding:12px 6px; text-align:center;
  }
  .rub-tile.selected{border-color:var(--accent); background:rgba(245,166,35,.1);}
  .rub-tile .rub-icon{font-size:20px;}
  .rub-tile .rub-nom{font-size:11px; font-weight:600; line-height:1.25;}
  .rub-manage-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:11px 14px; margin-bottom:8px;
  }
  .rub-manage-row .rm-emoji{font-size:18px; width:26px; text-align:center; flex:none;}
  .rub-manage-row .rm-nom{flex:1; font-size:13.5px; font-weight:600;}
  .rub-manage-row .rm-del{background:none; border:none; color:var(--text-dim); font-size:15px; padding:4px;}
</style>

  var STORAGE_KEY = "mondjai_coiffure_state_v1";

  /* ================= Helpers ================= */

  function uid(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }
  function formatDateFr(s){
    if(!s) return "";
    var parts = s.split("-");
    if(parts.length !== 3) return s;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function formatFCFA(n){
    var num = Math.round(Number(n) || 0);
    var neg = num < 0;
    num = Math.abs(num);
    var s = String(num).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "-" : "") + s + " F";
  }
  function toNum(v){
    var n = parseFloat(String(v === undefined || v === null ? "" : v).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function byId(id){ return document.getElementById(id); }

  /* ================= Données par défaut ================= */

  var QUARTIERS_DEFAUT = [
    "Cocody","Yopougon","Abobo","Adjamé","Plateau","Treichville","Marcory",
    "Koumassi","Port-Bouët","Attécoubé","Bingerville","Songon","Anyama"
  ];
  var TYPES_CLIENTE_DEFAUT = ["Jeune fille","Jeune dame","Jeune dame mariée"];
  var TYPES_COIFFURE_DEFAUT = ["Boho Braids","Knot Less","Faux locs","Tissage","Twist"];

  function seedList(names){
    return names.map(function(nom){ return { id: uid("d"), nom: nom, perso:false }; });
  }

  var RUBRIQUES_CHARGES_DEFAUT = [
    { id:"loyer", nom:"Loyer / local", emoji:"🏠", actif:true },
    { id:"decoration", nom:"Décoration / aménagement", emoji:"🎨", actif:false },
    { id:"publicite", nom:"Publicité", emoji:"📣", actif:true },
    { id:"entretien_salon", nom:"Entretien du salon", emoji:"🧹", actif:true },
    { id:"electricite", nom:"Électricité / eau", emoji:"💡", actif:false },
    { id:"autre", nom:"Autre", emoji:"📝", actif:true }
  ];
  function seedRubriquesCharges(){
    return RUBRIQUES_CHARGES_DEFAUT.map(function(r){
      return { id:r.id, nom:r.nom, emoji:r.emoji, actif:r.actif, perso:false };
    });
  }

  function defaultState(){
    return {
      version: 1,
      config: {
        typesCliente: seedList(TYPES_CLIENTE_DEFAUT),
        quartiers: seedList(QUARTIERS_DEFAUT),
        typesCoiffure: seedList(TYPES_COIFFURE_DEFAUT),
        rubriquesCharges: seedRubriquesCharges(),
        codeAccesOk: false,
        derniereValidationAcces: null,
        moisAccesValide: null,        // { mois, annee } — dernier mois civil couvert par l'accès (essai ou code mensuel)
        pinActif: false,
        pinCode: null
      },
      prestationsCoiffure: [],
      autresCharges: [],
      objectifEpargne: null,        // { id, nom, type:'auto'|'manuel', pourcentage, dateCreation }
      objectifsVerrouilles: [],      // objectifs migrés au-delà du 1er (données conservées, jamais affichées en détail)
      meta: { creation: todayStr(), derniereSauvegarde: null }
    };
  }

  function merge(base, extra){
    var out = {};
    for(var k in base) out[k] = base[k];
    if(extra) for(var k2 in extra) if(extra[k2] !== undefined) out[k2] = extra[k2];
    return out;
  }

  var state;

  // Fusion défensive d'un état chargé (localStorage) ou importé (F11 JSON) avec
  // l'état par défaut. Accepte aussi, en repli, une sauvegarde faite depuis
  // MonDjai/Salon F (mêmes champs prestationsCoiffure/autresCharges/config de
  // base) — les données propres aux autres profils (achats, ventes, prestations
  // pédicure) sont ignorées puisque cette application ne gère plus que Coiffure,
  // mais rien n'est perdu : un fichier non reconnu par une section précise est
  // simplement filtré à cette section, jamais utilisé pour refuser tout l'import.
  function normaliserEtatImporte(parsed){
    var base = defaultState();
    if(!parsed || typeof parsed !== "object") return base;
    var out = merge(base, parsed);
    out.config = merge(base.config, parsed.config || {});
    if(!Array.isArray(out.config.typesCliente) || !out.config.typesCliente.length) out.config.typesCliente = base.config.typesCliente;
    if(!Array.isArray(out.config.quartiers) || !out.config.quartiers.length) out.config.quartiers = base.config.quartiers;
    if(!Array.isArray(out.config.typesCoiffure) || !out.config.typesCoiffure.length) out.config.typesCoiffure = base.config.typesCoiffure;
    if(!Array.isArray(out.config.rubriquesCharges) || !out.config.rubriquesCharges.length) out.config.rubriquesCharges = base.config.rubriquesCharges;
    if(!Array.isArray(out.prestationsCoiffure)) out.prestationsCoiffure = [];
    if(!Array.isArray(out.autresCharges)) out.autresCharges = [];
    if(!Array.isArray(out.objectifsVerrouilles)) out.objectifsVerrouilles = [];
    if(out.objectifEpargne && typeof out.objectifEpargne !== "object") out.objectifEpargne = null;
    out.meta = merge(base.meta, parsed.meta || {});
    migrerLieuPrestations(out);
    migrerObjectifsCoiffure(out, parsed);
    migrerValidationAcces(out);
    migrerAccesCalendaire(out);
    return out;
  }

  // Amendement Sprint 2 (Salon F) : champ "lieu" (domicile/salon). Toute
  // prestation enregistrée avant cet amendement (ou provenant d'un très ancien
  // fichier) n'a pas de champ `lieu` — traitée par défaut comme "à domicile",
  // sans perte ni altération d'aucune autre donnée déjà saisie.
  function migrerLieuPrestations(out){
    out.prestationsCoiffure.forEach(function(p){
      if(p.lieu !== "domicile" && p.lieu !== "salon") p.lieu = "domicile";
    });
  }

  // Amendement Sprint 4C (Salon F) : un état déjà validé (codeAccesOk vrai)
  // mais sans horodatage de dernière validation vient forcément d'avant ce
  // mécanisme — on lui accorde une nouvelle période de 30 jours à partir de
  // maintenant plutôt que de considérer l'accès expiré dès la mise à jour de
  // l'application.
  function migrerValidationAcces(out){
    if(out.config.codeAccesOk && !out.config.derniereValidationAcces){
      out.config.derniereValidationAcces = Date.now();
    }
  }

  // Sprint 5B, section 10 : passage de l'accès mensuel en fenêtre glissante de
  // 30 jours (Sprint 4C/5A) à des bornes calendaires. Un état déjà validé
  // (codeAccesOk vrai) qui n'a pas encore de `moisAccesValide` vient forcément
  // d'avant ce mécanisme. On calcule le mois d'essai qui aurait dû s'appliquer
  // à partir de la date d'installation réelle (`meta.creation`, fixée dès le
  // tout premier lancement et jamais réécrite depuis) ; si une validation plus
  // récente existe (ancien renouvellement sous la fenêtre glissante), on ne
  // fait jamais reculer l'accès déjà acquis — on couvre au moins son mois. Une
  // migration technique ne doit jamais bloquer immédiatement une utilisatrice
  // déjà à jour.
  function migrerAccesCalendaire(out){
    if(!out.config.codeAccesOk) return;
    if(out.config.moisAccesValide) return;
    var installation = parseDateStr(out.meta.creation) || new Date();
    var couverture = finEssaiPourInstallation(installation);
    if(out.config.derniereValidationAcces){
      var dv = new Date(out.config.derniereValidationAcces);
      var moisValidation = { mois: dv.getMonth()+1, annee: dv.getFullYear() };
      if(compareMoisAnnee(moisValidation, couverture) > 0) couverture = moisValidation;
    }
    out.config.moisAccesValide = couverture;
  }

  // Cahier des charges Sprint 5A, section 5 : l'épargne devient un pourcentage
  // de la Main d'œuvre, avec un seul objectif actif et 2 emplacements grisés en
  // annonce. Migration : un objectif déjà créé au Sprint ≤4B (modèle Salon F —
  // pourcentage du solde net en mode auto, ou montant fixe/jour en mode manuel,
  // jusqu'à 3 par profil) est repris ; s'il y en avait plusieurs pour le profil
  // Coiffure, le plus récemment modifié devient l'objectif actif de cette
  // application, les autres basculent en "verrouillés" (grisés, données
  // conservées mais non affichées en détail — aucune perte). Faute d'horodatage
  // de modification dans l'ancien modèle, on utilise la date de création comme
  // meilleure approximation disponible (le plus souvent la même chose en
  // pratique), avec l'id (qui encode l'instant de création) comme départage.
  function migrerObjectifsCoiffure(out, parsed){
    if(out.objectifEpargne) return; // déjà au nouveau format (ré-import d'un export Coiffure)
    if(!parsed || !Array.isArray(parsed.objectifs) || !parsed.objectifs.length) return;
    var candidats = parsed.objectifs.filter(function(o){ return !o.profil || o.profil === "coiffure"; });
    if(!candidats.length) return;
    candidats = candidats.slice().sort(function(a,b){
      var da = a.dateCreation || "", db = b.dateCreation || "";
      if(da !== db) return da < db ? 1 : -1;
      var ia = String(a.id||""), ib = String(b.id||"");
      return ia < ib ? 1 : -1;
    });
    var principal = candidats[0];
    var pourcentage = (principal.pourcentage !== undefined && principal.pourcentage !== null && principal.pourcentage > 0) ? principal.pourcentage : 10;
    out.objectifEpargne = {
      id: principal.id || uid("obj"),
      nom: principal.nom || "Épargne",
      type: principal.type === "manuel" ? "manuel" : "auto",
      pourcentage: pourcentage,
      dateCreation: principal.dateCreation || todayStr()
    };
    out.objectifsVerrouilles = (out.objectifsVerrouilles||[]).concat(candidats.slice(1));
  }

  function loadState(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return defaultState();
    var parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ return defaultState(); }
    return normaliserEtatImporte(parsed);
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* stockage indisponible : on continue quand même */ }
  }

  /* ================= F11 : Sauvegarde / restauration JSON ================= */

  // Sprint 5B, note technique section 10/F11 : quand le navigateur propose
  // l'API File System Access (Chrome/Edge/Android), on laisse l'utilisatrice
  // choisir le dossier de destination. Sinon (notamment Safari/iPhone), repli
  // automatique et silencieux sur le téléchargement dans le dossier par défaut
  // — comportement du Sprint 5A, inchangé. Aucun appel réseau dans les deux cas.
  function exporterJson(){
    var filename = "mondjai-coiffure-" + todayStr() + ".json";
    var contenu = JSON.stringify(state, null, 2);
    if(typeof window.showSaveFilePicker === "function"){
      exporterJsonAvecChoixDossier(contenu, filename);
    } else {
      exporterJsonTelechargementDirect(contenu, filename);
    }
  }
  function marquerSauvegardeReussie(message){
    state.meta.derniereSauvegarde = todayStr();
    saveState();
    ui.backupMsg = message;
    render();
  }
  function exporterJsonTelechargementDirect(contenu, filename){
    try{
      var blob = new Blob([contenu], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      marquerSauvegardeReussie("Sauvegarde téléchargée.");
    }catch(e){
      ui.backupMsg = "Impossible de générer le fichier sur cet appareil.";
      render();
    }
  }

  var CODE_ACCES_ATTENDU = "HKETCK";

  // Accès mensuel — mécanisme de calcul repris tel quel du Sprint 4C de Salon F
  // (même algorithme déterministe, 100% local, aucun appel réseau), mais avec,
  // depuis le Sprint 5B : un secret propre à Coiffure (les codes des deux
  // applications ne sont plus jamais interchangeables) et des bornes
  // calendaires plutôt qu'une fenêtre glissante de 30 jours (voir plus bas,
  // finEssaiPourInstallation/accesMensuelExpire). Secret utilisé également par
  // l'outil séparé outil-code-mensuel-coiffure.html (non livré aux
  // utilisatrices) pour calculer les codes de réabonnement.
  var SECRET_MENSUEL_COIFFURE = "MDJ-COIFFURE-2026-R4XN";
  var LETTRES_CODE_MENSUEL = "ABCDEFGHJKLMNPQRSTUVWXYZ";

  function hashFnv1a(str){
    var h = 2166136261;
    for(var i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }
  function fmix32(h){
    h ^= h >>> 16;
    h = Math.imul(h, 0x85ebca6b) >>> 0;
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35) >>> 0;
    h ^= h >>> 16;
    return h >>> 0;
  }
  function codeAccesDuMois(mois, annee, secret){
    var base = String(secret) + "|" + String(annee) + "-" + pad2(mois) + "|";
    var code = "";
    for(var i=0;i<6;i++){
      var h = fmix32(hashFnv1a(base + i));
      code += LETTRES_CODE_MENSUEL.charAt(h % LETTRES_CODE_MENSUEL.length);
    }
    return code;
  }
  function codeAccesDuMoisAttenduAujourdhui(){
    var d = new Date();
    return codeAccesDuMois(d.getMonth()+1, d.getFullYear(), SECRET_MENSUEL_COIFFURE);
  }

  // ----- Bornes calendaires (Sprint 5B, section 10) -----

  // Parse une date "YYYY-MM-DD" (format utilisé par todayStr/meta.creation) en
  // objet Date local — jamais via `new Date(chaine)`, qui peut être interprété
  // en UTC selon le moteur et décaler le jour d'une unité près de minuit.
  function parseDateStr(s){
    if(!s) return null;
    var parts = String(s).split("-");
    if(parts.length !== 3) return null;
    var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
    if(!y || !m || !d) return null;
    return new Date(y, m-1, d);
  }
  function moisSuivant(mois, annee){
    mois = mois + 1;
    if(mois > 12){ mois = 1; annee = annee + 1; }
    return { mois: mois, annee: annee };
  }
  // Compare deux { mois, annee } : négatif si a < b, positif si a > b, 0 si égal.
  function compareMoisAnnee(a, b){
    if(a.annee !== b.annee) return a.annee - b.annee;
    return a.mois - b.mois;
  }
  // Cahier Sprint 5B, section 10 : installation avant le 15 du mois → essai
  // jusqu'à la fin de ce même mois civil ; à partir du 15 → essai jusqu'à la
  // fin du mois civil suivant (garantit dans tous les cas au moins deux
  // semaines pleines d'essai, le cas le plus court étant une installation le
  // 14, quel que soit le mois).
  function finEssaiPourInstallation(dateInstallation){
    var jour = dateInstallation.getDate();
    var mois = dateInstallation.getMonth()+1;
    var annee = dateInstallation.getFullYear();
    if(jour < 15) return { mois: mois, annee: annee };
    return moisSuivant(mois, annee);
  }
  // Accès expiré dès que le mois civil en cours dépasse le dernier mois
  // couvert (`moisAccesValide`) — plus de calcul en jours écoulés depuis une
  // dernière validation. Comme avant : aucune donnée n'est jamais supprimée
  // pendant qu'un renouvellement est en attente, seul l'accès est bloqué.
  function accesMensuelExpire(){
    if(!state.config.codeAccesOk) return false;
    var couverture = state.config.moisAccesValide;
    if(!couverture) return false; // état inattendu (migration en attente) : ne jamais bloquer par sécurité
    var d = new Date();
    var actuel = { mois: d.getMonth()+1, annee: d.getFullYear() };
    return compareMoisAnnee(actuel, couverture) > 0;
  }

  /* ================= Calculs ================= */

  function sortByDateDesc(arr){
    return arr.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts||0) - (a.ts||0);
    });
  }

  function dateFromStr(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }

  function getDayRange(d){ var k = dateKey(d); return { start:k, end:k }; }
  function getWeekRange(d){
    var day = d.getDay();
    var diffLundi = (day === 0) ? -6 : (1 - day);
    var lundi = new Date(d); lundi.setDate(d.getDate() + diffLundi);
    var dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6);
    return { start: dateKey(lundi), end: dateKey(dimanche) };
  }
  function getMonthRange(d){
    var premier = new Date(d.getFullYear(), d.getMonth(), 1);
    var dernier = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: dateKey(premier), end: dateKey(dernier) };
  }
  function rangeForPeriode(periode, ref){
    if(periode === "semaine") return getWeekRange(ref);
    if(periode === "mois") return getMonthRange(ref);
    return getDayRange(ref);
  }
  function inRange(dateStr, range){ return !!dateStr && dateStr >= range.start && dateStr <= range.end; }
  function filterRange(arr, range){ return arr.filter(function(x){ return inRange(x.date, range); }); }
  function sumBy(arr, fn){ return arr.reduce(function(s,x){ return s + (Number(fn(x)) || 0); }, 0); }

  // Cahier des charges Sprint 5A, section 4 : Transport rejoint la Mèche —
  // aucun des deux ne pèse plus sur les charges, le solde net ou le bénéfice de
  // Coiffure (payés par la cliente). Seules les Charges communes du salon
  // restent une charge réelle. Les deux restent enregistrés sur chaque
  // prestation pour la traçabilité, et restent visibles comme blocs informatifs
  // sur Aujourd'hui.
  function recetteCoiffure(range){
    return sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.mainOeuvre; });
  }
  function transportPeriode(range){
    return sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.transport||0; });
  }
  function mechePeriode(range){
    return sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.coutMeches||0; });
  }
  function chargesCommunesTotal(range){
    return sumBy(filterRange(state.autresCharges, range), function(c){ return c.montant; });
  }
  // Sprint 7 (observations terrain, confirmé par Hamadou) : le Solde net de
  // « Mon état » (et de l'aperçu Télécharger, même notion) déduit désormais à
  // la fois l'Épargne et les Charges communes de la Main d'œuvre — et non plus
  // les seules Charges communes. Les Charges communes restent affichées telles
  // quelles dans la mini-rangée de stats sous ce solde, à titre d'information,
  // même si elles n'apparaissent plus isolément dans le calcul. Ce changement
  // ne touche pas « Disponible aujourd'hui » sur l'écran Aujourd'hui, qui reste
  // Main d'œuvre − Charges communes − Épargne (formule inchangée, déjà
  // équivalente arithmétiquement, mais gardée comme fonction séparée pour ne
  // jamais coupler par erreur les deux écrans si l'un venait à évoluer seul).
  function soldeNetPeriode(range){
    return recetteCoiffure(range) - epargnePeriode(range) - chargesCommunesTotal(range);
  }
  function soldeNetJour(dateStr){ return soldeNetPeriode({ start:dateStr, end:dateStr }); }

  function allActivityDates(){
    var set = {};
    state.prestationsCoiffure.forEach(function(p){ if(p.date) set[p.date] = 1; });
    state.autresCharges.forEach(function(c){ if(c.date) set[c.date] = 1; });
    return Object.keys(set).sort();
  }

  // Observations terrain : ne jamais permettre de remonter, dans « Mon état »,
  // « Mes habitudes » ou « Télécharger », au-delà de la semaine ou du mois où
  // la toute première donnée (prestation ou charge) a été enregistrée — pour
  // éviter un défilement infini vers des périodes vides.
  function earliestActivityWeekStart(){
    var dates = allActivityDates();
    if(!dates.length) return getWeekRange(new Date()).start;
    return getWeekRange(dateFromStr(dates[0])).start;
  }
  function earliestActivityMonthStart(){
    var dates = allActivityDates();
    if(!dates.length) return getMonthRange(new Date()).start;
    return getMonthRange(dateFromStr(dates[0])).start;
  }

  // Cahier des charges Sprint 5A, section 5 : l'épargne est un pourcentage de
  // la Main d'œuvre (recette brute) — plus du solde net comme sur Trépor/Salon
  // F — donc simplement proportionnelle et additive sur une période, sans avoir
  // besoin de raisonner jour par jour.
  // Amendement (observations terrain) : le mode « Manuel » devient, comme sur
  // Trépor, un montant fixe visé chaque jour où au moins une prestation a été
  // enregistrée — jamais un pourcentage libre. Le mode « Auto » reste un
  // pourcentage de la Main d'œuvre, mais limité aux trois scénarios (10/20/30 %).
  function joursActifsDansPeriode(range){
    var set = {};
    state.prestationsCoiffure.forEach(function(p){
      if(inRange(p.date, range)) set[p.date] = 1;
    });
    return Object.keys(set).length;
  }
  function epargnePeriode(range){
    if(!state.objectifEpargne) return 0;
    var o = state.objectifEpargne;
    if(o.type === "manuel"){
      return joursActifsDansPeriode(range) * (o.montant || 0);
    }
    return recetteCoiffure(range) * (o.pourcentage || 0) / 100;
  }
  function epargneJour(dateStr){ return epargnePeriode({ start:dateStr, end:dateStr }); }

  // Sprint 7 (observations terrain) : 4 modèles d'objectif d'épargne, repris du
  // format de l'écran « Mon objectif » de Trépor mais adaptés au métier de la
  // coiffure — utilisés pour l'étape « Vous mettez de côté pour quoi ? » avant
  // le choix Auto/Manuel, et pour l'habillage (icônes fantômes) des 2
  // emplacements verrouillés.
  // Sprint 7 (retouches suite au test du Sprint 6) : les modèles Véhicule et
  // Filet de sécurité sont remplacés par deux modèles plus proches du métier
  // de la coiffure — Matériel de coiffure et Fauteuil & aménagement. Famille
  // et Épargne libre restent inchangés. Les objectifs déjà créés sous
  // l'ancien modèle gardent leur emoji/nom d'origine (déjà enregistrés en
  // state, non recalculés) : aucune migration nécessaire.
  var OBJECTIF_MODELES = [
    { id:"materiel", emoji:"🪮", nom:"Matériel de coiffure", desc:"Sèche-cheveux, kit d’installation, petit matériel" },
    { id:"fauteuil", emoji:"🪑", nom:"Fauteuil & aménagement", desc:"Fauteuil de coiffure, comptoir, aménagement du salon" },
    { id:"famille", emoji:"👨‍👩‍👧", nom:"Famille", desc:"Mariage, scolarité, santé" },
    { id:"libre", emoji:"💰", nom:"Épargne libre", desc:"Juste mettre de côté, sans montant précis" }
  ];
  function findObjectifModele(id){
    for(var i=0;i<OBJECTIF_MODELES.length;i++) if(OBJECTIF_MODELES[i].id === id) return OBJECTIF_MODELES[i];
    return null;
  }
  // Emoji affiché pour l'épargne (tuile Aujourd'hui, raccourci d'en-tête, carte
  // objectif active) : celui du modèle choisi à la création si disponible,
  // sinon 💰 par défaut (objectifs créés avant ce sprint, ou modèle non choisi).
  function epargneEmoji(){
    return (state.objectifEpargne && state.objectifEpargne.emoji) || "💰";
  }

  function emptyState(emoji, titre, desc){
    return '<div class="empty-state"><div class="es-emoji">' + emoji + '</div>' +
      '<div class="es-title">' + esc(titre) + '</div>' +
      '<div class="es-desc">' + esc(desc) + '</div></div>';
  }

  /* ================= Écran « Aujourd’hui » (repensé, profil unique) ================= */

  function renderAujourdhui(){
    var today = todayStr();
    var range = { start: today, end: today };
    var mainOeuvre = recetteCoiffure(range);
    var transport = transportPeriode(range);
    var meche = mechePeriode(range);
    var chargesCommunes = chargesCommunesTotal(range);
    var epargne = state.objectifEpargne ? epargneJour(today) : 0;
    var disponible = mainOeuvre - chargesCommunes - epargne;
    var perte = disponible < 0 ? '<div class="dash-perte">Jour à perte : ' + formatFCFA(Math.abs(disponible)) + '. Ça arrive — on note et on avance.</div>' : '';

    var blocks =
      '<button type="button" class="dash-block" style="color:var(--text);" data-action="voir-jour-mainoeuvre">' +
        '<div class="db-emoji">💆</div><div class="db-amount">' + formatFCFA(mainOeuvre) + '</div><div class="db-label">Main d’œuvre</div>' +
      '</button>' +
      '<button type="button" class="dash-block info" style="color:var(--text);" data-action="voir-jour-champ" data-champ="transport">' +
        '<div class="db-emoji">🚗</div><div class="db-amount">' + formatFCFA(transport) + '</div><div class="db-label">Transport</div>' +
      '</button>' +
      '<button type="button" class="dash-block info" style="color:var(--text);" data-action="voir-jour-champ" data-champ="meche">' +
        '<div class="db-emoji"><img class="meche-icon-img" src="' + MECHE_ICON_DATA + '" alt="Mèche" width="40" height="40"></div><div class="db-amount">' + formatFCFA(meche) + '</div><div class="db-label">Mèche</div>' +
      '</button>' +
      '<button type="button" class="dash-block" style="color:var(--text);" data-action="ouvrir-objectif">' +
        '<div class="db-emoji">' + esc(epargneEmoji()) + '</div><div class="db-amount">' + (state.objectifEpargne ? formatFCFA(epargne) : "Aucun") + '</div><div class="db-label">Épargne</div>' +
      '</button>';

    return (
      '<div class="section-title">Aujourd’hui · ' + formatDateFr(today) + '</div>' +
      '<div class="dash-solde">' +
        '<div class="ds-label">Disponible aujourd’hui</div>' +
        '<div class="ds-amount' + (disponible < 0 ? " neg" : "") + '">' + formatFCFA(disponible) + '</div>' +
        perte +
      '</div>' +
      '<div class="dash-grid">' + blocks + '</div>' +
      '<div class="charges-card-wrap">' + renderChargesCommunesCard() + '</div>'
    );
  }

  // Cahier des charges Sprint 5A, section 3 : la carte « Charges communes du
  // salon » devient compacte quand elle est vide, pour ne pas surcharger
  // l'écran tant qu'aucune charge n'a encore été renseignée. « Vide » est
  // interprété ici comme : aucune charge commune n'a jamais été enregistrée
  // (pas seulement aujourd'hui) — la carte reprend sa taille normale dès la
  // toute première charge ajoutée, qu'elle date d'aujourd'hui ou d'un autre jour.
  function renderChargesCommunesCard(){
    var today = todayStr();
    var total = chargesCommunesTotal({ start: today, end: today });
    if(!state.autresCharges.length){
      return (
        '<div class="caisse-zone">' +
          '<button type="button" class="charges-row charges-row-vide" data-action="voir-charges-jour">' +
            '<span class="cr-emoji">🧾</span><span class="cr-label">Charges communes du salon</span>' +
          '</button>' +
        '</div>'
      );
    }
    return (
      '<div class="caisse-zone">' +
        '<button type="button" class="charges-row" data-action="voir-charges-jour">' +
          '<span class="cr-emoji">💸</span><span class="cr-label">Charges communes du salon</span><span class="cr-amount">' + formatFCFA(total) + '</span>' +
        '</button>' +
      '</div>'
    );
  }

  /* ================= Formulaire F5 : Prestations coiffure ================= */

  function optionsFor(name, selectedId){
    var list = findList(name);
    var opts = list.map(function(it){
      return '<option value="' + it.id + '"' + (it.id===selectedId?" selected":"") + '>' + esc(it.nom) + '</option>';
    }).join("");
    opts += '<option value="__new__"' + (selectedId==="__new__"?" selected":"") + '>+ Autre…</option>';
    return opts;
  }
  function fieldErr(key){
    return ui.errors[key] ? '<div class="field-error">' + esc(ui.errors[key]) + '</div>' : "";
  }
  function captureDraft(fieldIds){
    fieldIds.forEach(function(id){
      var el = byId(id);
      if(el) ui.draft[id] = el.value;
    });
  }

  function renderChampLieu(lieu){
    return (
      '<div class="field"><div class="label">Lieu de la prestation <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (lieu==="domicile"?" active":"") + '" data-action="set-lieu-coiffure" data-val="domicile">🏠 À domicile</button>' +
          '<button type="button" class="radio-opt' + (lieu==="salon"?" active":"") + '" data-action="set-lieu-coiffure" data-val="salon">💈 En salon</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderFormCoiffure(){
    var d = ui.draft;
    var clienteSel = d["f-clienteSel"] || "";
    var quartierSel = d["f-quartierSel"] || "";
    var typesSel = d.typesCoiffureSel || [];
    var showNouveauType = !!d.showNouveauTypeCoiffure;
    var lieu = d["f-lieu"] || "domicile";
    var chips = state.config.typesCoiffure.map(function(t){
      var active = typesSel.indexOf(t.id) !== -1;
      return '<button type="button" class="chip' + (active?" active":"") + '" data-action="toggle-coiffure-type" data-id="' + t.id + '">' + esc(t.nom) + '</button>';
    }).join("");
    chips += '<button type="button" class="chip dashed" data-action="toggle-nouveau-type-coiffure">+ Personnalisé</button>';

    return (
      '<div>' +
        '<div class="field"><div class="label">Date de la prestation <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-coiffure">' +
          fieldErr("date") +
        '</div>' +
        '<div class="field"><div class="label">Type de cliente <span class="req">*</span></div>' +
          '<select class="select" id="f-clienteSel" data-action-change="cliente-change">' + optionsFor("typesCliente", clienteSel) + '</select>' +
          (clienteSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-clienteNouveauNom" placeholder="Nouveau type de cliente" value="' + esc(d["f-clienteNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("cliente") +
        '</div>' +
        renderChampLieu(lieu) +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Quartier <span class="req">*</span></div>' +
          '<select class="select" id="f-quartierSel" data-action-change="quartier-change">' + optionsFor("quartiers", quartierSel) + '</select>' +
          (quartierSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-quartierNouveauNom" placeholder="Nom du quartier" value="' + esc(d["f-quartierNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("quartier") +
        '</div>' : '') +
        '<div class="field"><div class="label">Type(s) de coiffure</div>' +
          '<div class="chip-wrap">' + chips + '</div>' +
          (showNouveauType ? '<div class="inline-new"><input type="text" class="input" id="f-nouveauTypeCoiffure" placeholder="Ex. Vanilles" value="' + esc(d["f-nouveauTypeCoiffure"]||"") + '" data-autofocus data-action-change="capture-coiffure">' +
            '<button type="button" class="btn btn-secondary" data-action="ajouter-type-coiffure">Ajouter</button></div>' : '') +
        '</div>' +
        '<div class="field"><div class="label">Main d’œuvre gardée (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-mainOeuvre" value="' + esc(d["f-mainOeuvre"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Ce que vous gardez réellement pour vous.</div>' +
          fieldErr("mainOeuvre") +
        '</div>' +
        '<div class="field"><div class="label">Coût des mèches (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-coutMeches" placeholder="0" value="' + esc(d["f-coutMeches"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Transport (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-transport" placeholder="0" value="' + esc(d["f-transport"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' : '') +
        '<button type="button" class="btn btn-primary" data-action="enregistrer-coiffure">Enregistrer</button>' +
      '</div>'
    );
  }

  var COIFFURE_FIELDS = ["f-date","f-clienteSel","f-clienteNouveauNom","f-quartierSel","f-quartierNouveauNom","f-nouveauTypeCoiffure","f-mainOeuvre","f-coutMeches","f-transport"];

  function enregistrerCoiffure(){
    captureDraft(COIFFURE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var date = d["f-date"] || todayStr();
    var lieu = (d["f-lieu"] === "salon") ? "salon" : "domicile";
    var clienteSel = d["f-clienteSel"];
    var clienteNouveauNom = (d["f-clienteNouveauNom"]||"").trim();
    var quartierSel = d["f-quartierSel"];
    var quartierNouveauNom = (d["f-quartierNouveauNom"]||"").trim();
    var mainOeuvre = toNum(d["f-mainOeuvre"]);
    var coutMeches = toNum(d["f-coutMeches"]);
    var transport = lieu === "domicile" ? toNum(d["f-transport"]) : 0;

    if(!date) errors.date = "Choisissez une date.";
    if(!clienteSel || (clienteSel==="__new__" && !clienteNouveauNom)) errors.cliente = "Choisissez ou précisez le type de cliente.";
    if(lieu === "domicile" && (!quartierSel || (quartierSel==="__new__" && !quartierNouveauNom))) errors.quartier = "Choisissez ou précisez le quartier.";
    if(!(mainOeuvre >= 0) || d["f-mainOeuvre"]==="") errors.mainOeuvre = "Indiquez la main d’œuvre gardée.";

    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }

    var cliente = clienteSel === "__new__" ? addPerso("typesCliente", clienteNouveauNom) : findById("typesCliente", clienteSel);
    var quartier = lieu === "domicile" ? (quartierSel === "__new__" ? addPerso("quartiers", quartierNouveauNom) : findById("quartiers", quartierSel)) : null;
    var typesIds = d.typesCoiffureSel || [];
    var typesNoms = typesIds.map(function(id){ var it = findById("typesCoiffure", id); return it ? it.nom : null; }).filter(Boolean);

    state.prestationsCoiffure.push({
      id: uid("coif"), date: date, lieu: lieu,
      typeClienteId: cliente ? cliente.id : null, typeClienteNom: cliente ? cliente.nom : clienteNouveauNom,
      quartierId: quartier ? quartier.id : null, quartierNom: lieu === "domicile" ? (quartier ? quartier.nom : quartierNouveauNom) : null,
      typesCoiffureIds: typesIds, typesCoiffureNoms: typesNoms,
      mainOeuvre: mainOeuvre, coutMeches: coutMeches, transport: transport, ts: Date.now()
    });
    saveState();
    closeModal();
  }

  /* ================= Listes / détails de prestations ================= */

  function renderCarteCoiffure(p){
    var types = (p.typesCoiffureNoms||[]).join(", ") || "Type non précisé";
    var lieuTxt = p.lieu === "salon" ? "💈 En salon" : esc(p.quartierNom);
    return (
      '<button type="button" class="entry-card" data-action="voir-coiffure" data-id="' + p.id + '">' +
        '<div class="entry-ico">💇</div>' +
        '<div class="entry-main">' +
          '<div class="entry-title">' + esc(p.typeClienteNom) + ' · ' + lieuTxt + '</div>' +
          '<div class="entry-sub">' + formatDateFr(p.date) + ' · ' + esc(types) + '</div>' +
        '</div>' +
        '<div class="entry-amount">' + formatFCFA(p.mainOeuvre) + '</div>' +
      '</button>'
    );
  }

  function renderListePrestationsRange(range, videEmoji, videTitre, videDesc){
    var items = sortByDateDesc(filterRange(state.prestationsCoiffure, range));
    if(!items.length) return emptyState(videEmoji, videTitre, videDesc);
    return '<div class="entry-list">' + items.map(renderCarteCoiffure).join("") + '</div>';
  }

  function drow(k,v){ return '<div class="detail-row"><div class="dk">' + esc(k) + '</div><div class="dv">' + v + '</div></div>'; }

  function detailShell(rowsHtml, kind, id){
    var confirming = ui.modal.confirmDelete;
    return (
      '<div>' + rowsHtml +
      (confirming ?
        '<div class="confirm-box"><p>Supprimer cet enregistrement ? Cette action est définitive.</p>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn btn-secondary" data-action="annuler-suppression">Annuler</button>' +
            '<button type="button" class="btn btn-danger" data-action="confirmer-suppression" data-kind="' + kind + '" data-id="' + id + '">Oui, supprimer</button>' +
          '</div></div>'
        :
        '<button type="button" class="btn btn-danger" style="margin-top:14px;" data-action="demander-suppression">🗑️ Supprimer</button>'
      ) +
      '</div>'
    );
  }

  function renderDetailCoiffure(){
    var p = state.prestationsCoiffure.filter(function(x){ return x.id === ui.modal.id; })[0];
    if(!p) return "";
    var rows =
      drow("Date", formatDateFr(p.date)) +
      drow("Type de cliente", esc(p.typeClienteNom)) +
      drow("Lieu", p.lieu === "salon" ? "💈 En salon" : "🏠 À domicile") +
      (p.lieu === "domicile" ? drow("Quartier", esc(p.quartierNom)) : "") +
      drow("Type(s) de coiffure", esc((p.typesCoiffureNoms||[]).join(", ") || "—")) +
      drow("Main d’œuvre gardée", formatFCFA(p.mainOeuvre)) +
      drow("Coût des mèches (non compté)", formatFCFA(p.coutMeches||0)) +
      (p.lieu === "domicile" ? drow("Transport (non compté)", formatFCFA(p.transport||0)) : "");
    return detailShell(rows, "coiffure", p.id);
  }

  // Bloc « Main d'œuvre » d'Aujourd'hui : liste complète des prestations du
  // jour, comme avant ce sprint — inchangé, simplement déplacé sur ce bloc.
  function renderJourMainOeuvreModal(){
    var today = todayStr();
    var items = sortByDateDesc(state.prestationsCoiffure.filter(function(p){ return p.date === today; }));
    if(!items.length){
      return emptyState("💇", "Aucune prestation aujourd’hui", "Les prestations enregistrées aujourd’hui apparaîtront ici.");
    }
    return '<div class="entry-list">' + items.map(function(p){
      var types = (p.typesCoiffureNoms||[]).join(", ") || "Type non précisé";
      var lieuTxt = p.lieu === "salon" ? "💈 En salon" : esc(p.quartierNom);
      return (
        '<button type="button" class="entry-card" data-action="voir-coiffure-du-jour" data-id="' + p.id + '">' +
          '<div class="entry-ico">💇</div>' +
          '<div class="entry-main">' +
            '<div class="entry-title">' + esc(p.typeClienteNom) + ' · ' + lieuTxt + '</div>' +
            '<div class="entry-sub">' + esc(types) + '</div>' +
          '</div>' +
          '<div class="entry-amount">' + formatFCFA(p.mainOeuvre) + '</div>' +
        '</button>'
      );
    }).join("") + '</div>';
  }

  // Blocs Transport / Mèche d'Aujourd'hui : depuis ce sprint, plus la liste
  // complète — seul le montant du jour lié au champ concerné, en liste
  // compacte avec le total en tête (confirmé au cahier des charges, section 3).
  function renderJourChampModal(champ){
    var today = todayStr();
    var estTransport = champ === "transport";
    var items = state.prestationsCoiffure.filter(function(p){
      return p.date === today && (estTransport ? (p.transport||0) > 0 : (p.coutMeches||0) > 0);
    });
    items = sortByDateDesc(items);
    var total = sumBy(items, function(p){ return estTransport ? (p.transport||0) : (p.coutMeches||0); });
    var titreChamp = estTransport ? "Transport" : "Mèche";
    var icoChamp = estTransport ? "🚗" : ('<img class="meche-icon-img" src="' + MECHE_ICON_DATA + '" alt="Mèche" width="22" height="22">');
    if(!items.length){
      return (
        '<div class="hint tight" style="margin-bottom:10px;">Aucun montant ' + (estTransport?"transport":"mèche") + ' enregistré aujourd’hui.</div>'
      );
    }
    var total_row = '<div class="etat-stat-row" style="margin-bottom:10px; border-color:var(--accent);"><div class="er-label">Total ' + titreChamp.toLowerCase() + ' du jour</div><div class="er-val">' + formatFCFA(total) + '</div></div>';
    var rows = items.map(function(p){
      return (
        '<div class="entry-card">' +
          '<div class="entry-ico">' + icoChamp + '</div>' +
          '<div class="entry-main"><div class="entry-title">' + esc(p.typeClienteNom) + '</div></div>' +
          '<div class="entry-amount">' + formatFCFA(estTransport ? (p.transport||0) : (p.coutMeches||0)) + '</div>' +
        '</div>'
      );
    }).join("");
    return total_row + '<div class="entry-list">' + rows + '</div>';
  }

  /* ================= Autres charges (rubriques, F11) ================= */

  function rubriquesActives(){
    return state.config.rubriquesCharges.filter(function(r){ return r.actif; });
  }
  function findRubriqueCharge(id){
    var list = state.config.rubriquesCharges;
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    return null;
  }

  function renderDetailChargesJour(){
    var today = todayStr();
    var range = { start: today, end: today };
    var hint = '<div class="hint tight" style="margin-bottom:14px;">Ces charges concernent le salon dans son ensemble (loyer, publicité…).</div>';
    var autres = filterRange(state.autresCharges, range).sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    var autresHtml = '<div class="reglages-section"><div class="rs-title">Charges communes du jour</div>' +
      (autres.length ? autres.map(function(c){
        return (
          '<button type="button" class="entry-card" data-action="voir-autre-charge" data-id="' + c.id + '" style="margin-bottom:8px;">' +
            '<div class="entry-ico">' + esc(c.rubriqueEmoji||"📝") + '</div>' +
            '<div class="entry-main"><div class="entry-title">' + esc(c.rubriqueNom) + '</div></div>' +
            '<div class="entry-amount">' + formatFCFA(c.montant) + '</div>' +
          '</button>'
        );
      }).join("") : '<div class="hint tight">Aucune charge commune ajoutée aujourd’hui.</div>') +
      '<button type="button" class="btn btn-secondary" style="margin-top:8px;" data-action="add-autre-charge">+ Ajouter une charge</button>' +
    '</div>';
    return hint + autresHtml;
  }

  function renderFormAutreCharge(){
    var d = ui.draft;
    var rubSel = d["f-rubrique"] || "";
    var rubs = rubriquesActives();
    var tiles = rubs.map(function(r){
      return (
        '<button type="button" class="rub-tile' + (rubSel===r.id?" selected":"") + '" data-action="set-rubrique-charge" data-id="' + r.id + '">' +
          '<div class="rub-icon">' + esc(r.emoji||"📝") + '</div>' +

  /* ================= F8 : Mon état (solde net → prestations → Main d’œuvre/Épargne) ================= */

  var MOIS_NOMS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function moisLabelFor(d){ return MOIS_NOMS[d.getMonth()] + " " + d.getFullYear(); }

  function ensureEtatRefs(){
    if(!ui.etatSemaineRef) ui.etatSemaineRef = todayStr();
    if(!ui.etatMoisRef) ui.etatMoisRef = todayStr();
  }
  function shiftRef(refName, delta){
    if(refName === "semaine"){
      var d = dateFromStr(ui.etatSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;
      if(nouveau > refAujourdhui) nouveau = refAujourdhui;
      var refPlusAncienne = earliestActivityWeekStart();
      if(nouveau < refPlusAncienne) nouveau = refPlusAncienne;
      ui.etatSemaineRef = nouveau;
    } else if(refName === "mois"){
      var d2 = dateFromStr(ui.etatMoisRef);
      d2.setDate(1);
      d2.setMonth(d2.getMonth() + delta);
      var nouveau2 = dateKey(d2);
      var refAujourdhuiM = getMonthRange(new Date()).start;
      if(nouveau2 > refAujourdhuiM) nouveau2 = refAujourdhuiM;
      var refPlusAncienM = earliestActivityMonthStart();
      if(nouveau2 < refPlusAncienM) nouveau2 = refPlusAncienM;
      ui.etatMoisRef = nouveau2;
    }
  }

  function renderEtatBack(){
    return '<button type="button" class="btn btn-ghost" style="padding:8px 0; margin-bottom:6px;" data-action="etat-back">‹ Retour</button>';

  function renderEtatSemaineNav(){
    var range = getWeekRange(dateFromStr(ui.etatSemaineRef));

      '<div class="etat-nav">' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="-1" data-periode="semaine"' + (estPlusAncienne?" disabled":"") + '>‹</button>' +
        '<div class="en-label">' + esc(label) + '</div>' +

  var JOURS_NOMS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function renderEtatListeJours(range, from){
    var jours = [];
    var d = dateFromStr(range.start);
    var end = dateFromStr(range.end);
    while(dateKey(d) <= dateKey(end)){
      jours.push(dateKey(d));
      d.setDate(d.getDate()+1);
    }
    var today = todayStr();
    var rows = jours.map(function(ds){
      var dd = dateFromStr(ds);
      var label = JOURS_NOMS[dd.getDay()].charAt(0).toUpperCase() + JOURS_NOMS[dd.getDay()].slice(1) + " " + formatDateFr(ds);
      if(ds > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }
      var solde = soldeNetPeriode({ start:ds, end:ds });
      return (
        '<button type="button" class="entry-card" style="width:100%; text-align:left;" data-action="etat-select-jour" data-date="' + ds + '" data-from="' + from + '">' +
          '<div class="entry-main"><div class="entry-title">' + esc(label) + '</div></div>' +
          '<div class="entry-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        '</button>'
      );
    }).join("");
    return '<div class="entry-list">' + rows + '</div>';
  }

  function renderEtatListeSemaines(monthRange){
    var firstWeekStart = getWeekRange(dateFromStr(monthRange.start)).start;
    var lastWeekStart = getWeekRange(dateFromStr(monthRange.end)).start;
    var semaines = [];
    var cur = firstWeekStart;
    while(cur <= lastWeekStart){
      semaines.push(cur);
      var d = dateFromStr(cur); d.setDate(d.getDate()+7);
      cur = dateKey(d);
    }
    var today = todayStr();
    var rows = semaines.map(function(ws){
      var range = getWeekRange(dateFromStr(ws));
      var label = formatDateFr(range.start) + " – " + formatDateFr(range.end);
      if(range.start > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }
      var solde = soldeNetPeriode(range);
      return (
        '<button type="button" class="entry-card" style="width:100%; text-align:left;" data-action="etat-select-semaine" data-week-start="' + ws + '">' +
          '<div class="entry-main"><div class="entry-title">' + esc(label) + '</div></div>' +
          '<div class="entry-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        '</button>'
      );
    }).join("");
    return '<div class="entry-list">' + rows + '</div>';
  }

  // Bloc commun : solde net → liste des prestations (de la journée) → Main
  // d'œuvre et Épargne — ordre imposé par le cahier des charges, section 6.

    ensureEtatRefs();

      var d = dateFromStr(ui.habitudesSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;

  function groupSum(arr, labelFn, valFn){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var lbl = labelFn(x);
      if(lbl === null || lbl === undefined || lbl === "") return;
      if(!(lbl in map)){ map[lbl] = 0; ordre.push(lbl); }
      map[lbl] += Number(valFn(x)) || 0;
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  function groupSumMulti(arr, valuesFn, valFn, labelVide){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var vals = valuesFn(x);
      if(!vals || !vals.length) vals = [labelVide];
      vals.forEach(function(v){
        if(!(v in map)){ map[v] = 0; ordre.push(v); }
        map[v] += Number(valFn(x)) || 0;
      });
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  function renderBreakdownRows(titre, rows){
    if(!rows.length) return "";
    var body = rows.map(function(r){
      return '<div class="eb-row"><div class="eb-nom">' + esc(r.label) + '</div><div class="eb-val">' + formatFCFA(r.montant) + '</div></div>';
    }).join("");
    return '<div class="etat-breakdown"><div class="eb-title">' + esc(titre) + '</div>' + body + '</div>';
  }
  function renderBreakdownsCoiffure(range){
    var items = filterRange(state.prestationsCoiffure, range);
    if(!items.length) return "";
    var domicile = items.filter(function(p){ return p.lieu === "domicile"; });
    return (
      renderBreakdownRows("Par quartier (prestations à domicile)", groupSum(domicile, function(p){ return p.quartierNom; }, function(p){ return p.mainOeuvre; })) +
      renderBreakdownRows("Par type de coiffure", groupSumMulti(items, function(p){ return p.typesCoiffureNoms; }, function(p){ return p.mainOeuvre; }, "Non précisé")) +
      renderBreakdownRows("Par type de cliente", groupSum(items, function(p){ return p.typeClienteNom; }, function(p){ return p.mainOeuvre; }))
    );
  }
  function renderBreakdownAutresCharges(range){
    var items = filterRange(state.autresCharges, range);
    if(!items.length) return "";
    return renderBreakdownRows("Charges communes — par rubrique", groupSum(items, function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; }));
  }

  function renderHabitudes(){
    ensureHabitudesRefs();
    var periode = ui.habitudesPeriode;
    var ref = periode === "semaine" ? dateFromStr(ui.habitudesSemaineRef) : periode === "mois" ? dateFromStr(ui.habitudesMoisRef) : new Date();
    var range = rangeForPeriode(periode, ref);

    var tabs = ["jour","semaine","mois"].map(function(p){
      var lbl = { jour:"Jour", semaine:"Semaine", mois:"Mois" }[p];
      return '<button type="button" class="etat-tab' + (periode===p?" active":"") + '" data-action="habitudes-set-periode" data-val="' + p + '">' + lbl + '</button>';
    }).join("");

    var navHtml = "";
    if(periode === "semaine" || periode === "mois"){
      var label = periode === "semaine" ? (formatDateFr(range.start) + " – " + formatDateFr(range.end)) : (moisLabelFor(ref).charAt(0).toUpperCase() + moisLabelFor(ref).slice(1));
      var refAujourdhui = periode === "semaine" ? getWeekRange(new Date()).start : getMonthRange(new Date()).start;
      var estPeriodeActuelle = (periode === "semaine" ? ui.habitudesSemaineRef : ui.habitudesMoisRef) >= refAujourdhui;
      var refPlusAncienneH = periode === "semaine" ? earliestActivityWeekStart() : earliestActivityMonthStart();
      var estPeriodePlusAncienne = (periode === "semaine" ? ui.habitudesSemaineRef : ui.habitudesMoisRef) <= refPlusAncienneH;
      navHtml = (
        '<div class="etat-nav">' +
          '<button type="button" class="en-btn" data-action="habitudes-nav" data-sens="-1" data-periode="' + periode + '"' + (estPeriodePlusAncienne?" disabled":"") + '>‹</button>' +
          '<div class="en-label">' + esc(label) + '</div>' +
          '<button type="button" class="en-btn" data-action="habitudes-nav" data-sens="1" data-periode="' + periode + '"' + (estPeriodeActuelle?" disabled":"") + '>›</button>' +
        '</div>'
      );
    } else {
      navHtml = '<div class="etat-nav"><div class="en-label">' + esc(formatDateFr(todayStr())) + '</div></div>';
    }

    var breakdowns = renderBreakdownsCoiffure(range) + renderBreakdownAutresCharges(range);
    if(!breakdowns){
      breakdowns = emptyState("📈","Pas encore d’habitudes à montrer","Vos statistiques par quartier, type de coiffure, type de cliente ou rubrique de charge apparaîtront ici au fil de vos saisies.");
    }

    return (
      '<div class="section-title">Mes habitudes</div>' +
      '<div class="etat-tabs">' + tabs + '</div>' +
      navHtml +
      breakdowns
    );
  }

    ctx.strokeStyle = "#2a303c"; ctx.beginPath(); ctx.moveTo(70,570); ctx.lineTo(W-70,570); ctx.stroke();

    // Copie du rendu vers le calque flouté affiché à l'écran (effet CSS
    // progressif de l'aperçu). Depuis Sprint 7, le fichier exporté ne
    // reprend plus ce canvas net tel quel : voir construireCanvasExport(),
    // qui recalcule un vrai flou sur les pixels du bas avant export, pour
    // que le fichier téléchargé/partagé corresponde à ce que montre l'aperçu
