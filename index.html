  // Sprint 7 (correctif) : construit le canvas réellement exporté/partagé —
  // net en haut (titre + solde net), réellement flouté en bas (pixels
  // recalculés, pas un filtre CSS visuel) avec la mention « Abonnez-vous
  // pour plus de fonctionnalités » incrustée, pour reproduire fidèlement ce
  // que voit la personne dans l'aperçu à l'écran. Utilisé par
  // canvasVersBlob(), donc par Télécharger et Partager.
  function roundRectPath(ctx, x, y, w, h, r){
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function dessinerOverlayAbonnementExport(ctx, W, H){
    var texte = "Abonnez-vous pour plus de fonctionnalités";
    ctx.font = "800 30px -apple-system,Helvetica,Arial,sans-serif";
    var maxWidth = W*0.8 - 68;
    var mots = texte.split(" "), lignes = [], ligne = "";
    mots.forEach(function(mot){
      var essai = ligne ? ligne + " " + mot : mot;
      if(ctx.measureText(essai).width > maxWidth && ligne){ lignes.push(ligne); ligne = mot; }
      else { ligne = essai; }
    });
    if(ligne) lignes.push(ligne);

    var lineHeight = 40, padX = 34, padY = 24;
    var textWidth = 0;
    lignes.forEach(function(l){ textWidth = Math.max(textWidth, ctx.measureText(l).width); });
    var boxW = Math.min(W*0.8, textWidth + padX*2);
    var boxH = lignes.length*lineHeight + padY*2;
    var cx = W/2, cy = H*0.74;
    var x0 = cx - boxW/2, y0 = cy - boxH/2;

    ctx.save();
    ctx.fillStyle = "rgba(17,20,26,.85)";
    ctx.strokeStyle = "rgba(245,166,35,.6)";
    ctx.lineWidth = 2;
    roundRectPath(ctx, x0, y0, boxW, boxH, 22);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#f5a623";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    lignes.forEach(function(l, i){
      ctx.fillText(l, cx, y0 + padY + lineHeight*i + lineHeight/2);
    });
    ctx.restore();
  }
  function construireCanvasExport(){
    var source = byId("telecharger-canvas");
    if(!source || !source.getContext) return null;
    var W = source.width, H = source.height;

    var out = document.createElement("canvas");
    out.width = W; out.height = H;
    var octx = out.getContext("2d");
    octx.drawImage(source, 0, 0); // base nette

    // Copie réellement floutée (pixels recalculés par le moteur canvas,
    // pas un filtre CSS d'affichage) — repli par sous-échantillonnage sur
    // les moteurs sans support de ctx.filter.
    var blurred = document.createElement("canvas");
    blurred.width = W; blurred.height = H;
    var bctx = blurred.getContext("2d");
    if("filter" in bctx){
      bctx.filter = "blur(16px)";
      bctx.drawImage(source, 0, 0);
      bctx.filter = "none";
    } else {
      var small = document.createElement("canvas");
      var sw = Math.max(1, Math.round(W/12)), sh = Math.max(1, Math.round(H/12));
      small.width = sw; small.height = sh;
      small.getContext("2d").drawImage(source, 0, 0, sw, sh);
      bctx.imageSmoothingEnabled = true;
      bctx.drawImage(small, 0, 0, sw, sh, 0, 0, W, H);
    }

    // Masque en dégradé identique au calque CSS de l'aperçu (net jusqu'à
    // 28%, flouté à partir de 36%) — punché dans le canal alpha du flou.
    var grad = bctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.28, "rgba(0,0,0,0)");
    grad.addColorStop(0.36, "rgba(0,0,0,1)");
    grad.addColorStop(1, "rgba(0,0,0,1)");
    bctx.globalCompositeOperation = "destination-in";
    bctx.fillStyle = grad;
    bctx.fillRect(0, 0, W, H);
    bctx.globalCompositeOperation = "source-over";

    octx.drawImage(blurred, 0, 0);
    dessinerOverlayAbonnementExport(octx, W, H);

    return out;
  }

  function canvasVersBlob(callback){
    var canvas = construireCanvasExport();
    if(!canvas){ callback(null); return; }
    if(canvas.toBlob){ canvas.toBlob(callback, "image/png"); return; }
    try{
      var dataUrl = canvas.toDataURL("image/png");
      var bstr = atob(dataUrl.split(",")[1]), n = bstr.length, u8 = new Uint8Array(n);
      while(n--) u8[n] = bstr.charCodeAt(n);
      callback(new Blob([u8], { type:"image/png" }));
    }catch(e){ callback(null); }
  }
  function nomFichierTelecharger(){
    return "mondjai-coiffure-" + ui.telechargerPeriode + "-" + todayStr() + ".png";

  function telechargerImage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nomFichierTelecharger();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    });
  }
  function partagerImage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var fichier;
      try{ fichier = new File([blob], nomFichierTelecharger(), { type:"image/png" }); }catch(e){ fichier = null; }
      if(fichier && navigator.share && navigator.canShare && navigator.canShare({ files:[fichier] })){
        navigator.share({ files:[fichier], title:"MonDjai/Coiffure" }).catch(function(){});
      } else {
        telechargerImage();
      }
    });
  }

  /* ================= Réglages ================= */

    var rubList = state.config.rubriquesCharges;
    var rubRows = rubList.map(function(r){
      return (
        '<div class="rub-manage-row">' +
          '<div class="rm-emoji">' + esc(r.emoji||"📝") + '</div>' +
          '<div class="rm-nom">' + esc(r.nom) + '</div>' +
          '<button type="button" class="switch' + (r.actif?" on":"") + '" data-action="toggle-rubrique-charge" data-id="' + r.id + '"><span class="knob"></span></button>' +
          (r.perso ? '<button type="button" class="rm-del" data-action="demander-suppression-rubrique" data-id="' + r.id + '" aria-label="Supprimer">🗑️</button>' : '') +
        '</div>'
      );
    }).join("");

    var pinActif = state.config.pinActif;

    var bientotHtml =
      '<div class="reglages-section">' +
        '<div class="rs-title">Disponible par abonnement premium</div>' +
        '<div class="profil-row soon">' +
          '<div class="pr-emoji">💅</div>' +
          '<div class="pr-text"><div class="pr-title">Pédicure / Manicure</div>' +
            '<div class="pr-desc">Application indépendante, sur commande, fusion avec Coiffure et/ou Revente de mèches.</div></div>' +
          '<button type="button" class="switch' + (ui.abonnementToggles.pedicure?" on":"") + '" data-action="toggle-abonnement-premium" data-id="pedicure"><span class="knob"></span></button>' +
        '</div>' +
        '<div class="profil-row soon">' +
          '<div class="pr-emoji">🛍️</div>' +
          '<div class="pr-text"><div class="pr-title">Revente de mèches</div>' +
            '<div class="pr-desc">Application indépendante, sur commande, fusion avec Coiffure et/ou Pédicure/Manicure.</div></div>' +
          '<button type="button" class="switch' + (ui.abonnementToggles.revente?" on":"") + '" data-action="toggle-abonnement-premium" data-id="revente"><span class="knob"></span></button>' +
        '</div>' +
        (ui.reglagesMsg ? '<div class="hint tight" style="margin-top:8px;">' + esc(ui.reglagesMsg) + '</div>' : '') +
      '</div>';

    return (
      '<div class="onb">' +
        '<div class="onb-head" style="display:flex; align-items:center; justify-content:space-between;">' +
          '<div class="onb-title" style="margin:0;">Réglages</div>' +
          '<button type="button" class="icon-btn" data-action="fermer-overlay">✕</button>' +
        '</div>' +
        '<div class="reglages-section">' +
          '<div class="rs-title">Charges communes du salon</div>' +
          rubRows +
          '<div class="inline-new">' +
            '<input type="text" class="input" id="f-nouvelleRubrique" placeholder="Nouvelle rubrique" value="' + esc(ui.draft["f-nouvelleRubrique"]||"") + '" data-autofocus data-action-change="capture-nouvelle-rubrique">' +
            '<button type="button" class="btn btn-secondary" data-action="ajouter-rubrique-charge">Ajouter</button>' +
          '</div>' +
          '<div class="hint tight">Servent pour les charges communes ajoutées depuis la carte « Charges communes du salon » (loyer, publicité…). Supprimer une rubrique personnalisée ne touche pas aux charges déjà enregistrées.</div>' +
        '</div>' +
        bientotHtml +
        '<div class="reglages-section">' +
          '<div class="rs-title">Sécurité</div>' +
          '<div class="profil-row">' +
            '<div class="pr-emoji">🔒</div>' +
            '<div class="pr-text"><div class="pr-title">Code PIN à l’ouverture</div><div class="pr-desc">Un verrou simple contre un regard indiscret — pas un chiffrement.</div></div>' +
            '<button type="button" class="switch' + (pinActif?" on":"") + '" data-action="toggle-pin-reglages"><span class="knob"></span></button>' +
          '</div>' +
          (pinActif ? '<button type="button" class="btn btn-secondary" data-action="changer-pin">Changer le code PIN</button>' : '') +
        '</div>' +
        '<div class="reglages-section">' +
          '<div class="rs-title">Sauvegarde et restauration</div>' +
          '<button type="button" class="btn btn-secondary" data-action="exporter-json">💾 Sauvegarder mes données (JSON)</button>' +
          '<div style="height:10px;"></div>' +
          '<label class="btn btn-secondary" style="display:flex; cursor:pointer;">📂 Restaurer une sauvegarde' +
            '<input type="file" accept="application/json" style="display:none;" data-action-change="importer-json"></label>' +
          (ui.backupMsg ? '<div class="hint tight">' + esc(ui.backupMsg) + '</div>' : '') +
          (state.meta.derniereSauvegarde ? '<div class="hint tight">Dernière sauvegarde : ' + esc(formatDateFr(state.meta.derniereSauvegarde)) + '</div>' : '') +
        '</div>' +
        '<div class="reglages-section">' +
          '<button type="button" class="btn btn-secondary" data-action="ouvrir-apropos">À propos</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderApropos(){
    return (
      '<div class="onb">' +
        '<div class="onb-head" style="display:flex; align-items:center; justify-content:space-between;">' +
          '<div class="onb-title" style="margin:0;">À propos</div>' +
          '<button type="button" class="icon-btn" data-action="fermer-apropos">✕</button>' +
        '</div>' +
        '<div class="mission">Chaque geste compte : on note, on avance.</div>' +
        '<div class="about-line">MonDjai/Coiffure vous aide à suivre vos prestations coiffure, sans jugement et sans calcul compliqué.</div>' +
        '<div class="about-line">Vos données restent uniquement sur ce téléphone — rien n’est envoyé sur internet.</div>' +
        '<div class="about-line">Transport et mèche sont enregistrés pour information mais ne comptent jamais comme des charges — ils sont payés par la cliente. Seules les charges communes du salon pèsent sur votre solde.</div>' +
        '<div class="about-line">Première application d’une famille à trois : Pédicure/Manicure et Revente de mèches arriveront plus tard en applications indépendantes, avec une fusion prévue par la suite.</div>' +
        '<div class="about-line">Le code PIN est un verrou de confort, pas un chiffrement fort — à ne jamais présenter comme une sécurité absolue.</div>' +
        '<div class="about-line">L’accès se renouvelle chaque mois par un code communiqué séparément — sans connexion internet, tout est calculé sur ce téléphone. Vos données ne sont jamais supprimées pendant qu’un renouvellement est en attente.</div>' +
        '<div class="about-line">Version : Sprint 5B — accès mensuel calendaire et choix du dossier de sauvegarde.</div>' +
      '</div>'
    );
  }

  /* ================= Actions ================= */

  function openModal(type, extra){
    ui.modal = merge({ type:type }, extra || {});
    ui.draft = {};
    ui.errors = {};
    render();
  }
  function closeModal(){
    if(ui.modalReturnTo){
      var back = ui.modalReturnTo;
      ui.modalReturnTo = null;
      openModal(back.type, back.extra);
      return;
    }
    ui.modal = null;
    ui.draft = {};
    ui.errors = {};
    render();
  }

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "fermer-modal-overlay"){
      if(e.target.closest("[data-stop-close]")) return;
      closeModal();
      return;
    }
    if(action === "fermer-modal"){ closeModal(); return; }

    switch(action){
      case "ouvrir-reglages": ui.overlay = "reglages"; ui.reglagesMsg = ""; render(); return;
      case "fermer-overlay": ui.overlay = null; ui.objDraft = null; render(); return;
      case "ouvrir-apropos": ui.overlay = "apropos"; render(); return;
      case "fermer-apropos": ui.overlay = "reglages"; render(); return;

      case "ouvrir-objectif": ui.overlay = "objectif"; render(); return;

      case "choisir-modele-objectif": {
        ui.objDraft = ui.objDraft || { step:"modele", modeleId:null, mode:"auto", pourcentage:"10", montant:"", nom:"" };
        ui.objDraft.modeleId = el.getAttribute("data-val");
        render();
        return;
      }
      case "continuer-objectif-modele": {
        var d0 = ui.objDraft;
        if(!d0 || !d0.modeleId) return;
        var m0 = findObjectifModele(d0.modeleId);
        d0.step = "form";
        if(m0 && !d0.nom) d0.nom = m0.nom;
        render();
        return;
      }
      case "revenir-objectif-modele": {
        if(ui.objDraft) ui.objDraft.step = "modele";
        render();
        return;
      }

      case "choisir-mode-objectif": {
        ui.objDraft = ui.objDraft || { mode:"auto", pourcentage:"10", montant:"", nom:"Épargne" };
        ui.objDraft.mode = el.getAttribute("data-val");
        ui.objDraft.erreurs = {};
        render();
        return;
      }
      case "choisir-pourcentage-objectif": {
        ui.objDraft = ui.objDraft || { mode:"auto", pourcentage:"10", montant:"", nom:"Épargne" };
        ui.objDraft.pourcentage = el.getAttribute("data-val");
        render();
        return;
      }
      case "enregistrer-objectif": enregistrerObjectif(); return;
      case "ouvrir-modifier-objectif": ui.draft = {}; openModal("modifier-objectif"); return;
      case "ouvrir-supprimer-objectif": openModal("confirmer-suppression-objectif"); return;
      case "confirmer-suppr-objectif": {
        state.objectifEpargne = null;
        saveState();
        closeModal();
        return;
      }
      case "modif-mode-objectif": {
        ui.draft.mode = el.getAttribute("data-val");
        render();
        return;
      }
      case "modif-pourcentage-objectif": {
        ui.draft.pourcentage = el.getAttribute("data-val");
        render();
        return;
      }
      case "enregistrer-modif-objectif": enregistrerModifObjectif(); return;

      case "telecharger-set-periode": ensureTelechargerRefs(); ui.telechargerPeriode = el.getAttribute("data-val"); render(); return;
      case "telecharger-nav": {
        var tsens = parseInt(el.getAttribute("data-sens"),10);
        var tper = el.getAttribute("data-periode");
        shiftTelechargerRef(tper, tsens);
        render();
        return;
      }
      case "telecharger-telecharger": telechargerImage(); return;
      case "telecharger-partager": partagerImage(); return;

      case "valider-code-acces": {
        var champCode = byId("f-codeAcces");
        if(champCode) ui.codeAccesInput = champCode.value;
        var saisieNorm = normaliserCode(ui.codeAccesInput);
        if(!state.config.codeAccesOk){
          if(saisieNorm === CODE_ACCES_ATTENDU){
            state.config.codeAccesOk = true;
            state.config.derniereValidationAcces = Date.now();
            // Mois d'essai : calculé à partir de la date d'installation réelle
            // (meta.creation, fixée dès le tout premier lancement), pas de la
            // date de saisie du code — les deux coïncident en pratique sauf si
            // l'utilisatrice a attendu avant de saisir le code initial.
            state.config.moisAccesValide = finEssaiPourInstallation(parseDateStr(state.meta.creation) || new Date());
            saveState();
            ui.codeAccesInput = "";
            ui.codeAccesErreur = "";
          } else {
            ui.codeAccesErreur = "Code incorrect, réessayez.";
          }
        } else {
          if(saisieNorm === codeAccesDuMoisAttenduAujourdhui()){
            state.config.derniereValidationAcces = Date.now();
            var dValid = new Date();
            state.config.moisAccesValide = { mois: dValid.getMonth()+1, annee: dValid.getFullYear() };
            saveState();
            ui.codeAccesInput = "";
            ui.codeAccesErreur = "";
          } else {
            ui.codeAccesErreur = "Code incorrect, réessayez.";
          }
        }
        render();
        return;
      }

      case "toggle-pin-reglages": {
        if(state.config.pinActif){
          state.config.pinActif = false;
          state.config.pinCode = null;
          saveState();
          render();
        } else {
          ui.pinSetupStep = "premier"; ui.pinSetupPremier = ""; ui.pinSetupInput = ""; ui.pinSetupErreur = false;
          openModal("pin-setup");
        }
        return;
      }
      case "toggle-abonnement-premium": {
        var idAbo = el.getAttribute("data-id");
        ui.abonnementToggles[idAbo] = !ui.abonnementToggles[idAbo];
        ui.reglagesMsg = "Disponible par abonnement premium — activation à venir.";
        render();
        return;
      }
      case "changer-pin": {
        ui.pinSetupStep = "premier"; ui.pinSetupPremier = ""; ui.pinSetupInput = ""; ui.pinSetupErreur = false;
        openModal("pin-setup");
        return;
      }
      case "pin-key": handlePinKey(el.getAttribute("data-id"), el.getAttribute("data-val")); return;
      case "pin-oublie": openModal("pin-oublie"); return;
      case "demander-erase": ui.modal.confirmErase = true; render(); return;
      case "annuler-erase": ui.modal.confirmErase = false; render(); return;
      case "confirmer-erase": {
        try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
        state = defaultState();
        ui.locked = false;
        ui.modal = null;
        render();
        return;
      }

      case "exporter-json": exporterJson(); return;

      case "toggle-rubrique-charge": {
        var rid = el.getAttribute("data-id");
        var rub = findRubriqueCharge(rid);
        if(rub){ rub.actif = !rub.actif; saveState(); render(); }
        return;
      }
      case "demander-suppression-rubrique": openModal("confirmer-suppression-rubrique", {id: el.getAttribute("data-id")}); return;
      case "confirmer-suppression-rubrique": {
        var ridSup = el.getAttribute("data-id");
        state.config.rubriquesCharges = state.config.rubriquesCharges.filter(function(r){ return r.id !== ridSup; });
        state.autresCharges.forEach(function(c){ if(c.rubriqueId === ridSup) c.rubriqueSupprimee = true; });
        saveState();
        ui.overlay = "reglages";
        closeModal();
        return;
      }
      case "ajouter-rubrique-charge": {
        var nomRub = (ui.draft["f-nouvelleRubrique"]||"").trim();
        if(nomRub){
          state.config.rubriquesCharges.push({ id: uid("rub"), nom: nomRub, emoji:"📝", actif:true, perso:true });
          saveState();
          ui.draft["f-nouvelleRubrique"] = "";
        }
        render();
        return;
      }

      case "go-tab": ui.tab = el.getAttribute("data-tab"); render(); return;

      case "etat-set-periode": {
        ensureEtatRefs();
        ui.etatPeriode = el.getAttribute("data-val");
        ui.etatSelSemaine = null; ui.etatSelJour = null;
        render();
        return;
      }
      case "etat-nav": {
        var sens = parseInt(el.getAttribute("data-sens"), 10);
        var per = el.getAttribute("data-periode");
        shiftRef(per, sens);
        ui.etatSelSemaine = null; ui.etatSelJour = null;
        render();
        return;
      }
      case "etat-select-jour": {
        ui.etatSelJour = el.getAttribute("data-date");
        ui.etatSelJourFrom = el.getAttribute("data-from");
        render();
        return;
      }
      case "etat-select-semaine": {
        ui.etatSelSemaine = el.getAttribute("data-week-start");
        render();
        return;
      }
      case "etat-back": {
        if(ui.etatSelJour){ ui.etatSelJour = null; ui.etatSelJourFrom = null; render(); return; }
        if(ui.etatSelSemaine){ ui.etatSelSemaine = null; render(); return; }
        return;
      }

      case "habitudes-set-periode": ensureHabitudesRefs(); ui.habitudesPeriode = el.getAttribute("data-val"); render(); return;
      case "habitudes-nav": {
        var hsens = parseInt(el.getAttribute("data-sens"), 10);
        var hper = el.getAttribute("data-periode");
        shiftHabitudesRef(hper, hsens);
        render();
        return;
      }

      case "add-coiffure": openModal("add-coiffure"); return;
      case "voir-coiffure": openModal("detail-coiffure", {id: el.getAttribute("data-id")}); return;

      case "voir-jour-mainoeuvre": openModal("jour-mainoeuvre"); return;
      case "voir-jour-champ": openModal("jour-champ", { champ: el.getAttribute("data-champ") }); return;
      case "voir-coiffure-du-jour": {
        ui.modalReturnTo = { type: "jour-mainoeuvre" };
        openModal("detail-coiffure", {id: el.getAttribute("data-id")});
        return;
      }

      case "voir-charges-jour": openModal("detail-charges-jour"); return;
      case "add-autre-charge": {
        ui.modalReturnTo = { type: "detail-charges-jour" };
        openModal("add-autre-charge");
        return;
      }
      case "voir-autre-charge": {
        ui.modalReturnTo = { type: "detail-charges-jour" };
        openModal("detail-autre-charge", {id: el.getAttribute("data-id")});
        return;
      }
      case "set-rubrique-charge": {
        captureDraft(["f-montantAutreCharge"]);
        ui.draft["f-rubrique"] = el.getAttribute("data-id");
        render();
        return;
      }

      case "demander-suppression": ui.modal.confirmDelete = true; render(); return;
      case "annuler-suppression": ui.modal.confirmDelete = false; render(); return;
      case "confirmer-suppression": {
        var kind = el.getAttribute("data-kind");
        var id = el.getAttribute("data-id");
        var map = { coiffure:"prestationsCoiffure", "autre-charge":"autresCharges" };
        var arrName = map[kind];
        if(arrName){
          state[arrName] = state[arrName].filter(function(x){ return x.id !== id; });
          saveState();
        }
        closeModal();
        return;
      }

      case "cliente-change": captureDraft(COIFFURE_FIELDS); render(); return;
      case "set-lieu-coiffure": {
        captureDraft(COIFFURE_FIELDS);
        ui.draft["f-lieu"] = el.getAttribute("data-val");
        render();
        return;
      }
      case "quartier-change": captureDraft(COIFFURE_FIELDS); render(); return;
      case "toggle-coiffure-type": {
        captureDraft(COIFFURE_FIELDS);
        var id2 = el.getAttribute("data-id");
        var sel = ui.draft.typesCoiffureSel || [];
        var idx = sel.indexOf(id2);
        if(idx===-1) sel.push(id2); else sel.splice(idx,1);
        ui.draft.typesCoiffureSel = sel;
        render();
        return;
      }
      case "toggle-nouveau-type-coiffure": {
        captureDraft(COIFFURE_FIELDS);
        ui.draft.showNouveauTypeCoiffure = !ui.draft.showNouveauTypeCoiffure;
        if(ui.draft.showNouveauTypeCoiffure) ui.pendingAutofocus = true;
        render();
        return;
      }
      case "ajouter-type-coiffure": {
        captureDraft(COIFFURE_FIELDS);
        var nom = (ui.draft["f-nouveauTypeCoiffure"]||"").trim();
        if(nom){
          var item = addPerso("typesCoiffure", nom);
          var sel2 = ui.draft.typesCoiffureSel || [];
          if(item && sel2.indexOf(item.id)===-1) sel2.push(item.id);
          ui.draft.typesCoiffureSel = sel2;
          ui.draft["f-nouveauTypeCoiffure"] = "";
          ui.draft.showNouveauTypeCoiffure = false;
        }
        render();
        return;
      }

      case "capture-coiffure": captureDraft(COIFFURE_FIELDS); return;
      case "capture-autre-charge": captureDraft(["f-montantAutreCharge"]); return;
      case "enregistrer-coiffure": enregistrerCoiffure(); return;
      case "enregistrer-autre-charge": enregistrerAutreCharge(); return;
    }
  }

  function handleChange(e){
    var el = e.target;
    var action = el.getAttribute && el.getAttribute("data-action-change");
    if(!action) return;
    switch(action){
      case "capture-coiffure": {
        captureDraft(COIFFURE_FIELDS);
        if((el.id === "f-clienteSel" && ui.draft["f-clienteSel"] === "__new__") ||
           (el.id === "f-quartierSel" && ui.draft["f-quartierSel"] === "__new__")){
          ui.pendingAutofocus = true;
        }
        return;
      }
      case "cliente-change": case "quartier-change": {
        captureDraft(COIFFURE_FIELDS);
        if((el.id === "f-clienteSel" && ui.draft["f-clienteSel"] === "__new__") ||
           (el.id === "f-quartierSel" && ui.draft["f-quartierSel"] === "__new__")){
          ui.pendingAutofocus = true;
        }
        render();
        return;
      }
      case "capture-code-acces": ui.codeAccesInput = el.value; ui.codeAccesErreur = ""; return;
      case "capture-obj-pourcentage": ui.objDraft.pourcentage = el.value; return;
      case "capture-obj-montant": ui.objDraft.montant = el.value; return;
      case "capture-obj-nom": ui.objDraft.nom = el.value; return;
      case "capture-modif-objectif": {
        if(el.id === "f-modifNom") ui.draft.nom = el.value;
        if(el.id === "f-modifPourcentage") ui.draft.pourcentage = el.value;
        if(el.id === "f-modifMontant") ui.draft.montant = el.value;
        return;
      }
      case "capture-autre-charge": captureDraft(["f-montantAutreCharge"]); return;
      case "capture-nouvelle-rubrique": ui.draft["f-nouvelleRubrique"] = el.value; return;
      case "importer-json": case "importer-json-lock": {
        var file = el.files && el.files[0];
        importerJsonDepuisFichier(file, function(ok){
          ui.backupMsg = ok ? "Sauvegarde restaurée." : "Ce fichier ne peut pas être lu comme une sauvegarde MonDjai/Coiffure.";
          if(ok){
            ui.locked = !!(state.config.pinActif && state.config.pinCode);
            if(!ui.locked){ ui.modal = null; ui.overlay = null; }
          }
          render();
        });
        return;
      }
    }
  }

  /* ================= Démarrage ================= */

  document.addEventListener("click", handleClick);
  document.addEventListener("change", handleChange);

  state = loadState();
  ui.locked = !!(state.config.pinActif && state.config.pinCode);
  render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }

  window.__mondjaiCoiffure = {
    getState: function(){ return state; },
    setState: function(s){ state = s; saveState(); render(); },
    render: render,
    STORAGE_KEY: STORAGE_KEY,
    codeAccesDuMois: codeAccesDuMois,
    codeAccesDuMoisAttenduAujourdhui: codeAccesDuMoisAttenduAujourdhui,
    accesMensuelExpire: accesMensuelExpire,
    finEssaiPourInstallation: finEssaiPourInstallation,
    compareMoisAnnee: compareMoisAnnee,
    parseDateStr: parseDateStr,
    normaliserEtatImporte: normaliserEtatImporte,
    defaultState: defaultState
  };
})();
</script>
</body>
</html>
