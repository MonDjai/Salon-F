        '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-encMontant" value="' + esc(d["f-encMontant"]) + '" data-action-change="capture-encaisser">' +
        fieldErr("encMontant") +
      '</div>' +
      '<div class="field"><div class="label">Date de l’encaissement <span class="req">*</span></div>' +
        '<input type="date" class="input" id="f-encDate" min="' + esc(p.date) + '" max="' + todayStr() + '" value="' + esc(d["f-encDate"]) + '" data-action-change="capture-encaisser">' +
        '<div class="field-note">La somme compte dans les recettes de ce jour-là.</div>' +
        fieldErr("encDate") +
      '</div>' +
      '<button type="button" class="btn btn-vert" data-action="enregistrer-encaissement">Enregistrer l’encaissement</button>';
    if(ui.modal.confirmAbandon){
      html +=
        '<div class="confirm-box"><p>Marquer ce crédit comme abandonné ? Le reste dû (' + esc(montantInsecable(reste)) + ') sort du total à encaisser. Aucun autre chiffre ne change : il n’avait jamais été compté.</p>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn btn-secondary" data-action="annuler-abandon">Annuler</button>' +
            '<button type="button" class="btn btn-danger" data-action="confirmer-abandon">Oui, abandonner</button>' +
          '</div></div>';
    } else {
      html += '<button type="button" class="lien-discret" data-action="demander-abandon">La cliente ne paiera pas</button>';
    }
    return html;
  }
  function enregistrerEncaissement(){
    var p = prestationParId(ui.modal && ui.modal.id);
    if(!p || !creditDe(p)){ closeModal(); return; }
    captureDraft(["f-encMontant", "f-encDate"]);
    var d = ui.draft;
    var errors = {};
    var brut = String(d["f-encMontant"]||"").trim();
    var montant = toNum(brut);
    var date = d["f-encDate"] || todayStr();
    var reste = resteDuCredit(p);
    if(brut === "" || !(montant > 0)) errors.encMontant = "Indiquez le montant reçu.";
    else if(Math.round(montant) > reste) errors.encMontant = "C’est plus que le reste dû (" + formatFCFA(reste) + "). Indiquez au plus " + formatFCFA(reste) + ".";
    if(date < p.date) errors.encDate = "L’encaissement ne peut pas être daté avant la prestation (" + formatDateFr(p.date) + ").";
    else if(date > todayStr()) errors.encDate = "La date ne peut pas être dans le futur.";
    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }
    state.encaissementsCredit.push({ id: uid("enc"), prestationId: p.id, date: date, montant: Math.round(montant), ts: Date.now() });
    majStatutCredit(p);
    saveState();
    var c = creditDe(p);
    ui.creditMsg = statutCredit(p) === "solde"
      ? (c.clienteNom || "La cliente") + " a tout payé : crédit soldé ✓"
      : formatFCFA(Math.round(montant)) + " encaissés · reste " + formatFCFA(resteDuCredit(p)) + ".";
    ui.errors = {};
    closeModal();
  }

  /* ================= Modal : dispatcher ================= */

  function renderModal(){
    var m = ui.modal;
    var body = "";
    var title = "";
    switch(m.type){
      case "add-coiffure": title = estModeSalon() ? "Nouvelle prestation" : "Nouvelle prestation coiffure"; body = renderFormCoiffure(); break;
      case "detail-coiffure": title = "Détail de la prestation"; body = renderDetailCoiffure(); break;
      case "jour-mainoeuvre": title = estModeSalon() ? "Recette du jour" : "Prestations d’aujourd’hui"; body = renderJourMainOeuvreModal(); break;
      case "jour-champ": title = (m.champ==="transport"?"Transport":"Mèche") + " du jour"; body = renderJourChampModal(m.champ); break;
      case "detail-charges-jour": title = "Charges communes"; body = renderDetailChargesJour(); break;
      case "add-autre-charge": title = "Nouvelle charge"; body = renderFormAutreCharge(); break;
      case "detail-autre-charge": title = "Détail de la charge"; body = renderDetailAutreCharge(); break;
      case "confirmer-suppression-rubrique": title = "Supprimer la rubrique"; body = renderConfirmSuppressionRubrique(); break;
      case "modifier-objectif": title = "Modifier l’objectif"; body = renderFormModifierObjectif(); break;
      case "confirmer-suppression-objectif": title = "Supprimer l’objectif"; body = renderConfirmSuppressionObjectif(); break;
      case "pin-setup": title = "Code PIN"; body = renderPinSetupModal(); break;
      case "pin-oublie": title = "Code oublié ?"; body = renderPinOublieModal(); break;
      // Sprint 8A — mode Salon
      case "charges-mois": title = "Charges " + deMois(libelleMoisCle(moisCourantCle())); body = renderChargesMoisModal(); break;
      case "fonds-detail": title = "Fonds produits"; body = renderFondsDetailModal(); break;
      case "credit-config": title = m.nouveau ? "Nouveau crédit" : "Crédit"; body = renderCreditConfigModal(); break;
      case "remu-config": title = m.cible === "proprio" ? "Ma rémunération" : (m.nouveau ? "Nouveau salarié" : "Salarié"); body = renderRemuConfigModal(); break;
      // Sprint 8C
      case "edit-coiffure": title = "Modifier la prestation"; body = renderFormCoiffure(); break;
      case "edit-charge": title = "Modifier la charge"; body = renderFormAutreCharge(); break;
      case "credits-clientes": title = "Crédit clientes"; body = renderCreditsClientes(); break;
      case "encaisser-credit": {
        var pe = prestationParId(m.id), ce = pe ? creditDe(pe) : null;
        title = "Encaisser" + (ce && ce.clienteNom ? " — " + ce.clienteNom : "");
        body = renderEncaisserCredit();
        break;
      }
      case "details-mois": title = "Détails du mois · " + libelleMoisCleMaj(m.cle || moisCourantCle()); body = renderDetailsMois(m.cle || moisCourantCle()); break;
      default: body = "";
    }
    return (
      '<div class="modal-overlay" data-action="fermer-modal-overlay">' +
        '<div class="modal" data-stop-close="1" data-modal="' + esc(m.type) + '">' +
          '<div class="modal-head">' +
            '<div class="modal-title">' + esc(title) + '</div>' +
            '<button type="button" class="modal-close" data-action="fermer-modal">✕</button>' +
          '</div>' +
          body +
        '</div>' +
      '</div>'
    );
  }

  /* ================= F8 : Mon état (solde net → prestations → Main d’œuvre/Épargne) ================= */

  var MOIS_NOMS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function moisLabelFor(d){ return MOIS_NOMS[d.getMonth()] + " " + d.getFullYear(); }

  function ensureEtatRefs(){
    if(!ui.etatSemaineRef) ui.etatSemaineRef = todayStr();
    if(!ui.etatMoisRef) ui.etatMoisRef = todayStr();
  }
  function shiftRef(refName, delta){
    if(refName === "semaine"){
      var d = dateFromStr(ui.etatSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;
      if(nouveau > refAujourdhui) nouveau = refAujourdhui;
      var refPlusAncienne = earliestActivityWeekStart();
      if(nouveau < refPlusAncienne) nouveau = refPlusAncienne;
      ui.etatSemaineRef = nouveau;
    } else if(refName === "mois"){
      var d2 = dateFromStr(ui.etatMoisRef);
      d2.setDate(1);
      d2.setMonth(d2.getMonth() + delta);
      var nouveau2 = dateKey(d2);
      var refAujourdhuiM = getMonthRange(new Date()).start;
      if(nouveau2 > refAujourdhuiM) nouveau2 = refAujourdhuiM;
      var refPlusAncienM = earliestActivityMonthStart();
      if(nouveau2 < refPlusAncienM) nouveau2 = refPlusAncienM;
      ui.etatMoisRef = nouveau2;
    }
  }

  function renderEtatBack(){
    return '<button type="button" class="btn btn-ghost" style="padding:8px 0; margin-bottom:6px;" data-action="etat-back">‹ Retour</button>';
  }
  function renderEtatSemaineNav(){
    var range = getWeekRange(dateFromStr(ui.etatSemaineRef));
    var label = formatDateFr(range.start) + " – " + formatDateFr(range.end);
    var estActuelle = ui.etatSemaineRef >= getWeekRange(new Date()).start;
    // Sprint 8C (correctif repris de Revente-C) : borne comparée sur le DÉBUT
    // de la période (la référence peut être n'importe quel jour de celle-ci).
    var estPlusAncienne = range.start <= earliestActivityWeekStart();
    return (
      '<div class="etat-nav">' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="-1" data-periode="semaine"' + (estPlusAncienne?" disabled":"") + '>‹</button>' +
        '<div class="en-label">' + esc(label) + '</div>' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="1" data-periode="semaine"' + (estActuelle?" disabled":"") + '>›</button>' +
      '</div>'
    );
  }
  function renderEtatMoisNav(){
    var ref = dateFromStr(ui.etatMoisRef);
    var label = moisLabelFor(ref).charAt(0).toUpperCase() + moisLabelFor(ref).slice(1);
    var estActuelle = ui.etatMoisRef >= getMonthRange(new Date()).start;
    var estPlusAncien = getMonthRange(ref).start <= earliestActivityMonthStart();
    return (
      '<div class="etat-nav">' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="-1" data-periode="mois"' + (estPlusAncien?" disabled":"") + '>‹</button>' +
        '<div class="en-label">' + esc(label) + '</div>' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="1" data-periode="mois"' + (estActuelle?" disabled":"") + '>›</button>' +
      '</div>'
    );
  }

  var JOURS_NOMS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function renderEtatListeJours(range, from){
    var jours = [];
    var d = dateFromStr(range.start);
    var end = dateFromStr(range.end);
    while(dateKey(d) <= dateKey(end)){
      jours.push(dateKey(d));
      d.setDate(d.getDate()+1);
    }
    var today = todayStr();
    var rows = jours.map(function(ds){
      var dd = dateFromStr(ds);
      var label = JOURS_NOMS[dd.getDay()].charAt(0).toUpperCase() + JOURS_NOMS[dd.getDay()].slice(1) + " " + formatDateFr(ds);
      if(ds > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }
      var solde = valeurListePeriode({ start:ds, end:ds });
      return (
        '<button type="button" class="entry-card" style="width:100%; text-align:left;" data-action="etat-select-jour" data-date="' + ds + '" data-from="' + from + '">' +
          '<div class="entry-main"><div class="entry-title">' + esc(label) + '</div></div>' +
          '<div class="entry-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        '</button>'
      );
    }).join("");
    return '<div class="entry-list">' + rows + '</div>';
  }

  function renderEtatListeSemaines(monthRange){
    var firstWeekStart = getWeekRange(dateFromStr(monthRange.start)).start;
    var lastWeekStart = getWeekRange(dateFromStr(monthRange.end)).start;
    var semaines = [];
    var cur = firstWeekStart;
    while(cur <= lastWeekStart){
      semaines.push(cur);
      var d = dateFromStr(cur); d.setDate(d.getDate()+7);
      cur = dateKey(d);
    }
    var today = todayStr();
    var rows = semaines.map(function(ws){
      var range = getWeekRange(dateFromStr(ws));
      var label = formatDateFr(range.start) + " – " + formatDateFr(range.end);
      if(range.start > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }
      var solde = valeurListePeriode(range);
      return (
        '<button type="button" class="entry-card" style="width:100%; text-align:left;" data-action="etat-select-semaine" data-week-start="' + ws + '">' +
          '<div class="entry-main"><div class="entry-title">' + esc(label) + '</div></div>' +
          '<div class="entry-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        '</button>'
      );
    }).join("");
    return '<div class="entry-list">' + rows + '</div>';
  }

  // Bloc commun : solde net → liste des prestations (de la journée) → Main
  // d'œuvre et Épargne — ordre imposé par le cahier des charges, section 6.
  // Réorganisation (observations terrain, façon MonDjai/Trépor) : Main
  // d'œuvre, Charges et Épargne apparaissent désormais en mini-rangée DANS la
  // carte solde elle-même, juste sous le gros chiffre — avant la liste des
  // prestations — plutôt qu'en bloc séparé après la liste.
  function renderMiniStatsRow(recette, charges, eparg){
    return (
      '<div class="solde-mini-stats">' +
        '<div class="sms-col"><div class="sms-label">Main d’œuvre</div><div class="sms-val">' + formatFCFA(recette) + '</div></div>' +
        '<div class="sms-col"><div class="sms-label">Charges</div><div class="sms-val">' + formatFCFA(charges) + '</div></div>' +
        '<div class="sms-col"><div class="sms-label">Épargne</div><div class="sms-val">' + (state.objectifEpargne ? formatFCFA(eparg) : "Aucun") + '</div></div>' +
      '</div>'
    );
  }

  function renderBlocEtatJour(dateStr){
    var range = { start: dateStr, end: dateStr };
    var recette = recetteCoiffure(range);
    var charges = chargesCommunesTotal(range);
    var eparg = epargnePeriode(range);
    var solde = recette - eparg - charges;
    var titre = '<div class="hint tight" style="margin-bottom:10px; font-weight:700; color:var(--text);">' + esc(formatDateFr(dateStr)) + '</div>';
    var soldeCard = (
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">Solde net</div>' +
        '<div class="ds-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        renderMiniStatsRow(recette, charges, eparg) +
      '</div>'
    );
    var listeHtml = '<div class="section-title" style="margin-top:2px;">Prestations de la journée</div>' +
      renderListePrestationsRange(range, "💇", "Aucune prestation ce jour-là", "Les prestations de cette journée apparaîtront ici.");
    return titre + soldeCard + listeHtml;
  }

  function renderBlocEtatPeriode(range){
    var recette = recetteCoiffure(range);
    var charges = chargesCommunesTotal(range);
    var eparg = epargnePeriode(range);
    var solde = recette - eparg - charges;
    var soldeCard = (
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">Solde net</div>' +
        '<div class="ds-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        renderMiniStatsRow(recette, charges, eparg) +
      '</div>'
    );
    return { soldeCard: soldeCard, recette: recette, eparg: eparg };
  }

  // Sprint 8B : vue de Mon état en mode Salon — "salon" (consolidée, par
  // défaut), "coiffure" ou "onglerie" (amendement, section 8).
  function vueEtat(){ return (ui.etatVue === "coiffure" || ui.etatVue === "onglerie") ? ui.etatVue : "salon"; }
  function recettesVue(range){
    var v = vueEtat();
    return v === "salon" ? recetteCoiffure(range) : recettesActivite(range, v);
  }
  function aDeLOnglerie(){ return state.prestationsCoiffure.some(function(p){ return activiteDe(p) === "onglerie"; }); }
  function lblVue(base){
    var v = vueEtat();
    return v === "salon" ? base : base + " — " + v;
  }

  // Montant affiché dans les listes de jours / semaines de Mon état : solde net
  // (Sprint 7, inchangé) en mode À domicile ; recettes (de la vue choisie) en
  // mode Salon, où les charges (fonds produits compris) ne se déduisent qu'au mois.
  function valeurListePeriode(range){
    return estModeSalon() ? recettesVue(range) : soldeNetPeriode(range);
  }

  /* ----- Sprints 8A/8B : Mon état en mode Salon ----- */

  function renderCarteRecettes(range, label){
    var v = vueEtat();
    var recette = recettesVue(range);
    var items = filterRange(state.prestationsCoiffure, range);
    if(v !== "salon") items = items.filter(function(p){ return activiteDe(p) === v; });
    var nb = items.length;
    var detail = (v === "salon" && aDeLOnglerie())
      ? " · coiffure " + formatFCFA(recettesActivite(range, "coiffure")) + " · onglerie " + formatFCFA(recettesActivite(range, "onglerie"))
      : "";
    var suite = v === "salon" ? " · les charges se déduisent au mois (onglet Mois)" : " · produits et marge : onglet Mois";
    return (
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">' + esc(lblVue(label)) + '</div>' +
        '<div class="ds-amount">' + formatFCFA(recette) + '</div>' +
        '<div class="ds-sub">' + nb + (nb > 1 ? " prestations" : " prestation") + esc(detail) + esc(suite) + '</div>' +
      '</div>'
    );
  }
  function renderBlocEtatJourSalon(dateStr){
    var range = { start: dateStr, end: dateStr };
    var v = vueEtat();
    var titre = '<div class="hint tight" style="margin-bottom:10px; font-weight:700; color:var(--text);">' + esc(formatDateFr(dateStr)) + '</div>';
    return titre + renderCarteRecettes(range, "Recette du jour") +
      '<div class="section-title" style="margin-top:2px;">Prestations de la journée</div>' +
      renderListePrestationsRange(range, v === "onglerie" ? "💅" : "💇", "Aucune prestation ce jour-là", "Les prestations de cette journée apparaîtront ici.", v === "salon" ? null : v);
  }

  function badgeMois(provisoire){
    return provisoire ? '<span class="ds-badge provisoire">Provisoire</span>' : '<span class="ds-badge definitif">Définitif</span>';
  }

  // Vues Coiffure / Onglerie du mois (amendement, section 8) : recettes de
  // l'activité − produits de l'activité = marge de l'activité. Les charges
  // communes n'y figurent pas : elles appartiennent au salon.
  // Sprint 8C : à l'écran, la carte Marge seulement ; la chaîne et la liste
  // des produits achetés passent dans la feuille « Détails du mois ».
  function chiffresActiviteMois(cle, act){
    var range = rangeDuMoisCle(cle);
    var recettes = recettesActivite(range, act);
    var produits = achatsProduitsMois(cle, "produits_" + act);
    var nb = filterRange(state.prestationsCoiffure, range).filter(function(p){ return activiteDe(p) === act; }).length;
    return { recettes: recettes, produits: produits, marge: recettes - produits, nb: nb, nomAct: act === "onglerie" ? "onglerie" : "coiffure" };
  }
  function renderBlocActiviteMois(cle, act){
    var x = chiffresActiviteMois(cle, act);
    return (
      '<div class="dash-solde" style="margin-bottom:12px;" data-test="carte-marge">' +
        '<div class="ds-label">Marge ' + x.nomAct + ' du mois' + badgeMois(cle >= moisCourantCle()) + '</div>' +
        '<div class="ds-amount' + (x.marge < 0 ? " neg" : "") + '">' + formatFCFA(x.marge) + '</div>' +
        '<div class="solde-mini-stats">' +
          '<div class="sms-col"><div class="sms-label">Recettes</div><div class="sms-val">' + formatFCFA(x.recettes) + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Produits</div><div class="sms-val">' + formatFCFA(x.produits) + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Prestations</div><div class="sms-val">' + x.nb + '</div></div>' +
        '</div>' +
      '</div>' +
      renderBoutonDetailsMois(cle, [], act)
    );
  }
  function renderDetailsActiviteMois(cle, act){
    var x = chiffresActiviteMois(cle, act);
    var chaine =
      '<div class="chaine-box">' +
        '<div class="chaine-row"><div class="ch-k">Recettes ' + x.nomAct + ' du mois</div><div class="ch-v">' + formatFCFA(x.recettes) + '</div></div>' +
        '<div class="chaine-row"><div class="ch-k">− Produits ' + x.nomAct + ' achetés</div><div class="ch-v">' + formatFCFA(x.produits) + '</div></div>' +
        '<div class="chaine-row total"><div class="ch-k">= Marge de l’activité</div><div class="ch-v"' + (x.marge < 0 ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(x.marge) + '</div></div>' +
      '</div>';
    var achats = chargesDuMois(cle).filter(function(c){ return typeDeCharge(c) === "produits_" + act; });
    var detailAchats = renderBreakdownRows("Produits " + x.nomAct + " achetés ce mois",
      achats.map(function(c){ return { label: formatDateFr(c.date) + (c.note ? " · " + c.note : ""), montant: c.montant }; }));
    return '<div class="section-title">Chaîne de calcul</div>' + chaine + detailAchats +
      '<div class="hint" style="margin:-4px 0 6px;">Les charges communes (loyer, CIE, SODECI…) n’apparaissent que dans la vue Salon : elles appartiennent au salon, pas à une activité.</div>';
  }

  // Ligne courte de clause pour la répartition (« 30 % », « fixe »).
  function clauseCourte(l){
    if(!l || !l.mode) return "non réglée";
    return l.mode === "pourcentage" ? formatPct(l.valeur) : "montant fixe";
  }
  // Sprint 8B — répartition du résultat net (amendement, section 7, étapes 4 à 8).
  function renderRepartitionMois(cle){
    var rep = repartitionMois(cle);
    var rn = rep.resultatNet;
    function ligne(k, v, neg){
      return '<div class="chaine-row"><div class="ch-k">' + esc(k) + '</div><div class="ch-v"' + (neg ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(v) + '</div></div>';
    }
    var rows = ligne("Résultat net du mois", rn, rn < 0);
    if(rep.proprio) rows += ligne("→ Propriétaire (" + clauseCourte(rep.proprio) + ")", rep.proprio.montant);
    rep.salaries.forEach(function(sl){ rows += ligne("→ " + sl.nom + " (" + clauseCourte(sl) + ")", sl.montant); });
    if(rep.epargne) rows += ligne("→ Épargne du mois (" + clauseCourte(rep.epargne) + ")", rep.epargne.montant);
    rows += '<div class="chaine-row total"><div class="ch-k">= Reste après rémunérations et épargne</div><div class="ch-v" data-test="detail-reste"' + (rep.reste < 0 ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(rep.reste) + '</div></div>';
    var vide = !rep.proprio && !rep.salaries.length && !rep.epargne;
    return (
      '<div class="section-title">Répartition du résultat net</div>' +
      '<div class="chaine-box">' + rows + '</div>' +
      rep.alertes.map(function(a){ return '<div class="alerte-douce">' + esc(a) + '</div>'; }).join("") +
      (vide ? '<div class="hint" style="margin:-4px 0 16px;">Réglez votre rémunération et celle de vos salariés dans Réglages, et l’épargne du mois dans Objectif d’épargne.</div>' : '')
    );
  }

  // Sprint 8C — points d'attention du mois : reste négatif, fonds à
  // découvert (mois en cours), pourcentages au-delà de 100 %, résultat net
  // négatif. Ils allument la pastille rouge du bouton « Détails du mois ».
  // Sprint 8D : chaque point a un libellé court (ligne du bouton quand il est
  // seul) et un libellé complet (encadré de la feuille) ; « Reste du salon
  // négatif » devient « Rémunérations et épargne pas couvertes (il manque …) ».
  function pointsAttentionDetail(cle){
    var rep = repartitionMois(cle);
    var pts = [];
    if(rep.resultatNet < 0) pts.push({ court: "Résultat net négatif", long: "Résultat net négatif" });
    if(rep.reste < 0) pts.push({ court: "Rémunérations et épargne pas couvertes", long: "Rémunérations et épargne pas couvertes (il manque " + formatFCFA(Math.abs(rep.reste)) + ")" });
    if(rep.totalPct > 100) pts.push({ court: "Total des pourcentages au-delà de 100 %", long: "Total des pourcentages au-delà de 100 %" });
    if(cle === moisCourantCle()){
      var sf = soldeFonds();
      if(sf.configure && sf.solde < 0) pts.push({ court: "Fonds produits à découvert", long: "Fonds produits à découvert (" + formatFCFA(Math.abs(sf.solde)) + ")" });
    }
    return pts;
  }
  function pointsAttentionMois(cle){
    return pointsAttentionDetail(cle).map(function(p){ return p.long; });
  }
  // Bouton « 📋 Détails du mois · Octobre 2026 » (style du bouton « Ce mois-ci »
  // de Revente-E), avec pastille rouge s'il y a un point d'attention : un
  // seul point est dit en clair ; plusieurs, « N points d'attention ».
  function renderBoutonDetailsMois(cle, pts, act){
    var n = pts ? pts.length : 0;
    var sous = n === 1
      ? pts[0].court + " — voir les détails"
      : (n > 1 ? n + " points d’attention — voir les détails"
        : (act ? "Chaîne de calcul, produits achetés" : "Recettes, charges, répartition, crédits"));
    return (
      '<button type="button" class="mois-btn" data-action="voir-details-mois" data-cle="' + cle + '" data-test="bouton-details-mois">' +
        '<span class="cm-ico">📋' + (n ? '<span class="cm-pastille" data-test="pastille-attention" aria-label="Point d’attention"></span>' : '') + '</span>' +
        '<span class="cm-main">' +
          '<span class="cm-titre">Détails du mois · <span class="cm-mois">' + esc(libelleMoisCleMaj(cle)) + '</span></span>' +
          '<span class="cm-sous' + (n ? " attention" : "") + '" data-test="ligne-attention">' + esc(sous) + '</span>' +
        '</span>' +
        '<span class="cm-chev" aria-hidden="true">›</span>' +
      '</button>'
    );
  }

  // Vue Salon du mois — Sprint 8C, écran allégé ; Sprint 8D : la carte
  // Résultat net montre DEUX chiffres, lus comme une soustraction :
  // Recettes − Charges (charges du mois + prévision du fonds produits, même
  // total que la jauge d'Aujourd'hui). Plus de colonne « Fonds » ni de ligne
  // « Reste du salon » (gardée dans la feuille). Au toucher : « Détails du mois ».
  function renderBlocSalonMois(cle){
    var r = resultatNetMois(cle);
    var rn = r.resultatNet;
    var charges = r.charges + r.fonds;
    var carte =
      '<button type="button" class="dash-solde as-btn" style="margin-bottom:12px;" data-action="voir-details-mois" data-cle="' + cle + '" data-test="carte-resultat"' +
        ' aria-label="' + esc("Résultat net du mois " + formatFCFA(rn) + " : recettes " + formatFCFA(r.recettes) + " moins charges " + formatFCFA(charges) + ". Voir les détails du mois.") + '">' +
        '<div class="ds-label">Résultat net du mois' + badgeMois(r.provisoire) + '</div>' +
        '<div class="ds-amount' + (rn < 0 ? " neg" : "") + '" data-test="resultat-net">' + formatFCFA(rn) + '</div>' +
        '<div class="soustraction">' +
          '<div class="sx-label">Recettes</div><div></div><div class="sx-label">Charges</div>' +
          '<div class="sx-prec">argent reçu</div><div></div><div class="sx-prec">loyer, factures, prêt, produits</div>' +
          '<div class="sx-val" data-test="mois-recettes">' + formatFCFA(r.recettes) + '</div>' +
          '<div class="sx-moins" aria-hidden="true">−</div>' +
          '<div class="sx-val" data-test="mois-charges">' + formatFCFA(charges) + '</div>' +
        '</div>' +
      '</button>';
    return carte + renderBoutonDetailsMois(cle, pointsAttentionDetail(cle));
  }

  // Feuille « Détails du mois » (vue Salon) : chaîne de calcul, répartition,
  // alertes douces, jauge (mois en cours), charges par rubrique, fonds,
  // remboursements de prêt, crédit clientes du mois. Aucun calcul modifié.
  function renderDetailsSalonMois(cle){
    var r = resultatNetMois(cle);
    var rn = r.resultatNet;
    var pts = pointsAttentionMois(cle);
    var attention = pts.length
      ? '<div class="attention-box" data-test="attention-box"><b>' + pts.length + (pts.length > 1 ? " points d’attention" : " point d’attention") + '</b> — rien n’est bloqué :<ul>' +
          pts.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div>'
      : '';
    var perte = "";
    if(rn < 0){
      perte = '<div class="dash-perte" style="margin:0 0 14px;">' + (r.provisoire
        ? "Pour l’instant, les recettes ne couvrent pas encore les charges du mois (" + formatFCFA(Math.abs(rn)) + " à rattraper)."
        : "Mois à perte : " + formatFCFA(Math.abs(rn)) + ". Ça arrive — on note et on avance.") + '</div>';
    }
    var v = versionFondsPourMois(cle);
    var fondsHint = (fondsActifPourMois(cle) && v.mode === "pourcentage") ? " (" + formatPct(v.valeur) + " des recettes)" : "";
    var range = rangeDuMoisCle(cle);
    function dont(k, val, test){
      return '<div class="chaine-row dont"' + (test ? ' data-test="' + test + '"' : '') + '><div class="ch-k">' + esc(k) + '</div><div class="ch-v">' + val + '</div></div>';
    }
    var detailRecettes = aDeLOnglerie()
      ? dont("dont coiffure · onglerie", formatFCFA(recettesActivite(range, "coiffure")) + ' · ' + formatFCFA(recettesActivite(range, "onglerie")))
      : '';
    var encMois = sumBy(encaissementsPeriode(range), function(e){ return e.montant; });
    var detailEnc = encMois > 0 ? dont("dont crédits encaissés", formatFCFA(encMois)) : '';
    // Sprint 8D : les charges du mois comprennent la prévision du fonds
    // produits (même total que la jauge d'Aujourd'hui) — chaîne en deux termes.
    var chargesAffichees = r.charges + r.fonds;
    var detailCharges = r.fonds > 0
      ? dont("dont loyer, factures, prêt et autres charges", formatFCFA(r.charges), "dont-charges") +
        dont("dont fonds produits" + fondsHint, formatFCFA(r.fonds), "dont-fonds")
      : '';

    var chaine =
      '<div class="section-title">Chaîne de calcul</div>' +
      '<div class="chaine-box" data-test="chaine-mois">' +
        '<div class="chaine-row"><div class="ch-k">Recettes du mois</div><div class="ch-v" data-test="detail-recettes">' + formatFCFA(r.recettes) + '</div></div>' +
        detailRecettes + detailEnc +
        '<div class="chaine-row"><div class="ch-k">− Charges du mois</div><div class="ch-v" data-test="detail-charges">' + formatFCFA(chargesAffichees) + '</div></div>' +
        detailCharges +
        '<div class="chaine-row total"><div class="ch-k">= Résultat net</div><div class="ch-v" data-test="detail-resultat"' + (rn < 0 ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(rn) + '</div></div>' +
      '</div>';

    var jauge = (cle === moisCourantCle()) ? renderJaugeCard(cle, true) : "";

    // Charges du mois par rubrique : la prévision du fonds produits en tête,
    // la liste tombe juste sur le total des charges du mois.
    var lignesRub = groupSum(chargesComptees(cle), function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; });
    if(r.fonds > 0) lignesRub.unshift({ label: "Fonds produits (prévision du mois)", montant: r.fonds });
    var chargesRub = renderBreakdownRows("Charges du mois — par rubrique", lignesRub, chargesAffichees);

    var fondsBloc = "";
    var sf = soldeFonds();
    if(sf.configure){
      var actif = fondsActifPourMois(cle);
      var rows =
        '<div class="eb-row"><div class="eb-nom">Prévision du mois</div><div class="eb-val">' + formatFCFA(r.fonds) + '</div></div>' +
        (actif ?
          '<div class="eb-row"><div class="eb-nom">Achats produits coiffure</div><div class="eb-val">' + formatFCFA(achatsProduitsMois(cle, "produits_coiffure")) + '</div></div>' +
          '<div class="eb-row"><div class="eb-nom">Achats produits onglerie</div><div class="eb-val">' + formatFCFA(achatsProduitsMois(cle, "produits_onglerie")) + '</div></div>'
          : '<div class="eb-row"><div class="eb-nom">Fonds arrêté ce mois : achats comptés dans les charges</div><div class="eb-val">—</div></div>') +
        '<div class="eb-row"><div class="eb-nom">Solde du fonds à ce jour</div><div class="eb-val" style="color:' + (sf.solde < 0 ? "var(--red)" : "var(--green)") + ';">' + formatFCFA(sf.solde) + '</div></div>';
      fondsBloc = '<div class="etat-breakdown" data-test="bloc-fonds"><div class="eb-title">Fonds produits (coiffure et onglerie)</div>' + rows + '</div>' +
        (sf.solde < 0 ? renderAlerteFonds(sf) : "");
    }

    var creditsBloc = "";
    var credits = (state.config.credits || []).filter(function(c){ return !!findRubriqueCharge(c.rubriqueId); });
    if(credits.length){
      creditsBloc = '<div class="etat-breakdown"><div class="eb-title">Remboursements de prêt</div>' +
        credits.map(function(c){
          var rub = findRubriqueCharge(c.rubriqueId);
          return '<div class="credit-row"><div class="cr-top"><div class="cr-ico">' + esc(rub.emoji || "🏦") + '</div>' +
            '<div class="cr-txt"><div class="cr-nom">' + esc(rub.nom) + '</div><div class="cr-sub">' + esc(sousTitreCredit(c)) + '</div></div></div>' +
            renderBilanCreditHtml(c) + '</div>';
        }).join("") + '</div>';
    }

    return attention + chaine + perte + renderRepartitionMois(cle) + jauge + chargesRub + fondsBloc + creditsBloc + renderCreditClientesMois(cle);
  }

  // Sprint 8C — crédit clientes du mois : encaissé ce mois, reste à encaisser.
  function renderCreditClientesMois(cle){
    if(!aDejaUnCredit()) return "";
    var range = rangeDuMoisCle(cle);
    var encMois = sumBy(encaissementsPeriode(range), function(e){ return e.montant; });
    var prestMois = state.prestationsCoiffure.filter(function(p){ return creditDe(p) && inRange(p.date, range); });
    var resteMois = sumBy(prestMois.filter(function(p){ return statutCredit(p) === "en_cours"; }), resteDuCredit);
    return (
      '<div class="etat-breakdown" data-test="credit-clientes-mois"><div class="eb-title">Crédit clientes</div>' +
        '<div class="eb-row"><div class="eb-nom">Encaissé ce mois (crédits)</div><div class="eb-val" style="color:var(--green);" data-test="cc-encaisse-mois">' + formatFCFA(encMois) + '</div></div>' +
        '<div class="eb-row"><div class="eb-nom">Reste à encaisser (prestations du mois)</div><div class="eb-val" style="color:var(--pink);" data-test="cc-reste-mois">' + formatFCFA(resteMois) + '</div></div>' +
        '<div class="eb-row"><div class="eb-nom">Total à encaisser aujourd’hui</div><div class="eb-val">' + formatFCFA(totalAEncaisser()) + '</div></div>' +
      '</div>' +
      '<div class="hint" style="margin:-8px 0 8px;">Le reste dû ne compte dans aucun calcul tant qu’il n’est pas reçu.</div>'
    );
  }

  function renderDetailsMois(cle){
    var vue = (ui.modal && ui.modal.vue) || "salon";
    return vue === "salon" ? renderDetailsSalonMois(cle) : renderDetailsActiviteMois(cle, vue);

    var vues = [["salon","💈 Salon"],["coiffure","💇 Coiffure"],["onglerie","💅 Onglerie"]].map(function(x){

    }).join("");
    var tabs = ["jour","semaine","mois"].map(function(p){

      return '<button type="button" class="etat-tab' + (periode===p?" active":"") + '" data-action="etat-set-periode" data-val="' + p + '">' + lbl + '</button>';

    var body = "";
    if(periode === "jour"){

      } else {

        body = renderEtatSemaineNav() + renderCarteRecettes(wr, "Recettes de la semaine") +

          '<div class="hint tight" style="margin-bottom:10px; font-weight:700; color:var(--text);">' + esc(formatDateFr(wr2.start) + " – " + formatDateFr(wr2.end)) + '</div>' +
          renderCarteRecettes(wr2, "Recettes de la semaine") +

    return (
      '<div class="section-title">Mon état · ' + LIBELLES_VUE[vue] + '</div>' +

  var LIBELLES_VUE = { salon:"Salon", coiffure:"Coiffure", onglerie:"Onglerie" };

          '<div class="hint tight" style="margin-bottom:10px; font-weight:700; color:var(--text);">' + esc(formatDateFr(wr2.start) + " – " + formatDateFr(wr2.end)) + '</div>' +

  /* ================= « Mes habitudes » ================= */

  function ensureHabitudesRefs(){
    if(!ui.habitudesSemaineRef) ui.habitudesSemaineRef = todayStr();
    if(!ui.habitudesMoisRef) ui.habitudesMoisRef = todayStr();
  }
  function shiftHabitudesRef(periode, delta){
    if(periode === "semaine"){
      var d = dateFromStr(ui.habitudesSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;
      if(nouveau > refAujourdhui) nouveau = refAujourdhui;
      var refPlusAncienne = earliestActivityWeekStart();
      if(nouveau < refPlusAncienne) nouveau = refPlusAncienne;
      ui.habitudesSemaineRef = nouveau;
    } else if(periode === "mois"){
      var d2 = dateFromStr(ui.habitudesMoisRef);
      d2.setDate(1);
      d2.setMonth(d2.getMonth() + delta);
      var nouveau2 = dateKey(d2);
      var refAujourdhuiM = getMonthRange(new Date()).start;
      if(nouveau2 > refAujourdhuiM) nouveau2 = refAujourdhuiM;
      var refPlusAncienM = earliestActivityMonthStart();
      if(nouveau2 < refPlusAncienM) nouveau2 = refPlusAncienM;
      ui.habitudesMoisRef = nouveau2;
    }
  }

  function groupSum(arr, labelFn, valFn){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var lbl = labelFn(x);
      if(lbl === null || lbl === undefined || lbl === "") return;
      if(!(lbl in map)){ map[lbl] = 0; ordre.push(lbl); }
      map[lbl] += Number(valFn(x)) || 0;
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  function groupSumMulti(arr, valuesFn, valFn, labelVide){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var vals = valuesFn(x);
      if(!vals || !vals.length) vals = [labelVide];
      vals.forEach(function(v){
        if(!(v in map)){ map[v] = 0; ordre.push(v); }
        map[v] += Number(valFn(x)) || 0;
      });
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  // Sprint 8D : `total` facultatif — ligne de total en bas de la liste.
  function renderBreakdownRows(titre, rows, total){
    if(!rows.length) return "";
    var body = rows.map(function(r){
      return '<div class="eb-row"><div class="eb-nom">' + esc(r.label) + '</div><div class="eb-val">' + formatFCFA(r.montant) + '</div></div>';
    }).join("");
    if(total !== undefined) body += '<div class="eb-row eb-total" data-test="total-rubriques"><div class="eb-nom">Total</div><div class="eb-val">' + formatFCFA(total) + '</div></div>';
    return '<div class="etat-breakdown"><div class="eb-title">' + esc(titre) + '</div>' + body + '</div>';
  }
  // Sprint 8B : ventilation par activité (mode Salon). Les répartitions par
  // quartier / type de coiffure / type de cliente ne concernent que la
  // coiffure (l'onglerie n'a pas ce détail) — sans onglerie, résultat
  // strictement identique au Sprint 7bis.
  // Sprint 8C : les statistiques d'activité comptent le PRIX TOTAL d'une
  // prestation à crédit, à la date de la prestation (montantActivitePrestation)
  // — sans crédit, mêmes chiffres qu'au 8B.
  function renderBreakdownActivites(range){
    var items = filterRange(state.prestationsCoiffure, range);
    if(!items.length) return "";
    function total(act){ return sumBy(items.filter(function(p){ return activiteDe(p) === act; }), montantActivitePrestation); }
    return renderBreakdownRows("Par activité", [
      { label: "💇 Coiffure", montant: total("coiffure") },
      { label: "💅 Onglerie", montant: total("onglerie") }
    ]);
  }
  function renderBreakdownsCoiffure(range){
    var items = filterRange(state.prestationsCoiffure, range).filter(function(p){ return activiteDe(p) === "coiffure"; });
    if(!items.length) return "";
    var domicile = items.filter(function(p){ return p.lieu === "domicile"; });
    return (
      renderBreakdownRows("Par quartier (prestations à domicile)", groupSum(domicile, function(p){ return p.quartierNom; }, montantActivitePrestation)) +
      renderBreakdownRows("Par type de coiffure", groupSumMulti(items, function(p){ return p.typesCoiffureNoms; }, montantActivitePrestation, "Non précisé")) +
      renderBreakdownRows("Par type de cliente", groupSum(items, function(p){ return p.typeClienteNom; }, montantActivitePrestation))
    );
  }
  function renderBreakdownAutresCharges(range){
    var items = filterRange(state.autresCharges, range);
    if(!items.length) return "";
    return renderBreakdownRows("Charges communes — par rubrique", groupSum(items, function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; }));
  }

  function renderHabitudes(){
    ensureHabitudesRefs();
    var periode = ui.habitudesPeriode;
    var ref = periode === "semaine" ? dateFromStr(ui.habitudesSemaineRef) : periode === "mois" ? dateFromStr(ui.habitudesMoisRef) : new Date();
    var range = rangeForPeriode(periode, ref);

    var tabs = ["jour","semaine","mois"].map(function(p){
      var lbl = { jour:"Jour", semaine:"Semaine", mois:"Mois" }[p];
      return '<button type="button" class="etat-tab' + (periode===p?" active":"") + '" data-action="habitudes-set-periode" data-val="' + p + '">' + lbl + '</button>';
    }).join("");

    var navHtml = "";
    if(periode === "semaine" || periode === "mois"){
      var label = periode === "semaine" ? (formatDateFr(range.start) + " – " + formatDateFr(range.end)) : (moisLabelFor(ref).charAt(0).toUpperCase() + moisLabelFor(ref).slice(1));
      var refAujourdhui = periode === "semaine" ? getWeekRange(new Date()).start : getMonthRange(new Date()).start;
      var estPeriodeActuelle = (periode === "semaine" ? ui.habitudesSemaineRef : ui.habitudesMoisRef) >= refAujourdhui;
      var refPlusAncienneH = periode === "semaine" ? earliestActivityWeekStart() : earliestActivityMonthStart();
      var estPeriodePlusAncienne = range.start <= refPlusAncienneH;
      navHtml = (
        '<div class="etat-nav">' +
          '<button type="button" class="en-btn" data-action="habitudes-nav" data-sens="-1" data-periode="' + periode + '"' + (estPeriodePlusAncienne?" disabled":"") + '>‹</button>' +
          '<div class="en-label">' + esc(label) + '</div>' +
          '<button type="button" class="en-btn" data-action="habitudes-nav" data-sens="1" data-periode="' + periode + '"' + (estPeriodeActuelle?" disabled":"") + '>›</button>' +
        '</div>'
      );
    } else {
      navHtml = '<div class="etat-nav"><div class="en-label">' + esc(formatDateFr(todayStr())) + '</div></div>';
    }

    var breakdowns = renderBreakdownsCoiffure(range) + renderBreakdownAutresCharges(range);
    if(estModeSalon()){
      // En mode Salon, la vue Mois range les charges par mois concerné.
      var chargesHtml = periode === "mois"
        ? renderBreakdownRows("Charges du mois — par rubrique", groupSum(chargesDuMois(moisCleDe(range.start)), function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; }))
        : renderBreakdownAutresCharges(range);
      breakdowns = renderBreakdownActivites(range) + renderBreakdownsCoiffure(range) + chargesHtml;
    }
    if(!breakdowns){
      breakdowns = emptyState("📈","Pas encore d’habitudes à montrer","Vos statistiques par quartier, type de coiffure, type de cliente ou rubrique de charge apparaîtront ici au fil de vos saisies.");
    }

    return (
      '<div class="section-title">Mes habitudes</div>' +
      '<div class="etat-tabs">' + tabs + '</div>' +
      navHtml +
      breakdowns
    );
  }

  // Note « déjà réparti / disponible » pour le garde-fou des pourcentages.
  function renderNotePctDisponible(cible, id, nouveau){
    var autres = totalPourcentages(moisCourantCle(), { cible: cible, id: id, nouveau: !!nouveau, mode: "fixe", valeur: 0 }).total;
    return '<div class="field-note">Déjà réparti en pourcentage du résultat net : ' + formatPct(autres) +
      ' — encore disponible : ' + formatPct(Math.max(0, 100 - autres)) + '.</div>';
  }

  function enregistrerObjectifSalon(d){
    var cle = moisCourantCle();
    var nom = (d.nom||"").trim() || "Épargne";
    var modele = findObjectifModele(d.modeleId);
    var emoji = modele ? modele.emoji : "💰";
    var mode, valeur;
    if(d.mode === "manuel"){
      valeur = Math.round(toNum(d.montant));
      if(!(valeur > 0)){ d.erreurs.montant = "Indiquez un montant supérieur à 0."; render(); return; }
      mode = "fixe";
    } else {
      mode = "pourcentage";
      valeur = toNum(d.pourcentage) || 10;
      var err = erreurGardeFou(cle, { cible: "epargne", mode: mode, valeur: valeur });
      if(err){ d.erreurs.pourcentage = err; render(); return; }
    }
    state.objectifEpargne = { id: uid("obj"), nom: nom, emoji: emoji, dateCreation: todayStr() };
    state.config.epargneMensuelle = majParamVersionne(state.config.epargneMensuelle, mode, valeur, cle);
    saveState();
    ui.objDraft = null;
    render();
  }

    var o = state.objectifEpargne;

    var elM = byId("f-modifMontant"); if(elM) d.montant = elM.value;

      valeur = toNum(d.pourcentage);

      var err = erreurGardeFou(cle, { cible: "epargne", mode: mode, valeur: valeur });
      if(err){ ui.errors = { pourcentage: err }; render(); return; }

  function ensureTelechargerRefs(){
    if(!ui.telechargerSemaineRef) ui.telechargerSemaineRef = todayStr();
    if(!ui.telechargerMoisRef) ui.telechargerMoisRef = todayStr();
  }
  function shiftTelechargerRef(periode, delta){
    if(periode === "semaine"){
      var d = dateFromStr(ui.telechargerSemaineRef);

      var nouveau = dateKey(d);

  // Sprint 7 (correctif) : construit le canvas réellement exporté/partagé —
  // net en haut (titre + solde net), réellement flouté en bas (pixels
  // recalculés, pas un filtre CSS visuel) avec la mention « Abonnez-vous
  // pour plus de fonctionnalités » incrustée, pour reproduire fidèlement ce
  // que voit la personne dans l'aperçu à l'écran. Utilisé par
  // canvasVersBlob(), donc par Télécharger et Partager.
  function roundRectPath(ctx, x, y, w, h, r){
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function dessinerOverlayAbonnementExport(ctx, W, H){
    var texte = "Abonnez-vous pour plus de fonctionnalités";
    ctx.font = "800 30px -apple-system,Helvetica,Arial,sans-serif";
    var maxWidth = W*0.8 - 68;
    var mots = texte.split(" "), lignes = [], ligne = "";
    mots.forEach(function(mot){
      var essai = ligne ? ligne + " " + mot : mot;
      if(ctx.measureText(essai).width > maxWidth && ligne){ lignes.push(ligne); ligne = mot; }
      else { ligne = essai; }
    });
    if(ligne) lignes.push(ligne);

    var lineHeight = 40, padX = 34, padY = 24;
    var textWidth = 0;
    lignes.forEach(function(l){ textWidth = Math.max(textWidth, ctx.measureText(l).width); });
    var boxW = Math.min(W*0.8, textWidth + padX*2);
    var boxH = lignes.length*lineHeight + padY*2;
    var cx = W/2, cy = H*0.74;
    var x0 = cx - boxW/2, y0 = cy - boxH/2;

    ctx.save();
    ctx.fillStyle = "rgba(17,20,26,.85)";
    ctx.strokeStyle = "rgba(245,166,35,.6)";
    ctx.lineWidth = 2;
    roundRectPath(ctx, x0, y0, boxW, boxH, 22);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#f5a623";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    lignes.forEach(function(l, i){
      ctx.fillText(l, cx, y0 + padY + lineHeight*i + lineHeight/2);
    });
    ctx.restore();
  }
  function construireCanvasExport(){
    var source = byId("telecharger-canvas");
    if(!source || !source.getContext) return null;
    var W = source.width, H = source.height;

    var out = document.createElement("canvas");
    out.width = W; out.height = H;
    var octx = out.getContext("2d");
    octx.drawImage(source, 0, 0); // base nette

    // Copie réellement floutée (pixels recalculés par le moteur canvas,
    // pas un filtre CSS d'affichage) — repli par sous-échantillonnage sur
    // les moteurs sans support de ctx.filter.
    var blurred = document.createElement("canvas");
    blurred.width = W; blurred.height = H;
    var bctx = blurred.getContext("2d");
    if("filter" in bctx){
      bctx.filter = "blur(16px)";
      bctx.drawImage(source, 0, 0);
      bctx.filter = "none";
    } else {
      var small = document.createElement("canvas");
      var sw = Math.max(1, Math.round(W/12)), sh = Math.max(1, Math.round(H/12));
      small.width = sw; small.height = sh;
      small.getContext("2d").drawImage(source, 0, 0, sw, sh);
      bctx.imageSmoothingEnabled = true;
      bctx.drawImage(small, 0, 0, sw, sh, 0, 0, W, H);
    }

    // Masque en dégradé identique au calque CSS de l'aperçu (net jusqu'à
    // 28%, flouté à partir de 36%) — punché dans le canal alpha du flou.
    var grad = bctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.28, "rgba(0,0,0,0)");
    grad.addColorStop(0.36, "rgba(0,0,0,1)");
    grad.addColorStop(1, "rgba(0,0,0,1)");
    bctx.globalCompositeOperation = "destination-in";
    bctx.fillStyle = grad;
    bctx.fillRect(0, 0, W, H);
    bctx.globalCompositeOperation = "source-over";

    octx.drawImage(blurred, 0, 0);
    dessinerOverlayAbonnementExport(octx, W, H);

    return out;
  }

  function canvasVersBlob(callback){
    var canvas = construireCanvasExport();
    if(!canvas){ callback(null); return; }
    if(canvas.toBlob){ canvas.toBlob(callback, "image/png"); return; }
    try{
      var dataUrl = canvas.toDataURL("image/png");
      var bstr = atob(dataUrl.split(",")[1]), n = bstr.length, u8 = new Uint8Array(n);
      while(n--) u8[n] = bstr.charCodeAt(n);
      callback(new Blob([u8], { type:"image/png" }));
    }catch(e){ callback(null); }
  }

      document.body.appendChild(a); a.click(); document.body.removeChild(a);

    });

  function partagerImage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var fichier;
      try{ fichier = new File([blob], nomFichierTelecharger(), { type:"image/png" }); }catch(e){ fichier = null; }
      if(fichier && navigator.share && navigator.canShare && navigator.canShare({ files:[fichier] })){
        navigator.share({ files:[fichier], title:"MonDjai/Coiffure" }).catch(function(){});
      } else {
        telechargerImage();
      }
    });
  }

  function enregistrerRemu(){
    captureDraft(REMU_FIELDS);
    var m = ui.modal, d = ui.draft;
    var cle = moisCourantCle();
    var errors = {};
    var mode = d.mode === "fixe" ? "fixe" : "pourcentage";
    var brut = String(d["f-remuValeur"]||"").trim();
    var valeur = toNum(brut);
    var nom = String(d["f-remuNom"]||"").trim();
    if(m.cible === "salarie"){
      if(!nom) errors.remuNom = "Indiquez le nom du salarié.";
      if(!(valeur > 0)) errors.remuValeur = mode === "pourcentage" ? "Indiquez un pourcentage supérieur à 0." : "Indiquez un montant supérieur à 0.";
    } else if(brut === "" || valeur < 0){
      errors.remuValeur = "Indiquez un montant ou un pourcentage (0 si vous vous payez sur le reste).";
    }
    if(!errors.remuValeur && mode === "pourcentage" && valeur > 100) errors.remuValeur = "Un pourcentage ne peut pas dépasser 100 %.";
    if(!errors.remuValeur && mode === "pourcentage"){
      var err = erreurGardeFou(cle, { cible: m.cible, id: m.id, nouveau: !!m.nouveau, mode: mode, valeur: valeur });
      if(err) errors.remuValeur = err;
    }
    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }
    if(mode === "fixe") valeur = Math.round(valeur);
    if(m.cible === "proprio"){
      if(state.config.remunerationProprio || valeur > 0){
        state.config.remunerationProprio = majParamVersionne(state.config.remunerationProprio, mode, valeur, cle);
      }
    } else if(m.nouveau){
      state.config.salaries.push({ id: uid("sal"), nom: nom, debut: cle, fin: null, mode: mode, valeur: valeur, depuis: cle, historique: [] });
    } else {
      var sal = findSalarie(m.id);
      if(sal){ sal.nom = nom; majParamVersionne(sal, mode, valeur, cle); }
    }
    saveState();
    closeModal();
  }

  function enregistrerCredit(){

    if(type !== "banque" && type !== "personne"){
      ui.errors = { creditType: "Précisez le type de prêteur." };
      render();
      return;
    }
    var preteur = String(d["f-creditPreteur"]||"").trim();
    var total = toNum(d["f-creditTotal"]);
    var montantTotal = total > 0 ? Math.round(total) : null;
    if(m.nouveau){
      var nom = String(d["f-creditNom"]||"").trim() ||
        (type === "banque" ? "Crédit " + (preteur || "banque") : "Apport " + (preteur || "d’une personne"));
      var rub = { id: uid("rub"), nom: nom, emoji: type === "banque" ? "🏦" : "🤝", actif: true, perso: true, portee: "salon", type: "credit" };
      state.config.rubriquesCharges.push(rub);
      state.config.credits.push({ id: uid("cred"), rubriqueId: rub.id, type: type, preteur: preteur, montantTotal: montantTotal, dateDebut: todayStr(), tsDebut: Date.now() });
    } else {
      var credit = findCredit(m.rubriqueId);
      if(credit){
        credit.type = type; credit.preteur = preteur; credit.montantTotal = montantTotal;
      } else {
        state.config.credits.push({ id: uid("cred"), rubriqueId: m.rubriqueId, type: type, preteur: preteur, montantTotal: montantTotal, dateDebut: todayStr(), tsDebut: Date.now() });

    closeModal();

  function enregistrerFonds(){
    var el = byId("f-fondsValeur");
    if(el) ui.fondsDraft.valeur = el.value;
    var d = ui.fondsDraft;
    var mode = d.mode === "pourcentage" ? "pourcentage" : "fixe";
    var brut = String(d.valeur === undefined || d.valeur === null ? "" : d.valeur).trim();
    var valeur = toNum(brut);
    ui.fondsMsg = "";
    if(brut === "" || valeur < 0 || (mode === "pourcentage" && valeur > 100)){
      ui.fondsErreur = mode === "pourcentage" ? "Indiquez un pourcentage entre 0 et 100 (0 arrête le fonds)." : "Indiquez un montant (0 arrête le fonds).";
      render();
      return;
    }
    if(mode === "fixe") valeur = Math.round(valeur);
    var cle = moisCourantCle();
    var f = state.config.fondsRenouvellement;
    if(!f){
      if(valeur === 0){ ui.fondsErreur = ""; ui.fondsMsg = "Aucun fonds produits enregistré (montant à 0)."; render(); return; }
      state.config.fondsRenouvellement = { mode: mode, valeur: valeur, depuis: cle, historique: [] };
    } else if(f.depuis === cle){
      f.mode = mode; f.valeur = valeur;
    } else if(f.depuis < cle){
      // Le réglage précédent reste valable pour les mois passés (résultats
      // nets définitifs inchangés) ; le nouveau s'applique dès ce mois-ci.
      f.historique = (f.historique || []).concat([{ depuis: f.depuis, mode: f.mode, valeur: f.valeur }]);
      f.depuis = cle; f.mode = mode; f.valeur = valeur;
    } else {
      // Horloge du téléphone revenue en arrière : on remplace simplement.
      f.historique = (f.historique || []).filter(function(h){ return h.depuis < cle; });
      f.depuis = cle; f.mode = mode; f.valeur = valeur;
    }
    saveState();
    ui.fondsErreur = "";
    ui.fondsDraft = { mode: mode, valeur: valeur > 0 ? String(valeur) : "" };
    ui.fondsMsg = valeur > 0 ? ("Fonds produits enregistré à partir de " + libelleMoisCle(cle) + ".") : ("Fonds produits arrêté à partir de " + libelleMoisCle(cle) + ".");
    render();
  }

  function afficherCacheActifApropos(){
    var el = byId("apropos-cache");
    if(!el) return;
    if(!("caches" in window)){ el.textContent = "Hors ligne : non disponible sur ce navigateur."; return; }
    caches.keys().then(function(keys){
      var miens = keys.filter(function(k){ return k.indexOf(PREFIXE_CACHE_APP) === 0; }).sort();

      if(!cible) return;
      cible.textContent = miens.length ? ("Hors ligne : prêt (" + miens.join(", ") + ")") : "Hors ligne : en préparation (ouvrez l’application une fois connectée).";
    }).catch(function(){
      var cible = byId("apropos-cache");
      if(cible) cible.textContent = "Hors ligne : état inconnu.";
    });

  function marquerReprise(cle, rubriqueId, statut){
    if(!state.reprisesCharges || typeof state.reprisesCharges !== "object") state.reprisesCharges = {};
    if(!state.reprisesCharges[cle]) state.reprisesCharges[cle] = {};
    state.reprisesCharges[cle][rubriqueId] = statut;
  }
  // Lit toutes les saisies visibles de la fenêtre de reprise (le clic sur
  // « Confirmer » peut arriver avant l'événement change du champ).
  function lireSaisiesReprise(){
    var out = {};
    var champs = document.querySelectorAll('[data-action-change="capture-reprise"]');
    for(var i=0;i<champs.length;i++){
      var id = champs[i].getAttribute("data-id");
      out[id] = champs[i].value;
      ui.repriseDraft[id] = champs[i].value;
    }
    return out;
  }
  // Confirme une proposition de reprise : crée la charge du mois en cours
  // avec le montant affiché (modifiable), rattachée à ce mois.
  function confirmerReprise(rubriqueId, cle, saisies){
    var p = reprisesEnAttente(cle).filter(function(x){ return x.rubrique.id === rubriqueId; })[0];
    if(!p) return true;
    var brut = (saisies && saisies[rubriqueId] !== undefined) ? saisies[rubriqueId]
      : (ui.repriseDraft[rubriqueId] !== undefined ? ui.repriseDraft[rubriqueId] : String(p.montant));
    var montant = toNum(brut);
    if(!ui.errors) ui.errors = {};
    if(String(brut).trim() === "" || !(montant > 0)){
      ui.errors["reprise-" + rubriqueId] = "Indiquez un montant supérieur à 0, ou ignorez cette charge.";
      return false;
    }
    state.autresCharges.push({
      id: uid("acharge"), date: todayStr(), moisConcerne: cle,
      rubriqueId: p.rubrique.id, rubriqueNom: p.rubrique.nom, rubriqueEmoji: p.rubrique.emoji, rubriqueType: typeDeRubrique(p.rubrique),
      montant: montant, reprise: true, ts: Date.now()
    });
    marquerReprise(cle, rubriqueId, "confirme");
    delete ui.repriseDraft[rubriqueId];
    delete ui.errors["reprise-" + rubriqueId];
    return true;
  }

  function openModal(type, extra){
    ui.modal = merge({ type:type }, extra || {});
    ui.draft = {};
    ui.errors = {};
    render();
  }
  function closeModal(){
    // Sprint 8C (repris de Revente-E) : les niveaux « retour » forment une
    // pile (ex. Crédit clientes → Encaisser ; liste du jour → détail →
    // modification ; Détails du mois → Charges du mois).
    if(ui.modalReturnTo){
      var back = ui.modalReturnTo;
      ui.modalReturnTo = back.returnTo || null;
      openModal(back.type, back.extra);
      return;
    }
    ui.modal = null;
    ui.draft = {};
    ui.errors = {};
    render();
  }
  // La feuille ouverte devient le niveau « retour » de la suivante (pile) :
  // fermer la suivante, ou le bouton retour du téléphone, ramène à elle, à jour.
  var CLES_CONFIRMATION = { type:1, confirmDelete:1, confirmErase:1, confirmRetrait:1, confirmAbandon:1 };
  function empilerModale(){
    if(!ui.modal) return;
    var extra = {};
    Object.keys(ui.modal).forEach(function(k){ if(!CLES_CONFIRMATION[k]) extra[k] = ui.modal[k]; });
    ui.modalReturnTo = { type: ui.modal.type, extra: extra, returnTo: ui.modalReturnTo || null };
  }
  // Ouvre une feuille par-dessus celle qui est ouverte (si elle l'est), sinon
  // comme première feuille.
  function ouvrirModaleEmpilee(type, extra){
    if(ui.modal) empilerModale();
    else ui.modalReturnTo = null;
    openModal(type, extra);
  }

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "fermer-modal-overlay"){
      if(e.target.closest("[data-stop-close]")) return;
      closeModal();
      return;
    }
    if(action === "fermer-modal"){ closeModal(); return; }

    switch(action){
      case "ouvrir-reglages": ui.overlay = "reglages"; ui.reglagesMsg = ""; reinitialiserMessagesSalon(); render(); return;

      // ----- Sprint 8A : mode Salon -----
      case "set-mode-travail": {
        var modeVoulu = el.getAttribute("data-val") === "salon" ? "salon" : "domicile";
        if(state.config.modeTravail !== modeVoulu){
          state.config.modeTravail = modeVoulu;
          if(modeVoulu === "salon") assurerRubriquesSalon(state.config);
          saveState();
          ui.etatPeriode = modeVoulu === "salon" ? "mois" : "jour";
          ui.etatSelJour = null; ui.etatSelSemaine = null; ui.etatVue = "salon";
          ui.fondsDraft = null; ui.fondsMsg = ""; ui.fondsErreur = "";
          ui.modeMsg = modeVoulu === "salon" ? "Mode Salon activé. Vos données restent intactes." : "Mode À domicile activé. Vos données restent intactes.";
        }
        render();
        return;
      }
      case "fonds-mode": {
        var champF = byId("f-fondsValeur");
        if(champF && ui.fondsDraft) ui.fondsDraft.valeur = champF.value;
        var nouveauMode = el.getAttribute("data-val") === "pourcentage" ? "pourcentage" : "fixe";
        if(ui.fondsDraft && ui.fondsDraft.mode !== nouveauMode){ ui.fondsDraft.mode = nouveauMode; ui.fondsDraft.valeur = ""; }
        ui.fondsErreur = ""; ui.fondsMsg = "";
        render();
        return;
      }
      case "enregistrer-fonds": enregistrerFonds(); return;
      // ----- Sprint 8D : thème (changement immédiat, sans rechargement) -----
      case "basculer-install-autres": ui.installAutres = !ui.installAutres; render(); return;
      case "installer-app": {
        var invite = installation.invite;
        installation.invite = null;
        if(invite && typeof invite.prompt === "function"){
          try{
            var promesse = invite.prompt();
            if(promesse && typeof promesse.catch === "function") promesse.catch(function(){});
            if(invite.userChoice && typeof invite.userChoice.then === "function"){
              invite.userChoice.then(function(choix){
                if(choix && choix.outcome === "accepted") installation.installeeIci = true;
                render();
              }, function(){});
            }
          }catch(e){}
        }
        render();
        return;
      }
      case "set-theme": {
        var themeVoulu = el.getAttribute("data-val");
        if(CHOIX_THEMES.indexOf(themeVoulu) === -1) themeVoulu = "clair";
        if(state.config.theme !== themeVoulu){
          state.config.theme = themeVoulu;
          saveState();
        }
        appliquerTheme();
        render();

      // ----- Sprint 8B : rémunérations -----

      case "ajouter-salarie": openModal("remu-config", { cible: "salarie", nouveau: true }); return;

      case "annuler-retrait-salarie": ui.modal.confirmRetrait = false; render(); return;

  /* ================= Sprint 8C : bouton retour du téléphone (repris de Revente) ================= */
  // Chaque niveau de navigation au-dessus de l'écran d'accueil (Aujourd'hui,
  // rien d'ouvert) correspond à une entrée d'historique (history.pushState).
  // Le bouton retour d'Android déclenche « popstate » : on remonte alors d'UN
  // niveau — fermer la feuille du dessus (Crédit clientes, Encaisser,
  // Détails du mois…), remonter le drill-down de Mon état, quitter l'écran
  // secondaire, revenir de l'onglet courant à Aujourd'hui. Depuis Aujourd'hui
  // sans rien d'ouvert, rien n'est empilé : le bouton retour quitte alors
  // l'application, comme attendu. Rien n'est empilé sur le Code d'accès ni sur
  // le verrouillage PIN. La profondeur est recalculée à chaque rendu
  // (profondeurUi) et l'historique est aligné dessus.

  var navHist = { actif:false, profondeur:0, popsIgnores:0 };

  function estEcranPorte(){
    return !state.config.codeAccesOk || accesMensuelExpire() || ui.locked;
  }
  function profondeurDrill(){
    if(ui.tab === "etat"){
      if(ui.etatPeriode === "semaine") return ui.etatSelJour ? 1 : 0;
      if(ui.etatPeriode === "mois") return (ui.etatSelSemaine ? 1 : 0) + (ui.etatSelJour ? 1 : 0);
    }
    return 0;
  }
  function objectifEnCreationEtape2(){
    return ui.overlay === "objectif" && !state.objectifEpargne && !!ui.objDraft && ui.objDraft.step === "form";
  }
  function profondeurUi(){
    if(estEcranPorte()) return 0;
    var p = 0;
    if(ui.tab !== "aujourdhui") p += 1;
    p += profondeurDrill();
    if(ui.overlay){
      p += 1;
      if(ui.overlay === "apropos") p += 1;          // À propos s'ouvre depuis Réglages
      if(objectifEnCreationEtape2()) p += 1;        // 2e étape de création d'objectif
    }
    if(ui.modal){
      p += 1;
      // Une feuille ouverte depuis une autre compte un niveau de plus par
      // niveau empilé (ex. Crédit clientes → Encaisser = 2).
      for(var r = ui.modalReturnTo; r; r = r.returnTo) p += 1;
      if(ui.modal.confirmDelete || ui.modal.confirmErase || ui.modal.confirmRetrait || ui.modal.confirmAbandon) p += 1;
    }
    return p;
  }

  // Remonte d'UN niveau (appelé par le bouton retour du téléphone).
  function retourUnNiveau(){
    if(ui.modal){
      if(ui.modal.confirmDelete){ ui.modal.confirmDelete = false; render(); return; }
      if(ui.modal.confirmErase){ ui.modal.confirmErase = false; render(); return; }
      if(ui.modal.confirmRetrait){ ui.modal.confirmRetrait = false; render(); return; }
      if(ui.modal.confirmAbandon){ ui.modal.confirmAbandon = false; render(); return; }
      closeModal();
      return;
    }
    if(ui.overlay){
      if(ui.overlay === "apropos"){ ui.overlay = "reglages"; render(); return; }
      if(objectifEnCreationEtape2()){ ui.objDraft.step = "modele"; render(); return; }
      ui.overlay = null; ui.objDraft = null;
      render();
      return;
    }
    if(ui.tab === "etat" && (ui.etatSelJour || ui.etatSelSemaine)){
      if(ui.etatSelJour){ ui.etatSelJour = null; ui.etatSelJourFrom = null; }
      else ui.etatSelSemaine = null;
      render();
      return;
    }
    if(ui.tab !== "aujourdhui"){ ui.tab = "aujourdhui"; render(); return; }
    render();
  }

  function synchroniserHistorique(){
    if(!navHist.actif || navHist.popsIgnores > 0) return;
    var cible = profondeurUi();
    if(cible > navHist.profondeur){
      while(navHist.profondeur < cible){
        navHist.profondeur++;
        try{ history.pushState({ mdjCoiffure:1, profondeur:navHist.profondeur }, ""); }
        catch(e){ navHist.actif = false; return; }
      }
    } else if(cible < navHist.profondeur){
      var n = navHist.profondeur - cible;
      navHist.profondeur = cible;
      navHist.popsIgnores++;
      try{ history.go(-n); }catch(e){ navHist.popsIgnores--; }
    }
  }

  function initialiserHistorique(){
    try{
      if(!window.history || typeof history.pushState !== "function") return;
      var st = history.state;
      if(st && st.mdjCoiffure && typeof st.profondeur === "number"){
        // Rechargement de la page : des entrées existent déjà, l'interface
        // repart de l'accueil → elles seront retirées au premier rendu.
        navHist.profondeur = st.profondeur;
      } else {
        history.replaceState({ mdjCoiffure:1, profondeur:0 }, "");
        navHist.profondeur = 0;
      }
      navHist.actif = true;
    }catch(e){ navHist.actif = false; return; }

    window.addEventListener("popstate", function(e){
      if(!navHist.actif) return;
      var st = e.state;
      var prof = (st && st.mdjCoiffure && typeof st.profondeur === "number") ? st.profondeur : 0;
      if(navHist.popsIgnores > 0){
        // Retour déclenché par l'application elle-même (synchronisation).
        navHist.popsIgnores--;
        navHist.profondeur = prof;
        synchroniserHistorique();
        return;
      }
      navHist.profondeur = prof;
      if(estEcranPorte()){ synchroniserHistorique(); return; }
      retourUnNiveau();
    });
  }

  /* ================= Sprint 8C : mise à jour automatique (repris de Revente) ================= */
  // Quand Hamadou remplace index.html ET sw.js sur GitHub (en changeant le
  // numéro VERSION_CACHE de sw.js), le téléphone le détecte tout seul :
  //  - vérification à chaque ouverture et à chaque retour au premier plan
  //    (registration.update(), silencieux, ignoré hors ligne) ;
  //  - le nouveau service worker s'installe, prend le contrôle
  //    (« controllerchange ») et la page se recharge UNE seule fois, seulement
  //    si c'est sans risque : Aujourd'hui sans rien d'ouvert, aucun formulaire,
  //    aucune saisie de code d'accès / PIN en cours ;
  //  - sinon, une petite bannière non bloquante propose « Mettre à jour », et
  //    le rechargement se fait quand la personne revient sur Aujourd'hui.
  // Les données (localStorage, clé mondjai_coiffure_state_v1) ne sont jamais
  // touchées : l'application enregistre à chaque action, et on vérifie avant
  // tout rechargement qu'aucune écriture n'est en attente.

  var MAJ_CLE_SESSION = "mondjai_coiffure_maj_auto";
  var maj = { prete:false, rechargementLance:false };
  var swRegistration = null;
  var swControleurAuDemarrage = false;
  // Garde-fou anti-boucle : une page elle-même issue d'un rechargement
  // automatique ne se recharge plus automatiquement pendant 10 secondes
  // (la bannière prend le relais).
  var pageIssueDunRechargementAuto = false;
  try{ pageIssueDunRechargementAuto = sessionStorage.getItem(MAJ_CLE_SESSION) === "1"; }catch(e){}
  if(pageIssueDunRechargementAuto){
    setTimeout(function(){
      try{ sessionStorage.removeItem(MAJ_CLE_SESSION); }catch(e){}
      pageIssueDunRechargementAuto = false;
    }, 10000);
  }

  function assurerEtatEnregistre(){
    // saveState() est synchrone et appelé à chaque action : en pratique rien
    // n'est jamais en attente. Par sécurité, si l'état en mémoire diffère de
    // celui enregistré (ex. migration non encore écrite), on l'écrit.
    try{
      var stocke = localStorage.getItem(STORAGE_KEY);
      if(stocke !== null && stocke !== JSON.stringify(state)) saveState();
    }catch(e){}
  }
  function rechargementSansRisque(){
    var actif = document.activeElement;
    if(actif && /^(INPUT|TEXTAREA|SELECT)$/.test(actif.tagName) && actif.value) return false;
    if(!state.config.codeAccesOk || accesMensuelExpire()){
      var champ = byId("f-codeAcces");
      return !((champ && champ.value) || "").trim() && !(ui.codeAccesInput || "").trim();
    }
    if(ui.locked) return !ui.modal && !(ui.pinLockInput || "");
    return !ui.modal && !ui.overlay && ui.tab === "aujourdhui";
  }
  function rechargerPourMaj(automatique){
    if(maj.rechargementLance) return;
    maj.rechargementLance = true;
    assurerEtatEnregistre();
    try{ if(automatique) sessionStorage.setItem(MAJ_CLE_SESSION, "1"); }catch(e){}
    location.reload();
  }
  function afficherBanniereMaj(){
    if(byId("maj-banner")) return;
    var b = document.createElement("div");
    b.id = "maj-banner";
    b.setAttribute("role", "status");
    b.innerHTML = '<div class="mb-text">Une nouvelle version est prête</div>' +
      '<button type="button" class="mb-btn" data-action="maj-recharger">Mettre à jour</button>';
    document.body.appendChild(b);
    try{ document.body.classList.add("maj-visible"); }catch(e){}
  }
  // Appelée après chaque rendu et à la prise de contrôle d'une nouvelle version.
  function verifierMajEnAttente(){
    if(!maj.prete || maj.rechargementLance) return;
    if(!pageIssueDunRechargementAuto && rechargementSansRisque()){
      rechargerPourMaj(true);
      return;
    }
    afficherBanniereMaj();
  }
  function verifierMiseAJourSw(){
    if(!swRegistration) return;
    if(navigator.onLine === false) return;   // hors ligne : rien à vérifier, aucune erreur
    try{
      var p = swRegistration.update();
      if(p && typeof p.catch === "function") p.catch(function(){});
    }catch(e){}
  }
  function enregistrerServiceWorker(){
    if(!("serviceWorker" in navigator)) return;
    // Premier lancement (aucun service worker ne contrôlait la page) : la prise
    // de contrôle qui suit l'installation ne doit PAS recharger la page.
    swControleurAuDemarrage = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(!swControleurAuDemarrage){ swControleurAuDemarrage = true; return; }
      maj.prete = true;
      verifierMajEnAttente();
    });
    var demarrer = function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        swRegistration = reg;
        if(swControleurAuDemarrage) verifierMiseAJourSw();
      }).catch(function(){});
    };
    if(document.readyState === "complete") demarrer();
    else window.addEventListener("load", demarrer);
    document.addEventListener("visibilitychange", function(){
      if(document.visibilityState === "visible") verifierMiseAJourSw();
    });
  }

  /* ================= Démarrage ================= */

  document.addEventListener("click", handleClick);
  document.addEventListener("change", handleChange);
  window.addEventListener("resize", function(){ mesurerBarreDuBas(); majBandeauAujourdhui(); });

  state = loadState();
  // Sprint 8D : thème (déjà posé par le script de <head>) confirmé ici, puis
  // suivi du réglage du téléphone pour le choix « Automatique ».
  appliquerTheme();
  suivreThemeTelephone();
  ui.locked = !!(state.config.pinActif && state.config.pinCode);
  // Sprint 8A : en mode Salon, le mois est la vue principale du résultat net.
  if(estModeSalon()) ui.etatPeriode = "mois";
  initialiserHistorique();
  render();
  enregistrerServiceWorker();

  window.__mondjaiCoiffure = {
    getState: function(){ return state; },
    setState: function(s){ state = s; saveState(); render(); },
    render: render,
    STORAGE_KEY: STORAGE_KEY,
    codeAccesDuMois: codeAccesDuMois,
    codeAccesDuMoisAttenduAujourdhui: codeAccesDuMoisAttenduAujourdhui,
    accesMensuelExpire: accesMensuelExpire,
    finEssaiPourInstallation: finEssaiPourInstallation,
    compareMoisAnnee: compareMoisAnnee,
    parseDateStr: parseDateStr,
    normaliserEtatImporte: normaliserEtatImporte,
    defaultState: defaultState,
    // Sprint 8A — exposés pour les tests de calcul
    resultatNetMois: resultatNetMois,
    jaugeMois: jaugeMois,
    soldeFonds: soldeFonds,
    previsionFondsMois: previsionFondsMois,
    bilanCredit: bilanCredit,
    findCredit: findCredit,
    reprisesEnAttente: reprisesEnAttente,
    moisDeCharge: moisDeCharge,
    estModeSalon: estModeSalon,
    // Sprint 8B
    repartitionMois: repartitionMois,
    totalPourcentages: totalPourcentages,
    recettesActivite: recettesActivite,
    cumulEpargneSalon: cumulEpargneSalon,
    rangeDuMoisCle: rangeDuMoisCle,
    // Sprint 8C (lecture seule, pour les tests)
    VERSION_APP: VERSION_APP,
    recettesPeriode: recettesPeriode,
    recetteCoiffure: recetteCoiffure,
    epargnePeriode: epargnePeriode,
    soldeNetPeriode: soldeNetPeriode,
    totalAEncaisser: totalAEncaisser,
    resteDuCredit: function(id){ var p = prestationParId(id); return p ? resteDuCredit(p) : null; },
    statutCredit: function(id){ var p = prestationParId(id); return p ? statutCredit(p) : null; },
    pointsAttentionMois: pointsAttentionMois,
    profondeurUi: profondeurUi,
    mecheSvg: mecheSvg,
    etatUi: function(){
      var pile = [];
      for(var r = ui.modalReturnTo; r; r = r.returnTo) pile.push(r.type);
      return { tab: ui.tab, overlay: ui.overlay, modale: ui.modal ? ui.modal.type : null, pile: pile, etatPeriode: ui.etatPeriode, etatVue: ui.etatVue };
    },
    etatMaj: function(){ return { prete: maj.prete, rechargementLance: maj.rechargementLance, banniere: !!byId("maj-banner") }; }
  };
})();
</script>
