  function handleChange(e){
    var el = e.target;
    var action = el.getAttribute && el.getAttribute("data-action-change");
    if(!action) return;
    switch(action){
      case "capture-achat": captureDraft(ACHAT_FIELDS); if(el.id==="f-produitSel"){ onProduitAchatChange(); } render(); return;
      case "capture-vente": captureDraft(VENTE_FIELDS); if(el.id==="f-produitSel"){ render(); } return;
      case "capture-coiffure": captureDraft(COIFFURE_FIELDS); return;
      case "capture-pedicure": captureDraft(PEDICURE_FIELDS); return;
      case "produit-achat-change": {
        captureDraft(ACHAT_FIELDS);
        onProduitAchatChange();
        if(ui.draft["f-produitSel"] === "__new__") ui.pendingAutofocus = true;
        render();
        return;
      }
      // Correction apportée pendant ce sprint : le sélecteur de produit de
      // Ventes déclarait déjà data-action-change="produit-vente-change" mais
      // aucun cas ne le traitait ici (seul un cas mort, jamais atteint, vivait
      // dans handleClick) — choisir « + Nouveau produit… » depuis Ventes ne
      // faisait donc rien. Corrigé sur le même principe que produit-achat-change.
      case "produit-vente-change": {
        captureDraft(VENTE_FIELDS);
        if(ui.draft["f-produitSel"] === "__new__") ui.pendingAutofocus = true;
        render();
        return;
      }
      case "cliente-change": case "quartier-change": {
        var fields = ui.modal.type.indexOf("pedicure")!==-1 ? PEDICURE_FIELDS : COIFFURE_FIELDS;
        captureDraft(fields);
        if((el.id === "f-clienteSel" && ui.draft["f-clienteSel"] === "__new__") ||
           (el.id === "f-quartierSel" && ui.draft["f-quartierSel"] === "__new__")){
          ui.pendingAutofocus = true;
        }
        render();
        return;
      }
      case "set-seuil-reassort": {
        var pid = el.getAttribute("data-id");
        var produit = findProduitById(pid);
        if(produit){
          var n = toNum(el.value);
          produit.seuilReassort = n >= 0 ? Math.round(n) : SEUIL_REASSORT_DEFAUT;
          saveState();
          render();
        }
        return;
      }
      case "capture-code-acces": ui.codeAccesInput = el.value; ui.codeAccesErreur = ""; return;
      case "capture-obj-sous-type": ui.objDraft.sousType = el.value; return;
      case "capture-obj-nom": ui.objDraft.nom = el.value; return;
      case "capture-obj-montant": ui.objDraft.montantFixeParJour = el.value; return;
      case "capture-modif-objectif": {
        if(el.id === "f-modifNom") ui.draft.nom = el.value;
        if(el.id === "f-modifMontant") ui.draft.montantFixeParJour = el.value;
        return;
      }
      case "capture-autre-charge": captureDraft(["f-montantAutreCharge"]); return;
      case "capture-nouvelle-rubrique": ui.draft["f-nouvelleRubrique"] = el.value; return;
      case "importer-json": case "importer-json-lock": {
        var file = el.files && el.files[0];
        importerJsonDepuisFichier(file, function(ok){
          ui.backupMsg = ok ? "Sauvegarde restaurée." : "Ce fichier ne peut pas être lu comme une sauvegarde MonDjai/Salon F.";
          if(ok){
            ui.locked = !!(state.config.pinActif && state.config.pinCode);
            if(!ui.locked){ ui.modal = null; ui.overlay = null; ensureValidTab(); }
          }
          render();
        });
        return;
      }
    }
  }

  var PEDICURE_FIELDS = ["f-date","f-clienteSel","f-clienteNouveauNom","f-quartierSel","f-quartierNouveauNom","f-typePrestation","f-mainOeuvre","f-coutProduits","f-transport"];

  function onProduitAchatChange(){
    captureDraft(ACHAT_FIELDS);
    var sel = ui.draft["f-produitSel"];
    if(sel && sel !== "__new__"){
      var p = findProduitById(sel);
      if(p){
        if(p.dernierPrixAchat !== null && p.dernierPrixAchat !== undefined) ui.draft["f-prixAchat"] = String(p.dernierPrixAchat);
        if(p.dernierPrixVenteEstime !== null && p.dernierPrixVenteEstime !== undefined) ui.draft["f-prixVente"] = String(p.dernierPrixVenteEstime);
      }
    }

  /* ---------- Enregistrement des formulaires ---------- */

  function enregistrerAchat(){
    captureDraft(ACHAT_FIELDS);
    var d = ui.draft;
    var errors = {};
    var date = d["f-date"] || todayStr();
    var produitSel = d["f-produitSel"];
    var produitNom = produitSel === "__new__" ? (d["f-produitNouveauNom"]||"").trim() : (findProduitById(produitSel)||{}).nom;
    var quantite = toNum(d["f-quantite"]);
    var prixAchat = toNum(d["f-prixAchat"]);
    var prixVente = toNum(d["f-prixVente"]);
    var charges = toNum(d["f-charges"]);

    if(!date) errors.date = "Choisissez une date.";
    if(!produitSel || (produitSel==="__new__" && !produitNom)) errors.produit = "Choisissez ou créez un produit.";
    if(!(quantite > 0)) errors.quantite = "Indiquez une quantité supérieure à 0.";
    if(!(prixAchat >= 0) || d["f-prixAchat"]==="") errors.prixAchat = "Indiquez le prix d’achat unitaire.";
    if(!(prixVente >= 0) || d["f-prixVente"]==="") errors.prixVente = "Indiquez le prix de vente estimé.";

    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }

    var produit = produitSel === "__new__" ? findOrCreateProduit(produitNom, prixAchat, prixVente) : findProduitById(produitSel);
    if(produit){ produit.dernierPrixAchat = prixAchat; produit.dernierPrixVenteEstime = prixVente; }

    state.achats.push({
      id: uid("achat"), date: date,
      produitId: produit ? produit.id : null,
      produitNom: produit ? produit.nom : produitNom,
      quantite: quantite, prixAchatUnitaire: prixAchat, prixVenteUnitaireEstime: prixVente,
      charges: charges, ts: Date.now()
    });
    saveState();
    closeModal();
  }

  function enregistrerVente(){
    captureDraft(VENTE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var date = d["f-date"] || todayStr();
    var produitSel = d["f-produitSel"];
    var produitNomNouveau = (d["f-produitNouveauNom"]||"").trim();
    var quantite = toNum(d["f-quantite"]);
    var montant = toNum(d["f-montant"]);
    var typeVente = d["f-typeVente"] || "stock";
    var prixRevendeur = toNum(d["f-prixRevendeur"]);

    if(!date) errors.date = "Choisissez une date.";
    if(!produitSel || (produitSel==="__new__" && !produitNomNouveau)) errors.produit = "Choisissez ou créez un produit.";
    if(!(quantite > 0)) errors.quantite = "Indiquez une quantité supérieure à 0.";
    if(!(montant >= 0) || d["f-montant"]==="") errors.montant = "Indiquez le montant encaissé.";
    if(typeVente === "commande_speciale" && (d["f-prixRevendeur"]==="" || !(prixRevendeur >= 0))) errors.prixRevendeur = "Indiquez le prix payé au revendeur.";

    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }

    var produit = produitSel === "__new__" ? findOrCreateProduit(produitNomNouveau) : findProduitById(produitSel);

    state.ventes.push({

      ts: Date.now()

    closeModal();
