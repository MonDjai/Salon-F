<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#11141a" />
<title>MonDjai/Salon F</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root{
    --bg:#11141a;
    --card:#1b2029;
    --card-2:#20262f;
    --border:#2a303c;
    --text:#eef1f6;
    --text-dim:#9aa3b2;
    --accent:#f5a623;
    --accent-dark:#c9840f;
    --green:#34b37e;
    --red:#ff6b5e;
    --blue:#5b8def;
    --turquoise:#4fd1c5;
    --pink:#e8788c;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior-y:none;}
  #app{min-height:100%; display:flex; flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(14px + var(--safe-top)) 16px 12px;
    background:linear-gradient(180deg,#161b23,#11141a);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-emoji{font-size:22px;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-title{font-size:16px; font-weight:700;}
  .brand-sub{font-size:11.5px; color:var(--text-dim);}
  .icon-btn{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    width:40px; height:40px; border-radius:12px; font-size:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{background:var(--card-2);}

  /* ---------- Main ---------- */
  .main{flex:1; padding:14px 16px calc(24px + var(--safe-bottom)); display:flex; flex-direction:column;}
  .main.with-tabbar{padding-bottom: calc(96px + var(--safe-bottom));}

  .section-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.04em; margin:4px 0 10px;}
  .hint{font-size:12.5px; color:var(--text-dim); line-height:1.5;}
  .hint.tight{margin-top:4px;}

  /* ---------- Onboarding / full pages (no tabbar) ---------- */
  .onb{flex:1; display:flex; flex-direction:column; padding:calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom)); min-height:100%;}
  .onb-head{margin-bottom:18px;}
  .onb-emoji{font-size:40px;}
  .onb-title{font-size:22px; font-weight:800; margin:10px 0 6px;}
  .onb-desc{font-size:14px; color:var(--text-dim); line-height:1.5;}
  .onb-body{flex:1; display:flex; flex-direction:column; justify-content:center;}

  .choice-grid{display:flex; flex-direction:column; gap:12px;}
  .choice-card{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1.5px solid var(--border); border-radius:16px;
    padding:16px 14px; text-align:left;
  }
  .choice-card.selected{border-color:var(--accent); background:linear-gradient(135deg,#241d10,#1c2029);}
  .choice-card .emoji{font-size:30px; width:40px; text-align:center; flex:none;}
  .choice-card .cc-text{flex:1; min-width:0;}
  .choice-card .cc-title{font-size:15.5px; font-weight:700;}
  .choice-card .cc-desc{font-size:12.5px; color:var(--text-dim); margin-top:2px; line-height:1.4;}
  .choice-card .cc-check{
    width:24px; height:24px; border-radius:8px; border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none; font-size:14px;
    color:transparent; background:var(--card-2);
  }
  .choice-card.selected .cc-check{background:var(--accent); border-color:var(--accent); color:#1b1200;}

  .error-text{color:var(--red); font-size:12.5px; margin-top:10px; line-height:1.4;}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:14px; padding:14px 16px; font-size:15px; font-weight:700;
    width:100%;
  }
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark)); color:#1b1200;}
  .btn-secondary{background:var(--card); color:var(--text); border:1px solid var(--border);}
  .btn-ghost{background:transparent; color:var(--accent); border:none; padding:10px;}
  .btn-danger{background:rgba(255,107,94,.12); color:var(--red); border:1px solid rgba(255,107,94,.4);}
  .btn:active{opacity:.85;}
  .btn-row{display:flex; gap:10px; margin-top:14px;}
  .btn-row .btn{width:auto; flex:1;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    display:flex; background:#161b23; border-top:1px solid var(--border);
    padding:8px 6px calc(8px + var(--safe-bottom));
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:transparent; border:none; color:var(--text-dim); padding:6px 2px; border-radius:12px;
  }
  .tab .tab-emoji{font-size:20px;}
  .tab .tab-label{font-size:10.5px; font-weight:600;}
  .tab.active{color:var(--accent);}
  .tab.active .tab-emoji{transform:translateY(-1px);}

  /* ---------- List cards ---------- */
  .entry-list{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .entry-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; display:flex; align-items:center; gap:12px; text-align:left;
  }
  .entry-card:active{background:var(--card-2);}
  .entry-ico{
    width:38px; height:38px; border-radius:11px; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:18px;
    background:rgba(245,166,35,.12); color:var(--accent);
  }
  .entry-main{flex:1; min-width:0;}
  .entry-title{font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-sub{font-size:12px; color:var(--text-dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .entry-amount{font-size:14px; font-weight:700; color:var(--accent); flex:none; white-space:nowrap;}
  .entry-amount.neg{color:var(--red);}
  .badge{
    display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px;
    background:rgba(91,141,239,.15); color:var(--blue); margin-left:6px;
  }

  .empty-state{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px 10px; color:var(--text-dim); gap:8px;
  }
  .empty-state .es-emoji{font-size:38px; opacity:.7;}
  .empty-state .es-title{font-size:14.5px; font-weight:700; color:var(--text);}
  .empty-state .es-desc{font-size:12.5px; max-width:260px; line-height:1.5;}

  .fab{
    position:fixed; right:18px; bottom:calc(92px + var(--safe-bottom)); z-index:7;
    width:56px; height:56px; border-radius:18px; border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#1b1200; font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(245,166,35,.35);
  }
  .fab:active{transform:scale(.96);}

  /* ---------- Forms ---------- */
  .field{margin-bottom:16px;}
  .field .label{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
  .field .label .req{color:var(--accent);}
  .input, .select, .textarea{
    width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 13px; font-size:15px; appearance:none;
  }
  .select{background-image:linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    padding-right:36px;}
  .input:focus, .select:focus, .textarea:focus{outline:2px solid var(--accent); outline-offset:0;}
  .field-error{color:var(--red); font-size:12px; margin-top:6px;}
  .field-note{color:var(--text-dim); font-size:11.5px; margin-top:6px; line-height:1.4;}
  .inline-new{margin-top:10px; display:flex; gap:8px;}
  .inline-new .input{flex:1;}
  .inline-new .btn{width:auto; padding:10px 14px; font-size:13px;}

  .radio-row{display:flex; gap:10px;}
  .radio-opt{
    flex:1; text-align:center; background:var(--card-2); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:12px; padding:12px 8px; font-size:13px; font-weight:700;
  }
  .radio-opt.active{border-color:var(--accent); color:var(--accent); background:rgba(245,166,35,.1);}

  .chip-wrap{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:var(--card-2); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:999px; padding:9px 14px; font-size:13px; font-weight:600;
  }
  .chip.active{border-color:var(--accent); color:var(--accent); background:rgba(245,166,35,.1);}
  .chip.dashed{border-style:dashed;}
  .chip-suggest{
    background:transparent; border:1px dashed var(--border); color:var(--text-dim);
    border-radius:999px; padding:7px 12px; font-size:12px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,12,.6); z-index:20;
    display:flex; align-items:flex-end;
  }
  .modal{
    width:100%; max-height:88vh; overflow-y:auto; background:var(--bg);
    border-radius:20px 20px 0 0; border-top:1px solid var(--border);
    padding:18px 18px calc(20px + var(--safe-bottom));
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .modal-title{font-size:17px; font-weight:800;}
  .modal-close{background:var(--card); border:1px solid var(--border); color:var(--text-dim);
    width:32px; height:32px; border-radius:10px; font-size:15px; display:flex; align-items:center; justify-content:center;}

  .detail-row{display:flex; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px;}
  .detail-row:last-of-type{border-bottom:none;}
  .detail-row .dk{color:var(--text-dim);}
  .detail-row .dv{font-weight:700; text-align:right;}

  .confirm-box{background:rgba(255,107,94,.08); border:1px solid rgba(255,107,94,.3); border-radius:14px; padding:14px; margin-top:14px;}
  .confirm-box p{margin:0 0 12px; font-size:13.5px; color:var(--text);}

  /* ---------- Réglages / À propos ---------- */
  .reglages-section{margin-bottom:22px;}
  .reglages-section .rs-title{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
  .profil-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:13px 14px; margin-bottom:10px;
  }
  .profil-row .pr-emoji{font-size:22px; width:30px; text-align:center; flex:none;}
  .profil-row .pr-text{flex:1;}
  .profil-row .pr-title{font-size:14.5px; font-weight:700;}
  .profil-row .pr-desc{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .switch{
    width:46px; height:28px; border-radius:999px; background:var(--card-2); border:1px solid var(--border);
    position:relative; flex:none;
  }
  .switch.on{background:var(--accent); border-color:var(--accent);}
  .switch .knob{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on .knob{left:20px; background:#1b1200;}

  .about-line{font-size:14px; color:var(--text-dim); line-height:1.6; margin-bottom:10px;}
  .mission{font-size:15.5px; font-weight:700; color:var(--text); margin:18px 0 8px;}

  /* ---------- F7 : Tableau de bord ---------- */
  .dash-solde{
    background:linear-gradient(135deg,var(--card),var(--card-2)); border:1px solid var(--border);
    border-radius:18px; padding:20px 18px; text-align:center; margin-bottom:14px;
  }
  .dash-solde .ds-label{font-size:12px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;}
  .dash-solde .ds-amount{font-size:32px; font-weight:800; margin-top:6px;}
  .dash-solde .ds-amount.neg{color:var(--red);}
  .dash-perte{
    margin-top:12px; background:rgba(255,107,94,.12); border:1px solid rgba(255,107,94,.35);
    border-radius:12px; padding:9px 12px; font-size:12.5px; color:var(--red); font-weight:600; line-height:1.4;
  }
  .dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .dash-block{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 10px; text-align:center; appearance:none; -webkit-appearance:none; font:inherit;}
  .dash-block .db-emoji{font-size:20px;}
  .dash-block .db-label{font-size:11px; color:var(--text-dim); margin-top:4px; font-weight:700;}
  .dash-block .db-amount{font-size:16.5px; font-weight:800; margin-top:4px;}
  .dash-block.charges .db-amount{color:var(--red);}

  /* ---------- F4 : Suivi de stock ---------- */
  .stock-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-bottom:10px;}
  .stock-card .sc-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .stock-card .sc-nom{font-size:14.5px; font-weight:700;}
  .stock-card .sc-alerte{font-size:10.5px; font-weight:700; color:var(--accent); background:rgba(245,166,35,.14); padding:3px 8px; border-radius:999px;}
  .stock-card .sc-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12.5px;}
  .stock-card .sc-grid .sk{color:var(--text-dim);}
  .stock-card .sc-grid .sv{font-weight:700; text-align:right;}
  .stock-card .sc-seuil{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; padding-top:10px; border-top:1px solid var(--border);}
  .stock-card .sc-seuil label{font-size:11.5px; color:var(--text-dim);}
  .stock-card .sc-seuil input{width:60px; background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:6px 8px; font-size:13px; text-align:center;}

  /* ---------- F8 : Mon état ---------- */
  .etat-tabs{display:flex; gap:8px; margin-bottom:14px;}
  .etat-tab{flex:1; text-align:center; background:var(--card); border:1.5px solid var(--border); color:var(--text-dim);
    border-radius:12px; padding:10px 6px; font-size:13px; font-weight:700;}
  .etat-tab.active{border-color:var(--accent); color:var(--accent); background:rgba(245,166,35,.1);}
  .etat-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .etat-nav .en-btn{background:var(--card); border:1px solid var(--border); color:var(--text); width:36px; height:36px;
    border-radius:10px; font-size:16px; display:flex; align-items:center; justify-content:center;}
  .etat-nav .en-btn:disabled{opacity:.35;}
  .etat-nav .en-label{font-size:13.5px; font-weight:700; text-align:center; flex:1;}
  .etat-stats{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
  .etat-stat-row{display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:11px 14px;}
  .etat-stat-row .er-label{font-size:13px; color:var(--text-dim);}
  .etat-stat-row .er-val{font-size:15px; font-weight:800;}
  .etat-stat-row .er-val.neg{color:var(--red);}
  .etat-breakdown{margin-top:6px; margin-bottom:18px;}
  .etat-breakdown .eb-title{font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:8px;}
  .eb-row{display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .eb-row:last-child{border-bottom:none;}
  .eb-row .eb-nom{color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .eb-row .eb-val{font-weight:700; white-space:nowrap;}
  .eb-row .eb-sub{color:var(--text-dim); font-size:11.5px;}

  /* ---------- Header : plusieurs icônes ---------- */
  .header-icons{display:flex; align-items:center; gap:8px;}

  /* ---------- Code d'accès / PIN ---------- */
  .pin-dots{display:flex; justify-content:center; gap:14px; margin:18px 0 22px;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); background:var(--card-2);}
  .pin-dot.filled{background:var(--accent); border-color:var(--accent);}
  .pin-dot.filled.err{background:var(--red); border-color:var(--red);}
  .pin-keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .pin-key{
    background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:16px; font-size:20px; font-weight:700; padding:16px 0;
  }
  .pin-key:active{background:var(--card-2);}
  .pin-key-empty{background:transparent; border:none;}

  /* ---------- F9 : Objectif d'épargne ---------- */
  .objectif-rappel{
    background:rgba(91,141,239,.1); border:1px solid rgba(91,141,239,.3); border-radius:14px;
    padding:12px 14px; font-size:12.5px; color:var(--text); line-height:1.5; margin-bottom:16px;
  }
  .objectif-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px;}
  .objectif-card .oc-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .objectif-card .oc-emoji{font-size:22px;}
  .objectif-card .oc-nom{font-size:15px; font-weight:800; flex:1;}
  .objectif-card .oc-montant{font-size:22px; font-weight:800; color:var(--accent);}
  .objectif-card .oc-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .objectif-card .oc-actions{display:flex; gap:8px; margin-top:12px;}
  .objectif-card .oc-actions .btn{font-size:12.5px; padding:10px;}
  .plafond-msg{font-size:12.5px; color:var(--text-dim); text-align:center; padding:14px; line-height:1.5;}

  .scenario-grid{display:flex; flex-direction:column; gap:10px;}
  .scenario-card{
    background:var(--card); border:1.5px solid var(--border); border-radius:16px; padding:14px;
    text-align:left;
  }
  .scenario-card.selected{border-color:var(--accent); background:linear-gradient(135deg,#241d10,#1c2029);}
  .scenario-card .sc-top{display:flex; align-items:center; justify-content:space-between;}
  .scenario-card .sc-nom{font-size:14.5px; font-weight:800;}
  .scenario-card .sc-pct{font-size:12px; font-weight:700; color:var(--accent);}
  .scenario-card .sc-estim{font-size:12px; color:var(--text-dim); margin-top:6px; line-height:1.5;}

  .stepper-row{display:flex; align-items:center; justify-content:center; gap:16px; margin:6px 0 4px;}
  .stepper-btn{width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--border);
    color:var(--text); font-size:18px; font-weight:800;}
  .stepper-val{font-size:16px; font-weight:800; min-width:70px; text-align:center;}

  /* ---------- F10 : Partager ---------- */
  .partager-canvas-wrap{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:10px; margin-bottom:16px;}
  .partager-canvas-wrap canvas{width:100%; height:auto; display:block; border-radius:10px;}

  /* ---------- Autres charges (rubriques) ---------- */
  .rub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .rub-tile{
    display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card-2);
    border:1.5px solid var(--border); border-radius:14px; padding:12px 6px; text-align:center;
  }
  .rub-tile.selected{border-color:var(--accent); background:rgba(245,166,35,.1);}
  .rub-tile .rub-icon{font-size:20px;}
  .rub-tile .rub-nom{font-size:11px; font-weight:600; line-height:1.25;}
  .rub-manage-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:11px 14px; margin-bottom:8px;
  }
  .rub-manage-row .rm-emoji{font-size:18px; width:26px; text-align:center; flex:none;}
  .rub-manage-row .rm-nom{flex:1; font-size:13.5px; font-weight:600;}
  .rub-manage-row .rm-del{background:none; border:none; color:var(--text-dim); font-size:15px; padding:4px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "mondjai_salonf_state_v1";

  /* ================= Helpers ================= */

  function uid(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }
  function pad2(n){ return n < 10 ? "0"+n : ""+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }
  function formatDateFr(s){
    if(!s) return "";
    var parts = s.split("-");
    if(parts.length !== 3) return s;
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  function formatFCFA(n){
    var num = Math.round(Number(n) || 0);
    var neg = num < 0;
    num = Math.abs(num);
    var s = String(num).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return (neg ? "-" : "") + s + " F";
  }
  function toNum(v){
    var n = parseFloat(String(v === undefined || v === null ? "" : v).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function esc(s){
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }
  function byId(id){ return document.getElementById(id); }
  function val(id){ var el = byId(id); return el ? el.value : ""; }

  /* ================= Données par défaut ================= */

  var QUARTIERS_DEFAUT = [
    "Cocody","Yopougon","Abobo","Adjamé","Plateau","Treichville","Marcory",
    "Koumassi","Port-Bouët","Attécoubé","Bingerville","Songon","Anyama"
  ];
  var TYPES_CLIENTE_DEFAUT = ["Jeune fille","Jeune dame","Jeune dame mariée"];
  var TYPES_COIFFURE_DEFAUT = ["Boho Braids","Knot Less","Faux locs","Tissage","Twist"];

  function seedList(names){
    return names.map(function(nom){ return { id: uid("d"), nom: nom, perso:false }; });
  }

  var RUBRIQUES_CHARGES_DEFAUT = [
    { id:"loyer", nom:"Loyer / local", emoji:"🏠", actif:true },
    { id:"decoration", nom:"Décoration / aménagement", emoji:"🎨", actif:false },
    { id:"publicite", nom:"Publicité", emoji:"📣", actif:true },
    { id:"entretien_salon", nom:"Entretien du salon", emoji:"🧹", actif:true },
    { id:"electricite", nom:"Électricité / eau", emoji:"💡", actif:false },
    { id:"autre", nom:"Autre", emoji:"📝", actif:true }
  ];
  function seedRubriquesCharges(){
    return RUBRIQUES_CHARGES_DEFAUT.map(function(r){
      return { id:r.id, nom:r.nom, emoji:r.emoji, actif:r.actif, perso:false };
    });
  }

  function defaultState(){
    return {
      version: 1,
      config: {
        profils: { coiffure:false, pedicure:false, revente:false },
        onboardingComplete: false,
        typesCliente: seedList(TYPES_CLIENTE_DEFAUT),
        quartiers: seedList(QUARTIERS_DEFAUT),
        typesCoiffure: seedList(TYPES_COIFFURE_DEFAUT),
        typesPrestationPedicure: [],
        produits: [],
        rubriquesCharges: seedRubriquesCharges(),
        codeAccesOk: false,
        pinActif: false,
        pinCode: null,
        joursRoulesParSemaine: 6
      },
      achats: [],
      ventes: [],
      prestationsCoiffure: [],
      prestationsPedicure: [],
      autresCharges: [],
      objectifs: [],
      meta: { creation: todayStr(), derniereSauvegarde: null, dernierRappelSauvegarde: null }
    };
  }

  function merge(base, extra){
    var out = {};
    for(var k in base) out[k] = base[k];
    if(extra) for(var k2 in extra) if(extra[k2] !== undefined) out[k2] = extra[k2];
    return out;
  }

  var state;
  // Fusion défensive d'un état (chargé depuis localStorage ou importé depuis un
  // fichier JSON de sauvegarde F11) avec l'état par défaut — mêmes règles dans
  // les deux cas, pour qu'une sauvegarde plus ancienne (sans un champ ajouté par
  // un sprint récent) se recharge toujours sans erreur.
  function normaliserEtatImporte(parsed){
    var base = defaultState();
    if(!parsed || typeof parsed !== "object") return base;
    var out = merge(base, parsed);
    out.config = merge(base.config, parsed.config || {});
    out.config.profils = merge(base.config.profils, (parsed.config && parsed.config.profils) || {});
    if(!Array.isArray(out.config.typesCliente) || !out.config.typesCliente.length) out.config.typesCliente = base.config.typesCliente;
    if(!Array.isArray(out.config.quartiers) || !out.config.quartiers.length) out.config.quartiers = base.config.quartiers;
    if(!Array.isArray(out.config.typesCoiffure) || !out.config.typesCoiffure.length) out.config.typesCoiffure = base.config.typesCoiffure;
    if(!Array.isArray(out.config.typesPrestationPedicure)) out.config.typesPrestationPedicure = [];
    if(!Array.isArray(out.config.produits)) out.config.produits = [];
    if(!Array.isArray(out.config.rubriquesCharges) || !out.config.rubriquesCharges.length) out.config.rubriquesCharges = base.config.rubriquesCharges;
    if(!Array.isArray(out.achats)) out.achats = [];
    if(!Array.isArray(out.ventes)) out.ventes = [];
    if(!Array.isArray(out.prestationsCoiffure)) out.prestationsCoiffure = [];
    if(!Array.isArray(out.prestationsPedicure)) out.prestationsPedicure = [];
    if(!Array.isArray(out.autresCharges)) out.autresCharges = [];
    if(!Array.isArray(out.objectifs)) out.objectifs = [];
    out.meta = merge(base.meta, parsed.meta || {});
    migrerLieuPrestations(out);
    return out;
  }

  function loadState(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(!raw) return defaultState();
    var parsed;
    try{ parsed = JSON.parse(raw); }catch(e){ return defaultState(); }
    return normaliserEtatImporte(parsed);
  }

  // Amendement post-Sprint 1 : ajout du champ "lieu" (domicile/salon) sur les
  // prestations. Toute prestation enregistrée avant cet amendement n'a pas de
  // champ `lieu` et portait systématiquement un quartier (obligatoire à l'époque)
  // — on la traite donc par défaut comme "à domicile", sans perte ni altération
  // d'aucune autre donnée déjà saisie.
  function migrerLieuPrestations(out){
    [out.prestationsCoiffure, out.prestationsPedicure].forEach(function(list){
      list.forEach(function(p){
        if(p.lieu !== "domicile" && p.lieu !== "salon") p.lieu = "domicile";
      });
    });
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* stockage indisponible : on continue quand même */ }
  }

  /* ================= F11 : Sauvegarde / restauration JSON ================= */

  function exporterJson(){
    state.meta.derniereSauvegarde = todayStr();
    saveState();
    try{
      var blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "mondjai-salonf-" + todayStr() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      ui.backupMsg = "Sauvegarde téléchargée.";
    }catch(e){
      ui.backupMsg = "Impossible de générer le fichier sur cet appareil.";
    }
    render();
  }

  function importerJsonDepuisFichier(file, callback){
    if(!file){ callback(false); return; }
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{ parsed = JSON.parse(reader.result); }catch(e){ callback(false); return; }
      state = normaliserEtatImporte(parsed);
      saveState();
      callback(true);
    };
    reader.onerror = function(){ callback(false); };
    reader.readAsText(file);
  }

  /* ================= UI (non persisté) ================= */

  var ui = {
    tab: null,           // 'coiffure' | 'pedicure' | 'achats' | 'ventes'
    overlay: null,       // null | 'reglages' | 'apropos' | 'objectif' | 'partager'
    modal: null,         // { type: 'add-...' | 'detail', ... }
    draft: {},
    errors: {},
    onboardingSel: { coiffure:false, pedicure:false, revente:false },
    onboardingMsg: "",
    pendingAutofocus: false,
    locked: false,               // écran de verrouillage PIN (F11)
    codeAccesInput: "",
    codeAccesErreur: "",
    objCreating: false,          // assistant de création d'objectif (F9) affiché plutôt que la liste
    objEditId: null,             // objectif en cours de modification
    partagerPeriode: "jour",
    partagerSemaineRef: null,
    partagerMoisRef: null,
    reglagesMsg: "",
    backupMsg: "",
    modalReturnTo: null    // "detail-charges-jour" pendant le sous-parcours ajout/suppression d'une autre charge
  };

  var TAB_DEFS = [
    { key:"aujourdhui", profil:null, label:"Aujourd’hui", emoji:"🏠" },
    { key:"coiffure", profil:"coiffure", label:"Coiffure", emoji:"💇" },
    { key:"pedicure", profil:"pedicure", label:"Pédicure", emoji:"💅" },
    { key:"achats", profil:"revente", label:"Achats", emoji:"📦" },
    { key:"ventes", profil:"revente", label:"Ventes", emoji:"🛍️" },
    { key:"etat", profil:null, label:"Mon état", emoji:"📊" }
  ];
  function activeTabs(){
    return TAB_DEFS.filter(function(t){ return t.profil === null || !!state.config.profils[t.profil]; });
  }
  function ensureValidTab(){
    var tabs = activeTabs();
    if(!tabs.length){ ui.tab = null; return; }
    if(!tabs.some(function(t){ return t.key === ui.tab; })) ui.tab = tabs[0].key;
  }

  /* ================= Listes personnalisables ================= */

  function findList(name){ return state.config[name]; }
  function addPerso(name, nom){
    nom = String(nom || "").trim();
    if(!nom) return null;
    var list = findList(name);
    var existing = list.filter(function(it){ return it.nom.toLowerCase() === nom.toLowerCase(); })[0];
    if(existing) return existing;
    var item = { id: uid("p"), nom: nom, perso:true };
    list.push(item);
    saveState();
    return item;
  }
  function findById(name, id){
    var list = findList(name);
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    return null;
  }

  function findOrCreateProduit(nom, prixAchat, prixVente){
    nom = String(nom || "").trim();
    if(!nom) return null;
    var list = state.config.produits;
    var existing = list.filter(function(p){ return p.nom.toLowerCase() === nom.toLowerCase(); })[0];
    if(existing){
      if(prixAchat !== undefined && prixAchat !== null) existing.dernierPrixAchat = prixAchat;
      if(prixVente !== undefined && prixVente !== null) existing.dernierPrixVenteEstime = prixVente;
      return existing;
    }
    var item = { id: uid("prod"), nom: nom,
      dernierPrixAchat: (prixAchat===undefined?null:prixAchat),
      dernierPrixVenteEstime: (prixVente===undefined?null:prixVente) };
    list.push(item);
    return item;
  }
  function findProduitById(id){
    var list = state.config.produits;
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    return null;
  }

  /* ================= Rendu racine ================= */

  function render(){
    var app = byId("app");
    if(!state.config.codeAccesOk){
      app.innerHTML = renderCodeAcces();
      afterRender();
      return;
    }
    if(ui.locked){
      var htmlLock = renderPinLock();
      if(ui.modal) htmlLock += renderModal();
      app.innerHTML = htmlLock;
      afterRender();
      return;
    }
    if(!state.config.onboardingComplete){
      app.innerHTML = renderOnboarding();
      return;
    }
    ensureValidTab();
    var html = "";
    if(ui.overlay === "reglages"){
      html = renderReglages();
    } else if(ui.overlay === "apropos"){
      html = renderApropos();
    } else if(ui.overlay === "objectif"){
      html = renderObjectifOverlay();
    } else if(ui.overlay === "partager"){
      html = renderPartager();
    } else {
      html = renderHeader() + renderMain() + renderTabBar();
    }
    if(ui.modal){
      html += renderModal();
    }
    app.innerHTML = html;
    afterRender();
  }

  function afterRender(){
    // Focus automatique sur le champ "nouveau nom" une seule fois, au moment
    // précis où il apparaît (ui.pendingAutofocus posé par l'action qui le
    // révèle). Corrigé pendant ce sprint : le faire à CHAQUE rendu (comme au
    // Sprint 1) reprenait le focus au champ "nouveau…" dès qu'on tapait dans
    // le champ suivant (ex. Quantité juste après avoir créé un produit), qui
    // déclenche son propre re-rendu au blur — empêchant en pratique de
    // continuer la saisie sur les champs suivants.
    if(ui.pendingAutofocus){
      var autoFocus = document.querySelector("[data-autofocus]");
      if(autoFocus){
        try{ autoFocus.focus(); }catch(e){}
      }
      ui.pendingAutofocus = false;
    }
    if(ui.overlay === "partager" && !ui.modal){
      dessinerCartePartage();
    }
  }

  /* ================= Onboarding (F1) ================= */

  var PROFIL_INFO = {
    coiffure: { emoji:"💇", titre:"Prestations coiffure", desc:"Tresses, tissages, twists, locs… chez la cliente ou en salon." },
    pedicure: { emoji:"💅", titre:"Pédicure / Manicure", desc:"Soins des pieds et des mains, pose de vernis ou d’ongles." },
    revente: { emoji:"🛍️", titre:"Revente de mèches / produits", desc:"Achat en gros, revente à l’unité ou au détail." }
  };

  function renderOnboarding(){
    var keys = ["coiffure","pedicure","revente"];
    var cards = keys.map(function(k){
      var info = PROFIL_INFO[k];
      var sel = !!ui.onboardingSel[k];
      return (
        '<button type="button" class="choice-card' + (sel?" selected":"") + '" data-action="toggle-onboarding" data-key="' + k + '">' +
          '<div class="emoji">' + info.emoji + '</div>' +
          '<div class="cc-text">' +
            '<div class="cc-title">' + esc(info.titre) + '</div>' +
            '<div class="cc-desc">' + esc(info.desc) + '</div>' +
          '</div>' +
          '<div class="cc-check">✓</div>' +
        '</button>'
      );
    }).join("");

    return (
      '<div class="onb">' +
        '<div class="onb-head">' +
          '<div class="onb-emoji">💇💅🛍️</div>' +
          '<div class="onb-title">Bienvenue sur MonDjai/Salon F</div>' +
          '<div class="onb-desc">Choisissez ce que vous faites — vous pouvez cocher plusieurs cases, et changer d’avis à tout moment depuis Réglages.</div>' +
        '</div>' +
        '<div class="onb-body">' +
          '<div class="choice-grid">' + cards + '</div>' +
          (ui.onboardingMsg ? '<div class="error-text">' + esc(ui.onboardingMsg) + '</div>' : '') +
        '</div>' +
        '<button type="button" class="btn btn-primary" data-action="onboarding-continuer" style="margin-top:16px;">Continuer</button>' +
      '</div>'
    );
  }

  /* ================= Écran « Code d'accès » (amendement, indépendant du PIN F11) ================= */

  var CODE_ACCES_ATTENDU = "HKETCK";
  function normaliserCode(s){
    return String(s||"").toUpperCase().replace(/\s+/g,"");
  }

  function renderCodeAcces(){
    return (
      '<div class="onb">' +
        '<div class="onb-head">' +
          '<div class="onb-emoji">🔐</div>' +
          '<div class="onb-title">Code d’accès</div>' +
          '<div class="onb-desc">Entrez le code qui vous a été communiqué pour ouvrir MonDjai/Salon F.</div>' +
        '</div>' +
        '<div class="onb-body">' +
          '<div class="field">' +
            '<div class="label">Code</div>' +
            '<input type="text" class="input" id="f-codeAcces" autocapitalize="characters" autocomplete="off" ' +
              'placeholder="Ex. ABCDEF" value="' + esc(ui.codeAccesInput||"") + '" data-autofocus data-action-change="capture-code-acces">' +
            (ui.codeAccesErreur ? '<div class="error-text">' + esc(ui.codeAccesErreur) + '</div>' : '') +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" data-action="valider-code-acces">Valider</button>' +
      '</div>'
    );
  }

  /* ================= Verrouillage PIN (F11) — indépendant du code d'accès ================= */

  function renderPinDots(n, actif, erreur){
    var dots = "";
    for(var i=0;i<4;i++){
      dots += '<div class="pin-dot' + (i<n?" filled":"") + (erreur?" err":"") + '"></div>';
    }
    return '<div class="pin-dots">' + dots + '</div>';
  }
  function renderPinKeypad(idPrefix){
    var touches = ["1","2","3","4","5","6","7","8","9","","0","del"];
    var cells = touches.map(function(t){
      if(t === "") return '<div class="pin-key pin-key-empty"></div>';
      if(t === "del") return '<button type="button" class="pin-key" data-action="pin-key" data-id="' + idPrefix + '" data-val="del">⌫</button>';
      return '<button type="button" class="pin-key" data-action="pin-key" data-id="' + idPrefix + '" data-val="' + t + '">' + t + '</button>';
    }).join("");
    return '<div class="pin-keypad">' + cells + '</div>';
  }

  function renderPinLock(){
    var saisie = ui.pinLockInput || "";
    var erreur = !!ui.pinLockErreur;
    return (
      '<div class="onb">' +
        '<div class="onb-head">' +
          '<div class="onb-emoji">🔒</div>' +
          '<div class="onb-title">Code PIN</div>' +
          '<div class="onb-desc">Entrez votre code à 4 chiffres pour ouvrir l’application.</div>' +
        '</div>' +
        '<div class="onb-body">' +
          renderPinDots(saisie.length, saisie.length>0, erreur) +
          (erreur ? '<div class="error-text" style="text-align:center;">Code incorrect, réessayez.</div>' : '') +
          renderPinKeypad("lock") +
          '<button type="button" class="btn btn-ghost" style="margin-top:8px;" data-action="pin-oublie">Code oublié ?</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderPinSetupModal(){
    var step = ui.pinSetupStep || "premier";
    var input = ui.pinSetupInput || "";
    var titre = step === "premier" ? "Choisissez un code à 4 chiffres" : "Confirmez le code";
    return (
      '<div>' +
        '<div class="hint" style="text-align:center; margin-bottom:6px;">' + esc(titre) + '</div>' +
        renderPinDots(input.length, input.length>0, false) +
        (ui.pinSetupErreur ? '<div class="error-text" style="text-align:center;">Les deux codes ne correspondent pas, recommencez.</div>' : '') +
        renderPinKeypad("setup") +
      '</div>'
    );
  }

  function renderPinOublieModal(){
    if(ui.modal.confirmErase){
      return (
        '<div class="confirm-box"><p>Effacer toutes les données de l’appareil ? Prestations, ventes, achats, objectifs — tout sera perdu, cette action est définitive.</p>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn btn-secondary" data-action="annuler-erase">Annuler</button>' +
            '<button type="button" class="btn btn-danger" data-action="confirmer-erase">Oui, tout effacer</button>' +
          '</div></div>'
      );
    }
    return (
      '<div>' +
        '<div class="hint" style="margin-bottom:14px;">Vous pouvez restaurer une sauvegarde JSON — le code PIN qu’elle contient s’appliquera, sans connaître le code actuel — ou repartir de zéro.</div>' +
        '<label class="btn btn-secondary" style="display:flex; cursor:pointer; margin-bottom:10px;">📂 Restaurer une sauvegarde JSON' +
          '<input type="file" accept="application/json" style="display:none;" data-action-change="importer-json-lock"></label>' +
        (ui.backupMsg ? '<div class="hint tight" style="margin-bottom:10px;">' + esc(ui.backupMsg) + '</div>' : '') +
        '<button type="button" class="btn btn-danger" data-action="demander-erase">🗑️ Effacer toutes les données</button>' +
      '</div>'
    );
  }

  function handlePinKey(prefix, val){
    if(prefix === "lock"){
      if(ui.pinLockErreur){ ui.pinLockInput = ""; ui.pinLockErreur = false; }
      if(val === "del"){ ui.pinLockInput = (ui.pinLockInput||"").slice(0,-1); render(); return; }
      var cur = ui.pinLockInput || "";
      if(cur.length >= 4) return;
      cur += val;
      ui.pinLockInput = cur;
      if(cur.length === 4){
        if(cur === state.config.pinCode){
          ui.locked = false; ui.pinLockInput = "";
        } else {
          ui.pinLockErreur = true;
        }
      }
      render();
      return;
    }
    if(prefix === "setup"){
      if(val === "del"){ ui.pinSetupInput = (ui.pinSetupInput||"").slice(0,-1); render(); return; }
      var cur2 = ui.pinSetupInput || "";
      if(cur2.length >= 4) return;
      cur2 += val;
      ui.pinSetupInput = cur2;
      if(cur2.length === 4){
        if((ui.pinSetupStep||"premier") === "premier"){
          ui.pinSetupPremier = cur2;
          ui.pinSetupInput = "";
          ui.pinSetupStep = "confirmer";
          ui.pinSetupErreur = false;
        } else {
          if(cur2 === ui.pinSetupPremier){
            state.config.pinActif = true;
            state.config.pinCode = cur2;
            saveState();
            closeModal();
            return;
          }
          ui.pinSetupErreur = true;
          ui.pinSetupStep = "premier";
          ui.pinSetupPremier = "";
          ui.pinSetupInput = "";
        }
      }
      render();
      return;
    }
  }

  /* ================= Header + tabbar ================= */

  function renderHeader(){
    return (
      '<div class="header">' +
        '<div class="brand">' +
          '<div class="brand-emoji">💇</div>' +
          '<div class="brand-text">' +
            '<div class="brand-title">MonDjai/Salon F</div>' +
            '<div class="brand-sub">Suivi financier du salon</div>' +
          '</div>' +
        '</div>' +
        '<div class="header-icons">' +
          '<button type="button" class="icon-btn" data-action="ouvrir-objectif" aria-label="Objectif d’épargne">🎯</button>' +
          '<button type="button" class="icon-btn" data-action="ouvrir-partager" aria-label="Partager">📤</button>' +
          '<button type="button" class="icon-btn" data-action="ouvrir-reglages" aria-label="Réglages">⚙️</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderTabBar(){
    var tabs = activeTabs();
    if(!tabs.length) return "";
    var items = tabs.map(function(t){
      return (
        '<button type="button" class="tab' + (ui.tab===t.key?" active":"") + '" data-action="go-tab" data-tab="' + t.key + '">' +
          '<span class="tab-emoji">' + t.emoji + '</span>' +
          '<span class="tab-label">' + t.label + '</span>' +
        '</button>'
      );
    }).join("");
    return '<div class="tabbar">' + items + '</div>';
  }

    if(!tabs.length){
      return '<div class="main"><div class="empty-state"><div class="es-emoji">🙈</div>' +

  function renderFab(){

  /* ================= Listes ================= */

  function sortByDateDesc(arr){
    return arr.slice().sort(function(a,b){
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.ts||0) - (a.ts||0);
    });
  }

  /* ================= Calculs communs — F7 tableau de bord & F8 Mon état ================= */

  function dateFromStr(s){
    var p = s.split("-");
    return new Date(+p[0], +p[1]-1, +p[2]);
  }
  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }

  function getDayRange(d){ var k = dateKey(d); return { start:k, end:k }; }
  function getWeekRange(d){
    var day = d.getDay(); // 0=dimanche
    var diffLundi = (day === 0) ? -6 : (1 - day);
    var lundi = new Date(d); lundi.setDate(d.getDate() + diffLundi);
    var dimanche = new Date(lundi); dimanche.setDate(lundi.getDate() + 6);
    return { start: dateKey(lundi), end: dateKey(dimanche) };
  }
  function getMonthRange(d){
    var premier = new Date(d.getFullYear(), d.getMonth(), 1);
    var dernier = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start: dateKey(premier), end: dateKey(dernier) };
  }
  function rangeForPeriode(periode, ref){
    if(periode === "semaine") return getWeekRange(ref);
    if(periode === "mois") return getMonthRange(ref);
    return getDayRange(ref);
  }
  function inRange(dateStr, range){ return !!dateStr && dateStr >= range.start && dateStr <= range.end; }
  function filterRange(arr, range){ return arr.filter(function(x){ return inRange(x.date, range); }); }
  function sumBy(arr, fn){ return arr.reduce(function(s,x){ return s + (Number(fn(x)) || 0); }, 0); }

  // Bloc "Charges consolidé" (F7/F8) : agrège, pour les profils actifs, les
  // charges déjà présentes dans les enregistrements existants — pas de rubriques
  // séparées à ce stade (F11, prévu au Sprint 3). Le coût des achats (Revente)
  // est compté ici comme une sortie de caisse du jour de l'achat, cohérent avec
  // le principe Trépor/Salon H « recette − charges = solde net » : le Suivi de
  // stock (F4) reste, lui, la vue séparée pour le bénéfice réalisé/attendu.
  function chargesConsolidees(range){
    var profils = state.config.profils;
    var total = 0;
    if(profils.coiffure){
      total += sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return (p.coutMeches||0) + (p.transport||0); });
    }
    if(profils.pedicure){
      total += sumBy(filterRange(state.prestationsPedicure, range), function(p){ return (p.coutProduits||0) + (p.transport||0); });
    }
    if(profils.revente){
      total += sumBy(filterRange(state.achats, range), function(a){ return (a.quantite||0) * (a.prixAchatUnitaire||0) + (a.charges||0); });
    }
    total += autresChargesTotal(range);
    return total;
  }

  // "Autres charges" (F11, Sprint 3) : rubriques communes aux 3 profils, pour les
  // frais qui ne se rattachent à aucune prestation/achat en particulier (loyer,
  // publicité...). Toujours comptées, quels que soient les profils actifs.
  function autresChargesTotal(range){
    return sumBy(filterRange(state.autresCharges, range), function(c){ return c.montant; });
  }
  function revenusParSource(range){
    var profils = state.config.profils;
    var sources = [];
    if(profils.coiffure){
      sources.push({ key:"coiffure", emoji:"💇", label:"Prestations coiffure",
        montant: sumBy(filterRange(state.prestationsCoiffure, range), function(p){ return p.mainOeuvre; }) });
    }
    if(profils.pedicure){
      sources.push({ key:"pedicure", emoji:"💅", label:"Pédicure / Manicure",
        montant: sumBy(filterRange(state.prestationsPedicure, range), function(p){ return p.mainOeuvre; }) });
    }
    if(profils.revente){
      sources.push({ key:"ventes", emoji:"🛍️", label:"Ventes",
        montant: sumBy(filterRange(state.ventes, range), function(v){ return v.montantEncaisse; }) });
    }
    return sources;
  }

  function soldeNetPeriode(range){
    var revenuTotal = sumBy(revenusParSource(range), function(s){ return s.montant; });
    return revenuTotal - chargesConsolidees(range);
  }
  function soldeNetJour(dateStr){
    return soldeNetPeriode({ start:dateStr, end:dateStr });
  }

  // Toutes les dates portant au moins un enregistrement (prestation, vente,
  // achat ou autre charge) — sert à ne compter, pour la moyenne hebdomadaire de
  // l'objectif d'épargne comme pour l'épargne "manuelle" jour par jour, que les
  // jours où quelque chose a vraiment été saisi (jamais une semaine calendaire
  // vide comptée comme un jour à 0 F).
  function allActivityDates(){
    var set = {};
    state.prestationsCoiffure.forEach(function(p){ if(p.date) set[p.date] = 1; });
    state.prestationsPedicure.forEach(function(p){ if(p.date) set[p.date] = 1; });
    state.ventes.forEach(function(v){ if(v.date) set[v.date] = 1; });
    state.achats.forEach(function(a){ if(a.date) set[a.date] = 1; });
    state.autresCharges.forEach(function(c){ if(c.date) set[c.date] = 1; });
    return Object.keys(set).sort();
  }

  /* ================= F9 : Objectif d'épargne (repris de Trépor/Salon H) ================= */

  var MAX_OBJECTIFS = 3;
  var NB_SEMAINES_MOYENNE = 4;
  var POURCENTAGES_SCENARIO = [
    { key:"tranquille", nom:"Tranquille", pct:10 },
    { key:"equilibre", nom:"Équilibré", pct:20 },
    { key:"ambitieux", nom:"Ambitieux", pct:30 }
  ];
  var OBJECTIF_MODELES = [
    { id:"equipement", emoji:"🧰", titre:"Matériel & équipement", desc:"Sèche-cheveux, kit manucure, mobilier…" },
    { id:"stock", emoji:"📦", titre:"Stock à agrandir", desc:"Plus de mèches et de produits en réserve." },
    { id:"local", emoji:"🏠", titre:"Salon / local fixe", desc:"Se poser dans un vrai local à vous." },
    { id:"epargne_libre", emoji:"💰", titre:"Épargne libre", desc:"Mettre de côté, sans projet précis pour l’instant." }
  ];
  function objectifModele(id){
    var m = OBJECTIF_MODELES.filter(function(x){ return x.id===id; })[0];
    return m || OBJECTIF_MODELES[OBJECTIF_MODELES.length-1];
  }
  function nomObjectifParDefaut(modeleId, sousType){
    var m = objectifModele(modeleId);
    sousType = String(sousType||"").trim();
    return sousType ? (m.titre + " / " + sousType) : m.titre;
  }

  // Liste des lundis (clé AAAA-MM-JJ) des semaines contenant au moins un jour
  // d'activité, de la plus récente à la plus ancienne.
  function semainesAvecActivite(){
    var dates = allActivityDates();
    var map = {}, ordre = [];
    dates.forEach(function(d){
      var lundi = getWeekRange(dateFromStr(d)).start;
      if(!(lundi in map)){ map[lundi] = true; ordre.push(lundi); }
    });
    return ordre.sort().reverse();
  }
  function moyenneHebdoRecente(){
    var semaines = semainesAvecActivite().slice(0, NB_SEMAINES_MOYENNE);
    if(!semaines.length) return null;
    var total = semaines.reduce(function(s, lundi){
      var range = { start: lundi, end: dateKey((function(){ var d=dateFromStr(lundi); d.setDate(d.getDate()+6); return d; })()) };
      return s + soldeNetPeriode(range);
    }, 0);
    return total / semaines.length;
  }

  function estimationScenarioCompacte(epargneHebdo, joursParSemaine){
    var jours = joursParSemaine > 0 ? joursParSemaine : 6;
    var parJour = epargneHebdo / jours;
    var parMois = epargneHebdo * 4.345;
    return formatFCFA(parJour) + "/jour · ~" + formatFCFA(epargneHebdo) + "/semaine · ~" + formatFCFA(parMois) + "/mois";
  }
  function computeScenarios(moyenneHebdo, joursParSemaine){
    return POURCENTAGES_SCENARIO.map(function(s){
      var hebdo = Math.max(0, moyenneHebdo || 0) * s.pct / 100;
      return {
        key: s.key, nom: s.nom, pct: s.pct, montantHebdo: hebdo,
        estimation: estimationScenarioCompacte(hebdo, joursParSemaine)
      };
    });
  }

  function computeEpargneQuotidienneObjectif(obj, dateStr){
    if(obj.type === "manuel") return obj.montantFixeParJour || 0;
    var solde = soldeNetJour(dateStr);
    return Math.max(0, solde) * (obj.pourcentage||0) / 100;
  }
  function computeEpargneCumuleeObjectif(obj){
    var dates = allActivityDates().filter(function(d){ return d >= obj.dateCreation; });
    return sumBy(dates, function(d){ return computeEpargneQuotidienneObjectif(obj, d); });
  }
  function computeEpargneJourTousObjectifs(dateStr){
    return sumBy((state.objectifs||[]).filter(function(o){ return o.actif && dateStr >= o.dateCreation; }),
      function(o){ return computeEpargneQuotidienneObjectif(o, dateStr); });
  }
  function computeEpargnePeriodeTousObjectifs(range){
    var dates = allActivityDates().filter(function(d){ return inRange(d, range); });
    return sumBy(dates, function(d){ return computeEpargneJourTousObjectifs(d); });
  }
  function hasObjectifAutoActif(excludeId){
    return (state.objectifs||[]).some(function(o){ return o.type==="auto" && o.id!==excludeId; });
  }

  function emptyState(emoji, titre, desc){
    return '<div class="empty-state"><div class="es-emoji">' + emoji + '</div>' +
      '<div class="es-title">' + esc(titre) + '</div>' +
      '<div class="es-desc">' + esc(desc) + '</div></div>';
  }

  /* ================= F7 : Tableau de bord du jour ================= */

  function renderAujourdhui(){
    var today = todayStr();
    var range = { start: today, end: today };
    var sources = revenusParSource(range);
    var charges = chargesConsolidees(range);
    var revenuTotal = sumBy(sources, function(s){ return s.montant; });
    var soldeNet = revenuTotal - charges;
    var objectifs = state.objectifs || [];
    var epargneJour = objectifs.length ? computeEpargneJourTousObjectifs(today) : 0;

    var blocksHtml = sources.map(function(s){
      return (
        '<div class="dash-block">' +
          '<div class="db-emoji">' + s.emoji + '</div>' +
          '<div class="db-label">' + esc(s.label) + '</div>' +
          '<div class="db-amount">' + formatFCFA(s.montant) + '</div>' +
        '</div>'
      );
    }).join("") + (
      '<button type="button" class="dash-block charges" style="color:var(--text); width:100%; cursor:pointer;" data-action="voir-charges-jour">' +
        '<div class="db-emoji">💸</div>' +
        '<div class="db-label">Charges</div>' +
        '<div class="db-amount">' + formatFCFA(charges) + '</div>' +
      '</button>'
    ) + (
      '<button type="button" class="dash-block" style="color:var(--text); width:100%; cursor:pointer;" data-action="ouvrir-objectif">' +
        '<div class="db-emoji">💰</div>' +
        '<div class="db-label">Épargne</div>' +
        '<div class="db-amount">' + (objectifs.length ? formatFCFA(epargneJour) : "Aucun") + '</div>' +
      '</button>'
    );

    var perte = soldeNet < 0 ?
      '<div class="dash-perte">Jour à perte : ' + formatFCFA(Math.abs(soldeNet)) + '. Ça arrive — on note et on avance.</div>' : '';

    var disponible = "";
    if(objectifs.length && soldeNet > 0){
      disponible = '<div class="hint tight" style="text-align:center; margin-top:8px; font-size:13px;">Disponible aujourd’hui : <strong style="color:var(--text);">' + formatFCFA(soldeNet - epargneJour) + '</strong></div>';
    }

    return (
      '<div class="section-title">Aujourd’hui · ' + formatDateFr(today) + '</div>' +
      '<div class="dash-solde">' +
        '<div class="ds-label">Solde net du jour</div>' +
        '<div class="ds-amount' + (soldeNet < 0 ? " neg" : "") + '">' + formatFCFA(soldeNet) + '</div>' +
        perte +
        disponible +
      '</div>' +
      '<div class="dash-grid">' + blocksHtml + '</div>'
    );
  }

  function renderListeAchats(){

    var head = '<div class="section-title">Achats</div>';

    }

          '</div>' +
          '<div class="entry-amount">' + formatFCFA(a.quantite * a.prixAchatUnitaire + (a.charges||0)) + '</div>' +

  /* ================= F4 : Suivi de stock & réassort ================= */

  var SEUIL_REASSORT_DEFAUT = 3;

  function computeStockProduit(p){
    var achatsP = state.achats.filter(function(a){ return a.produitId === p.id; });
    var ventesP = state.ventes.filter(function(v){ return v.produitId === p.id; });
    var ventesStock = ventesP.filter(function(v){ return v.typeVente !== "commande_speciale"; });
    var ventesCommande = ventesP.filter(function(v){ return v.typeVente === "commande_speciale"; });

    var totalAchatQte = sumBy(achatsP, function(a){ return a.quantite; });
    var totalAchatValeur = sumBy(achatsP, function(a){ return a.quantite * a.prixAchatUnitaire; });
    var coutMoyen = totalAchatQte > 0 ? totalAchatValeur / totalAchatQte : 0;

    var qteVendueStock = sumBy(ventesStock, function(v){ return v.quantite; });
    var stockRestant = Math.max(0, totalAchatQte - qteVendueStock);

    var prixVenteRef = (p.dernierPrixVenteEstime === null || p.dernierPrixVenteEstime === undefined) ? 0 : p.dernierPrixVenteEstime;

    var caStock = sumBy(ventesStock, function(v){ return v.montantEncaisse; });
    var beneficeStock = caStock - qteVendueStock * coutMoyen;
    var caCommande = sumBy(ventesCommande, function(v){ return v.montantEncaisse; });
    var beneficeCommande = sumBy(ventesCommande, function(v){ return v.montantEncaisse - (v.prixPayeRevendeur||0); });

    // Bénéfice attendu : ce qu'on visait sur tout ce qui a été acheté, à partir
    // du prix de vente estimé propre à chaque achat (pas une seule estimation globale).
    var beneficeAttendu = sumBy(achatsP, function(a){ return a.quantite * ((a.prixVenteUnitaireEstime||0) - (a.prixAchatUnitaire||0)); });

    var seuil = (p.seuilReassort===undefined || p.seuilReassort===null) ? SEUIL_REASSORT_DEFAUT : p.seuilReassort;

    return {
      produit: p, totalAchatQte: totalAchatQte, coutMoyen: coutMoyen, stockRestant: stockRestant,
      valeurStockCout: stockRestant * coutMoyen, valeurStockVente: stockRestant * prixVenteRef,
      caTotal: caStock + caCommande, beneficeRealise: beneficeStock + beneficeCommande,
      beneficeAttendu: beneficeAttendu, seuil: seuil, alerte: stockRestant <= seuil
    };
  }

  function renderStockSection(){
    var produits = state.config.produits.slice().sort(function(a,b){ return a.nom.localeCompare(b.nom); });
    if(!produits.length) return "";
    var cards = produits.map(function(p){
      var s = computeStockProduit(p);
      return (
        '<div class="stock-card">' +
          '<div class="sc-head">' +

            '<div class="sk">Stock restant</div><div class="sv">' + s.stockRestant + ' paquet(s)</div>' +
            '<div class="sk">Coût moyen</div><div class="sv">' + formatFCFA(s.coutMoyen) + '</div>' +
            '<div class="sk">Valeur (coût)</div><div class="sv">' + formatFCFA(s.valeurStockCout) + '</div>' +
            '<div class="sk">Valeur (vente est.)</div><div class="sv">' + formatFCFA(s.valeurStockVente) + '</div>' +
            '<div class="sk">Bénéfice réalisé</div><div class="sv">' + formatFCFA(s.beneficeRealise) + '</div>' +
            '<div class="sk">Bénéfice attendu</div><div class="sv">' + formatFCFA(s.beneficeAttendu) + '</div>' +
          '</div>' +
          '<div class="sc-seuil">' +
            '<label>Seuil de réassort</label>' +

          '</div>' +
        '</div>'
      );
    }).join("");
    return '<div class="reglages-section"><div class="rs-title">Suivi de stock &amp; réassort</div>' + cards + '</div>';

  /* ================= Formulaires : capture / options communes ================= */

  function optionsFor(name, selectedId){

    var opts = '<option value="" disabled' + (!selectedId?" selected":"") + '>' + esc(placeholder||"Choisir un produit") + '</option>';
    opts += list.map(function(it){
      return '<option value="' + it.id + '"' + (it.id===selectedId?" selected":"") + '>' + esc(it.nom) + '</option>';
    }).join("");
    opts += '<option value="__new__"' + (selectedId==="__new__"?" selected":"") + '>+ Nouveau produit…</option>';
    return opts;
  }

    var a = state.achats.filter(function(x){ return x.id === ui.modal.id; })[0];

    var rows =
      drow("Date", formatDateFr(a.date)) +
      drow("Produit", esc(a.produitNom)) +
      drow("Quantité", a.quantite + " paquet(s)") +
      drow("Prix d’achat unitaire", formatFCFA(a.prixAchatUnitaire)) +
      drow("Prix de vente estimé", formatFCFA(a.prixVenteUnitaireEstime)) +
      drow("Charges", formatFCFA(a.charges||0)) +
      drow("Total dépensé", formatFCFA(a.quantite*a.prixAchatUnitaire + (a.charges||0)));
    return detailShell(rows, "achat", a.id);
  }
  function renderDetailVente(){
    var v = state.ventes.filter(function(x){ return x.id === ui.modal.id; })[0];
    if(!v) return "";
    var rows =
      drow("Date", formatDateFr(v.date)) +
      drow("Produit", esc(v.produitNom)) +
      drow("Quantité", v.quantite + "") +
      drow("Montant encaissé", formatFCFA(v.montantEncaisse)) +
      drow("Type de vente", v.typeVente==="commande_speciale" ? "Commande spéciale" : "Depuis le stock");

      rows += drow("Prix payé au revendeur", formatFCFA(v.prixPayeRevendeur||0));

  /* ================= Autres charges — détail du jour (F11 rubriques) ================= */

  function rubriquesActives(){
    return state.config.rubriquesCharges.filter(function(r){ return r.actif; });
  }
  function findRubriqueCharge(id){
    var list = state.config.rubriquesCharges;
    for(var i=0;i<list.length;i++) if(list[i].id === id) return list[i];
    return null;
  }

  function renderDetailChargesJour(){
    var today = todayStr();
    var range = { start: today, end: today };
    var profils = state.config.profils;
    var lignesAuto = [];
    if(profils.coiffure){
      filterRange(state.prestationsCoiffure, range).forEach(function(p){
        var montant = (p.coutMeches||0) + (p.transport||0);
        if(montant > 0) lignesAuto.push({ label: "💇 Coût mèches / transport", montant: montant });
      });
    }
    if(profils.pedicure){
      filterRange(state.prestationsPedicure, range).forEach(function(p){

  function ensureEtatRefs(){
    if(!ui.etatPeriode) ui.etatPeriode = "jour";

    if(!ui.etatMoisRef) ui.etatMoisRef = todayStr();

  function shiftEtatRef(periode, delta){
    if(periode === "semaine"){
      var d = dateFromStr(ui.etatSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;
      if(nouveau > refAujourdhui) nouveau = refAujourdhui;
      ui.etatSemaineRef = nouveau;
    } else if(periode === "mois"){
      var d2 = dateFromStr(ui.etatMoisRef);
      d2.setDate(1);
      d2.setMonth(d2.getMonth() + delta);
      var nouveau2 = dateKey(d2);
      var refAujourdhuiM = getMonthRange(new Date()).start;
      if(nouveau2 > refAujourdhuiM) nouveau2 = refAujourdhuiM;
      ui.etatMoisRef = nouveau2;
    }
  }

  function groupSum(arr, labelFn, valFn){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var lbl = labelFn(x);
      if(lbl === null || lbl === undefined || lbl === "") return;
      if(!(lbl in map)){ map[lbl] = 0; ordre.push(lbl); }
      map[lbl] += Number(valFn(x)) || 0;
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  function groupSumMulti(arr, valuesFn, valFn, labelVide){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var vals = valuesFn(x);
      if(!vals || !vals.length) vals = [labelVide];
      vals.forEach(function(v){
        if(!(v in map)){ map[v] = 0; ordre.push(v); }
        map[v] += Number(valFn(x)) || 0;
      });
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  function renderBreakdownRows(titre, rows){
    if(!rows.length) return "";
    var body = rows.map(function(r){
      return '<div class="eb-row"><div class="eb-nom">' + esc(r.label) + '</div><div class="eb-val">' + formatFCFA(r.montant) + '</div></div>';
    }).join("");
    return '<div class="etat-breakdown"><div class="eb-title">' + esc(titre) + '</div>' + body + '</div>';
  }

  function renderBreakdownProduits(range){
    var produits = state.config.produits;
    if(!produits.length) return "";
    var rows = produits.map(function(p){
      var ventesP = filterRange(state.ventes.filter(function(v){ return v.produitId === p.id; }), range);
      if(!ventesP.length) return null;
      var ca = sumBy(ventesP, function(v){ return v.montantEncaisse; });
      var coutMoyen = computeStockProduit(p).coutMoyen;
      var benefice = sumBy(ventesP, function(v){
        if(v.typeVente === "commande_speciale") return v.montantEncaisse - (v.prixPayeRevendeur||0);
        return v.montantEncaisse - v.quantite * coutMoyen;
      });
      return { nom: p.nom, ca: ca, benefice: benefice };
    }).filter(Boolean).sort(function(a,b){ return b.ca - a.ca; });
    if(!rows.length) return "";
    var body = rows.map(function(r){
      return '<div class="eb-row"><div class="eb-nom">' + esc(r.nom) + '</div>' +
        '<div class="eb-val">' + formatFCFA(r.ca) + ' <span class="eb-sub">(bénéf. ' + formatFCFA(r.benefice) + ')</span></div></div>';
    }).join("");
    return '<div class="etat-breakdown"><div class="eb-title">Par produit — chiffre d’affaires (bénéfice)</div>' + body + '</div>';
  }

  function renderBreakdownsCoiffure(range){

      renderBreakdownRows("Par quartier (prestations à domicile)", groupSum(domicile, function(p){ return p.quartierNom; }, function(p){ return p.mainOeuvre; })) +
      renderBreakdownRows("Par type de coiffure", groupSumMulti(items, function(p){ return p.typesCoiffureNoms; }, function(p){ return p.mainOeuvre; }, "Non précisé")) +
      renderBreakdownRows("Par type de cliente", groupSum(items, function(p){ return p.typeClienteNom; }, function(p){ return p.mainOeuvre; }))
    );
  }
  function renderBreakdownsPedicure(range){

    var tabs = ["jour","semaine","mois"].map(function(p){

    var epargnePeriode = (state.objectifs||[]).length ? computeEpargnePeriodeTousObjectifs(range) : null;

    var statRows = sources.map(function(s){
      return '<div class="etat-stat-row"><div class="er-label">' + s.emoji + ' ' + esc(s.label) + '</div><div class="er-val">' + formatFCFA(s.montant) + '</div></div>';
    }).join("") +
      '<div class="etat-stat-row"><div class="er-label">💸 Charges</div><div class="er-val neg">' + formatFCFA(charges) + '</div></div>' +
      '<div class="etat-stat-row"><div class="er-label">Solde net</div><div class="er-val' + (soldeNet<0?" neg":"") + '">' + formatFCFA(soldeNet) + '</div></div>' +
      (epargnePeriode !== null ? '<div class="etat-stat-row"><div class="er-label">💰 Épargne</div><div class="er-val">' + formatFCFA(epargnePeriode) + '</div></div>' : '');

    var profils = state.config.profils;

    if(profils.coiffure) breakdowns += renderBreakdownsCoiffure(range);

    return (
      '<div class="section-title">Mon état</div>' +
      '<div class="etat-tabs">' + tabs + '</div>' +

      breakdowns

    if(d.mode === "manuel"){
      var montant = toNum(d.montantFixeParJour);
      if(!(montant > 0)){ d.erreurs.montant = "Indiquez un montant supérieur à 0."; render(); return; }
      state.objectifs.push({
        id: uid("obj"), modele: d.modele, sousType: d.sousType||"", nom: nom,
        type:"manuel", montantFixeParJour: montant, pourcentage: null,
        montantCible: 0, dateCreation: todayStr(), actif: true
      });
    } else {
      if(hasObjectifAutoActif(null)){ return; }
      if(!d.scenario){ d.erreurs.scenario = "Choisissez un rythme."; render(); return; }
      var pct = POURCENTAGES_SCENARIO.filter(function(s){ return s.key===d.scenario; })[0].pct;
      state.objectifs.push({
        id: uid("obj"), modele: d.modele, sousType: d.sousType||"", nom: nom,
        type:"auto", montantFixeParJour: null, pourcentage: pct,
        montantCible: 0, dateCreation: todayStr(), actif: true
      });

    saveState();
    ui.objCreating = false;
    ui.objDraft = null;
    render();

  function ensurePartagerRefs(){
    if(!ui.partagerPeriode) ui.partagerPeriode = "jour";
    if(!ui.partagerSemaineRef) ui.partagerSemaineRef = todayStr();
    if(!ui.partagerMoisRef) ui.partagerMoisRef = todayStr();

  function shiftPartagerRef(periode, delta){
    if(periode === "semaine"){
      var d = dateFromStr(ui.partagerSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;
      if(nouveau > refAujourdhui) nouveau = refAujourdhui;
      ui.partagerSemaineRef = nouveau;
    } else if(periode === "mois"){
      var d2 = dateFromStr(ui.partagerMoisRef);
      d2.setDate(1);
      d2.setMonth(d2.getMonth() + delta);
      var nouveau2 = dateKey(d2);
      var refAujourdhuiM = getMonthRange(new Date()).start;
      if(nouveau2 > refAujourdhuiM) nouveau2 = refAujourdhuiM;
      ui.partagerMoisRef = nouveau2;
    }
  }

  // Dessine la carte de synthèse sur le canvas #partager-canvas — appelé après
  // chaque rendu de l'écran Partager (afterRender), jamais pendant le build
  // HTML (le canvas doit déjà être dans le DOM).
  function dessinerCartePartage(){
    var canvas = byId("partager-canvas");
    if(!canvas || !canvas.getContext) return;
    ensurePartagerRefs();
    var periode = ui.partagerPeriode;
    var ref = periode === "semaine" ? dateFromStr(ui.partagerSemaineRef) : periode === "mois" ? dateFromStr(ui.partagerMoisRef) : new Date();
    var range = rangeForPeriode(periode, ref);
    var sources = revenusParSource(range);
    var charges = chargesConsolidees(range);
    var revenuTotal = sumBy(sources, function(s){ return s.montant; });
    var soldeNet = revenuTotal - charges;
    var epargne = (state.objectifs||[]).length ? computeEpargnePeriodeTousObjectifs(range) : 0;
    var periodeLabel = periode === "jour" ? formatDateFr(todayStr()) :
      periode === "semaine" ? (formatDateFr(range.start) + " – " + formatDateFr(range.end)) :
      (moisLabelFor(ref).charAt(0).toUpperCase() + moisLabelFor(ref).slice(1));

    var ctx = canvas.getContext("2d");
    var W = canvas.width, H = canvas.height;
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,"#1b2029"); grad.addColorStop(1,"#11141a");
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#f5a623";
    ctx.font = "700 40px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText("💇💅🛍️ MonDjai / Salon F", W/2, 110);
    ctx.fillStyle = "#9aa3b2";
    ctx.font = "500 30px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText(periodeLabel, W/2, 160);

    ctx.fillStyle = "#9aa3b2";
    ctx.font = "700 26px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText(soldeNet < 0 ? "SOLDE NET (JOUR À PERTE)" : "SOLDE NET", W/2, 260);
    ctx.fillStyle = soldeNet < 0 ? "#ff6b5e" : "#eef1f6";
    ctx.font = "800 96px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText(formatFCFA(soldeNet), W/2, 350);

    var colW = W/3;
    var cols = [
      { label:"Recettes", val: formatFCFA(revenuTotal), color:"#34b37e" },
      { label:"Charges", val: formatFCFA(charges), color:"#ff6b5e" },
      { label:"Épargne", val: formatFCFA(epargne), color:"#f5a623" }
    ];
    cols.forEach(function(c, i){
      var cx = colW*i + colW/2;
      ctx.fillStyle = "#9aa3b2";
      ctx.font = "700 26px -apple-system,Helvetica,Arial,sans-serif";
      ctx.fillText(c.label, cx, 460);
      ctx.fillStyle = c.color;
      ctx.font = "800 40px -apple-system,Helvetica,Arial,sans-serif";
      ctx.fillText(c.val, cx, 510);
    });

    ctx.strokeStyle = "#2a303c"; ctx.beginPath(); ctx.moveTo(70,570); ctx.lineTo(W-70,570); ctx.stroke();

    var y = 630;
    ctx.textAlign = "left";
    ctx.fillStyle = "#eef1f6";
    ctx.font = "700 32px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText("Détail", 70, y);
    y += 50;
    ctx.font = "500 30px -apple-system,Helvetica,Arial,sans-serif";
    var lignes = sources.map(function(s){ return [s.emoji + " " + s.label, formatFCFA(s.montant)]; });
    lignes.push(["💸 Charges", formatFCFA(charges)]);
    lignes.slice(0,7).forEach(function(l){
      ctx.fillStyle = "#9aa3b2"; ctx.textAlign = "left"; ctx.fillText(l[0], 70, y);
      ctx.fillStyle = "#eef1f6"; ctx.textAlign = "right"; ctx.fillText(l[1], W-70, y);
      y += 48;
    });

    ctx.textAlign = "center";
    ctx.fillStyle = "#6b7280";
    ctx.font = "400 22px -apple-system,Helvetica,Arial,sans-serif";
    ctx.fillText("Document informatif, non certifié.", W/2, H-60);
  }

  function canvasVersBlob(callback){
    var canvas = byId("partager-canvas");
    if(!canvas){ callback(null); return; }
    if(canvas.toBlob){ canvas.toBlob(callback, "image/png"); return; }
    // Repli pour les navigateurs sans toBlob (rare) : conversion via dataURL.
    try{
      var dataUrl = canvas.toDataURL("image/png");
      var bstr = atob(dataUrl.split(",")[1]), n = bstr.length, u8 = new Uint8Array(n);
      while(n--) u8[n] = bstr.charCodeAt(n);
      callback(new Blob([u8], { type:"image/png" }));
    }catch(e){ callback(null); }
  }

  function nomFichierPartage(){
    return "mondjai-salonf-" + ui.partagerPeriode + "-" + todayStr() + ".png";
  }

  function telechargerImagePartage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nomFichierPartage();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    });
  }

  function partagerImagePartage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var fichier;
      try{ fichier = new File([blob], nomFichierPartage(), { type:"image/png" }); }catch(e){ fichier = null; }
      if(fichier && navigator.share && navigator.canShare && navigator.canShare({ files:[fichier] })){
        navigator.share({ files:[fichier], title:"MonDjai/Salon F" }).catch(function(){});
      } else {
        telechargerImagePartage();
      }
    });
  }

  function openModal(type, extra){
    ui.modal = merge({ type:type }, extra || {});

  }
  function closeModal(){
    if(ui.modalReturnTo){
      var back = ui.modalReturnTo;
      ui.modalReturnTo = null;
      openModal(back);
      return;
    }
    ui.modal = null;
    ui.draft = {};

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    // Fermeture de la modale en cliquant sur l'overlay (mais pas sur son contenu)
    if(action === "fermer-modal-overlay"){
      if(e.target.closest("[data-stop-close]")) return;
      closeModal();
      return;
    }
    if(action === "fermer-modal"){ closeModal(); return; }

    switch(action){
      case "toggle-onboarding": {
        var k = el.getAttribute("data-key");
        ui.onboardingSel[k] = !ui.onboardingSel[k];
        ui.onboardingMsg = "";
        render();
        return;
      }
      case "onboarding-continuer": {
        var any = ui.onboardingSel.coiffure || ui.onboardingSel.pedicure || ui.onboardingSel.revente;
        if(!any){
          ui.onboardingMsg = "Choisissez au moins un profil pour continuer.";
          render();
          return;
        }
        state.config.profils = {
          coiffure: !!ui.onboardingSel.coiffure,
          pedicure: !!ui.onboardingSel.pedicure,
          revente: !!ui.onboardingSel.revente
        };
        state.config.onboardingComplete = true;
        saveState();
        ensureValidTab();
        render();
        return;
      }
      case "ouvrir-reglages": ui.overlay = "reglages"; ui.reglagesMsg = ""; render(); return;
      case "fermer-overlay": ui.overlay = null; ui.objCreating = false; ui.objDraft = null; render(); return;
      case "ouvrir-apropos": ui.overlay = "apropos"; render(); return;
      case "fermer-apropos": ui.overlay = "reglages"; render(); return;
      case "toggle-profil-reglages": {
        var key = el.getAttribute("data-key");
        var current = state.config.profils;
        var activesCount = (current.coiffure?1:0)+(current.pedicure?1:0)+(current.revente?1:0);
        if(current[key] && activesCount <= 1){
          ui.reglagesMsg = "Gardez au moins un profil actif.";
          render();
          return;
        }
        current[key] = !current[key];
        ui.reglagesMsg = "";
        saveState();
        ensureValidTab();
        render();
        return;
      }

      case "ouvrir-objectif": ui.overlay = "objectif"; render(); return;
      case "ouvrir-partager": ui.overlay = "partager"; ensurePartagerRefs(); render(); return;

      case "commencer-creation-objectif": ui.objCreating = true; ui.objDraft = { step:"modele" }; render(); return;
      case "annuler-creation-objectif": ui.objCreating = false; ui.objDraft = null; render(); return;
      case "choisir-modele-objectif": ui.objDraft.modele = el.getAttribute("data-id"); ui.objDraft.erreur = ""; render(); return;
      case "obj-etape-mode": {
        if(!ui.objDraft.modele){ ui.objDraft.erreur = "Choisissez un modèle pour continuer."; render(); return; }
        ui.objDraft.step = "mode"; render(); return;
      }
      case "obj-etape-modele": ui.objDraft.step = "modele"; render(); return;
      case "choisir-mode-objectif": {
        var mval = el.getAttribute("data-val");
        if(mval === "auto" && hasObjectifAutoActif(null)) return;
        ui.objDraft.mode = mval; ui.objDraft.erreur = ""; render(); return;
      }
      case "obj-etape-details": {
        if(!ui.objDraft.mode){ ui.objDraft.erreur = "Choisissez Manuel ou Automatique."; render(); return; }
        ui.objDraft.step = "details"; render(); return;
      }
      case "obj-jours-delta": {
        var delta = parseInt(el.getAttribute("data-delta"),10);
        var cur = ui.objDraft.joursRoules || state.config.joursRoulesParSemaine || 6;
        ui.objDraft.joursRoules = Math.max(1, Math.min(7, cur + delta));
        render();
