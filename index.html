    var blocks =
      fondsTile +
      '<button type="button" class="dash-block info" style="color:var(--text);" data-action="voir-jour-champ" data-champ="transport">' +
        '<div class="db-emoji">🚗</div><div class="db-amount">' + formatFCFA(transport) + '</div><div class="db-label">Transport</div>' +
      '</button>' +
      '<button type="button" class="dash-block info" style="color:var(--text);" data-action="voir-jour-champ" data-champ="meche">' +
        '<div class="db-emoji"><img class="meche-icon-img" src="' + MECHE_ICON_DATA + '" alt="Mèche" width="40" height="40"></div><div class="db-amount">' + formatFCFA(meche) + '</div><div class="db-label">Mèche</div>' +
      '</button>' +
      '<button type="button" class="dash-block" style="color:var(--text);" data-action="ouvrir-objectif">' +
        '<div class="db-emoji">' + esc(epargneEmoji()) + '</div><div class="db-amount"' + (state.objectifEpargne && !epargneSalonReglee() ? ' style="font-size:17px;"' : '') + '>' + esc(valeurEpargneSalon()) + '</div><div class="db-label">Épargne du mois</div>' +
      '</button>';

    return (
      '<div class="section-title">Aujourd’hui · ' + formatDateFr(today) + '</div>' +
      recetteCard +
      repriseBanner +
      renderJaugeCard(cle, true) +
      '<div class="dash-grid">' + blocks + '</div>' +
      (sf.configure && sf.solde < 0 ? renderAlerteFonds(sf) : '')
    );
  }

  // Jauge « Charges et fonds du mois à couvrir » (amendement, section 4).
  function renderJaugeCard(cle, cliquable){
    var j = jaugeMois(cle);
    var corps;
    if(j.aCouvrir <= 0){
      corps =
        '<div class="jauge-row"><div class="jauge-amount">0 F</div></div>' +
        '<div class="jauge-foot">Aucune charge ni fonds prévu pour ' + esc(nomMoisSeul(cle)) + ' pour l’instant.</div>';
    } else {
      var ok = j.couvert;
      corps =
        '<div class="jauge-row"><div class="jauge-amount">' + formatFCFA(j.aCouvrir) + '</div>' +
          '<div class="jauge-pct' + (ok ? " ok" : "") + '">couvert à ' + j.pct + ' %</div></div>' +
        '<div class="jauge-bar"><div class="jauge-fill' + (ok ? " ok" : "") + '" style="width:' + j.pct + '%"></div></div>' +
        '<div class="jauge-foot">Recettes du mois : ' + formatFCFA(j.recettes) +
          (ok ? ' — charges et fonds couverts.' : ' · encore ' + formatFCFA(j.reste) + ' à couvrir.') + '</div>';
    }
    var head = '<div class="jauge-head">Charges et fonds du mois à couvrir</div>';
    if(cliquable){
      return '<button type="button" class="jauge-card" data-action="voir-charges-mois">' + head + corps +
        '<div class="jauge-link">Voir et ajouter les charges du mois ›</div></button>';
    }
    return '<div class="jauge-card">' + head + corps + '</div>';
  }

  function renderAlerteFonds(sf){
    return '<div class="alerte-douce">🧴 Le fonds produits est à découvert de ' + formatFCFA(Math.abs(sf.solde)) +
      ' : les achats ont dépassé la prévision. Rien n’est bloqué — vous pouvez ajuster la prévision dans Réglages.</div>';
  }

  function libelleTypeCredit(t){ return t === "personne" ? "Personne (apport)" : "Banque"; }
  function sousTitreCredit(credit){
    var s = libelleTypeCredit(credit.type) + (credit.preteur ? " · " + credit.preteur : "");
    return s + " · depuis le " + formatDateFr(credit.dateDebut);
  }
  // Bilan léger (amendement, section 5) : Remboursé X · Reste dû Y · barre ;
  // sans montant total saisi, seul « Remboursé à ce jour » apparaît.
  function renderBilanCreditHtml(credit){
    var b = bilanCredit(credit);
    if(b.total === null){
      return '<div class="credit-bilan"><div class="cb-line"><span>Remboursé à ce jour</span><b>' + formatFCFA(b.rembourse) + '</b></div></div>';
    }
    return (
      '<div class="credit-bilan">' +
        '<div class="cb-line"><span>Remboursé <b>' + formatFCFA(b.rembourse) + '</b></span>' +
          (b.solde ? '<b style="color:var(--green);">Soldé ✓</b>' : '<span>Reste dû <b>' + formatFCFA(b.resteDu) + '</b></span>') +
        '</div>' +
        '<div class="jauge-bar"><div class="jauge-fill ok" style="width:' + b.pct + '%"></div></div>' +
      '</div>'
    );
  }

  // Fenêtre « Fonds de renouvellement » (tuile Fonds produits d’Aujourd’hui).
  function renderFondsDetailModal(){
    var cle = moisCourantCle();
    var sf = soldeFonds();
    if(!sf.configure){
      return (
        '<div class="hint" style="margin-bottom:14px;">Aucun fonds de renouvellement réglé. Prévoyez chaque mois un montant fixe ou un pourcentage des recettes : il est déduit du résultat net, et vos achats de produits sont payés par ce fonds au lieu d’être comptés deux fois.</div>' +
        '<button type="button" class="btn btn-primary" data-action="ouvrir-reglages-fonds">Régler le fonds</button>'
      );
    }
    var v = versionFondsPourMois(cle);
    var actif = fondsActifPourMois(cle);
    var modeTxt = !actif ? "fonds arrêté" : (v.mode === "pourcentage" ? (v.valeur + " % des recettes") : "montant fixe");
    var rows =
      drow("Prévision " + deMois(nomMoisSeul(cle)), formatFCFA(previsionFondsMois(cle)) + ' <span style="color:var(--text-dim); font-weight:600;">(' + esc(modeTxt) + ')</span>') +
      drow("Achats produits coiffure ce mois", formatFCFA(achatsProduitsMois(cle, "produits_coiffure"))) +
      drow("Achats produits onglerie ce mois", formatFCFA(achatsProduitsMois(cle, "produits_onglerie"))) +
      drow("Prévisions cumulées", formatFCFA(sf.previsions)) +
      drow("Achats payés par le fonds", formatFCFA(sf.achats)) +
      drow("Solde du fonds", '<span style="color:' + (sf.solde < 0 ? "var(--red)" : "var(--green)") + ';">' + formatFCFA(sf.solde) + '</span>');
    return (
      '<div>' + rows + '</div>' +
      (!actif ? '<div class="alerte-douce">Fonds arrêté : ce mois-ci, les achats de produits comptent comme des charges du mois.</div>' : '') +
      (sf.solde < 0 ? renderAlerteFonds(sf) : '') +
      '<div class="btn-row">' +
        '<button type="button" class="btn btn-secondary" data-action="ouvrir-reglages-fonds">Régler le fonds</button>' +
        '<button type="button" class="btn btn-primary" data-action="add-achat-produits">+ Achat de produits</button>' +
      '</div>'
    );
  }

  // Fenêtre « Charges du mois » (mode Salon) : reprise du mois précédent,
  // jauge, charges saisies pour le mois en cours, ajout.
  function renderChargesMoisModal(){
    var cle = moisCourantCle();
    var reprises = reprisesEnAttente(cle);
    var html = "";
    if(reprises.length){
      var prec = reprises[0].moisPrecedent;
      html +=
        '<div class="reglages-section" style="margin-bottom:16px;">' +
          '<div class="rs-title">À reprendre ' + esc(deMois(nomMoisSeul(prec))) + '</div>' +
          '<div class="hint tight" style="margin-bottom:10px;">Même montant que le mois dernier : confirmez, modifiez (CIE et SODECI varient) ou ignorez.</div>' +
          reprises.map(function(p){
            var id = p.rubrique.id;
            var val = (ui.repriseDraft[id] !== undefined) ? ui.repriseDraft[id] : String(p.montant);
            return (
              '<div class="reprise-row">' +
                '<div class="rr-head"><span>' + esc(p.rubrique.emoji || "📝") + '</span><span class="rr-nom">' + esc(p.rubrique.nom) + '</span>' +
                  '<span class="rr-prev">' + esc(nomMoisSeul(prec)) + ' : ' + formatFCFA(p.montant) + '</span></div>' +
                '<div class="rr-actions">' +
                  '<input type="number" inputmode="numeric" min="0" step="1" class="input" id="f-reprise-' + esc(id) + '" value="' + esc(val) + '" data-action-change="capture-reprise" data-id="' + esc(id) + '" aria-label="Montant pour ' + esc(nomMoisSeul(cle)) + '">' +
                  '<button type="button" class="btn btn-primary" data-action="reprise-confirmer" data-id="' + esc(id) + '">Confirmer</button>' +
                  '<button type="button" class="btn btn-secondary" data-action="reprise-ignorer" data-id="' + esc(id) + '">Ignorer</button>' +
                '</div>' +
                fieldErr("reprise-" + id) +
              '</div>'
            );
          }).join("") +
          (reprises.length > 1 ? '<button type="button" class="btn btn-secondary" data-action="reprise-tout-confirmer">✓ Tout confirmer</button>' : '') +
        '</div>';
    }
    html += renderJaugeCard(cle, false);
    var actifFonds = fondsActifPourMois(cle);
    var items = chargesDuMois(cle).slice().sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    html += '<div class="reglages-section"><div class="rs-title">Charges saisies pour ' + esc(nomMoisSeul(cle)) + '</div>' +
      (items.length ? items.map(function(c){
        var produitsFonds = actifFonds && estTypeProduits(typeDeCharge(c));
        var sub = "Saisie le " + formatDateFr(c.date) + (c.note ? " · " + c.note : "");
        return (
          '<button type="button" class="entry-card" style="width:100%; margin-bottom:8px;" data-action="voir-charge-mois" data-id="' + esc(c.id) + '">' +
            '<div class="entry-ico">' + esc(c.rubriqueEmoji || "📝") + '</div>' +
            '<div class="entry-main"><div class="entry-title">' + esc(c.rubriqueNom) + (produitsFonds ? '<span class="tag-fonds">fonds</span>' : '') + '</div>' +
              '<div class="entry-sub">' + esc(sub) + '</div></div>' +
            '<div class="entry-amount">' + formatFCFA(c.montant) + '</div>' +
          '</button>'
        );
      }).join("") : '<div class="hint tight">Aucune charge saisie pour ' + esc(nomMoisSeul(cle)) + ' pour l’instant.</div>') +
      '<button type="button" class="btn btn-secondary" style="margin-top:8px;" data-action="add-autre-charge">+ Ajouter une charge</button>' +
      '<div class="hint tight" style="margin-top:10px;">Les charges sont déduites du résultat net du mois, jamais au jour le jour. Les achats de produits marqués « fonds » sont payés par le fonds de renouvellement.</div>' +
    '</div>';
    return html;
  }

  /* ================= Formulaire F5 : Prestations coiffure ================= */

  function optionsFor(name, selectedId){
    var list = findList(name);
    var opts = list.map(function(it){
      return '<option value="' + it.id + '"' + (it.id===selectedId?" selected":"") + '>' + esc(it.nom) + '</option>';
    }).join("");
    opts += '<option value="__new__"' + (selectedId==="__new__"?" selected":"") + '>+ Autre…</option>';
    return opts;
  }
  function fieldErr(key){
    return ui.errors[key] ? '<div class="field-error">' + esc(ui.errors[key]) + '</div>' : "";
  }
  function captureDraft(fieldIds){
    fieldIds.forEach(function(id){
      var el = byId(id);
      if(el) ui.draft[id] = el.value;
    });
  }

  function renderChampLieu(lieu){
    return (
      '<div class="field"><div class="label">Lieu de la prestation <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (lieu==="domicile"?" active":"") + '" data-action="set-lieu-coiffure" data-val="domicile">🏠 À domicile</button>' +
          '<button type="button" class="radio-opt' + (lieu==="salon"?" active":"") + '" data-action="set-lieu-coiffure" data-val="salon">💈 En salon</button>' +
        '</div>' +
      '</div>'
    );
  }

  // Sprint 8B (amendement, section 8) : en mode Salon, menu « Activité »
  // en tête du formulaire. Onglerie = activité, montant et date, rien d'autre.
  function activiteBrouillon(){ return (estModeSalon() && ui.draft["f-activite"] === "onglerie") ? "onglerie" : "coiffure"; }
  function renderChampActivite(act){
    return (
      '<div class="field"><div class="label">Activité <span class="req">*</span></div>' +
        '<div class="radio-row">' +
          '<button type="button" class="radio-opt' + (act==="coiffure"?" active":"") + '" data-action="set-activite" data-val="coiffure">💇 Coiffure</button>' +
          '<button type="button" class="radio-opt' + (act==="onglerie"?" active":"") + '" data-action="set-activite" data-val="onglerie">💅 Onglerie</button>' +
        '</div>' +
      '</div>'
    );
  }
  function renderFormOnglerie(){
    var d = ui.draft;
    return (
      '<div>' +
        renderChampActivite("onglerie") +
        '<div class="field"><div class="label">Montant (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-montantOnglerie" value="' + esc(d["f-montantOnglerie"]||"") + '" data-action-change="capture-coiffure">' +
          fieldErr("montantOnglerie") +
        '</div>' +
        '<div class="field"><div class="label">Date <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-coiffure">' +
          fieldErr("date") +
        '</div>' +
        '<button type="button" class="btn btn-primary" data-action="enregistrer-coiffure">Enregistrer</button>' +
      '</div>'
    );
  }
  function enregistrerOnglerie(){
    captureDraft(COIFFURE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var date = d["f-date"] || todayStr();
    var montant = toNum(d["f-montantOnglerie"]);
    if(!date) errors.date = "Choisissez une date.";
    if(!(montant > 0) || !d["f-montantOnglerie"]) errors.montantOnglerie = "Indiquez le montant de la prestation.";
    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }
    state.prestationsCoiffure.push({
      id: uid("ongl"), date: date, activite: "onglerie", lieu: "salon",
      typeClienteId: null, typeClienteNom: null, quartierId: null, quartierNom: null,
      typesCoiffureIds: [], typesCoiffureNoms: [],
      mainOeuvre: montant, coutMeches: 0, transport: 0, ts: Date.now()
    });
    saveState();
    closeModal();
  }

  function renderFormCoiffure(){
    if(activiteBrouillon() === "onglerie") return renderFormOnglerie();
    var d = ui.draft;
    var clienteSel = d["f-clienteSel"] || "";
    var quartierSel = d["f-quartierSel"] || "";
    var typesSel = d.typesCoiffureSel || [];
    var showNouveauType = !!d.showNouveauTypeCoiffure;
    // Sprint 8A : en mode Salon, la prestation est par défaut « En salon » ;
    // « À domicile » reste possible (quartier, transport — amendement,
    // section 2). En mode À domicile, défaut inchangé.
    var lieu = d["f-lieu"] || lieuParDefaut();
    var chips = state.config.typesCoiffure.map(function(t){
      var active = typesSel.indexOf(t.id) !== -1;
      return '<button type="button" class="chip' + (active?" active":"") + '" data-action="toggle-coiffure-type" data-id="' + t.id + '">' + esc(t.nom) + '</button>';
    }).join("");
    chips += '<button type="button" class="chip dashed" data-action="toggle-nouveau-type-coiffure">+ Personnalisé</button>';

    return (
      '<div>' +
        (estModeSalon() ? renderChampActivite("coiffure") : '') +
        '<div class="field"><div class="label">Date de la prestation <span class="req">*</span></div>' +
          '<input type="date" class="input" id="f-date" max="' + todayStr() + '" value="' + esc(d["f-date"] || todayStr()) + '" data-action-change="capture-coiffure">' +
          fieldErr("date") +
        '</div>' +
        '<div class="field"><div class="label">Type de cliente <span class="req">*</span></div>' +
          '<select class="select" id="f-clienteSel" data-action-change="cliente-change">' + optionsFor("typesCliente", clienteSel) + '</select>' +
          (clienteSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-clienteNouveauNom" placeholder="Nouveau type de cliente" value="' + esc(d["f-clienteNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("cliente") +
        '</div>' +
        renderChampLieu(lieu) +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Quartier <span class="req">*</span></div>' +
          '<select class="select" id="f-quartierSel" data-action-change="quartier-change">' + optionsFor("quartiers", quartierSel) + '</select>' +
          (quartierSel==="__new__" ? '<div class="inline-new"><input type="text" class="input" id="f-quartierNouveauNom" placeholder="Nom du quartier" value="' + esc(d["f-quartierNouveauNom"]||"") + '" data-autofocus data-action-change="capture-coiffure"></div>' : '') +
          fieldErr("quartier") +
        '</div>' : '') +
        '<div class="field"><div class="label">Type(s) de coiffure</div>' +
          '<div class="chip-wrap">' + chips + '</div>' +
          (showNouveauType ? '<div class="inline-new"><input type="text" class="input" id="f-nouveauTypeCoiffure" placeholder="Ex. Vanilles" value="' + esc(d["f-nouveauTypeCoiffure"]||"") + '" data-autofocus data-action-change="capture-coiffure">' +
            '<button type="button" class="btn btn-secondary" data-action="ajouter-type-coiffure">Ajouter</button></div>' : '') +
        '</div>' +
        '<div class="field"><div class="label">Main d’œuvre gardée (FCFA) <span class="req">*</span></div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-mainOeuvre" value="' + esc(d["f-mainOeuvre"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">' + (estModeSalon() ? "Recette du salon pour cette prestation (hors mèche et transport)." : "Ce que vous gardez réellement pour vous.") + '</div>' +
          fieldErr("mainOeuvre") +
        '</div>' +
        '<div class="field"><div class="label">Coût des mèches (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-coutMeches" placeholder="0" value="' + esc(d["f-coutMeches"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' +
        (lieu === "domicile" ?
        '<div class="field"><div class="label">Transport (FCFA)</div>' +
          '<input type="number" inputmode="numeric" step="1" min="0" class="input" id="f-transport" placeholder="0" value="' + esc(d["f-transport"]||"") + '" data-action-change="capture-coiffure">' +
          '<div class="field-note">Payé par la cliente — enregistré pour information, jamais compté comme une charge.</div>' +
        '</div>' : '') +
        '<button type="button" class="btn btn-primary" data-action="enregistrer-coiffure">Enregistrer</button>' +
      '</div>'
    );
  }

  function lieuParDefaut(){ return estModeSalon() ? "salon" : "domicile"; }

  var COIFFURE_FIELDS = ["f-date","f-clienteSel","f-clienteNouveauNom","f-quartierSel","f-quartierNouveauNom","f-nouveauTypeCoiffure","f-mainOeuvre","f-coutMeches","f-transport","f-montantOnglerie"];

  function enregistrerCoiffure(){
    if(activiteBrouillon() === "onglerie"){ enregistrerOnglerie(); return; }
    captureDraft(COIFFURE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var date = d["f-date"] || todayStr();
    var lieu = ((d["f-lieu"] || lieuParDefaut()) === "salon") ? "salon" : "domicile";
    var clienteSel = d["f-clienteSel"];
    var clienteNouveauNom = (d["f-clienteNouveauNom"]||"").trim();
    var quartierSel = d["f-quartierSel"];
    var quartierNouveauNom = (d["f-quartierNouveauNom"]||"").trim();
    var mainOeuvre = toNum(d["f-mainOeuvre"]);
    var coutMeches = toNum(d["f-coutMeches"]);
    var transport = lieu === "domicile" ? toNum(d["f-transport"]) : 0;

    if(!date) errors.date = "Choisissez une date.";
    if(!clienteSel || (clienteSel==="__new__" && !clienteNouveauNom)) errors.cliente = "Choisissez ou précisez le type de cliente.";
    if(lieu === "domicile" && (!quartierSel || (quartierSel==="__new__" && !quartierNouveauNom))) errors.quartier = "Choisissez ou précisez le quartier.";
    if(!(mainOeuvre >= 0) || d["f-mainOeuvre"]==="") errors.mainOeuvre = "Indiquez la main d’œuvre gardée.";

    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }

    var cliente = clienteSel === "__new__" ? addPerso("typesCliente", clienteNouveauNom) : findById("typesCliente", clienteSel);
    var quartier = lieu === "domicile" ? (quartierSel === "__new__" ? addPerso("quartiers", quartierNouveauNom) : findById("quartiers", quartierSel)) : null;
    var typesIds = d.typesCoiffureSel || [];
    var typesNoms = typesIds.map(function(id){ var it = findById("typesCoiffure", id); return it ? it.nom : null; }).filter(Boolean);

    var prestation = {
      id: uid("coif"), date: date, lieu: lieu,
      typeClienteId: cliente ? cliente.id : null, typeClienteNom: cliente ? cliente.nom : clienteNouveauNom,
      quartierId: quartier ? quartier.id : null, quartierNom: lieu === "domicile" ? (quartier ? quartier.nom : quartierNouveauNom) : null,
      typesCoiffureIds: typesIds, typesCoiffureNoms: typesNoms,
      mainOeuvre: mainOeuvre, coutMeches: coutMeches, transport: transport, ts: Date.now()
    };
    // Sprint 8B : activité explicite pour les prestations saisies en mode
    // Salon (en mode À domicile, enregistrement strictement identique au 7bis).
    if(estModeSalon()) prestation.activite = "coiffure";
    state.prestationsCoiffure.push(prestation);
    saveState();
    closeModal();
  }

  /* ================= Listes / détails de prestations ================= */

  // Sprint 8B : carte d'une prestation d'onglerie (montant et date seulement).
  function renderCarteOnglerie(p, action, avecDate){
    return (
      '<button type="button" class="entry-card" data-action="' + action + '" data-id="' + p.id + '">' +
        '<div class="entry-ico">💅</div>' +
        '<div class="entry-main">' +
          '<div class="entry-title">Onglerie</div>' +
          '<div class="entry-sub">' + (avecDate ? formatDateFr(p.date) + ' · ' : '') + 'Prestation d’onglerie</div>' +
        '</div>' +
        '<div class="entry-amount">' + formatFCFA(p.mainOeuvre) + '</div>' +
      '</button>'
    );
  }

  function renderCarteCoiffure(p){
    if(activiteDe(p) === "onglerie") return renderCarteOnglerie(p, "voir-coiffure", true);
    var types = (p.typesCoiffureNoms||[]).join(", ") || "Type non précisé";
    var lieuTxt = p.lieu === "salon" ? "💈 En salon" : esc(p.quartierNom);
    return (
      '<button type="button" class="entry-card" data-action="voir-coiffure" data-id="' + p.id + '">' +
        '<div class="entry-ico">💇</div>' +
        '<div class="entry-main">' +
          '<div class="entry-title">' + esc(p.typeClienteNom) + ' · ' + lieuTxt + '</div>' +
          '<div class="entry-sub">' + formatDateFr(p.date) + ' · ' + esc(types) + '</div>' +
        '</div>' +
        '<div class="entry-amount">' + formatFCFA(p.mainOeuvre) + '</div>' +
      '</button>'
    );
  }

  // Sprint 8B : `activite` facultatif — filtre la liste (vues Coiffure /
  // Onglerie de Mon état). Sans filtre, comportement inchangé.
  function renderListePrestationsRange(range, videEmoji, videTitre, videDesc, activite){
    var items = sortByDateDesc(filterRange(state.prestationsCoiffure, range));
    if(activite) items = items.filter(function(p){ return activiteDe(p) === activite; });
    if(!items.length) return emptyState(videEmoji, videTitre, videDesc);
    return '<div class="entry-list">' + items.map(renderCarteCoiffure).join("") + '</div>';
  }

  function drow(k,v){ return '<div class="detail-row"><div class="dk">' + esc(k) + '</div><div class="dv">' + v + '</div></div>'; }

  function detailShell(rowsHtml, kind, id){
    var confirming = ui.modal.confirmDelete;
    return (
      '<div>' + rowsHtml +
      (confirming ?
        '<div class="confirm-box"><p>Supprimer cet enregistrement ? Cette action est définitive.</p>' +
          '<div class="btn-row">' +
            '<button type="button" class="btn btn-secondary" data-action="annuler-suppression">Annuler</button>' +

  // Blocs Transport / Mèche d'Aujourd'hui : depuis ce sprint, plus la liste
  // complète — seul le montant du jour lié au champ concerné, en liste
  // compacte avec le total en tête (confirmé au cahier des charges, section 3).
  function renderJourChampModal(champ){
    var today = todayStr();
    var estTransport = champ === "transport";
    var items = state.prestationsCoiffure.filter(function(p){
      return p.date === today && (estTransport ? (p.transport||0) > 0 : (p.coutMeches||0) > 0);
    });
    items = sortByDateDesc(items);
    var total = sumBy(items, function(p){ return estTransport ? (p.transport||0) : (p.coutMeches||0); });

    var icoChamp = estTransport ? "🚗" : ('<img class="meche-icon-img" src="' + MECHE_ICON_DATA + '" alt="Mèche" width="22" height="22">');
    if(!items.length){
      return (
        '<div class="hint tight" style="margin-bottom:10px;">Aucun montant ' + (estTransport?"transport":"mèche") + ' enregistré aujourd’hui.</div>'
      );
    }
    var total_row = '<div class="etat-stat-row" style="margin-bottom:10px; border-color:var(--accent);"><div class="er-label">Total ' + titreChamp.toLowerCase() + ' du jour</div><div class="er-val">' + formatFCFA(total) + '</div></div>';
    var rows = items.map(function(p){
      return (
        '<div class="entry-card">' +
          '<div class="entry-ico">' + icoChamp + '</div>' +
          '<div class="entry-main"><div class="entry-title">' + esc(p.typeClienteNom) + '</div></div>' +
          '<div class="entry-amount">' + formatFCFA(estTransport ? (p.transport||0) : (p.coutMeches||0)) + '</div>' +
        '</div>'
      );
    }).join("");
    return total_row + '<div class="entry-list">' + rows + '</div>';

  /* ================= Autres charges (rubriques, F11) ================= */

  // Sprint 8A : rubriques actives du mode en cours. En mode À domicile, la

  function optionsMoisConcerne(cle){
    // Mois précédent (facture arrivée en retard), mois en cours (défaut), mois suivant (paiement d'avance).

  function enregistrerChargeSalon(){
    captureDraft(CHARGE_FIELDS);
    var d = ui.draft;
    var errors = {};
    var cle = moisCourantCle();
    var rubrique = d["f-rubrique"] ? findRubriqueCharge(d["f-rubrique"]) : null;
    var montant = toNum(d["f-montantAutreCharge"]);
    var mois = d["f-moisConcerne"] || cle;
    if(optionsMoisConcerne(cle).indexOf(mois) === -1) mois = cle;
    if(!rubrique) errors.rubrique = "Choisissez une rubrique.";
    if(!(montant > 0) || d["f-montantAutreCharge"]==="") errors.montant = "Indiquez un montant supérieur à 0.";
    var type = typeDeRubrique(rubrique);
    var nouveauCredit = !!(rubrique && type === "credit" && !findCredit(rubrique.id));
    if(nouveauCredit && d["f-creditType"] !== "banque" && d["f-creditType"] !== "personne"){
      errors.creditType = "Précisez le type de prêteur.";
    }
    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }

    var maintenant = Date.now();
    if(nouveauCredit){
      var total = toNum(d["f-creditTotal"]);
      state.config.credits.push({
        id: uid("cred"), rubriqueId: rubrique.id, type: d["f-creditType"],
        preteur: String(d["f-creditPreteur"]||"").trim(),
        montantTotal: total > 0 ? Math.round(total) : null,
        dateDebut: todayStr(), tsDebut: maintenant
      });
    }
    var charge = {
      id: uid("acharge"), date: todayStr(), moisConcerne: mois,
      rubriqueId: rubrique.id, rubriqueNom: rubrique.nom, rubriqueEmoji: rubrique.emoji, rubriqueType: type,
      montant: montant, ts: maintenant
    };
    var note = String(d["f-noteCharge"]||"").trim();
    if(note) charge.note = note;
    state.autresCharges.push(charge);
    saveState();
    closeModal();
  }

  /* ================= F8 : Mon état (solde net → prestations → Main d’œuvre/Épargne) ================= */

  var MOIS_NOMS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  function moisLabelFor(d){ return MOIS_NOMS[d.getMonth()] + " " + d.getFullYear(); }

  function ensureEtatRefs(){
    if(!ui.etatSemaineRef) ui.etatSemaineRef = todayStr();
    if(!ui.etatMoisRef) ui.etatMoisRef = todayStr();
  }
  function shiftRef(refName, delta){
    if(refName === "semaine"){
      var d = dateFromStr(ui.etatSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;
      if(nouveau > refAujourdhui) nouveau = refAujourdhui;
      var refPlusAncienne = earliestActivityWeekStart();
      if(nouveau < refPlusAncienne) nouveau = refPlusAncienne;
      ui.etatSemaineRef = nouveau;
    } else if(refName === "mois"){
      var d2 = dateFromStr(ui.etatMoisRef);
      d2.setDate(1);
      d2.setMonth(d2.getMonth() + delta);
      var nouveau2 = dateKey(d2);
      var refAujourdhuiM = getMonthRange(new Date()).start;
      if(nouveau2 > refAujourdhuiM) nouveau2 = refAujourdhuiM;
      var refPlusAncienM = earliestActivityMonthStart();
      if(nouveau2 < refPlusAncienM) nouveau2 = refPlusAncienM;
      ui.etatMoisRef = nouveau2;
    }
  }

  function renderEtatBack(){
    return '<button type="button" class="btn btn-ghost" style="padding:8px 0; margin-bottom:6px;" data-action="etat-back">‹ Retour</button>';
  }
  function renderEtatSemaineNav(){
    var range = getWeekRange(dateFromStr(ui.etatSemaineRef));
    var label = formatDateFr(range.start) + " – " + formatDateFr(range.end);
    var estActuelle = ui.etatSemaineRef >= getWeekRange(new Date()).start;
    var estPlusAncienne = ui.etatSemaineRef <= earliestActivityWeekStart();
    return (
      '<div class="etat-nav">' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="-1" data-periode="semaine"' + (estPlusAncienne?" disabled":"") + '>‹</button>' +
        '<div class="en-label">' + esc(label) + '</div>' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="1" data-periode="semaine"' + (estActuelle?" disabled":"") + '>›</button>' +
      '</div>'
    );
  }
  function renderEtatMoisNav(){
    var ref = dateFromStr(ui.etatMoisRef);
    var label = moisLabelFor(ref).charAt(0).toUpperCase() + moisLabelFor(ref).slice(1);
    var estActuelle = ui.etatMoisRef >= getMonthRange(new Date()).start;
    var estPlusAncien = ui.etatMoisRef <= earliestActivityMonthStart();
    return (
      '<div class="etat-nav">' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="-1" data-periode="mois"' + (estPlusAncien?" disabled":"") + '>‹</button>' +
        '<div class="en-label">' + esc(label) + '</div>' +
        '<button type="button" class="en-btn" data-action="etat-nav" data-sens="1" data-periode="mois"' + (estActuelle?" disabled":"") + '>›</button>' +
      '</div>'
    );
  }

  var JOURS_NOMS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function renderEtatListeJours(range, from){
    var jours = [];
    var d = dateFromStr(range.start);
    var end = dateFromStr(range.end);
    while(dateKey(d) <= dateKey(end)){
      jours.push(dateKey(d));
      d.setDate(d.getDate()+1);
    }
    var today = todayStr();
    var rows = jours.map(function(ds){
      var dd = dateFromStr(ds);
      var label = JOURS_NOMS[dd.getDay()].charAt(0).toUpperCase() + JOURS_NOMS[dd.getDay()].slice(1) + " " + formatDateFr(ds);
      if(ds > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }
      var solde = valeurListePeriode({ start:ds, end:ds });
      return (
        '<button type="button" class="entry-card" style="width:100%; text-align:left;" data-action="etat-select-jour" data-date="' + ds + '" data-from="' + from + '">' +
          '<div class="entry-main"><div class="entry-title">' + esc(label) + '</div></div>' +
          '<div class="entry-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        '</button>'
      );
    }).join("");
    return '<div class="entry-list">' + rows + '</div>';
  }

  function renderEtatListeSemaines(monthRange){
    var firstWeekStart = getWeekRange(dateFromStr(monthRange.start)).start;
    var lastWeekStart = getWeekRange(dateFromStr(monthRange.end)).start;
    var semaines = [];
    var cur = firstWeekStart;
    while(cur <= lastWeekStart){
      semaines.push(cur);
      var d = dateFromStr(cur); d.setDate(d.getDate()+7);
      cur = dateKey(d);
    }
    var today = todayStr();
    var rows = semaines.map(function(ws){
      var range = getWeekRange(dateFromStr(ws));
      var label = formatDateFr(range.start) + " – " + formatDateFr(range.end);
      if(range.start > today){
        return '<div class="etat-stat-row" style="opacity:.4;"><div class="er-label">' + esc(label) + '</div><div class="er-val">—</div></div>';
      }
      var solde = valeurListePeriode(range);
      return (
        '<button type="button" class="entry-card" style="width:100%; text-align:left;" data-action="etat-select-semaine" data-week-start="' + ws + '">' +
          '<div class="entry-main"><div class="entry-title">' + esc(label) + '</div></div>' +
          '<div class="entry-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        '</button>'
      );
    }).join("");
    return '<div class="entry-list">' + rows + '</div>';
  }

  // Bloc commun : solde net → liste des prestations (de la journée) → Main
  // d'œuvre et Épargne — ordre imposé par le cahier des charges, section 6.
  // Réorganisation (observations terrain, façon MonDjai/Trépor) : Main
  // d'œuvre, Charges et Épargne apparaissent désormais en mini-rangée DANS la
  // carte solde elle-même, juste sous le gros chiffre — avant la liste des
  // prestations — plutôt qu'en bloc séparé après la liste.
  function renderMiniStatsRow(recette, charges, eparg){
    return (
      '<div class="solde-mini-stats">' +
        '<div class="sms-col"><div class="sms-label">Main d’œuvre</div><div class="sms-val">' + formatFCFA(recette) + '</div></div>' +
        '<div class="sms-col"><div class="sms-label">Charges</div><div class="sms-val">' + formatFCFA(charges) + '</div></div>' +
        '<div class="sms-col"><div class="sms-label">Épargne</div><div class="sms-val">' + (state.objectifEpargne ? formatFCFA(eparg) : "Aucun") + '</div></div>' +
      '</div>'
    );
  }

  function renderBlocEtatJour(dateStr){
    var range = { start: dateStr, end: dateStr };
    var recette = recetteCoiffure(range);
    var charges = chargesCommunesTotal(range);
    var eparg = epargnePeriode(range);
    var solde = recette - eparg - charges;
    var titre = '<div class="hint tight" style="margin-bottom:10px; font-weight:700; color:var(--text);">' + esc(formatDateFr(dateStr)) + '</div>';
    var soldeCard = (
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">Solde net</div>' +
        '<div class="ds-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        renderMiniStatsRow(recette, charges, eparg) +
      '</div>'
    );
    var listeHtml = '<div class="section-title" style="margin-top:2px;">Prestations de la journée</div>' +
      renderListePrestationsRange(range, "💇", "Aucune prestation ce jour-là", "Les prestations de cette journée apparaîtront ici.");
    return titre + soldeCard + listeHtml;
  }

  function renderBlocEtatPeriode(range){
    var recette = recetteCoiffure(range);
    var charges = chargesCommunesTotal(range);
    var eparg = epargnePeriode(range);
    var solde = recette - eparg - charges;
    var soldeCard = (
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">Solde net</div>' +
        '<div class="ds-amount' + (solde<0?" neg":"") + '">' + formatFCFA(solde) + '</div>' +
        renderMiniStatsRow(recette, charges, eparg) +
      '</div>'
    );
    return { soldeCard: soldeCard, recette: recette, eparg: eparg };
  }

  // Sprint 8B : vue de Mon état en mode Salon — "salon" (consolidée, par
  // défaut), "coiffure" ou "onglerie" (amendement, section 8).
  function vueEtat(){ return (ui.etatVue === "coiffure" || ui.etatVue === "onglerie") ? ui.etatVue : "salon"; }
  function recettesVue(range){
    var v = vueEtat();
    return v === "salon" ? recetteCoiffure(range) : recettesActivite(range, v);
  }
  function aDeLOnglerie(){ return state.prestationsCoiffure.some(function(p){ return activiteDe(p) === "onglerie"; }); }
  function lblVue(base){
    var v = vueEtat();
    return v === "salon" ? base : base + " — " + v;
  }

  // Montant affiché dans les listes de jours / semaines de Mon état : solde net
  // (Sprint 7, inchangé) en mode À domicile ; recettes (de la vue choisie) en
  // mode Salon, où les charges et le fonds ne se déduisent qu'au mois.
  function valeurListePeriode(range){
    return estModeSalon() ? recettesVue(range) : soldeNetPeriode(range);
  }

  /* ----- Sprints 8A/8B : Mon état en mode Salon ----- */

  function renderCarteRecettes(range, label){
    var v = vueEtat();
    var recette = recettesVue(range);
    var items = filterRange(state.prestationsCoiffure, range);
    if(v !== "salon") items = items.filter(function(p){ return activiteDe(p) === v; });
    var nb = items.length;
    var detail = (v === "salon" && aDeLOnglerie())
      ? " · coiffure " + formatFCFA(recettesActivite(range, "coiffure")) + " · onglerie " + formatFCFA(recettesActivite(range, "onglerie"))
      : "";
    var suite = v === "salon" ? " · charges et fonds se déduisent au mois (onglet Mois)" : " · produits et marge : onglet Mois";
    return (
      '<div class="dash-solde" style="margin-bottom:16px;">' +
        '<div class="ds-label">' + esc(lblVue(label)) + '</div>' +
        '<div class="ds-amount">' + formatFCFA(recette) + '</div>' +
        '<div class="ds-sub">' + nb + (nb > 1 ? " prestations" : " prestation") + esc(detail) + esc(suite) + '</div>' +
      '</div>'
    );
  }
  function renderBlocEtatJourSalon(dateStr){
    var range = { start: dateStr, end: dateStr };
    var v = vueEtat();
    var titre = '<div class="hint tight" style="margin-bottom:10px; font-weight:700; color:var(--text);">' + esc(formatDateFr(dateStr)) + '</div>';
    return titre + renderCarteRecettes(range, "Recette du jour") +
      '<div class="section-title" style="margin-top:2px;">Prestations de la journée</div>' +
      renderListePrestationsRange(range, v === "onglerie" ? "💅" : "💇", "Aucune prestation ce jour-là", "Les prestations de cette journée apparaîtront ici.", v === "salon" ? null : v);
  }

  function badgeMois(provisoire){
    return provisoire ? '<span class="ds-badge provisoire">Provisoire</span>' : '<span class="ds-badge definitif">Définitif</span>';
  }

  // Vues Coiffure / Onglerie du mois (amendement, section 8) : recettes de
  // l'activité − produits de l'activité = marge de l'activité. Les charges
  // communes n'y figurent pas : elles appartiennent au salon.
  function renderBlocActiviteMois(cle, act){
    var range = rangeDuMoisCle(cle);
    var recettes = recettesActivite(range, act);
    var produits = achatsProduitsMois(cle, "produits_" + act);
    var marge = recettes - produits;
    var nb = filterRange(state.prestationsCoiffure, range).filter(function(p){ return activiteDe(p) === act; }).length;
    var nomAct = act === "onglerie" ? "onglerie" : "coiffure";
    var carte =
      '<div class="dash-solde" style="margin-bottom:12px;">' +
        '<div class="ds-label">Marge ' + nomAct + ' du mois' + badgeMois(cle >= moisCourantCle()) + '</div>' +
        '<div class="ds-amount' + (marge < 0 ? " neg" : "") + '">' + formatFCFA(marge) + '</div>' +
        '<div class="solde-mini-stats">' +
          '<div class="sms-col"><div class="sms-label">Recettes</div><div class="sms-val">' + formatFCFA(recettes) + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Produits</div><div class="sms-val">' + formatFCFA(produits) + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Prestations</div><div class="sms-val">' + nb + '</div></div>' +
        '</div>' +
      '</div>';
    var chaine =
      '<div class="chaine-box">' +
        '<div class="chaine-row"><div class="ch-k">Recettes ' + nomAct + ' du mois</div><div class="ch-v">' + formatFCFA(recettes) + '</div></div>' +
        '<div class="chaine-row"><div class="ch-k">− Produits ' + nomAct + ' achetés</div><div class="ch-v">' + formatFCFA(produits) + '</div></div>' +
        '<div class="chaine-row total"><div class="ch-k">= Marge de l’activité</div><div class="ch-v"' + (marge < 0 ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(marge) + '</div></div>' +
      '</div>';
    var achats = chargesDuMois(cle).filter(function(c){ return typeDeCharge(c) === "produits_" + act; });
    var detailAchats = renderBreakdownRows("Produits " + nomAct + " achetés ce mois",
      achats.map(function(c){ return { label: formatDateFr(c.date) + (c.note ? " · " + c.note : ""), montant: c.montant }; }));
    return carte + chaine + detailAchats +
      '<div class="hint" style="margin:-4px 0 16px;">Les charges communes (loyer, CIE, SODECI…) n’apparaissent que dans la vue Salon : elles appartiennent au salon, pas à une activité.</div>';
  }

  // Ligne courte de clause pour la répartition (« 30 % », « fixe »).
  function clauseCourte(l){
    if(!l || !l.mode) return "non réglée";
    return l.mode === "pourcentage" ? formatPct(l.valeur) : "montant fixe";
  }
  // Sprint 8B — répartition du résultat net (amendement, section 7, étapes 4 à 8).
  function renderRepartitionMois(cle){
    var rep = repartitionMois(cle);
    var rn = rep.resultatNet;
    function ligne(k, v, neg){
      return '<div class="chaine-row"><div class="ch-k">' + esc(k) + '</div><div class="ch-v"' + (neg ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(v) + '</div></div>';
    }
    var rows = ligne("Résultat net du mois", rn, rn < 0);
    if(rep.proprio) rows += ligne("→ Propriétaire (" + clauseCourte(rep.proprio) + ")", rep.proprio.montant);
    rep.salaries.forEach(function(sl){ rows += ligne("→ " + sl.nom + " (" + clauseCourte(sl) + ")", sl.montant); });
    if(rep.epargne) rows += ligne("→ Épargne du mois (" + clauseCourte(rep.epargne) + ")", rep.epargne.montant);
    rows += '<div class="chaine-row total"><div class="ch-k">= Reste (trésorerie du salon)</div><div class="ch-v"' + (rep.reste < 0 ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(rep.reste) + '</div></div>';
    var vide = !rep.proprio && !rep.salaries.length && !rep.epargne;
    return (
      '<div class="section-title">Répartition du résultat net</div>' +
      '<div class="chaine-box">' + rows + '</div>' +
      rep.alertes.map(function(a){ return '<div class="alerte-douce">' + esc(a) + '</div>'; }).join("") +
      (vide ? '<div class="hint" style="margin:-4px 0 16px;">Réglez votre rémunération et celle de vos salariés dans Réglages, et l’épargne du mois dans Objectif d’épargne.</div>' : '')
    );
  }

  // Vue Salon du mois (amendement, sections 7 et 8) : résultat net, chaîne de
  // calcul, répartition (8B), jauge (mois en cours), charges par rubrique,
  // fonds, crédits.
  function renderBlocSalonMois(cle){
    var r = resultatNetMois(cle);
    var rn = r.resultatNet;
    var badge = badgeMois(r.provisoire);
    var perte = "";
    if(rn < 0){
      perte = '<div class="dash-perte">' + (r.provisoire
        ? "Pour l’instant, les recettes ne couvrent pas encore les charges et le fonds du mois (" + formatFCFA(Math.abs(rn)) + " à rattraper)."
        : "Mois à perte : " + formatFCFA(Math.abs(rn)) + ". Ça arrive — on note et on avance.") + '</div>';
    }
    var v = versionFondsPourMois(cle);
    var fondsHint = (fondsActifPourMois(cle) && v.mode === "pourcentage") ? " (" + v.valeur + " % des recettes)" : "";
    var range = rangeDuMoisCle(cle);
    var detailRecettes = aDeLOnglerie()
      ? '<div class="chaine-row"><div class="ch-k" style="padding-left:12px;">dont coiffure · onglerie</div><div class="ch-v" style="font-weight:600; color:var(--text-dim);">' +
          formatFCFA(recettesActivite(range, "coiffure")) + ' · ' + formatFCFA(recettesActivite(range, "onglerie")) + '</div></div>'
      : '';

    var carte =
      '<div class="dash-solde" style="margin-bottom:12px;">' +
        '<div class="ds-label">Résultat net du mois' + badge + '</div>' +
        '<div class="ds-amount' + (rn < 0 ? " neg" : "") + '">' + formatFCFA(rn) + '</div>' +
        perte +
        '<div class="solde-mini-stats">' +
          '<div class="sms-col"><div class="sms-label">Recettes</div><div class="sms-val">' + formatFCFA(r.recettes) + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Charges</div><div class="sms-val">' + formatFCFA(r.charges) + '</div></div>' +
          '<div class="sms-col"><div class="sms-label">Fonds</div><div class="sms-val">' + formatFCFA(r.fonds) + '</div></div>' +
        '</div>' +
      '</div>';

    var chaine =
      '<div class="chaine-box">' +
        '<div class="chaine-row"><div class="ch-k">Recettes du mois</div><div class="ch-v">' + formatFCFA(r.recettes) + '</div></div>' +
        detailRecettes +
        '<div class="chaine-row"><div class="ch-k">− Charges du mois</div><div class="ch-v">' + formatFCFA(r.charges) + '</div></div>' +
        '<div class="chaine-row"><div class="ch-k">− Fonds de renouvellement' + esc(fondsHint) + '</div><div class="ch-v">' + formatFCFA(r.fonds) + '</div></div>' +
        '<div class="chaine-row total"><div class="ch-k">= Résultat net</div><div class="ch-v"' + (rn < 0 ? ' style="color:var(--red);"' : '') + '>' + formatFCFA(rn) + '</div></div>' +
      '</div>';

    var jauge = (cle === moisCourantCle()) ? renderJaugeCard(cle, true) : "";

    var chargesRub = renderBreakdownRows("Charges du mois — par rubrique",
      groupSum(chargesComptees(cle), function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; }));

    var fondsBloc = "";
    var sf = soldeFonds();
    if(sf.configure){
      var actif = fondsActifPourMois(cle);
      var rows =
        '<div class="eb-row"><div class="eb-nom">Prévision du mois</div><div class="eb-val">' + formatFCFA(r.fonds) + '</div></div>' +
        (actif ?
          '<div class="eb-row"><div class="eb-nom">Achats produits coiffure</div><div class="eb-val">' + formatFCFA(achatsProduitsMois(cle, "produits_coiffure")) + '</div></div>' +
          '<div class="eb-row"><div class="eb-nom">Achats produits onglerie</div><div class="eb-val">' + formatFCFA(achatsProduitsMois(cle, "produits_onglerie")) + '</div></div>'
          : '<div class="eb-row"><div class="eb-nom">Fonds arrêté ce mois : achats comptés dans les charges</div><div class="eb-val">—</div></div>') +
        '<div class="eb-row"><div class="eb-nom">Solde du fonds à ce jour</div><div class="eb-val" style="color:' + (sf.solde < 0 ? "var(--red)" : "var(--green)") + ';">' + formatFCFA(sf.solde) + '</div></div>';
      fondsBloc = '<div class="etat-breakdown"><div class="eb-title">Fonds de renouvellement des produits</div>' + rows + '</div>' +
        (sf.solde < 0 ? renderAlerteFonds(sf) : "");
    }

    var creditsBloc = "";
    var credits = (state.config.credits || []).filter(function(c){ return !!findRubriqueCharge(c.rubriqueId); });
    if(credits.length){
      creditsBloc = '<div class="etat-breakdown"><div class="eb-title">Remboursements de crédit</div>' +
        credits.map(function(c){
          var rub = findRubriqueCharge(c.rubriqueId);
          return '<div class="credit-row"><div class="cr-top"><div class="cr-ico">' + esc(rub.emoji || "🏦") + '</div>' +
            '<div class="cr-txt"><div class="cr-nom">' + esc(rub.nom) + '</div><div class="cr-sub">' + esc(sousTitreCredit(c)) + '</div></div></div>' +
            renderBilanCreditHtml(c) + '</div>';
        }).join("") + '</div>';
    }

    return carte + chaine + renderRepartitionMois(cle) + jauge + chargesRub + fondsBloc + creditsBloc;
  }

  function renderMonEtatSalon(){
    ensureEtatRefs();
    var periode = ui.etatPeriode;
    var vue = vueEtat();
    var vues = [["coiffure","💇 Coiffure"],["onglerie","💅 Onglerie"],["salon","💈 Salon"]].map(function(x){
      return '<button type="button" class="vue-tab' + (vue===x[0]?" active":"") + '" data-action="etat-set-vue" data-val="' + x[0] + '">' + x[1] + '</button>';
    }).join("");
    var tabs = ["jour","semaine","mois"].map(function(p){
      var lbl = { jour:"Jour", semaine:"Semaine", mois:"Mois" }[p];
      return '<button type="button" class="etat-tab' + (periode===p?" active":"") + '" data-action="etat-set-periode" data-val="' + p + '">' + lbl + '</button>';
    }).join("");

    var body = "";
    if(periode === "jour"){
      body = renderBlocEtatJourSalon(todayStr());
    } else if(periode === "semaine"){
      if(ui.etatSelJour){
        body = renderEtatBack() + renderBlocEtatJourSalon(ui.etatSelJour);
      } else {
        var wr = getWeekRange(dateFromStr(ui.etatSemaineRef));
        body = renderEtatSemaineNav() + renderCarteRecettes(wr, "Recettes de la semaine") +
          '<div class="section-title">Recettes par jour</div>' +
          renderEtatListeJours(wr, "semaine");
      }
    } else {
      if(ui.etatSelJour){
        body = renderEtatBack() + renderBlocEtatJourSalon(ui.etatSelJour);
      } else if(ui.etatSelSemaine){
        var wr2 = getWeekRange(dateFromStr(ui.etatSelSemaine));
        body = renderEtatBack() +
          '<div class="hint tight" style="margin-bottom:10px; font-weight:700; color:var(--text);">' + esc(formatDateFr(wr2.start) + " – " + formatDateFr(wr2.end)) + '</div>' +
          renderCarteRecettes(wr2, "Recettes de la semaine") +
          '<div class="section-title">Recettes par jour</div>' +
          renderEtatListeJours(wr2, "mois");
      } else {
        var mr = getMonthRange(dateFromStr(ui.etatMoisRef));
        var cleM = moisCleDe(mr.start);
        body = renderEtatMoisNav() +
          (vue === "salon" ? renderBlocSalonMois(cleM) : renderBlocActiviteMois(cleM, vue)) +
          '<div class="section-title">Recettes par semaine</div>' +
          renderEtatListeSemaines(mr);
      }
    }

    return (
      '<div class="section-title">Mon état · ' + LIBELLES_VUE[vue] + '</div>' +
      '<div class="vue-tabs">' + vues + '</div>' +
      '<div class="etat-tabs">' + tabs + '</div>' +
      body
    );
  }
  var LIBELLES_VUE = { salon:"Salon", coiffure:"Coiffure", onglerie:"Onglerie" };

  function renderMonEtat(){
    if(estModeSalon()) return renderMonEtatSalon();
    ensureEtatRefs();
    var periode = ui.etatPeriode;
    var tabs = ["jour","semaine","mois"].map(function(p){
      var lbl = { jour:"Jour", semaine:"Semaine", mois:"Mois" }[p];
      return '<button type="button" class="etat-tab' + (periode===p?" active":"") + '" data-action="etat-set-periode" data-val="' + p + '">' + lbl + '</button>';
    }).join("");

    var body = "";
    if(periode === "jour"){
      body = renderBlocEtatJour(todayStr());

  /* ================= « Mes habitudes » ================= */

  function ensureHabitudesRefs(){
    if(!ui.habitudesSemaineRef) ui.habitudesSemaineRef = todayStr();
    if(!ui.habitudesMoisRef) ui.habitudesMoisRef = todayStr();
  }
  function shiftHabitudesRef(periode, delta){
    if(periode === "semaine"){
      var d = dateFromStr(ui.habitudesSemaineRef);
      d.setDate(d.getDate() + 7*delta);
      var nouveau = dateKey(d);
      var refAujourdhui = getWeekRange(new Date()).start;
      if(nouveau > refAujourdhui) nouveau = refAujourdhui;
      var refPlusAncienne = earliestActivityWeekStart();
      if(nouveau < refPlusAncienne) nouveau = refPlusAncienne;
      ui.habitudesSemaineRef = nouveau;
    } else if(periode === "mois"){
      var d2 = dateFromStr(ui.habitudesMoisRef);
      d2.setDate(1);
      d2.setMonth(d2.getMonth() + delta);
      var nouveau2 = dateKey(d2);
      var refAujourdhuiM = getMonthRange(new Date()).start;
      if(nouveau2 > refAujourdhuiM) nouveau2 = refAujourdhuiM;
      var refPlusAncienM = earliestActivityMonthStart();
      if(nouveau2 < refPlusAncienM) nouveau2 = refPlusAncienM;
      ui.habitudesMoisRef = nouveau2;
    }
  }

  function groupSum(arr, labelFn, valFn){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var lbl = labelFn(x);
      if(lbl === null || lbl === undefined || lbl === "") return;
      if(!(lbl in map)){ map[lbl] = 0; ordre.push(lbl); }
      map[lbl] += Number(valFn(x)) || 0;
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  function groupSumMulti(arr, valuesFn, valFn, labelVide){
    var map = {}, ordre = [];
    arr.forEach(function(x){
      var vals = valuesFn(x);
      if(!vals || !vals.length) vals = [labelVide];
      vals.forEach(function(v){
        if(!(v in map)){ map[v] = 0; ordre.push(v); }
        map[v] += Number(valFn(x)) || 0;
      });
    });
    return ordre.map(function(k){ return { label:k, montant:map[k] }; }).sort(function(a,b){ return b.montant - a.montant; });
  }
  function renderBreakdownRows(titre, rows){
    if(!rows.length) return "";
    var body = rows.map(function(r){
      return '<div class="eb-row"><div class="eb-nom">' + esc(r.label) + '</div><div class="eb-val">' + formatFCFA(r.montant) + '</div></div>';
    }).join("");
    return '<div class="etat-breakdown"><div class="eb-title">' + esc(titre) + '</div>' + body + '</div>';
  }
  // Sprint 8B : ventilation par activité (mode Salon). Les répartitions par
  // quartier / type de coiffure / type de cliente ne concernent que la
  // coiffure (l'onglerie n'a pas ce détail) — sans onglerie, résultat
  // strictement identique au Sprint 7bis.
  function renderBreakdownActivites(range){
    var items = filterRange(state.prestationsCoiffure, range);
    if(!items.length) return "";
    return renderBreakdownRows("Par activité", [
      { label: "💇 Coiffure", montant: recettesActivite(range, "coiffure") },
      { label: "💅 Onglerie", montant: recettesActivite(range, "onglerie") }
    ]);
  }
  function renderBreakdownsCoiffure(range){
    var items = filterRange(state.prestationsCoiffure, range).filter(function(p){ return activiteDe(p) === "coiffure"; });
    if(!items.length) return "";
    var domicile = items.filter(function(p){ return p.lieu === "domicile"; });
    return (
      renderBreakdownRows("Par quartier (prestations à domicile)", groupSum(domicile, function(p){ return p.quartierNom; }, function(p){ return p.mainOeuvre; })) +
      renderBreakdownRows("Par type de coiffure", groupSumMulti(items, function(p){ return p.typesCoiffureNoms; }, function(p){ return p.mainOeuvre; }, "Non précisé")) +
      renderBreakdownRows("Par type de cliente", groupSum(items, function(p){ return p.typeClienteNom; }, function(p){ return p.mainOeuvre; }))
    );
  }
  function renderBreakdownAutresCharges(range){
    var items = filterRange(state.autresCharges, range);
    if(!items.length) return "";
    return renderBreakdownRows("Charges communes — par rubrique", groupSum(items, function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; }));
  }

  function renderHabitudes(){
    ensureHabitudesRefs();
    var periode = ui.habitudesPeriode;
    var ref = periode === "semaine" ? dateFromStr(ui.habitudesSemaineRef) : periode === "mois" ? dateFromStr(ui.habitudesMoisRef) : new Date();
    var range = rangeForPeriode(periode, ref);

    var tabs = ["jour","semaine","mois"].map(function(p){
      var lbl = { jour:"Jour", semaine:"Semaine", mois:"Mois" }[p];
      return '<button type="button" class="etat-tab' + (periode===p?" active":"") + '" data-action="habitudes-set-periode" data-val="' + p + '">' + lbl + '</button>';
    }).join("");

    var navHtml = "";
    if(periode === "semaine" || periode === "mois"){
      var label = periode === "semaine" ? (formatDateFr(range.start) + " – " + formatDateFr(range.end)) : (moisLabelFor(ref).charAt(0).toUpperCase() + moisLabelFor(ref).slice(1));
      var refAujourdhui = periode === "semaine" ? getWeekRange(new Date()).start : getMonthRange(new Date()).start;
      var estPeriodeActuelle = (periode === "semaine" ? ui.habitudesSemaineRef : ui.habitudesMoisRef) >= refAujourdhui;
      var refPlusAncienneH = periode === "semaine" ? earliestActivityWeekStart() : earliestActivityMonthStart();
      var estPeriodePlusAncienne = (periode === "semaine" ? ui.habitudesSemaineRef : ui.habitudesMoisRef) <= refPlusAncienneH;
      navHtml = (
        '<div class="etat-nav">' +
          '<button type="button" class="en-btn" data-action="habitudes-nav" data-sens="-1" data-periode="' + periode + '"' + (estPeriodePlusAncienne?" disabled":"") + '>‹</button>' +
          '<div class="en-label">' + esc(label) + '</div>' +
          '<button type="button" class="en-btn" data-action="habitudes-nav" data-sens="1" data-periode="' + periode + '"' + (estPeriodeActuelle?" disabled":"") + '>›</button>' +
        '</div>'
      );
    } else {
      navHtml = '<div class="etat-nav"><div class="en-label">' + esc(formatDateFr(todayStr())) + '</div></div>';
    }

    var breakdowns = renderBreakdownsCoiffure(range) + renderBreakdownAutresCharges(range);
    if(estModeSalon()){
      // En mode Salon, la vue Mois range les charges par mois concerné.
      var chargesHtml = periode === "mois"
        ? renderBreakdownRows("Charges du mois — par rubrique", groupSum(chargesDuMois(moisCleDe(range.start)), function(c){ return c.rubriqueNom + (c.rubriqueSupprimee ? " (rubrique supprimée)" : ""); }, function(c){ return c.montant; }))
        : renderBreakdownAutresCharges(range);
      breakdowns = renderBreakdownActivites(range) + renderBreakdownsCoiffure(range) + chargesHtml;
    }
    if(!breakdowns){
      breakdowns = emptyState("📈","Pas encore d’habitudes à montrer","Vos statistiques par quartier, type de coiffure, type de cliente ou rubrique de charge apparaîtront ici au fil de vos saisies.");
    }

    return (
      '<div class="section-title">Mes habitudes</div>' +
      '<div class="etat-tabs">' + tabs + '</div>' +
      navHtml +
      breakdowns
    );
  }

  /* ----- Sprint 8B : objectif d'épargne en mode Salon (épargne mensuelle) ----- */

  // Note « déjà réparti / disponible » pour le garde-fou des pourcentages.
  function renderNotePctDisponible(cible, id, nouveau){
    var autres = totalPourcentages(moisCourantCle(), { cible: cible, id: id, nouveau: !!nouveau, mode: "fixe", valeur: 0 }).total;
    return '<div class="field-note">Déjà réparti en pourcentage du résultat net : ' + formatPct(autres) +
      ' — encore disponible : ' + formatPct(Math.max(0, 100 - autres)) + '.</div>';
  }

  function enregistrerObjectifSalon(d){
    var cle = moisCourantCle();
    var nom = (d.nom||"").trim() || "Épargne";
    var modele = findObjectifModele(d.modeleId);
    var emoji = modele ? modele.emoji : "💰";
    var mode, valeur;
    if(d.mode === "manuel"){
      valeur = Math.round(toNum(d.montant));
      if(!(valeur > 0)){ d.erreurs.montant = "Indiquez un montant supérieur à 0."; render(); return; }
      mode = "fixe";
    } else {
      mode = "pourcentage";
      valeur = toNum(d.pourcentage) || 10;
      var err = erreurGardeFou(cle, { cible: "epargne", mode: mode, valeur: valeur });
      if(err){ d.erreurs.pourcentage = err; render(); return; }
    }
    state.objectifEpargne = { id: uid("obj"), nom: nom, emoji: emoji, dateCreation: todayStr() };
    state.config.epargneMensuelle = majParamVersionne(state.config.epargneMensuelle, mode, valeur, cle);
    saveState();
    ui.objDraft = null;
    render();
  }

    var cle = moisCourantCle();
    var v = versionPourMois(state.config.epargneMensuelle, cle);
    var corps;
    if(versionActive(v)){
      var rep = repartitionMois(cle);
      var p = state.config.epargneMensuelle;
      var premier = (p.historique || []).map(function(h){ return h.depuis; }).concat([p.depuis]).sort()[0];
      corps =
        '<div class="oc-montant">' + formatFCFA(rep.montantEpargne) + '</div>' +
        '<div class="oc-sub">Épargne ' + esc(deMois(libelleMoisCle(cle))) + ' (provisoire) · Mensuel · ' + esc(libelleClause(v)) + '</div>' +
        '<div class="oc-sub">Cumul depuis ' + esc(libelleMoisCle(premier)) + ' : ' + formatFCFA(cumulEpargneSalon()) + '</div>' +

  // Sprint 7 (correctif) : construit le canvas réellement exporté/partagé —
  // net en haut (titre + solde net), réellement flouté en bas (pixels
  // recalculés, pas un filtre CSS visuel) avec la mention « Abonnez-vous
  // pour plus de fonctionnalités » incrustée, pour reproduire fidèlement ce
  // que voit la personne dans l'aperçu à l'écran. Utilisé par
  // canvasVersBlob(), donc par Télécharger et Partager.
  function roundRectPath(ctx, x, y, w, h, r){
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }
  function dessinerOverlayAbonnementExport(ctx, W, H){
    var texte = "Abonnez-vous pour plus de fonctionnalités";
    ctx.font = "800 30px -apple-system,Helvetica,Arial,sans-serif";
    var maxWidth = W*0.8 - 68;
    var mots = texte.split(" "), lignes = [], ligne = "";
    mots.forEach(function(mot){
      var essai = ligne ? ligne + " " + mot : mot;
      if(ctx.measureText(essai).width > maxWidth && ligne){ lignes.push(ligne); ligne = mot; }
      else { ligne = essai; }
    });
    if(ligne) lignes.push(ligne);

    var lineHeight = 40, padX = 34, padY = 24;
    var textWidth = 0;
    lignes.forEach(function(l){ textWidth = Math.max(textWidth, ctx.measureText(l).width); });
    var boxW = Math.min(W*0.8, textWidth + padX*2);
    var boxH = lignes.length*lineHeight + padY*2;
    var cx = W/2, cy = H*0.74;
    var x0 = cx - boxW/2, y0 = cy - boxH/2;

    ctx.save();
    ctx.fillStyle = "rgba(17,20,26,.85)";
    ctx.strokeStyle = "rgba(245,166,35,.6)";
    ctx.lineWidth = 2;
    roundRectPath(ctx, x0, y0, boxW, boxH, 22);
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = "#f5a623";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    lignes.forEach(function(l, i){
      ctx.fillText(l, cx, y0 + padY + lineHeight*i + lineHeight/2);
    });
    ctx.restore();
  }
  function construireCanvasExport(){
    var source = byId("telecharger-canvas");
    if(!source || !source.getContext) return null;
    var W = source.width, H = source.height;

    var out = document.createElement("canvas");
    out.width = W; out.height = H;
    var octx = out.getContext("2d");
    octx.drawImage(source, 0, 0); // base nette

    // Copie réellement floutée (pixels recalculés par le moteur canvas,
    // pas un filtre CSS d'affichage) — repli par sous-échantillonnage sur
    // les moteurs sans support de ctx.filter.
    var blurred = document.createElement("canvas");
    blurred.width = W; blurred.height = H;
    var bctx = blurred.getContext("2d");
    if("filter" in bctx){
      bctx.filter = "blur(16px)";
      bctx.drawImage(source, 0, 0);
      bctx.filter = "none";
    } else {
      var small = document.createElement("canvas");
      var sw = Math.max(1, Math.round(W/12)), sh = Math.max(1, Math.round(H/12));
      small.width = sw; small.height = sh;
      small.getContext("2d").drawImage(source, 0, 0, sw, sh);
      bctx.imageSmoothingEnabled = true;
      bctx.drawImage(small, 0, 0, sw, sh, 0, 0, W, H);
    }

    // Masque en dégradé identique au calque CSS de l'aperçu (net jusqu'à
    // 28%, flouté à partir de 36%) — punché dans le canal alpha du flou.
    var grad = bctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(0.28, "rgba(0,0,0,0)");
    grad.addColorStop(0.36, "rgba(0,0,0,1)");
    grad.addColorStop(1, "rgba(0,0,0,1)");
    bctx.globalCompositeOperation = "destination-in";
    bctx.fillStyle = grad;
    bctx.fillRect(0, 0, W, H);
    bctx.globalCompositeOperation = "source-over";

    octx.drawImage(blurred, 0, 0);
    dessinerOverlayAbonnementExport(octx, W, H);

    return out;
  }

  function canvasVersBlob(callback){
    var canvas = construireCanvasExport();
    if(!canvas){ callback(null); return; }
    if(canvas.toBlob){ canvas.toBlob(callback, "image/png"); return; }
    try{
      var dataUrl = canvas.toDataURL("image/png");
      var bstr = atob(dataUrl.split(",")[1]), n = bstr.length, u8 = new Uint8Array(n);
      while(n--) u8[n] = bstr.charCodeAt(n);
      callback(new Blob([u8], { type:"image/png" }));
    }catch(e){ callback(null); }
  }

      if(!blob) return;
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = nomFichierTelecharger();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    });
  }
  function partagerImage(){
    canvasVersBlob(function(blob){
      if(!blob) return;
      var fichier;
      try{ fichier = new File([blob], nomFichierTelecharger(), { type:"image/png" }); }catch(e){ fichier = null; }
      if(fichier && navigator.share && navigator.canShare && navigator.canShare({ files:[fichier] })){
        navigator.share({ files:[fichier], title:"MonDjai/Coiffure" }).catch(function(){});
      } else {
        telechargerImage();
      }
    });
  }

  function enregistrerRemu(){
    captureDraft(REMU_FIELDS);
    var m = ui.modal, d = ui.draft;
    var cle = moisCourantCle();
    var errors = {};
    var mode = d.mode === "fixe" ? "fixe" : "pourcentage";
    var brut = String(d["f-remuValeur"]||"").trim();
    var valeur = toNum(brut);
    var nom = String(d["f-remuNom"]||"").trim();
    if(m.cible === "salarie"){
      if(!nom) errors.remuNom = "Indiquez le nom du salarié.";
      if(!(valeur > 0)) errors.remuValeur = mode === "pourcentage" ? "Indiquez un pourcentage supérieur à 0." : "Indiquez un montant supérieur à 0.";
    } else if(brut === "" || valeur < 0){
      errors.remuValeur = "Indiquez un montant ou un pourcentage (0 si vous vous payez sur le reste).";
    }
    if(!errors.remuValeur && mode === "pourcentage" && valeur > 100) errors.remuValeur = "Un pourcentage ne peut pas dépasser 100 %.";
    if(!errors.remuValeur && mode === "pourcentage"){
      var err = erreurGardeFou(cle, { cible: m.cible, id: m.id, nouveau: !!m.nouveau, mode: mode, valeur: valeur });
      if(err) errors.remuValeur = err;
    }
    if(Object.keys(errors).length){ ui.errors = errors; render(); return; }
    if(mode === "fixe") valeur = Math.round(valeur);
    if(m.cible === "proprio"){
      if(state.config.remunerationProprio || valeur > 0){
        state.config.remunerationProprio = majParamVersionne(state.config.remunerationProprio, mode, valeur, cle);
      }
    } else if(m.nouveau){
      state.config.salaries.push({ id: uid("sal"), nom: nom, debut: cle, fin: null, mode: mode, valeur: valeur, depuis: cle, historique: [] });
    } else {
      var sal = findSalarie(m.id);
      if(sal){ sal.nom = nom; majParamVersionne(sal, mode, valeur, cle); }
    }
    saveState();
    closeModal();
  }

    if(m.nouveau){

  function enregistrerFonds(){
    var el = byId("f-fondsValeur");
    if(el) ui.fondsDraft.valeur = el.value;
    var d = ui.fondsDraft;
    var mode = d.mode === "pourcentage" ? "pourcentage" : "fixe";
    var brut = String(d.valeur === undefined || d.valeur === null ? "" : d.valeur).trim();
    var valeur = toNum(brut);
    ui.fondsMsg = "";
    if(brut === "" || valeur < 0 || (mode === "pourcentage" && valeur > 100)){
      ui.fondsErreur = mode === "pourcentage" ? "Indiquez un pourcentage entre 0 et 100 (0 arrête le fonds)." : "Indiquez un montant (0 arrête le fonds).";
      render();
      return;
    }
    if(mode === "fixe") valeur = Math.round(valeur);
    var cle = moisCourantCle();
    var f = state.config.fondsRenouvellement;
    if(!f){
      if(valeur === 0){ ui.fondsErreur = ""; ui.fondsMsg = "Aucun fonds enregistré (montant à 0)."; render(); return; }
      state.config.fondsRenouvellement = { mode: mode, valeur: valeur, depuis: cle, historique: [] };
    } else if(f.depuis === cle){
      f.mode = mode; f.valeur = valeur;
    } else if(f.depuis < cle){
      // Le réglage précédent reste valable pour les mois passés (résultats
      // nets définitifs inchangés) ; le nouveau s'applique dès ce mois-ci.
      f.historique = (f.historique || []).concat([{ depuis: f.depuis, mode: f.mode, valeur: f.valeur }]);
      f.depuis = cle; f.mode = mode; f.valeur = valeur;
    } else {
      // Horloge du téléphone revenue en arrière : on remplace simplement.
      f.historique = (f.historique || []).filter(function(h){ return h.depuis < cle; });
      f.depuis = cle; f.mode = mode; f.valeur = valeur;
    }
    saveState();
    ui.fondsErreur = "";
    ui.fondsDraft = { mode: mode, valeur: valeur > 0 ? String(valeur) : "" };
    ui.fondsMsg = valeur > 0 ? ("Fonds enregistré à partir de " + libelleMoisCle(cle) + ".") : ("Fonds arrêté à partir de " + libelleMoisCle(cle) + ".");
    render();
  }

  /* ================= Sprint 8A : actions du mode Salon ================= */

  function reinitialiserMessagesSalon(){
    ui.modeMsg = ""; ui.fondsMsg = ""; ui.fondsErreur = ""; ui.fondsDraft = null;
  }
  function marquerReprise(cle, rubriqueId, statut){
    if(!state.reprisesCharges || typeof state.reprisesCharges !== "object") state.reprisesCharges = {};
    if(!state.reprisesCharges[cle]) state.reprisesCharges[cle] = {};
    state.reprisesCharges[cle][rubriqueId] = statut;
  }
  // Lit toutes les saisies visibles de la fenêtre de reprise (le clic sur
  // « Confirmer » peut arriver avant l'événement change du champ).
  function lireSaisiesReprise(){
    var out = {};
    var champs = document.querySelectorAll('[data-action-change="capture-reprise"]');
    for(var i=0;i<champs.length;i++){
      var id = champs[i].getAttribute("data-id");
      out[id] = champs[i].value;
      ui.repriseDraft[id] = champs[i].value;
    }
    return out;
  }
  // Confirme une proposition de reprise : crée la charge du mois en cours
  // avec le montant affiché (modifiable), rattachée à ce mois.
  function confirmerReprise(rubriqueId, cle, saisies){
    var p = reprisesEnAttente(cle).filter(function(x){ return x.rubrique.id === rubriqueId; })[0];
    if(!p) return true;
    var brut = (saisies && saisies[rubriqueId] !== undefined) ? saisies[rubriqueId]
      : (ui.repriseDraft[rubriqueId] !== undefined ? ui.repriseDraft[rubriqueId] : String(p.montant));
    var montant = toNum(brut);
    if(!ui.errors) ui.errors = {};
    if(String(brut).trim() === "" || !(montant > 0)){
      ui.errors["reprise-" + rubriqueId] = "Indiquez un montant supérieur à 0, ou ignorez cette charge.";
      return false;
    }
    state.autresCharges.push({
      id: uid("acharge"), date: todayStr(), moisConcerne: cle,
      rubriqueId: p.rubrique.id, rubriqueNom: p.rubrique.nom, rubriqueEmoji: p.rubrique.emoji, rubriqueType: typeDeRubrique(p.rubrique),
      montant: montant, reprise: true, ts: Date.now()
    });
    marquerReprise(cle, rubriqueId, "confirme");
    delete ui.repriseDraft[rubriqueId];
    delete ui.errors["reprise-" + rubriqueId];
    return true;
  }

  /* ================= Actions ================= */

  function openModal(type, extra){
    ui.modal = merge({ type:type }, extra || {});
    ui.draft = {};
    ui.errors = {};
    render();
  }
  function closeModal(){
    if(ui.modalReturnTo){
      var back = ui.modalReturnTo;
      ui.modalReturnTo = null;
      openModal(back.type, back.extra);
      return;
    }
    ui.modal = null;
    ui.draft = {};
    ui.errors = {};
    render();
  }

  function handleClick(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "fermer-modal-overlay"){
      if(e.target.closest("[data-stop-close]")) return;
      closeModal();
      return;
    }
    if(action === "fermer-modal"){ closeModal(); return; }

    switch(action){
      case "ouvrir-reglages": ui.overlay = "reglages"; ui.reglagesMsg = ""; reinitialiserMessagesSalon(); render(); return;

      // ----- Sprint 8A : mode Salon -----
      case "set-mode-travail": {
        var modeVoulu = el.getAttribute("data-val") === "salon" ? "salon" : "domicile";
        if(state.config.modeTravail !== modeVoulu){
          state.config.modeTravail = modeVoulu;
          if(modeVoulu === "salon") assurerRubriquesSalon(state.config);
          saveState();
          ui.etatPeriode = modeVoulu === "salon" ? "mois" : "jour";
          ui.etatSelJour = null; ui.etatSelSemaine = null; ui.etatVue = "salon";
          ui.fondsDraft = null; ui.fondsMsg = ""; ui.fondsErreur = "";
          ui.modeMsg = modeVoulu === "salon" ? "Mode Salon activé. Vos données restent intactes." : "Mode À domicile activé. Vos données restent intactes.";
        }
        render();
        return;
      }
      case "fonds-mode": {
        var champF = byId("f-fondsValeur");
        if(champF && ui.fondsDraft) ui.fondsDraft.valeur = champF.value;
        var nouveauMode = el.getAttribute("data-val") === "pourcentage" ? "pourcentage" : "fixe";
        if(ui.fondsDraft && ui.fondsDraft.mode !== nouveauMode){ ui.fondsDraft.mode = nouveauMode; ui.fondsDraft.valeur = ""; }
        ui.fondsErreur = ""; ui.fondsMsg = "";
        render();
        return;
      }
      case "enregistrer-fonds": enregistrerFonds(); return;
      // ----- Sprint 8B : rémunérations -----
      case "ouvrir-remu": openModal("remu-config", { cible: el.getAttribute("data-cible"), id: el.getAttribute("data-id") || null }); return;
      case "ajouter-salarie": openModal("remu-config", { cible: "salarie", nouveau: true }); return;
      case "set-remu-mode": {
        captureDraft(REMU_FIELDS);
        var modeRemu = el.getAttribute("data-val") === "fixe" ? "fixe" : "pourcentage";
        if(ui.draft.mode !== modeRemu){ ui.draft.mode = modeRemu; ui.draft["f-remuValeur"] = ""; }
        ui.errors = {};
        render();
        return;
      }
      case "enregistrer-remu": enregistrerRemu(); return;
      case "demander-retrait-salarie": captureDraft(REMU_FIELDS); ui.modal.confirmRetrait = true; render(); return;
      case "annuler-retrait-salarie": ui.modal.confirmRetrait = false; render(); return;
      case "confirmer-retrait-salarie": {
        var salR = findSalarie(ui.modal.id);
        var cleR2 = moisCourantCle();
        if(salR){
          // Arrivé(e) ce mois-ci : aucun mois terminé à préserver, on retire
          // simplement. Sinon : dernier mois compté = mois précédent.
          if(salR.debut >= cleR2) state.config.salaries = state.config.salaries.filter(function(x){ return x.id !== salR.id; });
          else salR.fin = decalerMoisCle(cleR2, -1);
          saveState();
        }
        closeModal();
        return;

      case "ouvrir-credit": openModal("credit-config", { rubriqueId: el.getAttribute("data-id") }); return;
      case "ajouter-credit": openModal("credit-config", { nouveau: true }); return;

        captureDraft(CHARGE_FIELDS.concat(CREDIT_FIELDS));

        render();
        return;

      case "voir-fonds": openModal("fonds-detail"); return;

        render();
        return;
